# External links rot slowly, so check them weekly rather than on every push.
name: External links

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the site
        run: |
          python3 -m pip install -r requirements.txt
          python3 scripts/build_all.py
      - name: Check external links
        run: python3 scripts/check_links.py
