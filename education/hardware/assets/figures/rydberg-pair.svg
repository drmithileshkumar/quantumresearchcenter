<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Blockade shifts the double excitation</title><desc id="desc">Two resonantly driven atoms have a double-Rydberg state shifted by interaction V. The shift makes the second excitation off resonant.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Blockade shifts the double excitation</text><line x1="65" y1="265" x2="200" y2="265" class="wire"/><text x="214" y="270" text-anchor="start" class="">|11⟩</text><line x1="270" y1="190" x2="410" y2="190" class="wire"/><text x="424" y="195" text-anchor="start" class="">|1r⟩, |r1⟩</text><line x1="525" y1="105" x2="655" y2="105" class="wire"/><text x="669" y="110" text-anchor="start" class="">|rr⟩</text><line x1="525" y1="165" x2="655" y2="165" class="guide"/><text x="600" y="188" text-anchor="middle" class="small">unshifted rr</text><line x1="695" y1="105" x2="695" y2="165" class="wire" style="stroke:#ad663c"/><text x="702" y="141" text-anchor="start" class="small">V</text><path d="M145 245L305 200" fill="none" stroke="#286e94" stroke-width="2"/><path d="M410 182L545 115" fill="none" stroke="#ad663c" stroke-width="2"/><text x="210" y="215" text-anchor="middle" class="small">drive Ω</text><text x="420" y="90" text-anchor="middle" class="small">detuning B = V/ℏ</text><text x="380" y="318" text-anchor="middle" class="small">Strong blockade: |B| much larger than Ω.</text></svg>
