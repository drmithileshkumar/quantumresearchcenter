<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Two confined spins and a tunable barrier</title><desc id="desc">Two electrostatic potential wells each hold an electron. Changing the inter-dot barrier changes tunneling and exchange.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Two confined spins and a tunable barrier</text><path d="M65 120Q115 120 145 230Q175 280 205 230Q250 75 295 230Q325 280 355 230Q385 120 430 120" fill="none" stroke="#286e94" stroke-width="2"/><circle cx="175" cy="235" r="10" fill="#26796e"/><circle cx="325" cy="235" r="10" fill="#ad663c"/><text x="175" y="285" text-anchor="middle" class="small">spin 1</text><text x="325" y="285" text-anchor="middle" class="small">spin 2</text><text x="250" y="85" text-anchor="middle" class="small">tunable barrier</text><line x1="510" y1="225" x2="635" y2="225" class="wire"/><text x="649" y="230" text-anchor="start" class="">|0⟩</text><line x1="510" y1="130" x2="635" y2="130" class="wire"/><text x="649" y="135" text-anchor="start" class="">|1⟩</text><text x="575" y="180" text-anchor="middle" class="small">ΔE = |g|μʙB</text></svg>
