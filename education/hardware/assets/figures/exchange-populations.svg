    <dc:title>Exchange transfers one excitation coherently</dc:title>
    <dc:description>Under H/ℏ = g(XX+YY)/2, the 01 and 10 populations follow cos²(gt) and sin²(gt). Equal populations at gt=π/4 accompany the relative phase −i stated in the text.</dc:description>
