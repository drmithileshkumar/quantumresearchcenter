<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">A Bell-pair circuit becomes timed physical operations</title><desc id="desc">Two initialized data wires pass through H and controlled NOT, followed by measurement. Pulses are schematic, not a hardware waveform.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">A Bell-pair circuit becomes timed physical operations</text><text x="105" y="105" text-anchor="middle" class="">q₀ : |0⟩</text><line x1="170" y1="100" x2="675" y2="100" class="wire"/><text x="105" y="195" text-anchor="middle" class="">q₁ : |0⟩</text><line x1="170" y1="190" x2="675" y2="190" class="wire"/><rect x="222" y="80" width="46" height="40" rx="3" class="gate"/><text x="245.0" y="106.0" text-anchor="middle" class="">H</text><line x1="385" y1="100" x2="385" y2="190" class="wire"/><circle cx="385" cy="100" r="5" fill="#283f50"/><circle cx="385" cy="190" r="11" fill="white" stroke="#283f50" stroke-width="1.6"/><line x1="374" y1="190" x2="396" y2="190" class="wire"/><line x1="385" y1="179" x2="385" y2="201" class="wire"/><rect x="562" y="80" width="46" height="40" rx="3" class="gate"/><text x="585.0" y="106.0" text-anchor="middle" class="">M</text><rect x="562" y="170" width="46" height="40" rx="3" class="gate"/><text x="585.0" y="196.0" text-anchor="middle" class="">M</text><text x="245" y="245" text-anchor="middle" class="small">one-qubit drive</text><text x="400" y="275" text-anchor="middle" class="small">interaction + local corrections</text><text x="585" y="307" text-anchor="middle" class="small">record outcomes</text></svg>
