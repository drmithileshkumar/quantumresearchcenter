<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Path phase becomes an output probability</title><desc id="desc">Two paths pass through a balanced beam splitter, a relative phase plate, and another balanced splitter before detection.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Path phase becomes an output probability</text><line x1="80" y1="120" x2="680" y2="120" class="wire"/><line x1="80" y1="215" x2="680" y2="215" class="wire"/><rect x="190" y="92" width="40" height="151" rx="3" class="gate"/><text x="210" y="273" text-anchor="middle" class="small">balanced BS</text><rect x="480" y="92" width="40" height="151" rx="3" class="gate"/><text x="500" y="273" text-anchor="middle" class="small">balanced BS</text><rect x="320" y="102" width="68" height="36" rx="3" class="gate"/><text x="354.0" y="126.0" text-anchor="middle" class="">φ</text><text x="83" y="83" text-anchor="start" class="small">one photon</text><rect x="627" y="100" width="46" height="40" rx="3" class="gate"/><text x="650.0" y="126.0" text-anchor="middle" class="">D₀</text><rect x="627" y="195" width="46" height="40" rx="3" class="gate"/><text x="650.0" y="221.0" text-anchor="middle" class="">D₁</text><text x="380" y="310" text-anchor="middle" class="small">P(D₀) = cos²(φ/2),  P(D₁) = sin²(φ/2)</text></svg>
