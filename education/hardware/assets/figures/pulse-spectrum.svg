    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>A rectangular pulse has spectral sidelobes</dc:title>
    <dc:description>The curve is sinc²(ΔT/2), normalized to its zero-detuning value. It describes a Fourier-weight estimate in weak excitation, not an exact resonant π-pulse probability.</dc:description>
