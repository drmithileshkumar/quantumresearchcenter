<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Feedback latency and throughput are different</title><desc id="desc">Three measurement rounds on a common time axis. Each round passes through acquire, classify, and decode; a new round starts every interval Δ, before the previous result is ready. Latency is the time from the start of a round to its result; throughput is set by the start interval.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Feedback latency and throughput are different</text><line x1="150" y1="94" x2="150" y2="262" class="guide"/><line x1="230" y1="94" x2="230" y2="262" class="guide"/><line x1="310" y1="94" x2="310" y2="262" class="guide"/><line x1="390" y1="94" x2="390" y2="262" class="guide"/><line x1="470" y1="94" x2="470" y2="262" class="guide"/><line x1="550" y1="94" x2="550" y2="262" class="guide"/><line x1="630" y1="94" x2="630" y2="262" class="guide"/><line x1="710" y1="94" x2="710" y2="262" class="guide"/><text x="80" y="115" text-anchor="middle" class="small">round 1</text><rect x="150" y="93" width="108" height="34" rx="4" fill="#e1edf3" stroke="#8fb0c8"/><text x="204.0" y="115" text-anchor="middle" class="small">acquire</text><rect x="262" y="93" width="108" height="34" rx="4" fill="#eae4f3" stroke="#8fb0c8"/><text x="316.0" y="115" text-anchor="middle" class="small">classify</text><rect x="374" y="93" width="108" height="34" rx="4" fill="#e3f0e6" stroke="#8fb0c8"/><text x="428.0" y="115" text-anchor="middle" class="small">decode</text><circle cx="490" cy="110" r="6" fill="#ad663c"/><text x="80" y="175" text-anchor="middle" class="small">round 2</text><rect x="230" y="153" width="108" height="34" rx="4" fill="#e1edf3" stroke="#8fb0c8"/><text x="284.0" y="175" text-anchor="middle" class="small">acquire</text><rect x="342" y="153" width="108" height="34" rx="4" fill="#eae4f3" stroke="#8fb0c8"/><text x="396.0" y="175" text-anchor="middle" class="small">classify</text><rect x="454" y="153" width="108" height="34" rx="4" fill="#e3f0e6" stroke="#8fb0c8"/><text x="508.0" y="175" text-anchor="middle" class="small">decode</text><circle cx="570" cy="170" r="6" fill="#ad663c"/><text x="80" y="235" text-anchor="middle" class="small">round 3</text><rect x="310" y="213" width="108" height="34" rx="4" fill="#e1edf3" stroke="#8fb0c8"/><text x="364.0" y="235" text-anchor="middle" class="small">acquire</text><rect x="422" y="213" width="108" height="34" rx="4" fill="#eae4f3" stroke="#8fb0c8"/><text x="476.0" y="235" text-anchor="middle" class="small">classify</text><rect x="534" y="213" width="108" height="34" rx="4" fill="#e3f0e6" stroke="#8fb0c8"/><text x="588.0" y="235" text-anchor="middle" class="small">decode</text><circle cx="650" cy="230" r="6" fill="#ad663c"/><text x="666" y="235" text-anchor="start" class="small">result 3 ready</text><path d="M150 82H490" fill="none" stroke="#286e94" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M490 82H150" fill="none" stroke="#286e94" stroke-width="1.6" marker-end="url(#arrow)"/><text x="318.0" y="74" text-anchor="middle" class="small">latency: start of a round → its result</text><path d="M150 296H230" fill="none" stroke="#ad663c" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M230 296H150" fill="none" stroke="#ad663c" stroke-width="1.6" marker-end="url(#arrow)"/><line x1="150" y1="262" x2="150" y2="302" class="guide"/><line x1="230" y1="262" x2="230" y2="302" class="guide"/><text x="242" y="301" text-anchor="start" class="small">Δ: a new round every interval sets the throughput</text><line x1="130" y1="262" x2="720" y2="262" class="wire"/><text x="720" y="282" text-anchor="end" class="small">time →</text><text x="380" y="338" text-anchor="middle" class="small">A dependent operation must wait for the latency, even though rounds overlap.</text></svg>
