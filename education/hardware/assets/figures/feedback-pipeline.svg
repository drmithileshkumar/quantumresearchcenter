<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Feedback latency and throughput are different</title><desc id="desc">Three successive measurement rounds are processed in overlapping pipeline stages. Each result becomes available only after its dependent processing.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Feedback latency and throughput are different</text><line x1="100" y1="65" x2="100" y2="285" class="guide"/><line x1="240" y1="65" x2="240" y2="285" class="guide"/><line x1="380" y1="65" x2="380" y2="285" class="guide"/><line x1="520" y1="65" x2="520" y2="285" class="guide"/><line x1="660" y1="65" x2="660" y2="285" class="guide"/><rect x="100" y="88" width="113" height="36" rx="3" class="gate"/><text x="156.5" y="112.0" text-anchor="middle" class="">acquire</text><rect x="220" y="88" width="113" height="36" rx="3" class="gate"/><text x="276.5" y="112.0" text-anchor="middle" class="">classify</text><rect x="340" y="88" width="113" height="36" rx="3" class="gate"/><text x="396.5" y="112.0" text-anchor="middle" class="">decode</text><rect x="180" y="158" width="113" height="36" rx="3" class="gate"/><text x="236.5" y="182.0" text-anchor="middle" class="">acquire</text><rect x="300" y="158" width="113" height="36" rx="3" class="gate"/><text x="356.5" y="182.0" text-anchor="middle" class="">classify</text><rect x="420" y="158" width="113" height="36" rx="3" class="gate"/><text x="476.5" y="182.0" text-anchor="middle" class="">decode</text><rect x="260" y="228" width="113" height="36" rx="3" class="gate"/><text x="316.5" y="252.0" text-anchor="middle" class="">acquire</text><rect x="380" y="228" width="113" height="36" rx="3" class="gate"/><text x="436.5" y="252.0" text-anchor="middle" class="">classify</text><rect x="500" y="228" width="113" height="36" rx="3" class="gate"/><text x="556.5" y="252.0" text-anchor="middle" class="">decode</text><text x="380" y="319" text-anchor="middle" class="small">A new round may enter before the earlier result is ready.</text></svg>
