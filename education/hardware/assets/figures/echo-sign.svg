<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Echo reverses the sign of a static frequency error</title><desc id="desc">A π pulse between equal waiting periods reverses the toggling-frame sign of a static Z offset.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Echo reverses the sign of a static frequency error</text><line x1="90" y1="100" x2="685" y2="100" class="wire"/><rect x="107" y="80" width="46" height="40" rx="3" class="gate"/><text x="130.0" y="106.0" text-anchor="middle" class="">π/2</text><rect x="357" y="80" width="46" height="40" rx="3" class="gate"/><text x="380.0" y="106.0" text-anchor="middle" class="">π</text><rect x="617" y="80" width="46" height="40" rx="3" class="gate"/><text x="640.0" y="106.0" text-anchor="middle" class="">π/2</text><text x="245" y="72" text-anchor="middle" class="small">wait t/2</text><text x="510" y="72" text-anchor="middle" class="small">wait t/2</text><line x1="100" y1="225" x2="670" y2="225" class="guide"/><path d="M155 225V165H380V285H620V225" fill="none" stroke="#26796e" stroke-width="2"/><text x="245" y="153" text-anchor="middle" class="small">y(t) = +1</text><text x="510" y="307" text-anchor="middle" class="small">y(t) = −1</text><text x="380" y="325" text-anchor="middle" class="small">static phase: δωt/2 − δωt/2 = 0</text></svg>
