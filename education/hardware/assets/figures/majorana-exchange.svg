<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">An ideal exchange is a path through configuration space</title><desc id="desc">Two mode trajectories exchange horizontal positions as time advances downward. A crossing in this projected drawing is not a physical collision.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">An ideal exchange is a path through configuration space</text><text x="70" y="85" text-anchor="middle" class="small">start</text><text x="70" y="265" text-anchor="middle" class="small">finish</text><circle cx="190" cy="85" r="8" fill="#283f50"/><text x="190" y="65" text-anchor="middle" class="">γ₁</text><circle cx="380" cy="85" r="8" fill="#283f50"/><text x="380" y="65" text-anchor="middle" class="">γ₂</text><circle cx="600" cy="85" r="8" fill="#283f50"/><text x="600" y="65" text-anchor="middle" class="">γ₃</text><path d="M190 85C190 150 380 190 380 265" fill="none" stroke="#286e94" stroke-width="3"/><path d="M380 85C380 140 190 205 190 265" fill="none" stroke="#ad663c" stroke-width="3" stroke-dasharray="7 5"/><path d="M600 85V265" fill="none" stroke="#26796e" stroke-width="3"/><circle cx="190" cy="265" r="8" fill="#283f50"/><circle cx="380" cy="265" r="8" fill="#283f50"/><circle cx="600" cy="265" r="8" fill="#283f50"/><text x="380" y="318" text-anchor="middle" class="small">Ideal algebra: U₁₂ = (I + γ₁γ₂)/√2</text></svg>
