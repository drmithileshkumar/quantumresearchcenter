<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">A physical interaction graph constrains routing</title><desc id="desc">Four sites form a line. The desired operation connects end sites that have no direct native edge.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">A physical interaction graph constrains routing</text><line x1="140" y1="165" x2="300" y2="165" class="wire"/><line x1="300" y1="165" x2="460" y2="165" class="wire"/><line x1="460" y1="165" x2="620" y2="165" class="wire"/><circle cx="140" cy="165" r="20" fill="#e1edf3"/><text x="140" y="171" text-anchor="middle" class="">0</text><circle cx="300" cy="165" r="20" fill="#e1edf3"/><text x="300" y="171" text-anchor="middle" class="">1</text><circle cx="460" cy="165" r="20" fill="#e1edf3"/><text x="460" y="171" text-anchor="middle" class="">2</text><circle cx="620" cy="165" r="20" fill="#e1edf3"/><text x="620" y="171" text-anchor="middle" class="">3</text><path d="M140 125Q380 25 620 125" fill="none" stroke="#ad663c" stroke-width="2" stroke-dasharray="7 5"/><text x="380" y="60" text-anchor="middle" class="small">requested nonlocal gate</text><text x="380" y="235" text-anchor="middle" class="small">native edges: 0—1, 1—2, 2—3</text><text x="380" y="280" text-anchor="middle" class="small">move-and-restore: 2 outward + 2 return SWAPs</text></svg>
