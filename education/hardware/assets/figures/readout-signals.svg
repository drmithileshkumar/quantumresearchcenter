 <title>Overlapping signals require a decision rule</title>
 <metadata>
  <rdf:RDF xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
   <cc:Work>
    <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
    <dc:title>Overlapping signals require a decision rule</dc:title>
    <dc:description>Equal-variance Gaussian models are centered two standard deviations apart. Their overlap causes assignment errors. A midpoint threshold is optimal here only for equally likely preparations and symmetric decision costs.</dc:description>
    <dc:format>image/svg+xml</dc:format>
