    <dc:title>The energy-to-temperature ratio controls thermal excitation</dc:title>
    <dc:description>The normalized two-level Boltzmann population is 1/(1+exp[ℏω/kBT]). This assumes equilibrium of the qubit, not simply a stated refrigerator temperature.</dc:description>
