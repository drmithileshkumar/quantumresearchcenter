<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Internal transitions can change shared motion</title><desc id="desc">Two internal-state ladders have equally spaced motional levels. A carrier preserves n, and the red sideband lowers n by one.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Internal transitions can change shared motion</text><text x="180" y="65" text-anchor="middle" class="heading">internal |0⟩</text><line x1="100" y1="265" x2="210" y2="265" class="wire"/><text x="224" y="270" text-anchor="start" class="">n=0</text><line x1="100" y1="195" x2="210" y2="195" class="wire"/><text x="224" y="200" text-anchor="start" class="">n=1</text><line x1="100" y1="125" x2="210" y2="125" class="wire"/><text x="224" y="130" text-anchor="start" class="">n=2</text><text x="520" y="65" text-anchor="middle" class="heading">internal |1⟩</text><line x1="440" y1="265" x2="550" y2="265" class="wire"/><text x="564" y="270" text-anchor="start" class="">n=0</text><line x1="440" y1="195" x2="550" y2="195" class="wire"/><text x="564" y="200" text-anchor="start" class="">n=1</text><line x1="440" y1="125" x2="550" y2="125" class="wire"/><text x="564" y="130" text-anchor="start" class="">n=2</text><path d="M270 195L430 195" fill="none" stroke="#286e94" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="180" text-anchor="middle" class="small">carrier</text><path d="M270 195L430 265" fill="none" stroke="#ad663c" stroke-width="2" marker-end="url(#arrow)"/><text x="340" y="262" text-anchor="middle" class="small">red sideband</text><text x="380" y="322" text-anchor="middle" class="small">The internal energy gap is removed in this schematic.</text></svg>
