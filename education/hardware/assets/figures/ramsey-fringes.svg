    <dc:title>A Ramsey trace separates fringe frequency from contrast</dc:title>
    <dc:description>The illustrative trace has period 2 μs, visibility 0.9, and an assumed exponential envelope. A cosine-only period gives detuning magnitude, not its sign.</dc:description>
