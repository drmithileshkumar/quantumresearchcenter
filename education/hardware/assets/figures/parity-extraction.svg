<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Measure joint parity using one auxiliary</title><desc id="desc">Two data-controlled CNOTs write x XOR y to a zero-initialized auxiliary; only the auxiliary is measured.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Measure joint parity using one auxiliary</text><text x="100" y="105" text-anchor="middle" class="">data x</text><line x1="170" y1="100" x2="685" y2="100" class="wire"/><text x="100" y="185" text-anchor="middle" class="">data y</text><line x1="170" y1="180" x2="685" y2="180" class="wire"/><text x="100" y="265" text-anchor="middle" class="">aux |0⟩</text><line x1="170" y1="260" x2="685" y2="260" class="wire"/><line x1="300" y1="100" x2="300" y2="260" class="wire"/><circle cx="300" cy="100" r="5" fill="#283f50"/><circle cx="300" cy="260" r="11" fill="white" stroke="#283f50" stroke-width="1.6"/><line x1="289" y1="260" x2="311" y2="260" class="wire"/><line x1="300" y1="249" x2="300" y2="271" class="wire"/><line x1="445" y1="180" x2="445" y2="260" class="wire"/><circle cx="445" cy="180" r="5" fill="#283f50"/><circle cx="445" cy="260" r="11" fill="white" stroke="#283f50" stroke-width="1.6"/><line x1="434" y1="260" x2="456" y2="260" class="wire"/><line x1="445" y1="249" x2="445" y2="271" class="wire"/><rect x="582" y="240" width="46" height="40" rx="3" class="gate"/><text x="605.0" y="266.0" text-anchor="middle" class="">M</text><text x="380" y="325" text-anchor="middle" class="small">outcome 0 → even parity; outcome 1 → odd parity</text></svg>
