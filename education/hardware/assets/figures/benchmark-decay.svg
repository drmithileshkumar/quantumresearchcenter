    <dc:title>A sequence-length decay is a model-dependent inference</dc:title>
    <dc:description>Both curves use A = 0.45 and B = 0.5. Under the effective single-qubit depolarizing model, infidelity per fitted element is (1−α)/2; it is not automatically per native pulse.</dc:description>
