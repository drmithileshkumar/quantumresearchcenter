<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">A nonlinear circuit and its selected levels</title><desc id="desc">A capacitor and Josephson junction form a parallel circuit. The junction supplies a nonlinear energy instead of an ordinary quadratic inductive energy.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">A nonlinear circuit and its selected levels</text><path d="M150 85H430V255H150Z" fill="none" stroke="#283f50" stroke-width="2"/><line x1="136" y1="145" x2="164" y2="145" class="wire"/><line x1="136" y1="163" x2="164" y2="163" class="wire"/><rect x="139" y="146" width="22" height="16" fill="white"/><line x1="132" y1="147" x2="168" y2="147" class="wire"/><line x1="132" y1="163" x2="168" y2="163" class="wire"/><text x="100" y="160" text-anchor="middle" class="">C</text><rect x="416" y="145" width="28" height="32" rx="3" class="gate"/><line x1="418" y1="147" x2="442" y2="175" class="wire"/><line x1="418" y1="175" x2="442" y2="147" class="wire"/><text x="480" y="166" text-anchor="middle" class="">JJ</text><text x="290" y="303" text-anchor="middle" class="small">H = 4E꜀(n − nɡ)² − Eⱼ cos φ</text><line x1="555" y1="255" x2="650" y2="255" class="wire"/><text x="664" y="260" text-anchor="start" class="">|0⟩</text><line x1="555" y1="175" x2="650" y2="175" class="wire"/><text x="664" y="180" text-anchor="start" class="">|1⟩</text><line x1="555" y1="105" x2="650" y2="105" class="wire"/><text x="664" y="110" text-anchor="start" class="">|2⟩</text></svg>
