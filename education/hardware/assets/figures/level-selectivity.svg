<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">Energy spacing determines spectral selectivity</title><desc id="desc">Harmonic levels have equal gaps, while an illustrative anharmonic ladder has a smaller second gap.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">Energy spacing determines spectral selectivity</text><text x="180" y="65" text-anchor="middle" class="heading">Harmonic oscillator</text><line x1="80" y1="260" x2="230" y2="260" class="wire"/><text x="244" y="265" text-anchor="start" class="">|0⟩</text><line x1="80" y1="180" x2="230" y2="180" class="wire"/><text x="244" y="185" text-anchor="start" class="">|1⟩</text><line x1="80" y1="100" x2="230" y2="100" class="wire"/><text x="244" y="105" text-anchor="start" class="">|2⟩</text><line x1="115" y1="255" x2="115" y2="185" class="wire" style="stroke:#286e94"/><line x1="160" y1="175" x2="160" y2="105" class="wire" style="stroke:#ad663c"/><text x="520" y="65" text-anchor="middle" class="heading">Anharmonic device</text><line x1="420" y1="260" x2="570" y2="260" class="wire"/><text x="584" y="265" text-anchor="start" class="">|0⟩</text><line x1="420" y1="160" x2="570" y2="160" class="wire"/><text x="584" y="165" text-anchor="start" class="">|1⟩</text><line x1="420" y1="85" x2="570" y2="85" class="wire"/><text x="584" y="90" text-anchor="start" class="">|2⟩</text><line x1="455" y1="255" x2="455" y2="165" class="wire" style="stroke:#286e94"/><line x1="500" y1="155" x2="500" y2="90" class="wire" style="stroke:#ad663c"/><text x="180" y="310" text-anchor="middle" class="small">ω₁₂ = ω₀₁</text><text x="530" y="310" text-anchor="middle" class="small">α = ω₁₂ − ω₀₁ ≠ 0</text></svg>
