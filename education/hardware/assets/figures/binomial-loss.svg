<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">One loss changes parity without reading this code</title><desc id="desc">The binomial code uses even-number states. One photon loss maps both logical states into distinct odd-number states with the same amplitude factor.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">One loss changes parity without reading this code</text><line x1="85" y1="240" x2="150" y2="240" class="wire"/><text x="164" y="245" text-anchor="start" class="">0</text><text x="115" y="275" text-anchor="middle" class="small">|0⟩</text><line x1="220" y1="240" x2="285" y2="240" class="wire"/><text x="299" y="245" text-anchor="start" class="">1</text><text x="250" y="275" text-anchor="middle" class="small">|1⟩</text><line x1="355" y1="240" x2="420" y2="240" class="wire"/><text x="434" y="245" text-anchor="start" class="">2</text><text x="385" y="275" text-anchor="middle" class="small">|2⟩</text><line x1="490" y1="240" x2="555" y2="240" class="wire"/><text x="569" y="245" text-anchor="start" class="">3</text><text x="520" y="275" text-anchor="middle" class="small">|3⟩</text><line x1="625" y1="240" x2="690" y2="240" class="wire"/><text x="704" y="245" text-anchor="start" class="">4</text><text x="655" y="275" text-anchor="middle" class="small">|4⟩</text><text x="200" y="90" text-anchor="middle" class="heading">|0L⟩ = (|0⟩ + |4⟩)/√2</text><text x="530" y="90" text-anchor="middle" class="heading">|1L⟩ = |2⟩</text><path d="M650 215Q600 130 525 215" fill="none" stroke="#286e94" stroke-width="2" marker-end="url(#arrow)"/><text x="610" y="143" text-anchor="middle" class="small">√2 |3⟩</text><path d="M380 215Q335 130 250 215" fill="none" stroke="#ad663c" stroke-width="2" marker-end="url(#arrow)"/><text x="320" y="143" text-anchor="middle" class="small">√2 |1⟩</text><text x="380" y="321" text-anchor="middle" class="small">Both codewords start even; both loss states are odd.</text></svg>
