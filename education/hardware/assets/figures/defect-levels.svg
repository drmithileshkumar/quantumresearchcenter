<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="title desc"><title id="title">A selected transition in a spin-one defect</title><desc id="desc">An axial spin-one model has m=0 and m=±1 ground-manifold levels. A magnetic field splits the two microwave transitions.</desc><style>text{font:16px system-ui,sans-serif;fill:#283f50}.small{font-size:13px}.heading{font-weight:600;fill:#286e94}.wire{stroke:#283f50;stroke-width:2;fill:none}.guide{stroke:#b7c8d2;stroke-width:1;fill:none}.gate{fill:#f0f6f8;stroke:#286e94;stroke-width:1.6}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><text x="380" y="27" text-anchor="middle" class="heading">A selected transition in a spin-one defect</text><line x1="75" y1="265" x2="215" y2="265" class="wire"/><text x="229" y="270" text-anchor="start" class="">m = 0</text><line x1="355" y1="130" x2="475" y2="130" class="wire"/><text x="489" y="135" text-anchor="start" class="">m = −1</text><line x1="535" y1="85" x2="655" y2="85" class="wire"/><text x="669" y="90" text-anchor="start" class="">m = +1</text><path d="M180 250L375 145" fill="none" stroke="#286e94" stroke-width="2" marker-end="url(#arrow)"/><path d="M215 250Q690 245 600 100" fill="none" stroke="#ad663c" stroke-width="2" marker-end="url(#arrow)"/><text x="245" y="170" text-anchor="middle" class="small">D − γₑB</text><text x="490" y="210" text-anchor="middle" class="small">D + γₑB</text><text x="380" y="318" text-anchor="middle" class="small">Axial model only; optical excited levels are omitted.</text></svg>
