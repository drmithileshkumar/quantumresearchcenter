    <dc:title>Retries convert per-attempt success into waiting probability</dc:title>
    <dc:description>The curves are 1−(1−s)^N. Mean attempts are 1/s, while the distribution has a long tail that affects memory waiting and multi-link scheduling.</dc:description>
