    <dc:title>An isolated blockade estimate improves with |B|/Ω</dc:title>
    <dc:description>At |B|/Ω = 20 the bound is 1/401. It excludes Rydberg decay, pulse phase error, motion, and multilevel structure; it is not a total gate infidelity.</dc:description>
