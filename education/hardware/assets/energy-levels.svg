<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="title desc"><title id="title">Selecting two energy levels</title><desc id="desc">Equal spacings in a harmonic oscillator compared with a smaller second transition in a weakly anharmonic device. Vertical positions show relative energy, not measured device data.</desc><rect width="900" height="380" fill="#faf9f6"/><g fill="#203b37" font-family="DejaVu Sans,sans-serif" font-size="18"><text x="110" y="35">Harmonic oscillator</text><text x="520" y="35">Weakly anharmonic qubit</text><path d="M130 300L320 300" fill="none" stroke="#234c46" stroke-width="3"/><text x="335" y="306">|0⟩</text><path d="M130 200L320 200" fill="none" stroke="#234c46" stroke-width="3"/><text x="335" y="206">|1⟩</text><path d="M130 100L320 100" fill="none" stroke="#234c46" stroke-width="3"/><text x="335" y="106">|2⟩</text><path d="M200 290L200 210" fill="none" stroke="#234c46" stroke-width="3"/><text x="80" y="260">f₀₁</text><path d="M200 190L200 110" fill="none" stroke="#234c46" stroke-width="3"/><text x="80" y="160">f₁₂</text><path d="M550 300L740 300" fill="none" stroke="#234c46" stroke-width="3"/><text x="755" y="306">|0⟩</text><path d="M550 200L740 200" fill="none" stroke="#234c46" stroke-width="3"/><text x="755" y="206">|1⟩</text><path d="M550 120L740 120" fill="none" stroke="#234c46" stroke-width="3"/><text x="755" y="126">|2⟩</text><path d="M620 290L620 210" fill="none" stroke="#234c46" stroke-width="3"/><text x="500" y="260">f₀₁</text><path d="M620 190L620 130" fill="none" stroke="#234c46" stroke-width="3"/><text x="500" y="160">f₁₂</text><text x="145" y="350">f₁₂ = f₀₁</text><text x="555" y="350">f₁₂ &lt; f₀₁</text></g></svg>