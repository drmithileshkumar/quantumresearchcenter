<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" role="img" aria-labelledby="title desc"><title id="title">bb84</title><desc id="desc">An ideal BB84 signal: Alice selects bit x and basis a; Bob selects basis b. The wire between preparation and readout is the transmitted quantum system. Keep rounds with a=b.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H781" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">bit</text><rect x="184.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="210" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">X^x</text><rect x="344.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="370" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H^a</text><rect x="584.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="610" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H^b</text><rect x="781.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="805" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M829 62H860 M829 68H860" /></g></svg>