<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" role="img" aria-labelledby="title desc"><title id="title">optimal-basis</title><desc id="desc">Minimum-error discrimination for equal-prior zero and plus. After this rotation, guess zero for outcome zero and plus for outcome one.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H766" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0⟩ or |+⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">guess</text><rect x="372.5" y="41" width="95" height="48" rx="3" fill="#e7efeb" /><text x="420" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">Ry(π/4)</text><rect x="766.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="790" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M814 62H860 M814 68H860" /></g></svg>