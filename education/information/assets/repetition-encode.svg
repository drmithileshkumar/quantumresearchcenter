<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-labelledby="title desc"><title id="title">repetition-encode</title><desc id="desc">Three-qubit repetition encoding produces α|000⟩+β|111⟩. This is joint encoding, not three independent copies.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">α|0⟩+β|1⟩</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0⟩</text><path d="M140 215H860" /><text x="66" y="221" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0⟩</text><path d="M330 65V140" /><circle cx="330" cy="65" r="6" fill="#234c46" /><circle cx="330" cy="140" r="15" fill="#faf9f6" /><path d="M315 140h30 M330 125v30" /><path d="M620 65V215" /><circle cx="620" cy="65" r="6" fill="#234c46" /><circle cx="620" cy="215" r="15" fill="#faf9f6" /><path d="M605 215h30 M620 200v30" /></g></svg>