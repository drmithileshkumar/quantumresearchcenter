<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-labelledby="title desc"><title id="title">parity</title><desc id="desc">A Z-parity measurement. The auxiliary records the XOR of two data bits, revealing agreement without reading either logical basis value separately.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">data 1</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">data 1</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">data 2</text><text x="930" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">data 2</text><path d="M140 215H766" /><text x="66" y="221" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">ancilla |0⟩</text><text x="930" y="221" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">parity</text><path d="M300 65V215" /><circle cx="300" cy="65" r="6" fill="#234c46" /><circle cx="300" cy="215" r="15" fill="#faf9f6" /><path d="M285 215h30 M300 200v30" /><path d="M520 140V215" /><circle cx="520" cy="140" r="6" fill="#234c46" /><circle cx="520" cy="215" r="15" fill="#faf9f6" /><path d="M505 215h30 M520 200v30" /><rect x="766.0" y="191" width="48" height="48" rx="3" fill="#e7efeb" /><text x="790" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M814 212H860 M814 218H860" /></g></svg>