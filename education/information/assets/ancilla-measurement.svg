<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc"><title id="title">ancilla-measurement</title><desc id="desc">Measure the auxiliary after CNOT to record the system’s Z value. Ignoring the record gives dephasing; conditioning on it gives a projective state update.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|ψ⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">conditional</text><path d="M140 140H766" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">auxiliary |0⟩</text><text x="930" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">record</text><path d="M410 65V140" /><circle cx="410" cy="65" r="6" fill="#234c46" /><circle cx="410" cy="140" r="15" fill="#faf9f6" /><path d="M395 140h30 M410 125v30" /><rect x="766.0" y="116" width="48" height="48" rx="3" fill="#e7efeb" /><text x="790" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M814 137H860 M814 143H860" /></g></svg>