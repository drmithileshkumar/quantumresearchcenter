<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" role="img" aria-labelledby="title desc"><title id="title">interference</title><desc id="desc">Relative phase becomes a measurable probability: the zero outcome occurs with probability (1+cos φ)/2.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H786" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">bit</text><rect x="221.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="245" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><rect x="399.0" y="41" width="62" height="48" rx="3" fill="#e7efeb" /><text x="430" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">P(φ)</text><rect x="596.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="620" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><rect x="786.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="810" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M834 62H860 M834 68H860" /></g></svg>