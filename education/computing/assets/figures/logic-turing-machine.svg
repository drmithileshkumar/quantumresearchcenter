<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="title desc"><title id="title">A Turing machine: tape, head, and finite control</title><desc id="desc">A tape holds blanks and a finite block of ones. The head reads one cell. In state q, reading 1 leaves 1, moves right and remains in q; reading blank enters halt. A universal machine instead reads an encoded rule table and input and simulates it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">A Turing machine: tape, head, and finite control</text><text x="360" y="59" text-anchor="middle" class="small">Tape: no fixed bound on available cells</text><rect x="80" y="80" width="80" height="52" rx="5" class="node"/><text x="120.0" y="111.0" text-anchor="middle" class="">…</text><rect x="160" y="80" width="80" height="52" rx="5" class="node"/><text x="200.0" y="111.0" text-anchor="middle" class="">□</text><rect x="240" y="80" width="80" height="52" rx="5" class="accent"/><text x="280.0" y="111.0" text-anchor="middle" class="">1</text><rect x="320" y="80" width="80" height="52" rx="5" class="node"/><text x="360.0" y="111.0" text-anchor="middle" class="">1</text><rect x="400" y="80" width="80" height="52" rx="5" class="node"/><text x="440.0" y="111.0" text-anchor="middle" class="">1</text><rect x="480" y="80" width="80" height="52" rx="5" class="node"/><text x="520.0" y="111.0" text-anchor="middle" class="">□</text><rect x="560" y="80" width="80" height="52" rx="5" class="node"/><text x="600.0" y="111.0" text-anchor="middle" class="">…</text><path d="M280 185 L280 132" class="edge"/><text x="328" y="168" text-anchor="start" class="small">read / write head</text><rect x="180" y="185" width="200" height="52" rx="5" class="accent"/><text x="280.0" y="216.0" text-anchor="middle" class="">Finite control: q</text><rect x="430" y="185" width="250" height="75" rx="5" class="node"/><text x="555.0" y="216.5" text-anchor="middle" class="">q, 1 → write 1; right; q</text><text x="555.0" y="238.5" text-anchor="middle" class="">q, □ → halt</text><path d="M380 211 L430 211" class="edge"/><text x="555" y="282" text-anchor="middle" class="small">Example rule table (□ = blank)</text><text x="360" y="315" text-anchor="middle" class="label">Universal simulation</text><rect x="30" y="339" width="215" height="58" rx="5" class="node"/><text x="137.5" y="362.0" text-anchor="middle" class="">Encoded program P</text><text x="137.5" y="384.0" text-anchor="middle" class="">and input x</text><path d="M245 368 L285 368" class="edge"/><rect x="285" y="339" width="175" height="58" rx="5" class="node"/><text x="372.5" y="373.0" text-anchor="middle" class="">Universal machine</text><path d="M460 368 L500 368" class="edge"/><rect x="500" y="339" width="190" height="58" rx="5" class="node"/><text x="595.0" y="362.0" text-anchor="middle" class="">Simulates the steps</text><text x="595.0" y="384.0" text-anchor="middle" class="">of P on x</text></svg>
