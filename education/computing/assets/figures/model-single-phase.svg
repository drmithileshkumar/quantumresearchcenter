<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc"><title id="title">A relative phase controls the output probabilities</title><desc id="desc">A single qubit starts at zero, passes through H, R phi, H, and measurement. The probabilities are one plus cosine phi over two and one minus cosine phi over two.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:17px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.wire{fill:none;stroke:#246593;stroke-width:2}.gate{fill:white;stroke:#246593;stroke-width:2}</style><text class="heading" x="450" y="30" text-anchor="middle">A relative phase controls the output probabilities</text>
<text x="60" y="126" text-anchor="middle" data-tex="\ket0">|0⟩</text><path class="wire" d="M95 120H700 M750 117H825 M750 123H825"/>
<rect class="gate" x="180" y="95" width="50" height="50" rx="3"/><text x="205" y="127" text-anchor="middle">H</text>
<rect class="gate" x="355" y="95" width="70" height="50" rx="3"/><text x="390" y="127" text-anchor="middle" data-tex="R_\phi">Rφ</text>
<rect class="gate" x="540" y="95" width="50" height="50" rx="3"/><text x="565" y="127" text-anchor="middle">H</text>
<rect class="gate" x="700" y="95" width="50" height="50" rx="3"/><text x="725" y="127" text-anchor="middle">M</text><text x="850" y="127" text-anchor="middle">y</text>
<text x="450" y="210" text-anchor="middle" data-tex="p(0)=\frac{1+\cos\phi}{2},\qquad p(1)=\frac{1-\cos\phi}{2}">p(0) = (1 + cos φ)/2,   p(1) = (1 − cos φ)/2</text>
<text class="small" x="450" y="260" text-anchor="middle">φ = 0 returns zero; φ = π returns one; φ = π/2 gives equal probabilities.</text></svg>