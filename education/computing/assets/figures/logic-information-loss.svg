<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="title desc"><title id="title">Retaining inputs preserves the distinctions AND discards</title><desc id="desc">Ordinary AND maps inputs 00, 01, and 10 to zero and 11 to one. Retaining x and y and placing their AND into a target initially zero gives distinct three-bit outputs. The full reversible update is x,y,t to x,y,t XOR xy.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Retaining inputs preserves the distinctions AND discards</text><text x="170" y="62" text-anchor="middle" class="label" data-math="Retain only \(\mathrm{AND}(x,y)\)">Retain only AND(x,y)</text><text x="545" y="62" text-anchor="middle" class="label">Retain inputs and update a target</text><rect x="25" y="90" width="65" height="36" rx="5" class="node"/><text x="57.5" y="113" text-anchor="middle" class="">00</text><rect x="25" y="145" width="65" height="36" rx="5" class="node"/><text x="57.5" y="168" text-anchor="middle" class="">01</text><rect x="25" y="200" width="65" height="36" rx="5" class="node"/><text x="57.5" y="223" text-anchor="middle" class="">10</text><rect x="25" y="255" width="65" height="36" rx="5" class="node"/><text x="57.5" y="278" text-anchor="middle" class="">11</text><rect x="240" y="150" width="65" height="40" rx="5" class="accent"/><text x="272.5" y="175" text-anchor="middle" class="">0</text><rect x="240" y="255" width="65" height="36" rx="5" class="accent"/><text x="272.5" y="278" text-anchor="middle" class="">1</text><path d="M90 108 L165 108 L165 170 L240 170" class="edge"/><path d="M90 163 L165 163 L165 170 L240 170" class="edge"/><path d="M90 218 L165 218 L165 170 L240 170" class="edge"/><path d="M90 273 L240 273" class="edge"/><rect x="420" y="90" width="85" height="36" rx="5" class="node"/><text x="462.5" y="113" text-anchor="middle" class="">000</text><rect x="615" y="90" width="85" height="36" rx="5" class="accent"/><text x="657.5" y="113" text-anchor="middle" class="">000</text><path d="M505 108 L615 108" class="edge"/><rect x="420" y="145" width="85" height="36" rx="5" class="node"/><text x="462.5" y="168" text-anchor="middle" class="">010</text><rect x="615" y="145" width="85" height="36" rx="5" class="accent"/><text x="657.5" y="168" text-anchor="middle" class="">010</text><path d="M505 163 L615 163" class="edge"/><rect x="420" y="200" width="85" height="36" rx="5" class="node"/><text x="462.5" y="223" text-anchor="middle" class="">100</text><rect x="615" y="200" width="85" height="36" rx="5" class="accent"/><text x="657.5" y="223" text-anchor="middle" class="">100</text><path d="M505 218 L615 218" class="edge"/><rect x="420" y="255" width="85" height="36" rx="5" class="node"/><text x="462.5" y="278" text-anchor="middle" class="">110</text><rect x="615" y="255" width="85" height="36" rx="5" class="accent"/><text x="657.5" y="278" text-anchor="middle" class="">111</text><path d="M505 273 L615 273" class="edge"/><text x="545" y="318" text-anchor="middle" class="small" data-math="Shown: target \(t\) initially 0">Shown: target t initially 0</text><text x="360" y="351" text-anchor="middle" class="small" data-math="Full update: \((x,y,t)\to(x,y,t\oplus xy)\); applying it twice restores the input.">Full update: (x,y,t)→(x,y,t⊕ xy); applying it twice restores the input.</text></svg>
