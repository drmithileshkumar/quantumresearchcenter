<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc"><title id="title">Composition of U and its adjoint</title><desc id="desc">A three-layer graph shows inputs k, intermediate configurations j, and outputs i. The first step U has matrix rows a,c and b,d. The second step U dagger reverses the original arrows and conjugates their weights. Each entry of U dagger U is the sum of the two path products to that output. Normalized columns give diagonal entries one; orthogonal columns give off-diagonal entries zero. Under these conditions the composite is the identity.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="245" y="30" text-anchor="middle" class="heading">One step, then its adjoint</text><text x="720" y="30" text-anchor="middle" class="heading">Sum products along the two-step paths</text><text x="80" y="72" text-anchor="middle" class="small" data-math="Input \(k\)">Input k</text><text x="245" y="72" text-anchor="middle" class="small" data-math="Intermediate \(j\)">Intermediate j</text><text x="410" y="72" text-anchor="middle" class="small" data-math="Output \(i\)">Output i</text><text x="162" y="100" text-anchor="middle" class="heading" data-tex="U">U</text><text x="327" y="100" text-anchor="middle" class="heading" data-tex="U^\dagger">U†</text><path class="edge" d="M104 140H221" style="stroke:#246593"/><text x="162" y="129" text-anchor="middle" class="weight" style="fill:#246593" data-tex="a">a</text><path class="edge" d="M99 154L226 286" style="stroke:#246593"/><text x="137" y="218" text-anchor="middle" class="weight" style="fill:#246593" data-tex="b">b</text><path class="edge" d="M99 286L226 154" style="stroke:#a64d26"/><text x="190" y="205" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="c">c</text><path class="edge" d="M104 300H221" style="stroke:#a64d26"/><text x="162" y="329" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="d">d</text><path class="edge" d="M269 140H386" style="stroke:#246593"/><text x="327" y="129" text-anchor="middle" class="weight" style="fill:#246593" data-tex="a^*">a*</text><path class="edge" d="M264 154L391 286" style="stroke:#a64d26"/><text x="302" y="218" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="c^*">c*</text><path class="edge" d="M264 286L391 154" style="stroke:#246593"/><text x="355" y="205" text-anchor="middle" class="weight" style="fill:#246593" data-tex="b^*">b*</text><path class="edge" d="M269 300H386" style="stroke:#a64d26"/><text x="327" y="329" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="d^*">d*</text><circle cx="80" cy="140" r="24" class="node"/><text x="80" y="146" text-anchor="middle" class="" data-tex="0">0</text><circle cx="80" cy="300" r="24" class="node"/><text x="80" y="306" text-anchor="middle" class="" data-tex="1">1</text><circle cx="245" cy="140" r="24" class="node"/><text x="245" y="146" text-anchor="middle" class="" data-tex="0">0</text><circle cx="245" cy="300" r="24" class="node"/><text x="245" y="306" text-anchor="middle" class="" data-tex="1">1</text><circle cx="410" cy="140" r="24" class="node"/><text x="410" y="146" text-anchor="middle" class="" data-tex="0">0</text><circle cx="410" cy="300" r="24" class="node"/><text x="410" y="306" text-anchor="middle" class="" data-tex="1">1</text><path class="rule" d="M475 55V350"/><text x="720" y="180" text-anchor="middle" data-max-width="425" style="font-size:18px" data-tex="U^\dagger U=\begin{pmatrix}a^*a+b^*b&amp;a^*c+b^*d\\c^*a+d^*b&amp;c^*c+d^*d\end{pmatrix}">U† U=beginpmatrixa*a+b*b&amp;a*c+b*d\c*a+d*b&amp;c*c+d*dendpmatrix</text><text x="720" y="245" text-anchor="middle" class="" data-tex="=\begin{pmatrix}1&amp;0\\0&amp;1\end{pmatrix}=I">=beginpmatrix1&amp;0\0&amp;1endpmatrix=I</text><text x="720" y="305" text-anchor="middle" class="small">Unit output vectors give the diagonal ones.</text><text x="720" y="330" text-anchor="middle" class="small">Orthogonal outputs give the off-diagonal zeros.</text><text x="480" y="395" text-anchor="middle" class="" data-tex="(U^\dagger U)_{ik}=\sum_j U_{ji}^*U_{jk}=\begin{cases}1&amp;i=k\\0&amp;i\ne k\end{cases}">(U† U)ᵢₖ=Σⱼ Uⱼᵢ*Uⱼₖ=begincases1&amp;i=k\0&amp;i≠ kendcases</text></svg>
