<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 370" width="100%" height="auto" class="model-diagram" role="img" aria-label="Pauli transitions and operator basis">
  <defs>
    <style>
      .bg-panel { fill: none; stroke: #cbd5e1; stroke-width: 1.2; rx: 8; }
      .bg-card { fill: none; stroke: #e2e8f0; stroke-width: 1.2; rx: 6; }
      .title-text { font-family: system-ui, sans-serif; font-size: 13px; font-weight: 700; fill: #1a3b47; text-anchor: middle; }
      .sub-title { font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600; fill: #475569; text-anchor: middle; }
      .body-text { font-family: system-ui, sans-serif; font-size: 11px; fill: #475569; }
      .math-lbl { font-family: Georgia, serif; font-size: 13px; fill: #30343b; text-anchor: middle; }
      .trans-arrow { stroke: #246593; stroke-width: 1.8; fill: none; }
      .trans-arrow-y { stroke: #d97706; stroke-width: 1.8; fill: none; }
      .trans-arrow-z { stroke: #0891b2; stroke-width: 1.8; fill: none; }
      .loop-arc { stroke: #0891b2; stroke-width: 1.8; fill: none; }
      .state-node { fill: none; stroke: #246593; stroke-width: 2; }
      .state-node-1 { fill: none; stroke: #d97706; stroke-width: 2; }
      .badge-box { fill: none; stroke: #cbd5e1; stroke-width: 1; rx: 4; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#246593" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#d97706" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0891b2" />
    </marker>
  </defs>

  <!-- PANEL 1: Pauli X (Bit Flip) -->
  <rect x="15" y="10" width="180" height="345" class="bg-panel" />
  <text x="105" y="32" text-anchor="middle" class="title-text">Pauli X: Bit-Flip</text>
  <text x="105" y="48" text-anchor="middle" class="sub-title">Swap Basis States</text>

  <!-- Graph X -->
  <!-- State |0> -->
  <circle cx="105" cy="95" r="22" class="state-node" />
  <text x="105" y="100" text-anchor="middle" class="math-lbl" data-tex="\ket{0}">\ket{0}</text>

  <!-- State |1> -->
  <circle cx="105" cy="195" r="22" class="state-node-1" />
  <text x="105" y="200" text-anchor="middle" class="math-lbl" data-tex="\ket{1}">\ket{1}</text>

  <!-- Transitions |0> <-> |1> -->
  <path d="M 88 108 C 70 135 70 155 88 182" class="trans-arrow" marker-end="url(#arrow-blue)" />
  <text x="56" y="149" class="body-text" font-weight="700" fill="#246593">+1</text>

  <path d="M 122 182 C 140 155 140 135 122 108" class="trans-arrow" marker-end="url(#arrow-blue)" />
  <text x="144" y="149" class="body-text" font-weight="700" fill="#246593">+1</text>

  <!-- Matrix Card X at bottom -->
  <rect x="25" y="235" width="160" height="105" class="bg-card" />
  <text x="105" y="254" text-anchor="middle" class="math-lbl" data-tex="X = \begin{pmatrix} 0 &amp; 1 \\ 1 &amp; 0 \end{pmatrix}">X = \begin{pmatrix} 0 &amp; 1 \\ 1 &amp; 0 \end{pmatrix}</text>
  <text x="105" y="302" text-anchor="middle" class="math-lbl" data-tex="X\ket{0} = \ket{1}">X\ket{0} = \ket{1}</text>
  <text x="105" y="326" text-anchor="middle" class="math-lbl" data-tex="X\ket{1} = \ket{0}">X\ket{1} = \ket{0}</text>


  <!-- PANEL 2: Pauli Y (Bit & Phase Flip) -->
  <rect x="205" y="10" width="180" height="345" class="bg-panel" />
  <text x="295" y="32" text-anchor="middle" class="title-text">Pauli Y: Bit + Phase</text>
  <text x="295" y="48" text-anchor="middle" class="sub-title">Swap with Complex Weight</text>

  <!-- Graph Y -->
  <circle cx="295" cy="95" r="22" class="state-node" />
  <text x="295" y="100" text-anchor="middle" class="math-lbl" data-tex="\ket{0}">\ket{0}</text>

  <circle cx="295" cy="195" r="22" class="state-node-1" />
  <text x="295" y="200" text-anchor="middle" class="math-lbl" data-tex="\ket{1}">\ket{1}</text>

  <path d="M 278 108 C 260 135 260 155 278 182" class="trans-arrow-y" marker-end="url(#arrow-amber)" />
  <text x="250" y="149" class="body-text" font-weight="700" fill="#d97706">+i</text>

  <path d="M 312 182 C 330 155 330 135 312 108" class="trans-arrow-y" marker-end="url(#arrow-amber)" />
  <text x="334" y="149" class="body-text" font-weight="700" fill="#d97706">-i</text>

  <!-- Matrix Card Y at bottom -->
  <rect x="215" y="235" width="160" height="105" class="bg-card" />
  <text x="295" y="254" text-anchor="middle" class="math-lbl" data-tex="Y = \begin{pmatrix} 0 &amp; -i \\ i &amp; 0 \end{pmatrix}">Y = \begin{pmatrix} 0 &amp; -i \\ i &amp; 0 \end{pmatrix}</text>
  <text x="295" y="302" text-anchor="middle" class="math-lbl" data-tex="Y\ket{0} = i\ket{1}">Y\ket{0} = i\ket{1}</text>
  <text x="295" y="326" text-anchor="middle" class="math-lbl" data-tex="Y\ket{1} = -i\ket{0}">Y\ket{1} = -i\ket{0}</text>


  <!-- PANEL 3: Pauli Z (Phase Flip) -->
  <rect x="395" y="10" width="180" height="345" class="bg-panel" />
  <text x="485" y="32" text-anchor="middle" class="title-text">Pauli Z: Phase-Flip</text>
  <text x="485" y="48" text-anchor="middle" class="sub-title">Diagonal Relative Phase</text>

  <!-- Graph Z -->
  <!-- Loop on |0>: Arc above node -->
  <path d="M 473 80 C 455 52 515 52 497 80" class="loop-arc" marker-end="url(#arrow-cyan)" />
  <text x="485" y="58" class="body-text" font-weight="700" fill="#0891b2" text-anchor="middle">+1</text>

  <circle cx="485" cy="95" r="22" class="state-node" />
  <text x="485" y="100" text-anchor="middle" class="math-lbl" data-tex="\ket{0}">\ket{0}</text>

  <circle cx="485" cy="195" r="22" class="state-node-1" />
  <text x="485" y="200" text-anchor="middle" class="math-lbl" data-tex="\ket{1}">\ket{1}</text>

  <!-- Loop on |1>: Arc below node -->
  <path d="M 497 210 C 515 238 455 238 473 210" class="loop-arc" marker-end="url(#arrow-cyan)" />
  <text x="485" y="238" class="body-text" font-weight="700" fill="#0891b2" text-anchor="middle">-1</text>

  <!-- Matrix Card Z at bottom -->
  <rect x="405" y="250" width="160" height="90" class="bg-card" />
  <text x="485" y="268" text-anchor="middle" class="math-lbl" data-tex="Z = \begin{pmatrix} 1 &amp; 0 \\ 0 &amp; -1 \end{pmatrix}">Z = \begin{pmatrix} 1 &amp; 0 \\ 0 &amp; -1 \end{pmatrix}</text>
  <text x="485" y="306" text-anchor="middle" class="math-lbl" data-tex="Z\ket{0} = \ket{0}">Z\ket{0} = \ket{0}</text>
  <text x="485" y="328" text-anchor="middle" class="math-lbl" data-tex="Z\ket{1} = -\ket{1}">Z\ket{1} = -\ket{1}</text>


  <!-- PANEL 4: Algebraic Structure & Operator Basis -->
  <rect x="585" y="10" width="320" height="345" class="bg-panel" />
  <text x="745" y="32" text-anchor="middle" class="title-text">Algebraic Structure &amp; Basis</text>
  <text x="745" y="48" text-anchor="middle" class="sub-title">Anti-Commutation &amp; Operator Completeness</text>

  <!-- Sub-card A: Cyclic multiplication & Anti-commutation -->
  <rect x="597" y="60" width="296" height="130" class="bg-card" />
  <text x="745" y="78" text-anchor="middle" class="title-text" font-size="11.5px">Cyclic Anti-Commutation</text>

  <!-- Cyclic ring nodes -->
  <circle cx="650" cy="120" r="14" class="state-node" />
  <text x="650" y="125" text-anchor="middle" class="math-lbl" font-weight="700" data-tex="X">X</text>

  <circle cx="745" cy="100" r="14" class="state-node-1" />
  <text x="745" y="105" text-anchor="middle" class="math-lbl" font-weight="700" data-tex="Y">Y</text>

  <circle cx="840" cy="120" r="14" class="state-node" style="stroke: #0891b2;" />
  <text x="840" y="125" text-anchor="middle" class="math-lbl" font-weight="700" data-tex="Z">Z</text>

  <!-- Cyclic arrows -->
  <path d="M 664 113 Q 695 98 729 100" class="trans-arrow" marker-end="url(#arrow-blue)" />
  <path d="M 760 102 Q 795 102 825 115" class="trans-arrow-y" marker-end="url(#arrow-amber)" />
  <path d="M 830 130 Q 745 152 662 128" class="trans-arrow-z" marker-end="url(#arrow-cyan)" />

  <text x="745" y="172" text-anchor="middle" class="math-lbl" data-tex="XY = -YX = iZ, \quad \sigma_j^2 = I">\sigma_j \sigma_k = \delta_{jk}I + i\epsilon_{jkl}\sigma_l</text>


  <!-- Sub-card B: Complete Basis of Linear Operators -->
  <rect x="597" y="198" width="296" height="142" class="bg-card" />
  <text x="745" y="218" text-anchor="middle" class="title-text" font-size="11.5px">Complete Operator Basis</text>
  <text x="745" y="235" text-anchor="middle" class="sub-title" data-math="Any single-qubit operator \(M \in \mathbb{C}^{2\times 2}\):">Any single-qubit operator M in C^(2x2):</text>

  <text x="745" y="260" text-anchor="middle" class="math-lbl" data-tex="M = c_0 I + c_1 X + c_2 Y + c_3 Z">M = c_0 I + c_1 X + c_2 Y + c_3 Z</text>

  <rect x="612" y="280" width="266" height="48" class="badge-box" />
  <text x="745" y="300" text-anchor="middle" class="sub-title">Orthogonal under trace inner product:</text>
  <text x="745" y="318" text-anchor="middle" class="math-lbl" data-tex="\mathrm{Tr}(\sigma_j^\dagger \sigma_k) = 2\,\delta_{jk}">\mathrm{Tr}(\sigma_j^\dagger \sigma_k) = 2\,\delta_{jk}</text>

</svg>