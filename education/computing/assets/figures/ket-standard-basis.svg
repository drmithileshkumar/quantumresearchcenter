<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">A ket as a vector in the standard basis</title><desc id="desc">The standard basis vectors ket zero and ket one are perpendicular unit vectors. A blue arrow represents ket psi equals three fifths ket zero plus four fifths ket one. Dashed lines mark its coordinates v zero equals three fifths horizontally and v one equals four fifths vertically. The same ket is the column vector with entries three fifths and four fifths. This real-amplitude drawing represents state space, not physical space.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="380" y="30" text-anchor="middle" class="heading">A ket and its standard-basis coordinates</text><path class="edge" d="M110 330H360" style="stroke:#a64d26"/><path class="edge" d="M110 330V80" style="stroke:#347449"/><path d="M110 130H260V330" stroke="#a7bccd" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/><path class="edge" d="M110 330L260 130"/><text x="110" y="60" text-anchor="middle" class="" data-tex="\ket1">|1⟩</text><text x="385" y="335" text-anchor="middle" class="" data-tex="\ket0">|0⟩</text><text x="280" y="117" text-anchor="middle" class="" data-tex="\ket\psi">|ψ⟩</text><text x="75" y="136" text-anchor="middle" class="" data-tex="v_1=4/5">v₁=4/5</text><text x="260" y="355" text-anchor="middle" class="" data-tex="v_0=3/5">v₀=3/5</text><text x="93" y="352" text-anchor="middle" class="small" data-tex="0">0</text><text x="550" y="75" text-anchor="middle" class="heading">Standard basis</text><text x="485" y="130" text-anchor="middle" class="" data-tex="\ket0=\begin{pmatrix}1\\0\end{pmatrix}">|0⟩=beginpmatrix1\0endpmatrix</text><text x="650" y="130" text-anchor="middle" class="" data-tex="\ket1=\begin{pmatrix}0\\1\end{pmatrix}">|1⟩=beginpmatrix0\1endpmatrix</text><text x="550" y="215" text-anchor="middle" class="" data-tex="\ket\psi=\frac35\ket0+\frac45\ket1">|ψ⟩=3/5|0⟩+4/5|1⟩</text><text x="550" y="280" text-anchor="middle" class="" data-tex="\ket\psi=\begin{pmatrix}3/5\\4/5\end{pmatrix}">|ψ⟩=beginpmatrix3/5\4/5endpmatrix</text><text x="550" y="335" text-anchor="middle" class="small">A real-amplitude example.</text><text x="380" y="400" text-anchor="middle" class="" data-math="\(\ket\psi=v_0\ket0+v_1\ket1\): the coefficients are coordinates.">|ψ⟩=v₀|0⟩+v₁|1⟩: the coefficients are coordinates.</text></svg>
