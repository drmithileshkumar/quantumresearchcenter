<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Deterministic transitions: NOT applied twice</title><desc id="desc">The state diagram of NOT has one arrow from 0 to 1 and one from 1 to 0, each with weight 1. In the time-expanded diagram over two steps from 0, there is a single path, 0 to 1 to 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="180" y="34" text-anchor="middle" class="heading">State diagram</text><circle cx="110" cy="165" r="24" class="node"/><text x="110" y="171" text-anchor="middle" class="" data-tex="0">0</text><circle cx="250" cy="165" r="24" class="node"/><text x="250" y="171" text-anchor="middle" class="" data-tex="1">1</text><path d="M127 148 Q180 95 233 148" class="edge"/><text x="180" y="113" text-anchor="middle" class="weight" data-tex="1">1</text><path d="M233 182 Q180 235 127 182" class="edge"/><text x="180" y="231" text-anchor="middle" class="weight" data-tex="1">1</text><path d="M376 30V300" class="rule"/><text x="552" y="34" text-anchor="middle" class="heading" data-math="Time-expanded diagram from \(0\)">Time-expanded diagram from 0</text><text x="422" y="76" text-anchor="middle" class="small" data-tex="t=0">t=0</text><text x="537" y="76" text-anchor="middle" class="small" data-tex="t=1">t=1</text><text x="652" y="76" text-anchor="middle" class="small" data-tex="t=2">t=2</text><path d="M438 120L521 230" class="edge"/><text x="464.26" y="148.2" text-anchor="start" class="weight" data-tex="1">1</text><path d="M553 230L636 120" class="edge"/><text x="579.26" y="215.8" text-anchor="start" class="weight" data-tex="1">1</text><circle cx="422" cy="120" r="16" class="node"/><text x="422" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="422" cy="230" r="16" class="unused"/><text x="422" y="236" text-anchor="middle" class="small" data-tex="1">1</text><circle cx="537" cy="120" r="16" class="unused"/><text x="537" y="126" text-anchor="middle" class="small" data-tex="0">0</text><circle cx="537" cy="230" r="16" class="node"/><text x="537" y="236" text-anchor="middle" class="" data-tex="1">1</text><circle cx="652" cy="120" r="16" class="node"/><text x="652" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="652" cy="230" r="16" class="unused"/><text x="652" y="236" text-anchor="middle" class="small" data-tex="1">1</text><text x="686" y="125" text-anchor="start" class="" data-math="weight \(1\)">weight 1</text><text x="686" y="235" text-anchor="start" class="" data-math="weight \(0\)">weight 0</text><text x="552" y="300" text-anchor="middle" class="small">One arrow leaves each configuration, so the run has exactly one path.</text></svg>
