<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">A proof is a network of justified steps</title><desc id="desc">Statements P and P implies Q lead by modus ponens to Q. Q and Q implies R lead to R. Each edge records a dependency, not a passage of time.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">A proof is a network of justified steps</text><rect x="45" y="65" width="170" height="50" rx="5" class="node"/><text x="130.0" y="95.0" text-anchor="middle" class="">P</text><rect x="265" y="65" width="190" height="50" rx="5" class="node"/><text x="360.0" y="95.0" text-anchor="middle" class="">P implies Q</text><path d="M130 115 L130 150 L210 150 L210 180" class="edge"/><path d="M360 115 L360 150 L290 150 L290 180" class="edge"/><text x="250" y="137" text-anchor="middle" class="small">modus ponens</text><rect x="165" y="180" width="170" height="50" rx="5" class="accent"/><text x="250.0" y="210.0" text-anchor="middle" class="">Q</text><rect x="465" y="180" width="210" height="50" rx="5" class="node"/><text x="570.0" y="210.0" text-anchor="middle" class="">Q implies R</text><path d="M335 205 L395 205 L395 270" class="edge"/><path d="M570 230 L570 270 L475 270" class="edge"/><rect x="315" y="270" width="160" height="38" rx="5" class="accent"/><text x="395.0" y="294.0" text-anchor="middle" class="">R</text></svg>
