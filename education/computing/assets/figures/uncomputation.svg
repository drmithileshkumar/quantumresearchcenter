<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="title desc"><title id="title">Compute, copy a basis label, and uncompute</title><desc id="desc">A computes an answer in workspace. CNOT records the answer in a clean output. A dagger restores the workspace.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="70" text-anchor="middle">x</text><line x1="85" y1="65" x2="660" y2="65"/><text x="40" y="135" text-anchor="middle">0</text><line x1="85" y1="130" x2="660" y2="130"/><text x="40" y="210" text-anchor="middle">0</text><line x1="85" y1="205" x2="660" y2="205"/><rect x="170.0" y="41.0" width="70" height="112" rx="4"/><text x="205" y="103" text-anchor="middle">A</text><line x1="350" y1="130" x2="350" y2="205"/><circle cx="350" cy="130" r="5" style="fill:#476b70"/><circle cx="350" cy="205" r="14"/><line x1="336" y1="205" x2="364" y2="205"/><line x1="350" y1="191" x2="350" y2="219"/><rect x="450.0" y="41.0" width="70" height="112" rx="4"/><text x="485" y="103" text-anchor="middle">A†</text><text x="670" y="49" text-anchor="middle">x</text><text x="670" y="114" text-anchor="middle">0</text><text x="670" y="189" text-anchor="middle">f(x)</text><text x="205" y="252" text-anchor="middle" class="small">compute</text><text x="350" y="252" text-anchor="middle" class="small">copy label</text><text x="485" y="252" text-anchor="middle" class="small">uncompute</text></svg>