<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="title desc"><title id="title">Measurement as projection</title><desc id="desc">A real unit vector projects onto two orthogonal measurement axes. Squared projected lengths give probabilities.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><line x1="100" y1="240" x2="480" y2="240"/><line x1="100" y1="240" x2="100" y2="30"/><line x1="100" y1="240" x2="360" y2="90"/><line x1="360" y1="90" x2="360" y2="240" stroke-dasharray="5 4"/><line x1="360" y1="90" x2="100" y2="90" stroke-dasharray="5 4"/><text x="390" y="83" text-anchor="middle" data-tex="\psi">ψ</text><text x="475" y="265" text-anchor="middle" data-tex="\ket0">|0⟩</text><text x="75" y="35" text-anchor="middle" data-tex="\ket1">|1⟩</text><text x="240" y="265" text-anchor="middle" data-tex="\sqrt3/2">√3/2</text><text x="70" y="160" text-anchor="middle" data-tex="1/2">1/2</text><text x="355" y="35" text-anchor="middle" data-math="\(p(0)=3/4\), \(p(1)=1/4\)">p(0)=3/4, p(1)=1/4</text></svg>