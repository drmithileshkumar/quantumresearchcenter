<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 330" role="img" aria-labelledby="title desc"><title id="title">Quantum teleportation</title><desc id="desc">The Bell pair is prepared on the last two wires. Alice performs CNOT, Hadamard, and two measurements. Their classical bits control X then Z on Bob.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="70" text-anchor="middle" data-tex="\ket\psi">|ψ⟩</text><line x1="85" y1="65" x2="535" y2="65"/><text x="40" y="155" text-anchor="middle" data-tex="\ket0">|0⟩</text><line x1="85" y1="150" x2="535" y2="150"/><text x="40" y="250" text-anchor="middle" data-tex="\ket0">|0⟩</text><line x1="85" y1="245" x2="890" y2="245"/><rect x="131.0" y="130.0" width="48" height="40" rx="4"/><text x="155" y="156" text-anchor="middle" data-tex="H">H</text><line x1="240" y1="150" x2="240" y2="245"/><circle cx="240" cy="150" r="5" style="fill:#476b70"/><circle cx="240" cy="245" r="14"/><line x1="226" y1="245" x2="254" y2="245"/><line x1="240" y1="231" x2="240" y2="259"/><line x1="355" y1="65" x2="355" y2="150"/><circle cx="355" cy="65" r="5" style="fill:#476b70"/><circle cx="355" cy="150" r="14"/><line x1="341" y1="150" x2="369" y2="150"/><line x1="355" y1="136" x2="355" y2="164"/><rect x="421.0" y="45.0" width="48" height="40" rx="4"/><text x="445" y="71" text-anchor="middle" data-tex="H">H</text><rect x="498.0" y="45.0" width="44" height="40" rx="4"/><text x="520" y="71" text-anchor="middle"></text><path d="M507 73 A14 14 0 0 1 533 73 M520 72 l8 -18"/><rect x="498.0" y="130.0" width="44" height="40" rx="4"/><text x="520" y="156" text-anchor="middle"></text><path d="M507 158 A14 14 0 0 1 533 158 M520 157 l8 -18"/><line x1="542" y1="65" x2="785" y2="65" stroke-dasharray="5 4"/><line x1="785" y1="65" x2="785" y2="223" stroke-dasharray="5 4"/><line x1="542" y1="150" x2="665" y2="150" stroke-dasharray="5 4"/><line x1="665" y1="150" x2="665" y2="223" stroke-dasharray="5 4"/><rect x="641.0" y="225.0" width="48" height="40" rx="4"/><text x="665" y="251" text-anchor="middle" data-tex="X^n">Xⁿ</text><rect x="761.0" y="225.0" width="48" height="40" rx="4"/><text x="785" y="251" text-anchor="middle" data-tex="Z^m">Z^m</text><text x="580" y="49" text-anchor="middle" class="small" data-tex="m">m</text><text x="580" y="135" text-anchor="middle" class="small" data-tex="n">n</text><text x="875" y="223" text-anchor="middle" data-tex="\ket\psi">|ψ⟩</text><text x="200" y="298" text-anchor="middle" class="small">shared Bell pair</text><text x="443" y="298" text-anchor="middle" class="small">Alice</text><text x="735" y="298" text-anchor="middle" class="small" data-math="Bob: \(X\) first, then \(Z\)">Bob: X first, then Z</text></svg>