<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">Adjoint: reverse transitions and conjugate amplitudes</title><desc id="desc">The arrows of the preceding U graph are reversed. The original transition i to j with amplitude U ji becomes a transition j to i with conjugate amplitude U ji star. The reversed arrows have weights a star from 0 to 0, b star from 1 to 0, c star from 0 to 1, and d star from 1 to 1. Thus U dagger has rows a star,b star and c star,d star. The original columns become conjugated rows. For a unitary U this is the inverse transition; the adjoint is defined for any matrix.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="205" y="30" text-anchor="middle" class="heading">Reversed transition graph</text><text x="710" y="30" text-anchor="middle" class="heading" data-math="Matrix \(U^\dagger\)">Matrix U†</text><text x="80" y="72" text-anchor="middle" class="small" data-math="Output \(i\)">Output i</text><text x="330" y="72" text-anchor="middle" class="small" data-math="Input \(j\)">Input j</text><path class="edge" d="M306 120H104" style="stroke:#246593"/><text x="205" y="108" text-anchor="middle" class="weight" style="fill:#246593" data-tex="a^*">a*</text><path class="edge" d="M311 265L99 135" style="stroke:#246593"/><text x="160" y="201" text-anchor="middle" class="weight" style="fill:#246593" data-tex="b^*">b*</text><path class="edge" d="M311 135L99 265" style="stroke:#a64d26"/><text x="250" y="201" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="c^*">c*</text><path class="edge" d="M306 280H104" style="stroke:#a64d26"/><text x="205" y="309" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="d^*">d*</text><circle cx="80" cy="120" r="24" class="node"/><text x="80" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="80" cy="280" r="24" class="node"/><text x="80" y="286" text-anchor="middle" class="" data-tex="1">1</text><circle cx="330" cy="120" r="24" class="node"/><text x="330" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="330" cy="280" r="24" class="node"/><text x="330" y="286" text-anchor="middle" class="" data-tex="1">1</text><path class="rule" d="M430 55V330"/><rect x="596" y="125" width="230" height="65" rx="4" fill="#eaf1f7"/><rect x="596" y="210" width="230" height="65" rx="4" fill="#fbefe8"/><text x="646" y="85" text-anchor="middle" class="small" data-math="from \(0\)">from 0</text><text x="776" y="85" text-anchor="middle" class="small" data-math="from \(1\)">from 1</text><text x="520" y="160" text-anchor="middle" class="small" data-math="to \(0\)">to 0</text><text x="520" y="245" text-anchor="middle" class="small" data-math="to \(1\)">to 1</text><text x="548" y="205" text-anchor="middle" class="" data-tex="U^\dagger=">U†=</text><path d="M590 125H580V275H590 M832 125H842V275H832" fill="none" stroke="#30343b" stroke-width="1.6"/><text x="646" y="160" text-anchor="middle" style="fill:#246593;font-size:22px" data-tex="a^*">a*</text><text x="776" y="160" text-anchor="middle" style="fill:#246593;font-size:22px" data-tex="b^*">b*</text><text x="646" y="245" text-anchor="middle" style="fill:#a64d26;font-size:22px" data-tex="c^*">c*</text><text x="776" y="245" text-anchor="middle" style="fill:#a64d26;font-size:22px" data-tex="d^*">d*</text><text x="710" y="320" text-anchor="middle" class="small">Original columns become conjugated rows.</text><text x="480" y="370" text-anchor="middle" class="" data-tex="U=\begin{pmatrix}a&amp;c\\b&amp;d\end{pmatrix}\quad\longmapsto\quad U^\dagger=\begin{pmatrix}a^*&amp;b^*\\c^*&amp;d^*\end{pmatrix}">U=beginpmatrixa&amp;c\b&amp;dendpmatrix longmapsto  U†=beginpmatrixa*&amp;b*\c*&amp;d*endpmatrix</text><text x="480" y="415" text-anchor="middle" class="" data-tex="(U^\dagger)_{ij}=U_{ji}^*=\bigl(\bra jU\ket i\bigr)^*">(U†)ᵢⱼ=Uⱼᵢ*=bigl(⟨j|U|i⟩bigr)*</text></svg>
