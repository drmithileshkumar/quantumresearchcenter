<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-labelledby="title desc"><title id="title">Deterministic does not imply reversible</title><desc id="desc">Two distinct configurations may each have one successor yet share that successor, preventing unique reversal. A one-to-one transition retains distinct resulting states so each has a unique predecessor.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Deterministic does not imply reversible</text><text x="175" y="65" text-anchor="middle" class="label">Deterministic, many-to-one</text><text x="540" y="65" text-anchor="middle" class="label">One-to-one, reversible on its image</text><rect x="25" y="100" width="90" height="45" rx="5" class="node"/><text x="70.0" y="127.5" text-anchor="middle" class="">A</text><rect x="25" y="200" width="90" height="45" rx="5" class="node"/><text x="70.0" y="227.5" text-anchor="middle" class="">B</text><rect x="230" y="150" width="90" height="45" rx="5" class="node"/><text x="275.0" y="177.5" text-anchor="middle" class="">C</text><rect x="410" y="100" width="90" height="45" rx="5" class="node"/><text x="455.0" y="127.5" text-anchor="middle" class="">A</text><rect x="410" y="200" width="90" height="45" rx="5" class="node"/><text x="455.0" y="227.5" text-anchor="middle" class="">B</text><rect x="600" y="100" width="90" height="45" rx="5" class="node"/><text x="645.0" y="127.5" text-anchor="middle" class="">A′</text><rect x="600" y="200" width="90" height="45" rx="5" class="node"/><text x="645.0" y="227.5" text-anchor="middle" class="">B′</text><path d="M115 122 L175 122 L175 172 L230 172" class="edge"/><path d="M115 222 L175 222 L175 172 L230 172" class="edge"/><path d="M500 122 L600 122" class="edge"/><path d="M500 222 L600 222" class="edge"/><text x="175" y="278" text-anchor="middle" class="small">C alone does not identify A or B.</text><text x="540" y="278" text-anchor="middle" class="small">Each result identifies its predecessor.</text></svg>
