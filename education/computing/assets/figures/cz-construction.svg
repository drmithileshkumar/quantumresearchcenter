<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 225" role="img" aria-labelledby="title desc"><title id="title">Controlled Z from CNOT</title><desc id="desc">Hadamard on the target, then CNOT, then Hadamard implements controlled Z.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="70" text-anchor="middle" data-tex="a">a</text><line x1="85" y1="65" x2="620" y2="65"/><text x="40" y="155" text-anchor="middle" data-tex="b">b</text><line x1="85" y1="150" x2="620" y2="150"/><rect x="156.0" y="130.0" width="48" height="40" rx="4"/><text x="180" y="156" text-anchor="middle" data-tex="H">H</text><line x1="330" y1="65" x2="330" y2="150"/><circle cx="330" cy="65" r="5" style="fill:#476b70"/><circle cx="330" cy="150" r="14"/><line x1="316" y1="150" x2="344" y2="150"/><line x1="330" y1="136" x2="330" y2="164"/><rect x="456.0" y="130.0" width="48" height="40" rx="4"/><text x="480" y="156" text-anchor="middle" data-tex="H">H</text><text x="350" y="210" text-anchor="middle" class="small" data-math="Only \(\ket{11}\) changes sign.">Only |11⟩ changes sign.</text></svg>