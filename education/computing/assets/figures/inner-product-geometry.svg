<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Inner product: amplitude along the final direction</title><desc id="desc">A real state-vector plane shows the final unit vector phi equals ket zero and the initial unit vector psi equals square root three over two ket zero plus one half ket one. Their angle is pi over six. The component of psi along phi has coefficient bra phi ket psi equals square root three over two, so the probability of the final-state outcome is three quarters. The dashed line selects the projection. These are state-vector directions, not directions in physical space.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="380" y="30" text-anchor="middle" class="heading">Amplitude as a component of the initial vector</text><path d="M115 300V85" stroke="#a7bccd" stroke-width="1.2" fill="none"/><text x="95" y="85" text-anchor="middle" class="small" data-tex="\ket1">|1⟩</text><path class="edge" d="M115 300H415" style="stroke:#a64d26"/><path class="edge" d="M115 300L374.808 150"/><path d="M374.808 150V300" stroke="#a7bccd" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/><circle cx="374.808" cy="300" r="4" fill="#246593"/><path d="M165 300A50 50 0 0 0 158.301 275" fill="none" stroke="#a64d26" stroke-width="1.4"/><text x="178" y="286" text-anchor="middle" class="" data-tex="\theta">θ</text><text x="98" y="321" text-anchor="middle" class="small" data-tex="0">0</text><text x="375" y="128" text-anchor="middle" class="" data-math="initial \(\ket\psi\)">initial |ψ⟩</text><text x="495" y="306" text-anchor="middle" class="" data-math="final \(\ket\phi=\ket0\)">final |φ⟩=|0⟩</text><text x="245" y="337" text-anchor="middle" class="" data-tex="\braket\phi\psi=\sqrt3/2">⟨φ|ψ⟩=√3/2</text><text x="575" y="125" text-anchor="middle" class="" data-tex="\braket\phi\phi=\braket\psi\psi=1">⟨φ|φ⟩=⟨ψ|ψ⟩=1</text><text x="575" y="177" text-anchor="middle" class="" data-tex="\theta=\pi/6">θ=π/6</text><text x="575" y="230" text-anchor="middle" class="" data-tex="p(\phi\mid\psi)=3/4">p(φ|ψ)=3/4</text><text x="380" y="395" text-anchor="middle" class="" data-math="For real unit vectors: \(\braket\phi\psi=\cos\theta\).">For real unit vectors: ⟨φ|ψ⟩=cosθ.</text></svg>
