<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-labelledby="title desc"><title id="title">Configurations contain what is needed to continue</title><desc id="desc">A configuration consists of stored data, control state, and position in the instructions. A transition produces the next complete configuration, and repeated transitions form a run.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Configurations contain what is needed to continue</text><rect x="30" y="70" width="265" height="130" rx="5" class="accent"/><text x="162.5" y="118.0" text-anchor="middle" class="">Configuration Cₜ</text><text x="162.5" y="140.0" text-anchor="middle" class="">stored data</text><text x="162.5" y="162.0" text-anchor="middle" class="">control state / next instruction</text><path d="M295 135 L425 135" class="edge"/><text x="360" y="113" text-anchor="middle" class="small">transition</text><rect x="425" y="70" width="265" height="130" rx="5" class="accent"/><text x="557.5" y="118.0" text-anchor="middle" class="">Configuration Cₜ₊₁</text><text x="557.5" y="140.0" text-anchor="middle" class="">updated data</text><text x="557.5" y="162.0" text-anchor="middle" class="">updated control position</text><text x="360" y="236" text-anchor="middle" class="small">A run: C₀ → C₁ → C₂ → …   (until a halting condition is reached)</text></svg>
