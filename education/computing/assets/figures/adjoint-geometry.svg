<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">A matrix and its adjoint acting on the same vector</title><desc id="desc">One set of axes shows the initial vector psi in blue at coordinates three fifths,four fifths, A psi in orange at seven fifths,four fifths, and A dagger psi in green at three fifths,seven fifths. A is the horizontal shear with rows one,one and zero,one; its adjoint is the vertical shear with rows one,zero and one,one. An orange arc alpha measures the angle from A psi to psi, about 23.4 degrees. A green arc beta measures the angle from psi to A dagger psi, about 13.7 degrees. The arcs compare directions, not lengths. The adjoint does not undo A.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="400" y="30" text-anchor="middle" class="heading">Same initial vector, two different images</text><path d="M110 370H480 M145 395V65" stroke="#d3dee7" stroke-width="1.3" fill="none"/><text x="500" y="378" text-anchor="middle" class="small" data-tex="\ket0">|0⟩</text><text x="124" y="70" text-anchor="middle" class="small" data-tex="\ket1">|1⟩</text><path class="edge" d="M145 370L253 226" style="stroke:#246593"/><path class="edge" d="M145 370L397 226" style="stroke:#a64d26"/><path class="edge" d="M145 370L253 118" style="stroke:#347449"/><path d="M253 118V226H397" stroke="#a7bccd" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/><text x="275" y="248" text-anchor="middle" style="fill:#246593" data-tex="\ket\psi">|ψ⟩</text><text x="432" y="224" text-anchor="middle" style="fill:#a64d26" data-tex="A\ket\psi">A|ψ⟩</text><text x="287" y="102" text-anchor="middle" style="fill:#347449" data-tex="A^\dagger\ket\psi">A†|ψ⟩</text><path class="angle-arc" d="M217.932 328.324A84 84 0 0 0 195.4 302.8" fill="none" stroke="#a64d26" stroke-width="1.7"/><text x="222.217" y="301.834" text-anchor="middle" style="fill:#a64d26" data-tex="\alpha">α</text><path class="angle-arc" d="M212.2 280.4A112 112 0 0 0 189.119 267.056" fill="none" stroke="#347449" stroke-width="1.7"/><text x="210.568" y="256.59" text-anchor="middle" style="fill:#347449" data-tex="\beta">β</text><text x="625" y="85" text-anchor="middle" class="" data-tex="A=\begin{pmatrix}1&amp;1\\0&amp;1\end{pmatrix}">A=beginpmatrix1&amp;1\0&amp;1endpmatrix</text><text x="625" y="165" text-anchor="middle" class="" data-tex="A^\dagger=\begin{pmatrix}1&amp;0\\1&amp;1\end{pmatrix}">A†=beginpmatrix1&amp;0\1&amp;1endpmatrix</text><text x="625" y="250" text-anchor="middle" style="fill:#a64d26" data-tex="\alpha\approx23.4^\circ">α≈23.4°</text><text x="625" y="292" text-anchor="middle" style="fill:#347449" data-tex="\beta\approx13.7^\circ">β≈13.7°</text><text x="625" y="342" text-anchor="middle" class="small">Angles measured from the initial vector.</text><text x="400" y="435" text-anchor="middle" class="" data-tex="\ket\psi=\begin{pmatrix}3/5\\4/5\end{pmatrix},\quad A\ket\psi=\begin{pmatrix}7/5\\4/5\end{pmatrix},\quad A^\dagger\ket\psi=\begin{pmatrix}3/5\\7/5\end{pmatrix}">|ψ⟩=beginpmatrix3/5\4/5endpmatrix,  A|ψ⟩=beginpmatrix7/5\4/5endpmatrix,  A†|ψ⟩=beginpmatrix3/5\7/5endpmatrix</text><text x="400" y="492" text-anchor="middle" class="" data-tex="A^\dagger A=\begin{pmatrix}1&amp;1\\1&amp;2\end{pmatrix}\ne I">A† A=beginpmatrix1&amp;1\1&amp;2endpmatrix≠ I</text></svg>
