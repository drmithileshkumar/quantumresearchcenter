<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc">
  <title id="title">Phase Modulation and Interference Fringe Curves</title>
  <desc id="desc">Left: Circuit schematic of a Hadamard phase interferometer converting unobservable relative phase phi into observable population distributions. Right: Smooth sinusoidal interference curves P(0) = cos^2(phi/2) and P(1) = sin^2(phi/2) oscillating between constructive and destructive interference as phi varies from 0 to 2pi.</desc>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 1.5L9 5L0 8.5Z" fill="#626c77"/>
    </marker>
  </defs>
  <style>
    text { font: 14px Georgia, serif; fill: #30343b; }
    .heading { font: 600 13px system-ui, sans-serif; fill: #246593; text-transform: uppercase; letter-spacing: 0.05em; }
    .small { font: 12px system-ui, sans-serif; fill: #626c77; }
    .axis { stroke: #a7bccd; stroke-width: 1.5; }
    .wire { stroke: #246593; stroke-width: 2; }
    .gate { fill: #f6f8fa; stroke: #246593; stroke-width: 1.8; rx: 4; }
    .gate-phase { fill: #fff8f2; stroke: #a64d26; stroke-width: 1.8; rx: 4; }
    .gate-meas { fill: #f6f8fa; stroke: #4f5761; stroke-width: 1.8; rx: 4; }
    .curve-p0 { fill: none; stroke: #246593; stroke-width: 2.5; }
    .curve-p1 { fill: none; stroke: #a64d26; stroke-width: 2.5; stroke-dasharray: 6 3; }
    .divider { stroke: #d3dee7; stroke-width: 1.2; stroke-dasharray: 4 4; }
  </style>

  <!-- Left: Circuit Diagram -->
  <text x="175" y="28" text-anchor="middle" class="heading">Phase Interferometer Circuit</text>

  <!-- Wire -->
  <line x1="30" y1="130" x2="330" y2="130" class="wire"/>

  <!-- Input State -->
  <text x="20" y="135" text-anchor="end" data-tex="\ket{0}">|0⟩</text>

  <!-- First Hadamard -->
  <rect x="55" y="105" width="46" height="50" class="gate"/>
  <text x="78" y="135" text-anchor="middle" style="font-weight:600;font-size:16px;fill:#246593">H</text>

  <!-- State after H: |+> -->
  <text x="125" y="95" text-anchor="middle" class="small" data-math="\(\frac{\ket{0}+\ket{1}}{\sqrt{2}}\)">(|0⟩+|1⟩)/√2</text>

  <!-- Phase Gate P(phi) -->
  <rect x="150" y="105" width="56" height="50" class="gate-phase"/>
  <text x="178" y="135" text-anchor="middle" style="font-weight:600;font-size:15px;fill:#a64d26" data-math="\(P(\phi)\)">P(φ)</text>

  <!-- State after P(phi) -->
  <text x="235" y="95" text-anchor="middle" class="small" data-math="\(\frac{\ket{0}+e^{i\phi}\ket{1}}{\sqrt{2}}\)">(|0⟩+e^iφ|1⟩)/√2</text>

  <!-- Second Hadamard -->
  <rect x="260" y="105" width="46" height="50" class="gate"/>
  <text x="283" y="135" text-anchor="middle" style="font-weight:600;font-size:16px;fill:#246593">H</text>

  <!-- Measurement symbol -->
  <rect x="330" y="112" width="28" height="36" class="gate-meas"/>
  <path d="M336 138 A10 10 0 0 1 352 138" fill="none" stroke="#4f5761" stroke-width="1.3"/>
  <line x1="344" y1="138" x2="351" y2="124" stroke="#4f5761" stroke-width="1.3"/>

  <!-- Explanatory description below circuit -->
  <g transform="translate(30, 205)">
    <text x="0" y="0" style="font-weight:600;fill:#30343b">Phase-to-Population Conversion:</text>
    <text x="0" y="24" class="small" data-math="1. Standard basis cannot detect relative phase directly:">1. Standard basis cannot detect relative phase directly:</text>
    <text x="16" y="44" class="small" data-math="\(|\braket{0}{\psi}|^2 = |\braket{1}{\psi}|^2 = 1/2\) (uniform probabilities)">|⟨0|ψ⟩|² = |⟨1|ψ⟩|² = 1/2 (uniform probabilities)</text>
    <text x="0" y="68" class="small" data-math="2. Second Hadamard recombines transition paths:">2. Second Hadamard recombines transition paths:</text>
    <text x="16" y="88" class="small" data-math="\(A(0) = \frac{1 + e^{i\phi}}{2} = e^{i\phi/2}\cos(\phi/2)\)">A(0) = (1 + e^iφ)/2 = e^(iφ/2) cos(φ/2)</text>
    <text x="16" y="110" class="small" data-math="\(A(1) = \frac{1 - e^{i\phi}}{2} = -i e^{i\phi/2}\sin(\phi/2)\)">A(1) = (1 - e^iφ)/2 = -i e^(iφ/2) sin(φ/2)</text>
  </g>

  <!-- Center Divider -->
  <line x1="365" y1="20" x2="365" y2="345" class="divider"/>

  <!-- Right: Interference Fringes Curve -->
  <text x="560" y="28" text-anchor="middle" class="heading">Interference Fringe Oscillations</text>

  <!-- Origin at (425, 260), width = 290, height = 180 -->
  <!-- Horizontal axis: phi from 0 to 2pi (425 to 715) -->
  <!-- Vertical axis: Probability from 0 to 1 (260 to 80) -->
  <line x1="425" y1="260" x2="725" y2="260" class="axis" marker-end="url(#arr-gray)"/>
  <line x1="425" y1="260" x2="425" y2="65" class="axis" marker-end="url(#arr-gray)"/>

  <text x="730" y="264" class="small" data-tex="\phi">φ</text>
  <text x="425" y="58" text-anchor="middle" class="small">Prob.</text>

  <!-- Horizontal Axis Ticks -->
  <!-- phi = 0 -> 425 -->
  <line x1="425" y1="260" x2="425" y2="265" stroke="#8c959f" stroke-width="1.2"/>
  <text x="425" y="280" text-anchor="middle" class="small">0</text>

  <!-- phi = pi/2 -> 497.5 -->
  <line x1="497" y1="260" x2="497" y2="265" stroke="#8c959f" stroke-width="1.2"/>
  <text x="497" y="280" text-anchor="middle" class="small" data-tex="\pi/2">π/2</text>
  <line x1="497" y1="80" x2="497" y2="260" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- phi = pi -> 570 -->
  <line x1="570" y1="260" x2="570" y2="265" stroke="#8c959f" stroke-width="1.2"/>
  <text x="570" y="280" text-anchor="middle" class="small" data-tex="\pi">π</text>
  <line x1="570" y1="80" x2="570" y2="260" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- phi = 3pi/2 -> 642.5 -->
  <line x1="642" y1="260" x2="642" y2="265" stroke="#8c959f" stroke-width="1.2"/>
  <text x="642" y="280" text-anchor="middle" class="small" data-tex="3\pi/2">3π/2</text>
  <line x1="642" y1="80" x2="642" y2="260" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- phi = 2pi -> 715 -->
  <line x1="715" y1="260" x2="715" y2="265" stroke="#8c959f" stroke-width="1.2"/>
  <text x="715" y="280" text-anchor="middle" class="small" data-tex="2\pi">2π</text>
  <line x1="715" y1="80" x2="715" y2="260" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Vertical Axis Ticks -->
  <!-- y = 260 is 0 -->
  <!-- y = 170 is 0.5 -->
  <line x1="420" y1="170" x2="425" y2="170" stroke="#8c959f" stroke-width="1.2"/>
  <text x="412" y="174" text-anchor="end" class="small">0.5</text>
  <line x1="425" y1="170" x2="715" y2="170" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- y = 80 is 1.0 -->
  <line x1="420" y1="80" x2="425" y2="80" stroke="#8c959f" stroke-width="1.2"/>
  <text x="412" y="84" text-anchor="end" class="small">1.0</text>
  <line x1="425" y1="80" x2="715" y2="80" stroke="#f0f3f6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Curve P(0) = cos^2(phi/2): Starts at (425, 80), reaches (570, 260), rises back to (715, 80) -->
  <!-- High precision cubic beziers for raised cosine -->
  <!-- First half 0 to pi: (425,80) -> (570,260) with inflection at (497, 170) -->
  <path d="M425 80 C465 80, 475 170, 497 170 C519 170, 529 260, 570 260 C611 260, 621 170, 642 170 C664 170, 674 80, 715 80" class="curve-p0"/>

  <!-- Curve P(1) = sin^2(phi/2): Starts at (425, 260), reaches peak at (570, 80), falls back to (715, 260) -->
  <path d="M425 260 C465 260, 475 170, 497 170 C519 170, 529 80, 570 80 C611 80, 621 170, 642 170 C664 170, 674 260, 715 260" class="curve-p1"/>

  <!-- Legend / Labels -->
  <g transform="translate(460, 310)">
    <line x1="0" y1="0" x2="25" y2="0" class="curve-p0"/>
    <text x="32" y="4" class="small" style="font-weight:600;fill:#246593" data-math="\(P(0) = \cos^2(\phi/2)\)">P(0) = cos²(φ/2)</text>
  </g>
  <g transform="translate(600, 310)">
    <line x1="0" y1="0" x2="25" y2="0" class="curve-p1"/>
    <text x="32" y="4" class="small" style="font-weight:600;fill:#a64d26" data-math="\(P(1) = \sin^2(\phi/2)\)">P(1) = sin²(φ/2)</text>
  </g>

  <text x="570" y="342" text-anchor="middle" class="small" data-math="\(P(0) + P(1) = 1 \text{ for all } \phi\) (Conservation of probability)">P(0) + P(1) = 1 for all φ (Conservation of probability)</text>
</svg>
