<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 570" role="img" aria-labelledby="title desc"><title id="title">Geometric action of AA dagger and A dagger A</title><desc id="desc">Common axes show initial psi at three fifths,four fifths in blue. Orange AA dagger first sends psi through A dagger to three fifths,seven fifths, then through A to two,seven fifths. Green A dagger A first sends psi through A to seven fifths,four fifths, then through A dagger to seven fifths,eleven fifths. Faint dashed rays show the intermediate vectors. Angle alpha compares AA dagger psi with psi, about 18.1 degrees; beta compares A dagger A psi with psi, about 4.4 degrees. The blue direction extends as a faint guide for the angle arc. The two products are different and neither returns psi.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="425" y="30" text-anchor="middle" class="heading">Two orders of composition on the same vector</text><path d="M85 390H450 M120 420V65" stroke="#d3dee7" stroke-width="1.3" fill="none"/><text x="468" y="400" text-anchor="middle" class="small" data-tex="\ket0">|0⟩</text><text x="100" y="75" text-anchor="middle" class="small" data-tex="\ket1">|1⟩</text><path class="edge" d="M120 390L195 215" style="stroke:#a64d26;opacity:.4;stroke-dasharray:5 4"/><path class="edge" d="M120 390L295 290" style="stroke:#347449;opacity:.4;stroke-dasharray:5 4"/><path d="M195 290V215H370" fill="none" stroke="#a64d26" stroke-width="1.1" stroke-dasharray="3 4" opacity=".5"/><path d="M195 290H295V115" fill="none" stroke="#347449" stroke-width="1.1" stroke-dasharray="3 4" opacity=".5"/><path d="M195 290L246 222" stroke="#a7bccd" stroke-width="1.1" stroke-dasharray="3 4" fill="none"/><path class="edge" d="M120 390L195 290" style="stroke:#246593"/><path class="edge" d="M120 390L370 215" style="stroke:#a64d26"/><path class="edge" d="M120 390L295 115" style="stroke:#347449"/><text x="173" y="310" text-anchor="middle" style="fill:#246593" data-tex="\ket\psi">|ψ⟩</text><text x="410" y="213" text-anchor="middle" style="fill:#a64d26" data-tex="AA^\dagger\ket\psi">AA†|ψ⟩</text><text x="335" y="97" text-anchor="middle" style="fill:#347449" data-tex="A^\dagger A\ket\psi">A† A|ψ⟩</text><text x="172" y="197" text-anchor="middle" style="fill:#a64d26" data-tex="A^\dagger\ket\psi">A†|ψ⟩</text><text x="337" y="310" text-anchor="middle" style="fill:#347449" data-tex="A\ket\psi">A|ψ⟩</text><path class="angle-arc" d="M188.815 341.829A84 84 0 0 0 170.4 322.8" fill="none" stroke="#a64d26" stroke-width="1.7"/><text x="193.297" y="319.067" text-anchor="middle" style="fill:#a64d26" data-tex="\alpha">α</text><path class="angle-arc" d="M216 262A160 160 0 0 0 205.9 255.014" fill="none" stroke="#347449" stroke-width="1.7"/><text x="221.257" y="243.606" text-anchor="middle" style="fill:#347449" data-tex="\beta">β</text><text x="655" y="95" text-anchor="middle" class="" data-tex="AA^\dagger=\begin{pmatrix}2&amp;1\\1&amp;1\end{pmatrix}">AA†=beginpmatrix2&amp;1\1&amp;1endpmatrix</text><text x="655" y="175" text-anchor="middle" class="" data-tex="A^\dagger A=\begin{pmatrix}1&amp;1\\1&amp;2\end{pmatrix}">A† A=beginpmatrix1&amp;1\1&amp;2endpmatrix</text><text x="655" y="235" text-anchor="middle" class="small">The rightmost matrix acts first.</text><text x="655" y="287" text-anchor="middle" style="fill:#a64d26" data-tex="\alpha\approx18.1^\circ">α≈18.1°</text><text x="655" y="330" text-anchor="middle" style="fill:#347449" data-tex="\beta\approx4.4^\circ">β≈4.4°</text><text x="655" y="375" text-anchor="middle" class="small">Angles measured from the initial vector.</text><text x="425" y="465" text-anchor="middle" class="" data-tex="\ket\psi\xrightarrow{A^\dagger}\begin{pmatrix}3/5\\7/5\end{pmatrix}\xrightarrow{A}AA^\dagger\ket\psi=\begin{pmatrix}2\\7/5\end{pmatrix}">|ψ⟩xrightarrowA†beginpmatrix3/5\7/5endpmatrixxrightarrowAAA†|ψ⟩=beginpmatrix2\7/5endpmatrix</text><text x="425" y="535" text-anchor="middle" class="" data-tex="\ket\psi\xrightarrow{A}\begin{pmatrix}7/5\\4/5\end{pmatrix}\xrightarrow{A^\dagger}A^\dagger A\ket\psi=\begin{pmatrix}7/5\\11/5\end{pmatrix}">|ψ⟩xrightarrowAbeginpmatrix7/5\4/5endpmatrixxrightarrowA†A† A|ψ⟩=beginpmatrix7/5\11/5endpmatrix</text></svg>
