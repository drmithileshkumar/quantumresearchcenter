<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-labelledby="title desc"><title id="title">Two Hadamards</title><desc id="desc">Two consecutive Hadamard gates restore the input. No intermediate measurement is performed.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="80" text-anchor="middle">|0⟩</text><line x1="85" y1="75" x2="580" y2="75"/><rect x="171.0" y="55.0" width="48" height="40" rx="4"/><text x="195" y="81" text-anchor="middle">H</text><rect x="366.0" y="55.0" width="48" height="40" rx="4"/><text x="390" y="81" text-anchor="middle">H</text><text x="580" y="60" text-anchor="middle">|0⟩</text><text x="290" y="140" text-anchor="middle" class="small">Intermediate amplitudes: +1/√2 and +1/√2</text></svg>