<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 235" role="img" aria-labelledby="title desc"><title id="title">Bell-state preparation</title><desc id="desc">Hadamard on the first qubit followed by CNOT prepares the Bell state from two zeros.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="80" text-anchor="middle" data-tex="\ket0">|0⟩</text><line x1="85" y1="75" x2="580" y2="75"/><text x="40" y="160" text-anchor="middle" data-tex="\ket0">|0⟩</text><line x1="85" y1="155" x2="580" y2="155"/><rect x="171.0" y="55.0" width="48" height="40" rx="4"/><text x="195" y="81" text-anchor="middle" data-tex="H">H</text><line x1="375" y1="75" x2="375" y2="155"/><circle cx="375" cy="75" r="5" style="fill:#476b70"/><circle cx="375" cy="155" r="14"/><line x1="361" y1="155" x2="389" y2="155"/><line x1="375" y1="141" x2="375" y2="169"/><text x="345" y="215" text-anchor="middle" class="small" data-math="Output: \((\ket{00}+\ket{11})/\sqrt2\)">Output: (|00⟩+|11⟩)/√2</text></svg>