<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 330" role="img" aria-labelledby="title desc"><title id="title">Square root of NOT with weights a and b</title><desc id="desc">Each self-loop carries stay-weight a and each arrow between configurations carries switch-weight b. Over two steps from 0, staying twice contributes a squared and switching twice contributes b squared at 0. Staying then switching contributes ab and switching then staying contributes ba at 1. For the combined step to be NOT, a squared plus b squared must be zero and 2ab must be one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="180" y="34" text-anchor="middle" class="heading">State diagram</text><circle cx="110" cy="165" r="24" class="node"/><text x="110" y="171" text-anchor="middle" class="" data-tex="0">0</text><circle cx="250" cy="165" r="24" class="node"/><text x="250" y="171" text-anchor="middle" class="" data-tex="1">1</text><path d="M127 148 Q180 95 233 148" class="edge"/><text x="180" y="113" text-anchor="middle" class="weight" data-tex="b">b</text><path d="M233 182 Q180 235 127 182" class="edge"/><text x="180" y="231" text-anchor="middle" class="weight" data-tex="b">b</text><path d="M96 146 C35 105 35 225 91 179" class="edge"/><text x="42" y="170" text-anchor="end" class="weight" data-tex="a">a</text><path d="M264 146 C325 105 325 225 269 179" class="edge"/><text x="318" y="170" text-anchor="start" class="weight" data-tex="a">a</text><path d="M376 30V300" class="rule"/><text x="552" y="34" text-anchor="middle" class="heading" data-math="Time-expanded diagram from \(0\)">Time-expanded diagram from 0</text><text x="422" y="76" text-anchor="middle" class="small" data-tex="t=0">t=0</text><text x="537" y="76" text-anchor="middle" class="small" data-tex="t=1">t=1</text><text x="652" y="76" text-anchor="middle" class="small" data-tex="t=2">t=2</text><path d="M438 120L521 120" class="edge"/><text x="479.5" y="111" text-anchor="middle" class="weight" data-tex="a">a</text><path d="M438 120L521 230" class="edge"/><text x="464.26" y="148.2" text-anchor="start" class="weight" data-tex="b">b</text><path d="M553 120L636 120" class="edge"/><text x="594.5" y="111" text-anchor="middle" class="weight" data-tex="a">a</text><path d="M553 120L636 230" class="edge"/><text x="579.26" y="148.2" text-anchor="start" class="weight" data-tex="b">b</text><path d="M553 230L636 120" class="edge"/><text x="579.26" y="215.8" text-anchor="start" class="weight" data-tex="b">b</text><path d="M553 230L636 230" class="edge"/><text x="594.5" y="254" text-anchor="middle" class="weight" data-tex="a">a</text><circle cx="422" cy="120" r="16" class="node"/><text x="422" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="422" cy="230" r="16" class="unused"/><text x="422" y="236" text-anchor="middle" class="small" data-tex="1">1</text><circle cx="537" cy="120" r="16" class="node"/><text x="537" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="537" cy="230" r="16" class="node"/><text x="537" y="236" text-anchor="middle" class="" data-tex="1">1</text><circle cx="652" cy="120" r="16" class="node"/><text x="652" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="652" cy="230" r="16" class="node"/><text x="652" y="236" text-anchor="middle" class="" data-tex="1">1</text><text x="686" y="125" text-anchor="start" class="" data-tex="a^2+b^2">a²+b²</text><text x="686" y="235" text-anchor="start" class="" data-tex="ab+ba=2ab">ab+ba=2ab</text><text x="552" y="300" text-anchor="middle" class="small" data-math="NOT requires \(a^2+b^2=0\) and \(2ab=1\).">NOT requires a²+b²=0 and 2ab=1.</text></svg>
