<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="title desc"><title id="title">Hilbert’s program: study the proof rules</title><desc id="desc">The object theory uses axioms and inference rules to produce formal proofs. Metamathematical reasoning studies these finite proofs, aiming to establish that none proves a contradiction.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Hilbert’s program: study the proof rules</text><rect x="30" y="55" width="660" height="125" rx="8" class="frame"/><text x="60" y="79" text-anchor="start" class="label">OBJECT THEORY</text><rect x="55" y="100" width="185" height="55" rx="5" class="node"/><text x="147.5" y="121.5" text-anchor="middle" class="">Axioms and</text><text x="147.5" y="143.5" text-anchor="middle" class="">inference rules</text><path d="M240 127 L305 127" class="edge"/><rect x="305" y="100" width="350" height="55" rx="5" class="node"/><text x="480" y="121.5" text-anchor="middle" class="">Finite formal proofs</text><text x="480" y="143.5" text-anchor="middle" class="">and their conclusions</text><rect x="40" y="235" width="255" height="65" rx="5" class="accent"/><text x="167.5" y="261.5" text-anchor="middle" class="">Finitary reasoning</text><text x="167.5" y="283.5" text-anchor="middle" class="">about proof construction</text><path d="M167 235 L167 200 L480 200 L480 155" class="edge"/><rect x="385" y="235" width="295" height="65" rx="5" class="accent"/><text x="532.5" y="261.5" text-anchor="middle" class="">Goal: no permitted proof</text><text x="532.5" y="283.5" text-anchor="middle" class="">derives a contradiction</text><path d="M295 267 L385 267" class="edge"/><text x="360" y="326" text-anchor="middle" class="small">A proposed justification, not an assumption that consistency is guaranteed.</text></svg>
