<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" role="img" aria-labelledby="title desc"><title id="title">Hilbert’s program: proving consistency</title><desc id="desc">Inside the formal system, axioms and rules derive valid theorems like 2+2=4. A contradiction like 0=1 must be impossible. Hilbert’s program studies the rules from the outside to prove that the contradiction branch is permanently closed.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Hilbert’s program: proving consistency</text><style>
.tag-ok{font:600 11.5px system-ui,sans-serif;fill:#15803d}
.tag-no{font:600 11.5px system-ui,sans-serif;fill:#b91c1c}
.box-header{font:600 13px system-ui,sans-serif;fill:#0f172a}
.box-sub{font:11.5px system-ui,sans-serif;fill:#64748b}
.danger-node{fill:#fffafa;stroke:#fca5a5;stroke-width:1.5;rx:6px}
.edge-text{font:600 11px system-ui,sans-serif;fill:#246593}
.meta-head{font:700 11.5px system-ui,sans-serif;fill:#1e3a5f;letter-spacing:0.04em}
.meta-desc{font:12px system-ui,sans-serif;fill:#334155}
</style><rect x="45" y="46" width="145" height="76" class="node"/><text x="117" y="77" text-anchor="middle" class="box-header">Axioms</text><text x="117" y="98" text-anchor="middle" class="box-sub">Starting assumptions</text><path d="M190 84 L245 84" class="edge"/><text x="217" y="76" text-anchor="middle" class="edge-text">deduction</text><path d="M245 84 L270 84 L270 56 L320 56" class="edge"/><rect x="322" y="35" width="353" height="42" class="node"/><text x="338" y="61" class="box-header" text-anchor="start">Valid Theorems</text><text x="450" y="61" class="box-sub" text-anchor="start" data-math="(e.g. \(2 + 2 = 4\))">(e.g. 2 + 2 = 4)</text><text x="660" y="61" class="tag-ok" text-anchor="end">✓ Permitted</text><path d="M245 84 L270 84 L270 112 L320 112" fill="none" stroke="#cbd5e1" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/><line x1="288" y1="105" x2="302" y2="119" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><line x1="302" y1="105" x2="288" y2="119" stroke="#b91c1c" stroke-width="2.2" stroke-linecap="round"/><rect x="322" y="91" width="353" height="42" class="danger-node"/><text x="338" y="117" class="box-header" text-anchor="start" fill="#991b1b">Contradiction</text><text x="450" y="117" class="box-sub" text-anchor="start" fill="#7f1d1d" data-math="(e.g. \(0 = 1\))">(e.g. 0 = 1)</text><text x="660" y="117" class="tag-no" text-anchor="end">✗ Forbidden</text><path d="M498 176 L498 141" class="edge"/><text x="508" y="161" class="edge-text">guarantees this branch never occurs</text><rect x="45" y="176" width="630" height="56" class="accent"/><text x="65" y="198" class="meta-head">HILBERT’S METAMATHEMATICS (OUTSIDE VIEW)</text><text x="65" y="218" class="meta-desc" data-math="Analyzes the rules as physical symbol moves to prove that “\(0 = 1\)” is impossible.">Analyzes the rules as physical symbol moves to prove that “0 = 1” is impossible.</text></svg>
