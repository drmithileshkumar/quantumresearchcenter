<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 235" role="img" aria-labelledby="title desc"><title id="title">Deutsch algorithm</title><desc id="desc">Prepare zero and one, apply Hadamards, query the joint oracle, and apply Hadamard and measurement to the first wire.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="75" text-anchor="middle">|0⟩</text><line x1="85" y1="70" x2="680" y2="70"/><text x="40" y="160" text-anchor="middle">|1⟩</text><line x1="85" y1="155" x2="680" y2="155"/><rect x="146.0" y="50.0" width="48" height="40" rx="4"/><text x="170" y="76" text-anchor="middle">H</text><rect x="146.0" y="135.0" width="48" height="40" rx="4"/><text x="170" y="161" text-anchor="middle">H</text><rect x="295.0" y="44.5" width="70" height="135" rx="4"/><text x="330" y="118" text-anchor="middle">U_f</text><rect x="466.0" y="50.0" width="48" height="40" rx="4"/><text x="490" y="76" text-anchor="middle">H</text><rect x="588.0" y="50.0" width="44" height="40" rx="4"/><text x="610" y="76" text-anchor="middle"></text><path d="M597 78 A14 14 0 0 1 623 78 M610 77 l8 -18"/><text x="385" y="218" text-anchor="middle" class="small">Measured bit: 0 = constant; 1 = balanced</text></svg>