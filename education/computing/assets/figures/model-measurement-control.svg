<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Measurement and a classically controlled correction</title><desc id="desc">A zero input passes through H and measurement M. The measured qubit is retained. Its classical outcome m controls an X correction: apply X only when m is one. The final qubit state is zero for either result.</desc><style>text{font:17px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.wire{stroke:#246593;stroke-width:2;fill:none}.gate{stroke:#246593;stroke-width:2;fill:#fff}</style>
<text x="400" y="28" text-anchor="middle" class="heading">Measurement and a classically controlled correction</text>
<path class="wire" d="M105 185H710"/>
<text x="65" y="191" text-anchor="middle" class="" data-tex="\ket0">|0⟩</text>
<rect class="gate" x="186" y="162" width="48" height="46" rx="3"/>
<text x="210" y="191" text-anchor="middle" class="">H</text>
<rect class="gate" x="346" y="162" width="48" height="46" rx="3"/>
<text x="370" y="191" text-anchor="middle" class="">M</text>
<rect class="gate" x="571" y="162" width="48" height="46" rx="3"/>
<text x="595" y="191" text-anchor="middle" class="">X</text>
<path class="wire" d="M366 162V85H591V162 M374 162V93H599V162"/>
<text x="485" y="67" text-anchor="middle" class="small">Classical record m</text>
<text x="665" y="137" text-anchor="middle" class="small">if m = 1</text>
<text x="480" y="220" text-anchor="middle" class="" data-tex="\ket m">|m⟩</text>
<text x="750" y="191" text-anchor="middle" class="" data-tex="\ket0">|0⟩</text>
<text x="400" y="280" text-anchor="middle" class="" data-tex="m=0:\ \ket0\mapsto\ket0,\qquad m=1:\ X\ket1=\ket0">m = 0: keep |0⟩;   m = 1: X|1⟩ = |0⟩</text>
<text x="400" y="325" text-anchor="middle" class="small">Each outcome has probability 1/2. The double line carries the recorded bit.</text>
</svg>