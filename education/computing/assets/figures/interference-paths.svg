<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 310" role="img" aria-labelledby="title desc"><title id="title">Coherent computation paths</title><desc id="desc">Each path amplitude is a product. Contributions to final zero add; contributions to final one cancel.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><circle cx="60" cy="145" r="20"/><text x="60" y="150" text-anchor="middle">0</text><circle cx="300" cy="65" r="20"/><text x="300" y="70" text-anchor="middle">0</text><circle cx="300" cy="230" r="20"/><text x="300" y="235" text-anchor="middle">1</text><circle cx="620" cy="65" r="20"/><text x="620" y="70" text-anchor="middle">0</text><circle cx="620" cy="230" r="20"/><text x="620" y="235" text-anchor="middle">1</text><line x1="80" y1="140" x2="280" y2="65"/><line x1="80" y1="150" x2="280" y2="230"/><line x1="320" y1="65" x2="600" y2="65"/><line x1="320" y1="65" x2="600" y2="230"/><line x1="320" y1="230" x2="600" y2="65"/><line x1="320" y1="230" x2="600" y2="230"/><text x="175" y="80" text-anchor="middle" data-tex="+1/\sqrt2">+1/√2</text><text x="175" y="230" text-anchor="middle" data-tex="+1/\sqrt2">+1/√2</text><text x="450" y="44" text-anchor="middle" data-tex="+1/\sqrt2">+1/√2</text><text x="450" y="255" text-anchor="middle" data-tex="-1/\sqrt2">−1/√2</text><text x="405" y="105" text-anchor="middle" data-tex="+1/\sqrt2">+1/√2</text><text x="520" y="105" text-anchor="middle" data-tex="+1/\sqrt2">+1/√2</text><text x="350" y="294" text-anchor="middle" class="small" data-math="Final amplitudes: \(0\to 1/2+1/2=1\); \(1\to 1/2-1/2=0\)">Final amplitudes: 0→ 1/2+1/2=1; 1→ 1/2−1/2=0</text></svg>