<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="title desc"><title id="title">Measurement samples an output configuration</title><desc id="desc">Output state alpha zero ket zero plus alpha one ket one is measured. One run returns either zero with probability magnitude alpha zero squared or one with probability magnitude alpha one squared.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:18px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.edge{fill:none;stroke:#246593;stroke-width:2;marker-end:url(#arrow)}</style>
<text class="heading" x="480" y="30" text-anchor="middle">Measurement reports one outcome per run</text>
<text x="230" y="150" text-anchor="middle" data-tex="\ket{\psi_{\mathrm{out}}}=\alpha_0\ket0+\alpha_1\ket1">|ψₒᵤₜ⟩ = α₀|0⟩ + α₁|1⟩</text>
<path class="edge" d="M425 143H485"/>
<text x="560" y="150" text-anchor="middle">Measurement</text>
<path class="edge" d="M640 130L740 90"/><path class="edge" d="M640 156L740 210"/>
<text x="825" y="90" text-anchor="middle" data-tex="y=0">y = 0</text>
<text x="825" y="122" text-anchor="middle" data-tex="p(0)=|\alpha_0|^2">p(0) = |α₀|²</text>
<text x="825" y="215" text-anchor="middle" data-tex="y=1">y = 1</text>
<text x="825" y="247" text-anchor="middle" data-tex="p(1)=|\alpha_1|^2">p(1) = |α₁|²</text>
<text class="small" x="480" y="295" text-anchor="middle">The branches are alternative classical results, not copies of the output state.</text></svg>