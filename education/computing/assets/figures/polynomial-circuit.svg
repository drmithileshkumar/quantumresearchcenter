<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title desc"><title id="title">Circuit for x + y + xy</title><desc id="desc">Inputs x and y each branch to an AND gate and an XOR gate. The AND produces u=xy, the first XOR produces v=x+y, and a second XOR produces z=u+v=x+y+xy. Filled dots connect wires; a crossing without a dot is not a connection.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="400" y="28" text-anchor="middle" data-math="\(z=x+y+xy\) over bits">z=x+y+xy over bits</text><text x="35" y="85" text-anchor="middle" data-tex="x">x</text><text x="35" y="265" text-anchor="middle" data-tex="y">y</text><line x1="55" y1="80" x2="90" y2="80"/><line x1="90" y1="80" x2="90" y2="205"/><circle cx="90" cy="105" r="5" style="fill:#476b70"/><line x1="90" y1="105" x2="270" y2="105"/><line x1="90" y1="205" x2="272" y2="205"/><line x1="55" y1="260" x2="150" y2="260"/><line x1="150" y1="260" x2="150" y2="135"/><circle cx="150" cy="235" r="5" style="fill:#476b70"/><line x1="150" y1="135" x2="270" y2="135"/><line x1="150" y1="235" x2="272" y2="235"/><path d="M270 90 H300 A30 30 0 0 1 300 150 H270 Z" style="fill:#f8fbf9"/><path d="M260 190 Q290 220 260 250 Q320 250 340 220 Q320 190 260 190 Z" style="fill:#f8fbf9"/><path d="M250 190 Q280 220 250 250"/><path d="M530 140 Q560 170 530 200 Q590 200 610 170 Q590 140 530 140 Z" style="fill:#f8fbf9"/><path d="M520 140 Q550 170 520 200"/><text x="300" y="76" text-anchor="middle" class="small">AND</text><text x="300" y="277" text-anchor="middle" class="small">XOR</text><text x="570" y="123" text-anchor="middle" class="small">XOR</text><line x1="330" y1="120" x2="425" y2="120"/><line x1="425" y1="120" x2="425" y2="155"/><line x1="425" y1="155" x2="542" y2="155"/><text x="385" y="103" text-anchor="middle" data-tex="u=xy">u=xy</text><line x1="340" y1="220" x2="425" y2="220"/><line x1="425" y1="220" x2="425" y2="185"/><line x1="425" y1="185" x2="542" y2="185"/><text x="386" y="246" text-anchor="middle" data-tex="v=x+y">v=x+y</text><line x1="610" y1="170" x2="735" y2="170"/><text x="700" y="150" text-anchor="middle" data-tex="z=u+v">z=u+v</text><text x="400" y="312" text-anchor="middle" class="small">Filled dots join wires; crossings without dots do not. Here + means XOR.</text></svg>