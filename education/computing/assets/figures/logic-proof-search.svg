<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" role="img" aria-labelledby="title desc"><title id="title">Checking, searching, and deciding</title><desc id="desc">Checking accepts or rejects a supplied record. Search enumerates and checks candidates, looping on failure and stopping on a proof. A decision procedure must also halt with no when no proof exists.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Checking, searching, and deciding</text><text x="35" y="65" text-anchor="start" class="label">CHECK</text><rect x="135" y="42" width="145" height="46" rx="5" class="node"/><text x="207.5" y="70.0" text-anchor="middle" class="">Candidate</text><path d="M280 65 L340 65" class="edge"/><rect x="340" y="42" width="130" height="46" rx="5" class="node"/><text x="405.0" y="70.0" text-anchor="middle" class="">Checker</text><path d="M470 65 L530 65" class="edge"/><rect x="530" y="42" width="155" height="46" rx="5" class="node"/><text x="607.5" y="70.0" text-anchor="middle" class="">Valid / invalid</text><text x="35" y="150" text-anchor="start" class="label">SEARCH</text><rect x="135" y="123" width="145" height="55" rx="5" class="node"/><text x="207.5" y="144.5" text-anchor="middle" class="">Next</text><text x="207.5" y="166.5" text-anchor="middle" class="">candidate</text><path d="M280 150 L340 150" class="edge"/><rect x="340" y="123" width="130" height="55" rx="5" class="node"/><text x="405.0" y="155.5" text-anchor="middle" class="">Checker</text><path d="M470 150 L550 150" class="edge"/><text x="510" y="134" text-anchor="middle" class="small">proves P</text><rect x="550" y="123" width="135" height="55" rx="5" class="accent"/><text x="617.5" y="155.5" text-anchor="middle" class="">Stop: found</text><path d="M405 178 L405 222 L207 222 L207 178" class="edge"/><text x="305" y="245" text-anchor="middle" class="small">otherwise: keep searching</text><text x="35" y="318" text-anchor="start" class="label">DECIDE</text><rect x="135" y="290" width="145" height="55" rx="5" class="node"/><text x="207.5" y="322.5" text-anchor="middle" class="">Sentence P</text><path d="M280 318 L340 318" class="edge"/><rect x="340" y="290" width="130" height="55" rx="5" class="node"/><text x="405.0" y="322.5" text-anchor="middle" class="">Decider</text><path d="M470 318 L530 318" class="edge"/><rect x="530" y="290" width="155" height="55" rx="5" class="accent"/><text x="607.5" y="311.5" text-anchor="middle" class="">Yes / no</text><text x="607.5" y="333.5" text-anchor="middle" class="">always halts</text><text x="360" y="378" text-anchor="middle" class="small">Search alone has no stopping condition when no proof exists.</text></svg>
