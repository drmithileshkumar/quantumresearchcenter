<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 270" role="img" aria-labelledby="title desc"><title id="title">Controlled reversible gates</title><desc id="desc">CNOT has one control and an XOR target. Toffoli has two controls. Fredkin has a control and two swap targets.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="120" y="32" text-anchor="middle">CNOT</text><text x="30" y="90" text-anchor="middle" data-tex="a">a</text><line x1="55" y1="85" x2="205" y2="85"/><text x="30" y="150" text-anchor="middle" data-tex="b">b</text><line x1="55" y1="145" x2="205" y2="145"/><text x="345" y="32" text-anchor="middle">Toffoli</text><text x="255" y="90" text-anchor="middle" data-tex="a">a</text><line x1="280" y1="85" x2="430" y2="85"/><text x="255" y="150" text-anchor="middle" data-tex="b">b</text><line x1="280" y1="145" x2="430" y2="145"/><text x="255" y="210" text-anchor="middle" data-tex="c">c</text><line x1="280" y1="205" x2="430" y2="205"/><text x="570" y="32" text-anchor="middle">Fredkin</text><text x="480" y="90" text-anchor="middle" data-tex="a">a</text><line x1="505" y1="85" x2="655" y2="85"/><text x="480" y="150" text-anchor="middle" data-tex="b">b</text><line x1="505" y1="145" x2="655" y2="145"/><text x="480" y="210" text-anchor="middle" data-tex="c">c</text><line x1="505" y1="205" x2="655" y2="205"/><line x1="120" y1="85" x2="120" y2="145"/><circle cx="120" cy="85" r="5" style="fill:#476b70"/><circle cx="120" cy="145" r="14"/><line x1="106" y1="145" x2="134" y2="145"/><line x1="120" y1="131" x2="120" y2="159"/><line x1="345" y1="85" x2="345" y2="205"/><circle cx="345" cy="85" r="5" style="fill:#476b70"/><circle cx="345" cy="145" r="5" style="fill:#476b70"/><circle cx="345" cy="205" r="14"/><line x1="331" y1="205" x2="359" y2="205"/><line x1="345" y1="191" x2="345" y2="219"/><line x1="570" y1="85" x2="570" y2="205"/><circle cx="570" cy="85" r="5" style="fill:#476b70"/><line x1="561" y1="136" x2="579" y2="154"/><line x1="561" y1="154" x2="579" y2="136"/><line x1="561" y1="196" x2="579" y2="214"/><line x1="561" y1="214" x2="579" y2="196"/><text x="350" y="252" text-anchor="middle" class="small">Filled dot: control = 1. Circled plus: XOR target. Crosses: swap.</text></svg>