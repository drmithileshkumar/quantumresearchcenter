<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 330" role="img" aria-labelledby="title desc"><title id="title">XOR from four NAND gates</title><desc id="desc">First compute t=NAND(a,b). Then u=NAND(a,t) and v=NAND(b,t). The last NAND of u and v yields XOR.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="30" y="65" text-anchor="middle">a</text><text x="30" y="260" text-anchor="middle">b</text><line x1="50" y1="60" x2="330" y2="60"/><line x1="50" y1="255" x2="330" y2="255"/><line x1="90" y1="60" x2="90" y2="145"/><line x1="90" y1="145" x2="162" y2="145"/><circle cx="90" cy="60" r="5" style="fill:#476b70"/><line x1="115" y1="255" x2="115" y2="175"/><line x1="115" y1="175" x2="162" y2="175"/><circle cx="115" cy="255" r="5" style="fill:#476b70"/><path d="M162 132 H190 A28 28 0 0 1 190 188 H162 Z" style="fill:#f8fbf9"/><circle cx="224" cy="160" r="6"/><line x1="230" y1="160" x2="285" y2="160"/><text x="265" y="143" text-anchor="middle">t</text><circle cx="285" cy="160" r="5" style="fill:#476b70"/><line x1="285" y1="160" x2="285" y2="110"/><line x1="285" y1="110" x2="352" y2="110"/><line x1="285" y1="160" x2="285" y2="210"/><line x1="285" y1="210" x2="352" y2="210"/><line x1="330" y1="60" x2="330" y2="80"/><line x1="330" y1="80" x2="352" y2="80"/><line x1="330" y1="255" x2="330" y2="240"/><line x1="330" y1="240" x2="352" y2="240"/><path d="M352 67 H380 A28 28 0 0 1 380 123 H352 Z" style="fill:#f8fbf9"/><circle cx="414" cy="95" r="6"/><path d="M352 197 H380 A28 28 0 0 1 380 253 H352 Z" style="fill:#f8fbf9"/><circle cx="414" cy="225" r="6"/><line x1="420" y1="95" x2="530" y2="95"/><line x1="530" y1="95" x2="530" y2="145"/><line x1="530" y1="145" x2="572" y2="145"/><text x="470" y="78" text-anchor="middle">u</text><line x1="420" y1="225" x2="530" y2="225"/><line x1="530" y1="225" x2="530" y2="175"/><line x1="530" y1="175" x2="572" y2="175"/><text x="470" y="250" text-anchor="middle">v</text><path d="M572 132 H600 A28 28 0 0 1 600 188 H572 Z" style="fill:#f8fbf9"/><circle cx="634" cy="160" r="6"/><line x1="640" y1="160" x2="725" y2="160"/><text x="720" y="143" text-anchor="middle">a ⊕ b</text><text x="395" y="310" text-anchor="middle" class="small">The small output circle denotes negation; filled dots denote branches.</text></svg>