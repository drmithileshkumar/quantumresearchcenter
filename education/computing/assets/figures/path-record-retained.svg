<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">A retained record keeps the endpoints distinct</title><desc id="desc">Each left node has amplitude one over square root of two. Recording sends 00 to 00 and 10 to 11. The final H reaches 00, 10, 01, and 11 with amplitudes one half, one half, one half, and minus one half.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:17px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.edge{fill:none;stroke:#246593;stroke-width:1.8;marker-end:url(#arrow)}.node{fill:white;stroke:#246593;stroke-width:1.7}</style>
<text x="480" y="27" text-anchor="middle" class="heading">A retained record keeps the endpoints distinct</text>
<text x="130" y="70" text-anchor="middle" class="heading">After first H</text>
<text x="400" y="70" text-anchor="middle" class="heading">Record written</text>
<text x="720" y="70" text-anchor="middle" class="heading">After final H</text>
<text x="870" y="95" text-anchor="middle" class="small">Amplitude</text>
<text x="130" y="99" text-anchor="middle" class="small">Each amplitude: 1/√2</text>
