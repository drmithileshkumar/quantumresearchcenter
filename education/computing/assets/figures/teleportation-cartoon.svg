<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" role="img" aria-labelledby="tc-title tc-desc">
  <title id="tc-title">Popular Notion vs. Quantum Reality of Teleportation</title>
  <desc id="tc-desc">A cartoon contrasting the science-fiction myth of matter dematerializing and beaming across space with the physical reality of quantum teleportation using pre-shared entanglement, destruction of the original state, and a mandatory classical message.</desc>

  <defs>
    <!-- Gradients -->
    <linearGradient id="myth-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="quantum-orb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="60%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="entangle-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .tc-bg { fill: #fcfdfd; stroke: #cbd5e1; stroke-width: 1.5; }
    .tc-panel-myth { fill: #fff5f5; stroke: #fecaca; stroke-width: 1.5; }
    .tc-panel-real { fill: #f0fdf4; stroke: #bbf7d0; stroke-width: 1.5; }
    .tc-head { font: bold 14px system-ui, -apple-system, sans-serif; letter-spacing: 0.04em; }
    .tc-subhead { font: 12px system-ui, -apple-system, sans-serif; fill: #475569; }
    .tc-bold { font: bold 13px system-ui, -apple-system, sans-serif; }
    .tc-text { font: 12px system-ui, -apple-system, sans-serif; fill: #1e293b; }
    .tc-caption { font: 11px system-ui, -apple-system, sans-serif; fill: #64748b; }
    .tc-math { font: 14px Georgia, serif; fill: #0f172a; }
    .tc-line { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .tc-wire { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 4 3; }
    .tc-sci-beam { stroke: url(#myth-beam); stroke-width: 8; stroke-linecap: round; filter: url(#glow-filter); }
    .tc-myth-x { stroke: #dc2626; stroke-width: 4; stroke-linecap: round; }
  </style>

  <!-- Outer Canvas Card -->
  <rect x="5" y="5" width="930" height="530" rx="8" class="tc-bg"/>

  <!-- ========================================================================= -->
  <!-- TOP HALF: THE POPULAR SCI-FI MYTH (Matter Beaming)                        -->
  <!-- ========================================================================= -->
  <g transform="translate(15, 15)">
    <rect x="0" y="0" width="900" height="170" rx="6" class="tc-panel-myth"/>

    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="24" rx="4" fill="#fee2e2"/>
    <text x="24" y="31" class="tc-head" fill="#991b1b">1. THE SCI-FI POPULAR MYTH</text>
    <text x="250" y="31" class="tc-subhead">What media and popular fiction often depict</text>

    <!-- Alice side (Earth) -->
    <g transform="translate(45, 50)">
      <rect x="0" y="65" width="90" height="12" rx="3" fill="#cbd5e1"/>
      <text x="45" y="95" text-anchor="middle" class="tc-bold" fill="#334155">Alice (Earth)</text>
      <!-- Teleporter pad base -->
      <ellipse cx="45" cy="65" rx="35" ry="10" fill="#94a3b8"/>
      <ellipse cx="45" cy="62" rx="30" ry="7" fill="#e2e8f0"/>
      <!-- Physical person / cat / matter -->
      <g>
        <circle cx="45" cy="25" r="14" fill="#f87171"/>
        <circle cx="41" cy="22" r="2" fill="#ffffff"/>
        <circle cx="49" cy="22" r="2" fill="#ffffff"/>
        <path d="M41 29 Q45 34 49 29" stroke="#7f1d1d" stroke-width="1.5" fill="none"/>
        <rect x="36" y="39" width="18" height="22" rx="4" fill="#ef4444"/>
        <!-- Dematerialize scan effect -->
        <line x1="20" y1="20" x2="70" y2="20" stroke="#fca5a5" stroke-width="2" stroke-dasharray="2 2">
          <animate attributeName="y1" values="10;60;10" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="y2" values="10;60;10" dur="2s" repeatCount="indefinite"/>
        </line>
        <text x="45" y="-5" text-anchor="middle" class="tc-caption" fill="#b91c1c">Physical Matter</text>
      </g>
    </g>

    <!-- Mythical Space Beam (Crossed out) -->
    <g transform="translate(190, 65)">
      <!-- Pulsing matter beam -->
      <line x1="10" y1="35" x2="490" y2="35" class="tc-sci-beam" stroke-dasharray="20 10">
        <animate attributeName="stroke-dashoffset" values="0;-60" dur="1s" repeatCount="indefinite"/>
      </line>
      <text x="250" y="20" text-anchor="middle" class="tc-bold" fill="#b91c1c">"Matter Beaming Across Empty Space"</text>

      <!-- Warning Stamp -->
      <rect x="140" y="42" width="220" height="34" rx="4" fill="#ffffff" stroke="#ef4444" stroke-width="1.8"/>
      <line x1="135" y1="40" x2="365" y2="78" class="tc-myth-x"/>
      <text x="250" y="62" text-anchor="middle" class="tc-head" fill="#b91c1c">PHYSICALLY IMPOSSIBLE</text>
      <text x="250" y="95" text-anchor="middle" class="tc-caption" fill="#991b1b">
        Matter does not travel · Instantaneous transport violates relativity · Copying violates no-cloning
      </text>
    </g>

    <!-- Bob side (Mars) -->
    <g transform="translate(740, 50)">
      <rect x="0" y="65" width="90" height="12" rx="3" fill="#cbd5e1"/>
      <text x="45" y="95" text-anchor="middle" class="tc-bold" fill="#334155">Bob (Mars)</text>
      <ellipse cx="45" cy="65" rx="35" ry="10" fill="#94a3b8"/>
      <ellipse cx="45" cy="62" rx="30" ry="7" fill="#e2e8f0"/>
      <!-- Materializing clone -->
      <g>
        <circle cx="45" cy="25" r="14" fill="#f87171" opacity="0.8"/>
        <rect x="36" y="39" width="18" height="22" rx="4" fill="#ef4444" opacity="0.8"/>
        <text x="45" y="-5" text-anchor="middle" class="tc-caption" fill="#b91c1c">Instant Clone?</text>
      </g>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM HALF: THE QUANTUM REALITY (Entanglement + 2 Classical Bits)        -->
  <!-- ========================================================================= -->
  <g transform="translate(15, 205)">
    <rect x="0" y="0" width="900" height="315" rx="6" class="tc-panel-real"/>

    <!-- Header Badge -->
    <rect x="16" y="14" width="220" height="24" rx="4" fill="#dbeafe"/>
    <text x="24" y="31" class="tc-head" fill="#1e40af">2. THE QUANTUM REALITY</text>
    <text x="250" y="31" class="tc-subhead">Matter never moves: state is transferred using entanglement + two classical bits</text>

    <!-- ==================== ALICE'S LAB (EARTH) ==================== -->
    <g transform="translate(30, 48)">
      <rect x="0" y="0" width="215" height="250" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="215" height="28" rx="6" fill="#f8fafc"/>
      <text x="107" y="19" text-anchor="middle" class="tc-bold" fill="#0f172a">Alice’s Laboratory (Earth)</text>

      <!-- Unknown Input State |psi> -->
      <g transform="translate(35, 45)">
        <text x="35" y="12" text-anchor="middle" class="tc-caption" fill="#0369a1">Unknown Input</text>
        <text x="35" y="28" text-anchor="middle" class="tc-math" data-tex="\ket\psi = \alpha\ket0 + \beta\ket1">|ψ⟩ = α|0⟩ + β|1⟩</text>
        
        <!-- Animated Original State Qubit -->
        <g transform="translate(35, 60)">
          <!-- Core sphere -->
          <circle cx="0" cy="0" r="18" fill="url(#quantum-orb-grad)" filter="url(#glow-filter)">
            <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.25;0.35;0.92;1" dur="10s" repeatCount="indefinite"/>
          </circle>
          <!-- Internal spin arrow -->
          <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
            <animate attributeName="opacity" values="1;1;0.15;0.15;1" keyTimes="0;0.25;0.35;0.92;1" dur="10s" repeatCount="indefinite"/>
          </line>
          <!-- State phase ring -->
          <circle cx="0" cy="0" r="23" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2">
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
          </circle>
        </g>
      </g>

      <!-- Alice's half of Bell pair -->
      <g transform="translate(145, 45)">
        <text x="25" y="12" text-anchor="middle" class="tc-caption" fill="#6b21a8">Alice’s Bell Qubit</text>
        <text x="25" y="28" text-anchor="middle" class="tc-bold" fill="#7e22ce">Qubit 2</text>
        <circle cx="25" cy="60" r="13" fill="#a855f7" filter="url(#glow-filter)"/>
        <text x="25" y="64" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Φ⁺</text>
      </g>

      <!-- Bell-State Measurement Unit -->
      <g transform="translate(20, 150)">
        <rect x="0" y="0" width="175" height="58" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="87" y="18" text-anchor="middle" class="tc-bold" fill="#1e293b">Bell Measurement</text>
        <text x="87" y="32" text-anchor="middle" class="tc-caption">Couples input to entangled pair</text>

        <!-- Measurement Flash Animation -->
        <rect x="2" y="2" width="171" height="54" rx="3" fill="#fef08a" opacity="0">
          <animate attributeName="opacity" values="0;0;0.7;0;0" keyTimes="0;0.24;0.28;0.36;1" dur="10s" repeatCount="indefinite"/>
        </rect>

        <!-- Result readout screen -->
        <g transform="translate(48, 36)">
          <rect x="0" y="0" width="80" height="18" rx="2" fill="#0f172a"/>
          <text x="40" y="13" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="12" font-weight="bold">
            bits: m n
          </text>
        </g>
      </g>

      <!-- Status note: Original destroyed -->
      <text x="107" y="232" text-anchor="middle" class="tc-bold" fill="#b91c1c">
        Original destroyed!
        <tspan font-weight="normal" fill="#64748b" font-size="10"> (No-cloning obeyed)</tspan>
      </text>
    </g>

    <!-- ==================== MIDDLE CHANNELS ==================== -->
    <g transform="translate(265, 48)">

      <!-- 1. The Pre-Shared Entangled Pair (Top Channel) -->
      <g transform="translate(0, 30)">
        <text x="180" y="-8" text-anchor="middle" class="tc-bold" fill="#6b21a8">
          Pre-Shared Entangled Link <tspan font-weight="normal" class="tc-math" data-tex="\ket{\Phi^+} = \frac{\ket{00}+\ket{11}}{\sqrt2}">(|00⟩+|11⟩)/√2</tspan>
        </text>

        <!-- Entangled wavy link -->
        <path d="M 10 25 Q 90 -5 180 25 T 350 25" fill="none" stroke="url(#entangle-grad)" stroke-width="3" stroke-dasharray="6 3">
          <animate attributeName="stroke-dashoffset" values="0;-36" dur="2s" repeatCount="indefinite"/>
        </path>
        <!-- Quantum correlation particles -->
        <circle cx="90" cy="10" r="4" fill="#ec4899">
          <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <circle cx="270" cy="10" r="4" fill="#8b5cf6">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
        </circle>
        <text x="180" y="52" text-anchor="middle" class="tc-caption" fill="#64748b">
          Prepared in advance · Contains no message by itself · Zero FTL communication
        </text>
      </g>

      <!-- 2. The Classical Channel (Bottom Channel) -->
      <g transform="translate(0, 150)">
        <rect x="15" y="-12" width="330" height="92" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
        <text x="180" y="8" text-anchor="middle" class="tc-bold" fill="#0369a1">
          Classical Channel (Speed of Light ≤ c)
        </text>
        <text x="180" y="24" text-anchor="middle" class="tc-caption" fill="#64748b">
          Alice calls Bob with her measurement outcomes: 2 classical bits
        </text>

        <!-- Classical Wire / Radio wave -->
        <line x1="30" y1="52" x2="330" y2="52" stroke="#0284c7" stroke-width="1.8" stroke-dasharray="5 4"/>

        <!-- Animated Moving Classical Packet (Envelope / 2 bits) -->
        <g transform="translate(30, 42)">
          <animateTransform attributeName="transform" type="translate"
            values="30,42; 30,42; 300,42; 300,42; 30,42"
            keyTimes="0; 0.40; 0.72; 0.95; 1"
            dur="10s" repeatCount="indefinite"/>
          <rect x="-16" y="-12" width="34" height="22" rx="3" fill="#0284c7" filter="url(#glow-filter)"/>
          <text x="1" y="3" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">
            01
          </text>
        </g>

        <!-- Speed of light note -->
        <text x="180" y="72" text-anchor="middle" class="tc-caption" fill="#0284c7">
          Crucial: Bob CANNOT recover the state until these 2 bits arrive!
        </text>
      </g>

    </g>

    <!-- ==================== BOB'S LAB (MARS) ==================== -->
    <g transform="translate(645, 48)">
      <rect x="0" y="0" width="225" height="250" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <rect x="0" y="0" width="225" height="28" rx="6" fill="#f8fafc"/>
      <text x="112" y="19" text-anchor="middle" class="tc-bold" fill="#0f172a">Bob’s Laboratory (Mars)</text>

      <!-- Bob's Entangled Half -->
      <g transform="translate(25, 45)">
        <text x="25" y="12" text-anchor="middle" class="tc-caption" fill="#6b21a8">Bob’s Bell Qubit</text>
        <text x="25" y="28" text-anchor="middle" class="tc-bold" fill="#7e22ce">Qubit 3</text>
        <circle cx="25" cy="60" r="13" fill="#a855f7" filter="url(#glow-filter)"/>
        <text x="25" y="64" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="bold">Φ⁺</text>
        <text x="25" y="86" text-anchor="middle" class="tc-caption" fill="#475569">Already here!</text>
      </g>

      <!-- Reconstructed Target State (Appears on Bob's particle after correction) -->
      <g transform="translate(135, 45)">
        <text x="40" y="12" text-anchor="middle" class="tc-caption" fill="#0369a1">Reconstructed</text>
        <text x="40" y="28" text-anchor="middle" class="tc-math" data-tex="\ket\psi = \alpha\ket0 + \beta\ket1">|ψ⟩ = α|0⟩ + β|1⟩</text>

        <!-- State representation on Bob's side -->
        <g transform="translate(40, 60)">
          <!-- Scrambled/Random State before 2 bits arrive -->
          <g>
            <animate attributeName="opacity" values="0.9;0.9;0.9;0.9;0.05;0.05;0.9" keyTimes="0;0.35;0.65;0.72;0.80;0.95;1" dur="10s" repeatCount="indefinite"/>
            <circle cx="0" cy="0" r="16" fill="#94a3b8" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 2"/>
            <text x="0" y="4" text-anchor="middle" fill="#475569" font-size="11" font-weight="bold">?</text>
            <text x="0" y="32" text-anchor="middle" class="tc-caption" fill="#64748b">Random mix</text>
          </g>

          <!-- Fully Reconstructed State |psi> after Bob applies Pauli Z^m X^n -->
          <g opacity="0">
            <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;0.35;0.65;0.72;0.80;0.95;1" dur="10s" repeatCount="indefinite"/>
            <!-- Core sphere -->
            <circle cx="0" cy="0" r="18" fill="url(#quantum-orb-grad)" filter="url(#glow-filter)"/>
            <line x1="-8" y1="8" x2="8" y2="-8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="0" cy="0" r="23" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 2">
              <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite"/>
            </circle>
            <text x="0" y="36" text-anchor="middle" class="tc-bold" fill="#0284c7">Restored!</text>
          </g>
        </g>
      </g>

      <!-- Bob's Unitary Correction Stage -->
      <g transform="translate(20, 150)">
        <rect x="0" y="0" width="185" height="58" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
        <text x="92" y="18" text-anchor="middle" class="tc-bold" fill="#1e293b">Pauli Correction</text>
        <text x="92" y="34" text-anchor="middle" class="tc-math" data-tex="U = Z^m X^n">U = Zᵐ Xⁿ</text>
        <text x="92" y="49" text-anchor="middle" class="tc-caption" fill="#0369a1">Applies gate matching the 2 bits</text>
      </g>

      <!-- Status note: Matter never moved -->
      <text x="112" y="232" text-anchor="middle" class="tc-bold" fill="#047857">
        State transferred!
        <tspan font-weight="normal" fill="#64748b" font-size="10"> (Matter stayed put)</tspan>
      </text>
    </g>

  </g>
</svg>

