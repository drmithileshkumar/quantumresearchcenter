<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-labelledby="title desc"><title id="title">Path visualization of the cross-sum condition</title><desc id="desc">Left: in one step S from a superposition of 0 and 1, arrows of weight a and c meet at output 0 while arrows of weight b and d meet at output 1. Right: expanding the total probability pairs each forward arrow from 0 to j with a conjugated reversed arrow from j to 1; the two cross paths 0 to 0 to 1 (weight c star a) and 0 to 1 to 1 (weight d star b) must cancel to zero, while the return paths to 0 add to 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker><marker id="arrow-neg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a64d26"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#9fb2c2"/></marker></defs><style>text{font:15px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.muted{font:13px system-ui,sans-serif;fill:#7b8a97}.weight{font:600 14px Georgia,serif;fill:#246593}.neg-weight{font:600 14px Georgia,serif;fill:#a64d26}.node{fill:#fff;stroke:#246593;stroke-width:1.8}.active{fill:#eaf1f7;stroke:#246593;stroke-width:2.1}.cancelled{fill:#fbf0ea;stroke:#a64d26;stroke-width:2;stroke-dasharray:4 3}.unused{fill:#fff;stroke:#b8c7d4;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:2;marker-end:url(#arrow)}.neg-edge{fill:none;stroke:#a64d26;stroke-width:2;stroke-dasharray:5 4;marker-end:url(#arrow-neg)}.muted-edge{fill:none;stroke:#b8c7d4;stroke-width:1.4;marker-end:url(#arrow-muted)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="175" y="30" text-anchor="middle" class="heading">1. Two inputs interfere at each output j</text><text x="72" y="68" text-anchor="middle" class="small">Input i, k</text><text x="205" y="68" text-anchor="middle" class="small">Output j</text><path d="M88 125L188 125" class="edge"/><text x="138" y="114" text-anchor="middle" class="weight" data-tex="a">a</text><path d="M86 135L190 235" class="edge"/><text x="115" y="182" text-anchor="middle" class="weight" data-tex="b">b</text><path d="M86 235L190 135" class="neg-edge"/><text x="162" y="182" text-anchor="middle" class="neg-weight" data-tex="c">c</text><path d="M88 245L188 245" class="neg-edge"/><text x="138" y="266" text-anchor="middle" class="neg-weight" data-tex="d">d</text><circle cx="72" cy="125" r="16" class="active"/><text x="72" y="130" text-anchor="middle">0</text><text x="46" y="130" text-anchor="end" class="weight" data-tex="v_0">v₀</text><circle cx="72" cy="245" r="16" class="active"/><text x="72" y="250" text-anchor="middle">1</text><text x="46" y="250" text-anchor="end" class="neg-weight" data-tex="v_1">v₁</text><circle cx="205" cy="125" r="16" class="node"/><text x="205" y="130" text-anchor="middle">0</text><text x="230" y="122" text-anchor="start" class="small" data-tex="v'_0=av_0+cv_1">v'₀ = av₀ + cv₁</text><text x="230" y="142" text-anchor="start" class="muted">cross term: a*c + c*a</text><circle cx="205" cy="245" r="16" class="node"/><text x="205" y="250" text-anchor="middle">1</text><text x="230" y="242" text-anchor="start" class="small" data-tex="v'_1=bv_0+dv_1">v'₁ = bv₀ + dv₁</text><text x="230" y="262" text-anchor="start" class="muted">cross term: b*d + d*b</text><text x="175" y="332" text-anchor="middle" class="small">Gain at j=0 must balance loss at j=1.</text><path d="M368 24V340" class="rule"/><text x="614" y="30" text-anchor="middle" class="heading">2. Cross paths 0 → j → 1 must cancel</text><text x="425" y="68" text-anchor="middle" class="small">Start 0</text><text x="555" y="68" text-anchor="middle" class="small">Via j</text><text x="685" y="68" text-anchor="middle" class="small">End i</text><text x="490" y="92" text-anchor="middle" class="small">forward S</text><text x="620" y="92" text-anchor="middle" class="small">conjugated reverse</text><path d="M571 125L668 125" class="muted-edge"/><text x="620" y="115" text-anchor="middle" class="muted" data-tex="a^*">a*</text><path d="M569 235L670 135" class="muted-edge"/><text x="636" y="172" text-anchor="middle" class="muted" data-tex="b^*">b*</text><path d="M441 125L538 125" class="edge"/><text x="490" y="114" text-anchor="middle" class="weight" data-tex="a">a</text><path d="M439 135L540 235" class="edge"/><text x="475" y="198" text-anchor="middle" class="weight" data-tex="b">b</text><path d="M569 135L670 235" class="edge"/><text x="598" y="202" text-anchor="middle" class="weight" data-tex="c^*">c*</text><path d="M571 245L668 245" class="neg-edge"/><text x="620" y="266" text-anchor="middle" class="neg-weight" data-tex="d^*">d*</text><circle cx="425" cy="125" r="16" class="active"/><text x="425" y="130" text-anchor="middle">0</text><circle cx="425" cy="245" r="16" class="unused"/><text x="425" y="250" text-anchor="middle" class="muted">1</text><circle cx="555" cy="125" r="16" class="node"/><text x="555" y="130" text-anchor="middle">0</text><circle cx="555" cy="245" r="16" class="node"/><text x="555" y="250" text-anchor="middle">1</text><circle cx="685" cy="125" r="16" class="active"/><text x="685" y="130" text-anchor="middle">0</text><circle cx="685" cy="245" r="16" class="cancelled"/><text x="685" y="250" text-anchor="middle">1</text><text x="712" y="122" text-anchor="start" class="weight" data-tex="|a|^2+|b|^2=1">|a|² + |b|² = 1</text><text x="712" y="142" text-anchor="start" class="muted">(return paths add)</text><text x="712" y="242" text-anchor="start" class="neg-weight" data-tex="c^*a+d^*b=0">c*a + d*b = 0</text><text x="712" y="262" text-anchor="start" class="neg-weight">(cross paths cancel)</text><text x="614" y="332" text-anchor="middle" class="small">Paths 0 → 0 → 1 (weight c*a) and 0 → 1 → 1 (weight d*b) cancel to 0.</text></svg>

