<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">Geometric action of a transition matrix</title><desc id="desc">Left: the initial ket psi has coordinates three fifths and four fifths in the standard basis. Right: U equals one fifth times the matrix with rows four,minus three and three,four. It rotates ket zero to coordinates four fifths,three fifths and ket one to minus three fifths,four fifths. The transformed components three fifths U ket zero and four fifths U ket one add to U ket psi equals ket one. The coordinate axes stay fixed. This is a real state-vector plane.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="240" y="30" text-anchor="middle" class="heading">Initial vector</text><text x="720" y="30" text-anchor="middle" class="heading">Transformed vector and basis directions</text><path class="edge" d="M135 340H345" style="stroke:#a64d26"/><path class="edge" d="M135 340V130" style="stroke:#347449"/><path class="edge" d="M135 340L261 172" style="stroke:#246593"/><path d="M135 172H261V340" stroke="#a7bccd" stroke-width="1.3" stroke-dasharray="5 4" fill="none"/><text x="365" y="345" text-anchor="middle" class="" data-tex="\ket0">|0⟩</text><text x="135" y="110" text-anchor="middle" class="" data-tex="\ket1">|1⟩</text><text x="276" y="154" text-anchor="middle" class="" data-tex="\ket\psi">|ψ⟩</text><text x="104" y="181" text-anchor="middle" class="" data-tex="4/5">4/5</text><text x="261" y="365" text-anchor="middle" class="" data-tex="3/5">3/5</text><path d="M535 340H915 M700 365V95" stroke="#d3dee7" stroke-width="1.2" fill="none"/><text x="920" y="360" text-anchor="middle" class="small" data-tex="\ket0">|0⟩</text><text x="700" y="78" text-anchor="middle" class="small" data-tex="\ket1">|1⟩</text><path class="edge" d="M700 340L868 214" style="stroke:#a64d26"/><path class="edge" d="M700 340L574 172" style="stroke:#347449"/><path class="edge" d="M700 340V130" style="stroke:#246593"/><text x="880" y="198" text-anchor="middle" class="" data-tex="U\ket0">U|0⟩</text><text x="565" y="150" text-anchor="middle" class="" data-tex="U\ket1">U|1⟩</text><text x="739" y="120" text-anchor="middle" class="" data-tex="U\ket\psi">U|ψ⟩</text><path d="M800.8 264.4L700 130" fill="none" stroke="#347449" stroke-width="1.4" stroke-dasharray="5 4"/><path d="M599.2 205.6L700 130" fill="none" stroke="#a64d26" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="800.8" cy="264.4" r="3.5" fill="#a64d26"/><circle cx="599.2" cy="205.6" r="3.5" fill="#347449"/><text x="830" y="291" text-anchor="middle" class="small" data-tex="\frac35U\ket0">3/5U|0⟩</text><text x="777" y="184" text-anchor="middle" class="small" data-tex="\frac45U\ket1">4/5U|1⟩</text><path class="rule" d="M465 55V385"/><text x="480" y="425" text-anchor="middle" class="small">The state changes; the coordinate axes stay fixed.</text><text x="480" y="470" text-anchor="middle" class="" data-tex="U=\frac15\begin{pmatrix}4&amp;-3\\3&amp;4\end{pmatrix},\qquad \ket\psi=\begin{pmatrix}3/5\\4/5\end{pmatrix},\qquad U\ket\psi=\begin{pmatrix}0\\1\end{pmatrix}">U=1/5beginpmatrix4&amp;−3\3&amp;4endpmatrix,  |ψ⟩=beginpmatrix3/5\4/5endpmatrix,  U|ψ⟩=beginpmatrix0\1endpmatrix</text><text x="480" y="515" text-anchor="middle" class="" data-tex="U\ket\psi=\frac35U\ket0+\frac45U\ket1=\ket1">U|ψ⟩=3/5U|0⟩+4/5U|1⟩=|1⟩</text></svg>
