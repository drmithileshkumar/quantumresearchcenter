<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" role="img" aria-labelledby="title desc"><title id="title">The halting contradiction: run D on its own description</title><desc id="desc">Assume H always halts and correctly predicts halting. Program D calls H(p,p) and does the opposite. With p equal to d, the description of D, either prediction about D(d) is contradicted by its prescribed behavior.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">The halting contradiction: run D on its own description</text><text x="360" y="61" text-anchor="middle" class="small">Assume H always halts and correctly predicts halting.</text><rect x="25" y="80" width="670" height="285" rx="8" class="frame"/><text x="50" y="104" text-anchor="start" class="label">PROGRAM D(p)</text><rect x="60" y="137" width="130" height="60" rx="5" class="node"/><text x="125.0" y="172.0" text-anchor="middle" class="">Input p</text><path d="M190 167 L245 167" class="edge"/><rect x="245" y="137" width="160" height="60" rx="5" class="accent"/><text x="325.0" y="172.0" text-anchor="middle" class="">Call H(p, p)</text><path d="M405 153 L460 153 L460 135 L515 135" class="edge"/><text x="455" y="116" text-anchor="middle" class="small">“halts”</text><rect x="515" y="108" width="145" height="55" rx="5" class="node"/><text x="587.5" y="140.5" text-anchor="middle" class="">Loop forever</text><path d="M405 181 L460 181 L460 267 L515 267" class="edge"/><text x="460" y="298" text-anchor="middle" class="small">“does not halt”</text><rect x="515" y="240" width="145" height="55" rx="5" class="node"/><text x="587.5" y="272.5" text-anchor="middle" class="">Halt</text><text x="360" y="337" text-anchor="middle" class="small">D follows fixed instructions: it opposes the prediction.</text><text x="360" y="392" text-anchor="middle" class="label">Now set p = d, the description of D.</text><text x="360" y="422" text-anchor="middle" class="small">H(d, d) predicts this very run; either answer is contradicted.</text></svg>
