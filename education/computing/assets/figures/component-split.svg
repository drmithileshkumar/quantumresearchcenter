<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Splitting a state along a direction</title><desc id="desc">In a real state-vector plane, the unit vector phi points at 15 degrees and the unit vector psi at 75 degrees, so the angle between them is 60 degrees. The component of psi along phi, the inner product of phi and psi times phi, has length one half and lies along phi. The remainder psi perp runs from the end of that component to the tip of psi, at a right angle to phi, with length root three over two. The squared lengths one quarter and three quarters add to one.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="380" y="30" text-anchor="middle" class="heading">Splitting a state along a direction</text><path d="M79.9 348.1L416.4 257.9" stroke="#d3dee7" stroke-width="1.2" fill="none"/><path class="edge" d="M110.0 340.0L361.1 272.7" style="stroke:#a64d26"/><path class="edge" d="M110.0 340.0L177.3 88.9"/><defs><marker id="arrow-fixed" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><path d="M110.0 340.0L235.6 306.4" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow-fixed)"/><path class="edge" d="M235.6 306.4L177.3 88.9" style="stroke:#347449;stroke-width:2.2;stroke-dasharray:7 5"/><path d="M231.9 292.8L218.4 296.5L222.0 310.0" stroke="#347449" stroke-width="1.4" fill="none"/><path d="M160.2 326.5A52 52 0 0 0 123.5 289.8" stroke="#4b5864" stroke-width="1.3" fill="none"/><circle cx="110" cy="340" r="3.5" fill="#30343b"/><text x="390.118" y="264.942" text-anchor="middle" class="" data-tex="\ket\phi">|φ⟩</text><text x="177.293" y="72.8593" text-anchor="middle" class="" data-tex="\ket\psi">|ψ⟩</text><text x="160.912" y="294.088" text-anchor="middle" class="" data-tex="\theta">θ</text><text x="180.55" y="352.155" text-anchor="middle" class="" data-tex="\braket\phi\psi\,\ket\phi">⟨φ|ψ⟩ |φ⟩</text><text x="243.137" y="187.771" text-anchor="middle" class="" data-tex="\ket{\psi_\perp}">|ψ_(perp)⟩</text><text x="565" y="120" text-anchor="middle" class="" data-tex="\ket\psi=\braket\phi\psi\,\ket\phi+\ket{\psi_\perp}">|ψ⟩=⟨φ|ψ⟩ |φ⟩+|ψ_(perp)⟩</text><text x="565" y="172" text-anchor="middle" class="" data-tex="\braket\phi{\psi_\perp}=0">⟨φ|ψ_(perp)⟩=0</text><text x="565" y="224" text-anchor="middle" class="" data-tex="1=|\braket\phi\psi|^2+\|\psi_\perp\|^2">1=|⟨φ|ψ⟩|²+|ψ_(perp)|²</text><text x="565" y="276" text-anchor="middle" class="small" data-math="Here \(\theta=60^\circ\): \(\braket\phi\psi=\tfrac12\)">Here θ=60°: ⟨φ|ψ⟩=1/2</text><text x="565" y="304" text-anchor="middle" class="small" data-tex="1=\tfrac14+\tfrac34">1=1/4+3/4</text></svg>
