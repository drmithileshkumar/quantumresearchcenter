<svg data-linked-diagram="hadamard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="group" aria-labelledby="title desc">
<title id="title">Hadamard transitions and their ket notation</title>
<desc id="desc">Two rows show each possible input separately. From input zero, arrows to zero and one both have amplitude one over square root two, giving H ket zero equals ket zero plus ket one, divided by square root two. From input one, the arrow to zero has positive amplitude and the dashed arrow to one has negative amplitude, giving H ket one equals ket zero minus ket one, divided by square root two.</desc>
<defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#256a91"/></marker><marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7757b8"/></marker></defs>
<style>text{font:19px Georgia,serif;fill:#263d4b}.label{font:14px Arial,sans-serif;fill:#596b78}.node{fill:#f5f8fb;stroke:#6e8796;stroke-width:1.5}.rule{stroke:#d4dfe6;stroke-width:1}</style>
<line class="rule" x1="28" y1="240" x2="872" y2="240"/>
<text x="65" y="30" class="label" text-anchor="middle">Input</text><text x="295" y="30" class="label" text-anchor="middle">After one H step</text><text x="590" y="30" class="label" text-anchor="middle">The same transition in ket notation</text><g data-link="0-0" class="diagram-link diagram-arrow" tabindex="0" role="button" aria-pressed="false" aria-label="Input 0 to output 0: one over square root two"><path class="diagram-hit" d="M86 124.5L272 79.4" fill="none" stroke="transparent" stroke-width="22"/><path d="M86 124.5L272 79.4" fill="none" stroke="#256a91" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="169" y="83" text-anchor="middle" data-tex="1/\sqrt2">1/√2</text></g><circle class="node" cx="295" cy="75" r="21"/><text x="295" y="81" text-anchor="middle">0</text><g data-link="0-1" class="diagram-link diagram-arrow" tabindex="0" role="button" aria-pressed="false" aria-label="Input 0 to output 1: one over square root two"><path class="diagram-hit" d="M86 135.5L272 180.6" fill="none" stroke="transparent" stroke-width="22"/><path d="M86 135.5L272 180.6" fill="none" stroke="#7757b8" stroke-width="2.4" marker-end="url(#arrow-violet)"/><text x="169" y="188" text-anchor="middle" data-tex="1/\sqrt2">1/√2</text></g><circle class="node" cx="295" cy="185" r="21"/><text x="295" y="191" text-anchor="middle">1</text><circle class="node" cx="65" cy="130" r="21"/><text x="65" y="136" text-anchor="middle">0</text><text x="440" y="133" text-anchor="middle" data-tex="H\ket0=">H|0⟩=</text><g data-link="0-0" class="diagram-link diagram-term" tabindex="0" role="button" aria-pressed="false" aria-label="Term for input 0 to output 0"><rect class="term-halo" x="497" y="100" width="116" height="55" rx="10" fill="transparent"/><text x="555" y="133" text-anchor="middle" data-tex="\frac{1}{\sqrt2}\ket0">1/√2|0⟩</text></g><g data-link="0-1" class="diagram-link diagram-term" tabindex="0" role="button" aria-pressed="false" aria-label="Term for input 0 to output 1"><rect class="term-halo" x="657" y="100" width="116" height="55" rx="10" fill="transparent"/><text x="635" y="133" text-anchor="middle" data-tex="+">+</text><text x="715" y="133" text-anchor="middle" data-tex="\frac{1}{\sqrt2}\ket1">1/√2|1⟩</text></g><text x="590" y="175" class="label" text-anchor="middle">Both outgoing amplitudes are positive.</text><g data-link="1-0" class="diagram-link diagram-arrow" tabindex="0" role="button" aria-pressed="false" aria-label="Input 1 to output 0: one over square root two"><path class="diagram-hit" d="M86 349.5L272 304.4" fill="none" stroke="transparent" stroke-width="22"/><path d="M86 349.5L272 304.4" fill="none" stroke="#256a91" stroke-width="2.4" marker-end="url(#arrow-blue)"/><text x="169" y="308" text-anchor="middle" data-tex="1/\sqrt2">1/√2</text></g><circle class="node" cx="295" cy="300" r="21"/><text x="295" y="306" text-anchor="middle">0</text><g data-link="1-1" class="diagram-link diagram-arrow" tabindex="0" role="button" aria-pressed="false" aria-label="Input 1 to output 1: minus one over square root two"><path class="diagram-hit" d="M86 360.5L272 405.6" fill="none" stroke="transparent" stroke-width="22"/><path d="M86 360.5L272 405.6" fill="none" stroke="#7757b8" stroke-width="2.4" marker-end="url(#arrow-violet)" stroke-dasharray="7 4"/><text x="169" y="413" text-anchor="middle" data-tex="-1/\sqrt2">−1/√2</text></g><circle class="node" cx="295" cy="410" r="21"/><text x="295" y="416" text-anchor="middle">1</text><circle class="node" cx="65" cy="355" r="21"/><text x="65" y="361" text-anchor="middle">1</text><text x="440" y="358" text-anchor="middle" data-tex="H\ket1=">H|1⟩=</text><g data-link="1-0" class="diagram-link diagram-term" tabindex="0" role="button" aria-pressed="false" aria-label="Term for input 1 to output 0"><rect class="term-halo" x="497" y="325" width="116" height="55" rx="10" fill="transparent"/><text x="555" y="358" text-anchor="middle" data-tex="\frac{1}{\sqrt2}\ket0">1/√2|0⟩</text></g><g data-link="1-1" class="diagram-link diagram-term" tabindex="0" role="button" aria-pressed="false" aria-label="Term for input 1 to output 1"><rect class="term-halo" x="657" y="325" width="116" height="55" rx="10" fill="transparent"/><text x="635" y="358" text-anchor="middle" data-tex="-">−</text><text x="715" y="358" text-anchor="middle" data-tex="\frac{1}{\sqrt2}\ket1">1/√2|1⟩</text></g><text x="590" y="400" class="label" text-anchor="middle">The minus sign belongs to the arrow ending at 1.</text></svg>