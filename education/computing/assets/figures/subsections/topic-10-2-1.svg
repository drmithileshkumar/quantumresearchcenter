<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Checking a certificate</title><desc id="desc">The reversible implementation of a classical verifier preserves x and certificate w and writes V(x,w) into a blank bit. This checks a supplied certificate; it does not find one. Internal workspace is suppressed. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Checking a certificate</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 110L810 110"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket w">|w⟩</text><path class="wire" d="M170 180L810 180"/><path class="wire" d="M189 187L199 173"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 250L720.0 250"/><path class="wire" d="M720.0 247L810 247"/><path class="wire" d="M720.0 253L810 253"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120">V(x,w)</text><rect class="gate" x="190.0" y="90" width="100" height="180" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="U_V">U_V</text><rect class="gate" x="670.0" y="230" width="100" height="40" rx="3"/><text x="720" y="256" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880">Accept if the final bit is 1.</text></svg>
