<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" role="img" aria-labelledby="title desc"><title id="title">An efficient reduction transfers a solver</title><desc id="desc">If task A reduces efficiently to task B, an efficient solver for B would yield one for A. The arrow describes converting instances, not proving that such a solver exists. Instance of A → Efficient conversion → Instance of B → B solver → A answer</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">An efficient reduction transfers a solver</text><rect x="32" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="94" text-anchor="middle" class="" data-max-width="131" data-math="Instance of \(A\)">Instance of A</text><path d="M185 89L213 89" class="edge"/><rect x="213" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="83" text-anchor="middle" class="" data-max-width="131">Efficient</text><text x="289.5" y="105" text-anchor="middle" class="" data-max-width="131">conversion</text><path d="M366 89L394 89" class="edge"/><rect x="394" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="94" text-anchor="middle" class="" data-max-width="131" data-math="Instance of \(B\)">Instance of B</text><path d="M547 89L575 89" class="edge"/><rect x="575" y="54" width="153" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="83" text-anchor="middle" class="" data-max-width="131" data-math="\(B\) solver \(\to\) \(A\)">B solver → A</text><text x="651.5" y="105" text-anchor="middle" class="" data-max-width="131">answer</text></svg>
