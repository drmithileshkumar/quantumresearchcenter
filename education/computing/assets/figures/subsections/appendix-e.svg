<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc"><title id="title">Queries can increase polynomial degree</title><desc id="desc">Starting from amplitudes independent of hidden input bits, each Boolean query raises their degree by at most one. Squaring magnitudes gives the factor of two for acceptance probabilities. Input-independent start
degree 0 → After T queries
amplitude degree ≤ T → Acceptance probability
degree ≤ 2T</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Queries can increase polynomial degree</text><rect x="32" y="54" width="213.333" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="82" text-anchor="middle" class="" data-max-width="191.333">Input-independent</text><text x="138.667" y="104" text-anchor="middle" class="" data-max-width="191.333">start</text><text x="138.667" y="126" text-anchor="middle" class="" data-max-width="191.333">degree 0</text><path d="M245.333 99L273.333 99" class="edge"/><rect x="273.333" y="54" width="213.333" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="93" text-anchor="middle" class="" data-max-width="191.333" data-math="After \(T\) queries">After T queries</text><text x="380" y="115" text-anchor="middle" class="" data-max-width="191.333" data-math="amplitude degree \(\le T\)">amplitude degree ≤ T</text><path d="M486.667 99L514.667 99" class="edge"/><rect x="514.667" y="54" width="213.333" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="93" text-anchor="middle" class="" data-max-width="191.333">Acceptance probability</text><text x="621.333" y="115" text-anchor="middle" class="" data-max-width="191.333" data-math="degree \(\le 2T\)">degree ≤ 2T</text></svg>
