<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Queries can increase polynomial degree</title><desc id="desc">Starting from amplitudes independent of hidden input bits, each Boolean query raises their degree by at most one. Squaring magnitudes gives the factor of two for acceptance probabilities. A query algorithm alternates input-independent unitaries U0, U1, …, UT with T queries O_x, then measures. Below each stage is the largest possible degree of the amplitudes as polynomials in the input bits: 0 at the start, rising by at most one at each query and unchanged by each U. The acceptance probability, a sum of squared magnitudes, has degree at most 2T.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Queries can increase polynomial degree</text><polyline points="58,130 611,130" fill="none" stroke="#476b70" stroke-width="1.6"/><polyline points="689,127 730,127" fill="none" stroke="#476b70" stroke-width="1.2"/><polyline points="689,133 730,133" fill="none" stroke="#476b70" stroke-width="1.2"/><rect x="84" y="110" width="52" height="40" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="110" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="U_0">U₀</text><rect x="159" y="110" width="52" height="40" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="185" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="O_x">O_x</text><rect x="234" y="110" width="52" height="40" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="260" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="U_1">U₁</text><rect x="309" y="110" width="52" height="40" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="335" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="O_x">O_x</text><rect x="459" y="110" width="52" height="40" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="485" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="O_x">O_x</text><rect x="534" y="110" width="52" height="40" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="560" y="135" text-anchor="middle" class="" data-max-width="40" data-tex="U_T">U_T</text><rect x="611" y="110" width="78" height="40" rx="6" fill="#eaf1f7" stroke="#8fb0c8" stroke-width="1.3"/><text x="650" y="135" text-anchor="middle" class="" data-max-width="66">measure</text><text x="410" y="135" text-anchor="middle" class="" data-max-width="18" data-tex="\cdots">⋯</text><rect x="125" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="147" y="197" text-anchor="middle" class="small" data-max-width="32">0</text><rect x="200" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="222" y="197" text-anchor="middle" class="small" data-max-width="32" data-tex="\le1">≤1</text><rect x="275" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="297" y="197" text-anchor="middle" class="small" data-max-width="32" data-tex="\le1">≤1</text><rect x="350" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="372" y="197" text-anchor="middle" class="small" data-max-width="32" data-tex="\le2">≤2</text><rect x="500" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="522" y="197" text-anchor="middle" class="small" data-max-width="32" data-tex="\le T">≤ T</text><rect x="583" y="178" width="44" height="28" rx="14" fill="#f5f7f9" stroke="#c6d0d9" stroke-width="1.3"/><text x="605" y="197" text-anchor="middle" class="small" data-max-width="32" data-tex="\le T">≤ T</text><text x="40" y="135" text-anchor="end" class="" data-max-width="700" data-tex="\ket0">|0⟩</text><text x="100" y="197" text-anchor="end" class="small" data-max-width="700">degree</text><text x="222" y="250" text-anchor="middle" class="small" style="fill:#765391" data-max-width="330" data-math="query: amplitude times \((-1)^{x_i}=1-2x_i\), degree \(+1\) at most">query: amplitude times (−1)^(xᵢ)=1−2xᵢ, degree +1 at most</text><text x="560" y="250" text-anchor="middle" class="small" data-max-width="300" data-math="\(U_k\): fixed linear mix, degree unchanged">Uₖ: fixed linear mix, degree unchanged</text><text x="380" y="300" text-anchor="middle" class="" style="fill:#246593" data-max-width="700" data-math="acceptance probability \(\sum|\alpha_z|^2\): each square doubles the degree, so \(\le2T\)">acceptance probability Σ|α_z|²: each square doubles the degree, so ≤2T</text></svg>
