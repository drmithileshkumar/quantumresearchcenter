<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" role="img" aria-labelledby="title desc"><title id="title">Three different inputs merge</title><desc id="desc">The AND gate maps 00, 01, and 10 to the same output. Output zero cannot identify which of these inputs occurred. 00 → 0; 01 → 0; 10 → 0; 11 → 1.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Three different inputs merge</text><text x="380" y="56" text-anchor="middle" class="" data-max-width="350">AND</text><path d="M115.749 107.463L643.262 184.392" class="edge"/><path d="M116 188L643 188" class="edge"/><path d="M115.749 268.537L643.262 191.608" class="edge"/><path d="M115.749 352.537L643.262 275.608" class="edge"/><circle cx="92" cy="104" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="109" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="92" cy="188" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="193" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="92" cy="272" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="277" text-anchor="middle" class="" data-max-width="38">10</text><circle cx="92" cy="356" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="361" text-anchor="middle" class="" data-max-width="38">11</text><circle cx="668" cy="188" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="668" y="193" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="668" cy="272" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="668" y="277" text-anchor="middle" class="" data-max-width="38">1</text></svg>
