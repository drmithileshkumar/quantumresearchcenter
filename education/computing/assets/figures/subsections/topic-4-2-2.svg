<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title desc"><title id="title">Measurement and its conditional state</title><desc id="desc">For |ψ⟩=(√3/2)|0⟩+(1/2)|1⟩, the first measurement gives the indicated probabilities. Each branch leaves a definite state, so an immediate repeat gives the same result. start → zero: p=3/4; start → one: p=1/4; zero → end0: p=1; one → end1: p=1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Measurement and its conditional state</text><path d="M107.078 172.874L337.922 112.126" class="edge"/><text x="215" y="115" text-anchor="middle" class="" data-max-width="190" data-tex="p=3/4">p=3/4</text><path d="M106.958 187.567L338.042 252.433" class="edge"/><text x="215" y="245" text-anchor="middle" class="" data-max-width="190" data-tex="p=1/4">p=1/4</text><path d="M393 105L637 105" class="edge"/><text x="515" y="85" text-anchor="middle" class="" data-max-width="190" data-tex="p=1">p=1</text><path d="M393 260L637 260" class="edge"/><text x="515" y="240" text-anchor="middle" class="" data-max-width="190" data-tex="p=1">p=1</text><circle cx="80" cy="180" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="185" text-anchor="middle" class="" data-max-width="48" data-tex="\ket\psi">|ψ⟩</text><circle cx="365" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="365" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="\ket0">|0⟩</text><circle cx="365" cy="260" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="365" y="265" text-anchor="middle" class="" data-max-width="48" data-tex="\ket1">|1⟩</text><circle cx="665" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="665" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="\ket0">|0⟩</text><circle cx="665" cy="260" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="665" y="265" text-anchor="middle" class="" data-max-width="48" data-tex="\ket1">|1⟩</text><text x="215" y="55" text-anchor="middle" class="small" data-max-width="700">First measurement</text><text x="515" y="55" text-anchor="middle" class="small" data-max-width="700">Immediate repeat</text><text x="380" y="335" text-anchor="middle" class="small" data-max-width="700">Arrow labels are probabilities; nodes are conditional states.</text></svg>
