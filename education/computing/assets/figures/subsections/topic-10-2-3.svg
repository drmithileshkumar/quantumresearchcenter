<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">Different tasks offer different structure</title><desc id="desc">Factoring uses arithmetic structure; unstructured search assumes only oracle access to a predicate. A lower bound for the latter is not a lower bound for every structured problem. Columns: Task, Information available, Quantum approach. Factoring, Arithmetic on an integer, Use periodic structure; Unstructured search, Predicate on candidate labels, Amplitude amplification</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Different tasks offer different structure</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Task</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Information available</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Quantum approach</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">Factoring</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210">Arithmetic on an integer</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210">Use periodic structure</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="186" text-anchor="middle" class="" data-max-width="210">Unstructured search</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="175" text-anchor="middle" class="" data-max-width="210">Predicate on candidate</text><text x="380" y="197" text-anchor="middle" class="" data-max-width="210">labels</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="186" text-anchor="middle" class="" data-max-width="210">Amplitude amplification</text></svg>
