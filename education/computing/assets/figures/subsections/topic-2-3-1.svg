<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" role="img" aria-labelledby="title desc"><title id="title">Resetting an unknown bit</title><desc id="desc">Both possible logical inputs are reset to zero. For erasure of one equally likely bit in the standard isothermal setting, the minimum heat delivered to the environment is kBT ln 2. 0 → 0; 1 → 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Resetting an unknown bit</text><text x="380" y="56" text-anchor="middle" class="" data-max-width="350">reset</text><path d="M115.936 105.745L643.066 144.182" class="edge"/><path d="M115.936 186.255L643.066 147.818" class="edge"/><circle cx="92" cy="104" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="109" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="92" cy="188" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="193" text-anchor="middle" class="" data-max-width="38">1</text><circle cx="668" cy="146" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="668" y="151" text-anchor="middle" class="" data-max-width="38">0</text></svg>
