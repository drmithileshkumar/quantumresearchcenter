<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Prepare and mark four candidates</title><desc id="desc">Two H gates prepare the uniform state. Controlled-Z marks 11 by changing only its sign; it does not change immediate measurement probabilities. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Prepare and mark four candidates</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92">H</text><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle cx="720.0" cy="180" r="5" fill="#476b70"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Output amplitudes in order 00, 01, 10, 11: \((1,1,1,-1)/2\)">Output amplitudes in order 00, 01, 10, 11: (1,1,1,−1)/2</text></svg>
