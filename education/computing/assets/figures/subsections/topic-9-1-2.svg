<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-labelledby="title desc"><title id="title">Asymptotic order and finite costs</title><desc id="desc">The linear algorithm with a large constant eventually wins, but not for every input size. Big-O notation describes growth, not a complete timing prediction. Columns: Input n, Cost n², Cost 1000n, Smaller cost. 10, 100, 10,000, n²; 1000, 1,000,000, 1,000,000, Equal; 10,000, 100,000,000, 10,000,000, 1000n</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Asymptotic order and finite costs</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Input \(n\)">Input n</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Cost \(n^2\)">Cost n²</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Cost 1000n</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Smaller cost</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">10</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152">100</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152">10,000</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="n^2">n²</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">1000</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152">1,000,000</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152">1,000,000</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152">Equal</text><rect x="32" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="227" text-anchor="middle" class="" data-max-width="152">10,000</text><rect x="206" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="227" text-anchor="middle" class="" data-max-width="152">100,000,000</text><rect x="380" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="227" text-anchor="middle" class="" data-max-width="152">10,000,000</text><rect x="554" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="227" text-anchor="middle" class="" data-max-width="152">1000n</text></svg>
