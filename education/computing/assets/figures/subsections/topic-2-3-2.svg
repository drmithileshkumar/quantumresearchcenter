<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" role="img" aria-labelledby="title desc"><title id="title">Logical and physical questions are separate</title><desc id="desc">A reversible truth table settles whether the input is recoverable. It does not specify the energy dissipated by a particular physical device. Columns: Description, Question it answers, What else is needed. Logical map, Can we recover the input?, Full input/output states; Physical process, How much heat is released?, Dynamics and environment</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Logical and physical questions are separate</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Description</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Question it answers</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">What else is needed</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Logical map</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">Can we recover the</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">input?</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="138" text-anchor="middle" class="" data-max-width="210">Full input/output states</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210">Physical process</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="189" text-anchor="middle" class="" data-max-width="210">How much heat is</text><text x="380" y="211" text-anchor="middle" class="" data-max-width="210">released?</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="200" text-anchor="middle" class="" data-max-width="210">Dynamics and environment</text></svg>
