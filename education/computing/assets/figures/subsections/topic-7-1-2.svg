<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" role="img" aria-labelledby="title desc"><title id="title">One observed value leaves an ambiguity</title><desc id="desc">If a classical query returns f(0)=0, both a constant and a balanced truth table remain possible. A second value is needed for an exact classical answer. Query f(0) → Observed: 0 → Could be (0,0)
constant; Same observation → No information about f(1) → Could be (0,1)
balanced</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">One observed value leaves an ambiguity</text><rect x="32" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="94" text-anchor="middle" class="" data-max-width="191.333" data-math="Query \(f(0)\)">Query f(0)</text><path d="M245.333 89L273.333 89" class="edge"/><rect x="273.333" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="94" text-anchor="middle" class="" data-max-width="191.333">Observed: 0</text><path d="M486.667 89L514.667 89" class="edge"/><rect x="514.667" y="54" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="83" text-anchor="middle" class="" data-max-width="191.333" data-math="Could be \((0,0)\)">Could be (0,0)</text><text x="621.333" y="105" text-anchor="middle" class="" data-max-width="191.333">constant</text><rect x="32" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="188" text-anchor="middle" class="" data-max-width="191.333">Same observation</text><path d="M245.333 183L273.333 183" class="edge"/><rect x="273.333" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="177" text-anchor="middle" class="" data-max-width="191.333">No information about</text><text x="380" y="199" text-anchor="middle" class="" data-max-width="191.333" data-tex="f(1)">f(1)</text><path d="M486.667 183L514.667 183" class="edge"/><rect x="514.667" y="148" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="177" text-anchor="middle" class="" data-max-width="191.333" data-math="Could be \((0,1)\)">Could be (0,1)</text><text x="621.333" y="199" text-anchor="middle" class="" data-max-width="191.333">balanced</text></svg>
