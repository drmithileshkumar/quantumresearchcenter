<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Magnitude and phase of an amplitude</title><desc id="desc">The amplitude z=re^(iφ) is a vector of length r at angle φ in the complex plane. Its real and imaginary components are rcosφ and rsinφ; its squared magnitude is r². A vector from the origin, its phase angle, and its projections onto the real and imaginary axes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Magnitude and phase of an amplitude</text><path d="M125 280L650 280" class="edge" style="stroke:#6b7885"/><path d="M180 310L180 70" class="edge" style="stroke:#6b7885"/><path d="M430 280V110H180" fill="none" stroke="#a7bccd" stroke-dasharray="5 4"/><path d="M180 280L430 110" class="edge"/><path d="M235 280A55 55 0 0 0 225.5 249.1" fill="none" stroke="#a64d26" stroke-width="1.7"/><text x="180" y="58" text-anchor="middle" class="small" data-max-width="700">Imaginary</text><text x="685" y="285" text-anchor="middle" class="small" data-max-width="70">Real</text><text x="160" y="303" text-anchor="middle" class="" data-max-width="700" data-tex="0">0</text><text x="430" y="310" text-anchor="middle" class="" data-max-width="700" data-tex="r\cos\phi">rcosφ</text><text x="115" y="116" text-anchor="middle" class="" data-max-width="100" data-tex="r\sin\phi">rsinφ</text><text x="250" y="265" text-anchor="middle" class="" data-max-width="700" data-tex="\phi">φ</text><text x="285" y="174" text-anchor="middle" class="" data-max-width="700" data-tex="r">r</text><text x="520" y="102" text-anchor="middle" class="" data-max-width="200" data-tex="z=re^{i\phi}">z=re^(iφ)</text><text x="380" y="365" text-anchor="middle" class="small" data-max-width="700" data-tex="|z|^2=(r\cos\phi)^2+(r\sin\phi)^2=r^2">|z|²=(rcosφ)²+(rsinφ)²=r²</text></svg>
