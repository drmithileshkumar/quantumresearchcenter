<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 140" role="img" aria-labelledby="title desc"><title id="title">Compute, mark, then clear the record</title><desc id="desc">For a basis input x, compute f(x) into clean workspace, apply Z to that bit, and reverse the computation. The function-dependent sign remains while the workspace returns to zero. |x⟩|0⟩ → Compute
|x⟩|f(x)⟩ → Apply phase
(−1)^(f(x)) → Uncompute
(−1)^(f(x))|x⟩|0⟩</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Compute, mark, then clear the record</text><rect x="32" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="94" text-anchor="middle" class="" data-max-width="131" data-tex="\ket{x}\ket0">|x⟩|0⟩</text><path d="M185 89L213 89" class="edge"/><rect x="213" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="83" text-anchor="middle" class="" data-max-width="131">Compute</text><text x="289.5" y="105" text-anchor="middle" class="" data-max-width="131" data-tex="\ket{x}\ket{f(x)}">|x⟩|f(x)⟩</text><path d="M366 89L394 89" class="edge"/><rect x="394" y="54" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="83" text-anchor="middle" class="" data-max-width="131">Apply phase</text><text x="470.5" y="105" text-anchor="middle" class="" data-max-width="131" data-tex="(-1)^{f(x)}">(−1)^(f(x))</text><path d="M547 89L575 89" class="edge"/><rect x="575" y="54" width="153" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="83" text-anchor="middle" class="" data-max-width="131">Uncompute</text><text x="651.5" y="105" text-anchor="middle" class="" data-max-width="131" data-tex="(-1)^{f(x)}\ket{x}\ket0">(−1)^(f(x))|x⟩|0⟩</text></svg>
