<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="title desc"><title id="title">Local operations and remote readout</title><desc id="desc">H and CNOT prepare the shared Bell pair. Alice’s local gate UA cannot affect Bob’s outcome probabilities, even when Bob chooses a different readout gate V. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Local operations and remote readout</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">a</text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L720.0 180"/><path class="wire" d="M720.0 177L810 177"/><path class="wire" d="M720.0 183L810 183"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120">b</text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><path class="wire" d="M400.0 110L400.0 180"/><circle cx="400.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="400.0" cy="180" r="14"/><path class="wire" d="M386.0 180L414.0 180"/><path class="wire" d="M400.0 166L400.0 194"/><rect class="gate" x="510.0" y="90" width="100" height="40" rx="3"/><text x="560" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_A">U_A</text><rect class="gate" x="510.0" y="160" width="100" height="40" rx="3"/><text x="560" y="186" text-anchor="middle" class="" data-max-width="92">V</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880">Alice’s result is not sent to Bob.</text><text x="480" y="260" text-anchor="middle" class="small" data-max-width="880" data-tex="p(b=0)=p(b=1)=1/2">p(b=0)=p(b=1)=1/2</text></svg>
