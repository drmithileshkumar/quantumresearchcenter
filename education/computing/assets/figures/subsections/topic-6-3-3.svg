<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 154" role="img" aria-labelledby="title desc"><title id="title">Compute, mark, then clear the record</title><desc id="desc">For a basis input x, compute f(x) into clean workspace, apply Z to that bit, and reverse the computation. The function-dependent sign remains while the workspace returns to zero. x,0,0 → x,f(x),g(x) (weight 1); x,f(x),g(x) → x,f(x),g(x) (weight (−1)^(f(x))); x,f(x),g(x) → x,0,0 (weight 1).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Compute, mark, then clear the record</text><text x="188" y="56" text-anchor="middle" class="" data-max-width="175" data-tex="A">A</text><text x="380" y="56" text-anchor="middle" class="" data-max-width="175" data-tex="Z">Z</text><text x="572" y="56" text-anchor="middle" class="" data-max-width="175" data-tex="A^\dagger">A†</text><path d="M125 104L222.4 104" class="edge"/><text x="174.2" y="95" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M344.6 104L414.4 104" class="edge"/><text x="380" y="95" text-anchor="middle" class="small" data-max-width="120" data-tex="(-1)^{f(x)}">(−1)^(f(x))</text><path d="M536.6 104L634 104" class="edge"/><text x="585.8" y="95" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><rect x="61" y="84" width="62" height="40" rx="20" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="109" text-anchor="middle" class="" data-max-width="56" data-tex="x,0,0">x,0,0</text><rect x="225.4" y="84" width="117.2" height="40" rx="20" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="284" y="109" text-anchor="middle" class="" data-max-width="111.2" data-tex="x,f(x),g(x)">x,f(x),g(x)</text><rect x="417.4" y="84" width="117.2" height="40" rx="20" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="476" y="109" text-anchor="middle" class="" data-max-width="111.2" data-tex="x,f(x),g(x)">x,f(x),g(x)</text><rect x="637" y="84" width="62" height="40" rx="20" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="668" y="109" text-anchor="middle" class="" data-max-width="56" data-tex="x,0,0">x,0,0</text></svg>
