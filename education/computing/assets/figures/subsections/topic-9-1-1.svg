<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="title desc"><title id="title">Test a candidate label</title><desc id="desc">A computational-basis input and a blank target implement one predicate test. M reads whether x is marked; this is classical value-query behaviour represented with the reversible oracle. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Test a candidate label</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 110L810 110"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L720.0 180"/><path class="wire" d="M720.0 177L810 177"/><path class="wire" d="M720.0 183L810 183"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120">f(x)</text><rect class="gate" x="190.0" y="90" width="100" height="110" rx="3"/><text x="240" y="151" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92">M</text></svg>
