<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 438" role="img" aria-labelledby="title desc"><title id="title">Encoding is not cloning</title><desc id="desc">Two CNOTs encode one unknown qubit into a joint three-qubit state. This is the repetition-code encoding used for bit-flip protection; it is not a complete error-correction or fault-tolerance circuit. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Encoding is not cloning</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 250L810 250"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 110L240.0 180"/><circle cx="240.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="240.0" cy="180" r="14"/><path class="wire" d="M226.0 180L254.0 180"/><path class="wire" d="M240.0 166L240.0 194"/><path class="wire" d="M720.0 110L720.0 250"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="250" r="14"/><path class="wire" d="M706.0 250L734.0 250"/><path class="wire" d="M720.0 236L720.0 264"/><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket\psi=\alpha\ket0+\beta\ket1">|ψ⟩=α|0⟩+β|1⟩</text><text x="480" y="330" text-anchor="middle" class="small" data-max-width="880" data-math="Encoded state: \(\alpha\ket{000}+\beta\ket{111}\)">Encoded state: α|000⟩+β|111⟩</text></svg>
