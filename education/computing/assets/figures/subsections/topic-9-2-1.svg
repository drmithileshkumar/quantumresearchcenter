<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" role="img" aria-labelledby="title desc"><title id="title">Group outcomes of the search circuit</title><desc id="desc">The bundled wire carries the n-qubit search register. Good and bad components group its basis labels; they are not separate physical qubits. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Group outcomes of the search circuit</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">x</text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="H^{\otimes n}">H^(⊗ n)</text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="(DO_f)^{k}">(DO_f)ᵏ</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{\psi_k}=a_k\ket G+b_k\ket B">|ψₖ⟩=aₖ|G⟩+bₖ|B⟩</text><text x="480" y="190" text-anchor="middle" class="small" data-max-width="880" data-tex="p(\text{marked})=|a_k|^2">p(marked)=|aₖ|²</text></svg>
