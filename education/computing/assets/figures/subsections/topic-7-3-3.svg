<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">Measure a candidate, then verify it</title><desc id="desc">A failed verification rejects that candidate, not every possible candidate. With an unknown marked fraction, the schedule must choose how long to search before measuring again. Choose iteration count
then amplify and measure; Check the candidate
f(x) = 1?; Yes: return x; No: revise schedule
and try again</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Measure a candidate, then verify it</text><rect x="35" y="75" width="230" height="80" rx="5" fill="#fff" stroke="#a7bccd"/><text x="150" y="109" text-anchor="middle" class="" data-max-width="208">Choose iteration count</text><text x="150" y="131" text-anchor="middle" class="" data-max-width="208">then amplify and measure</text><path d="M265 115L325 115" class="edge"/><rect x="325" y="75" width="190" height="80" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="420" y="109" text-anchor="middle" class="" data-max-width="168">Check the candidate</text><text x="420" y="131" text-anchor="middle" class="" data-max-width="168" data-math="\(f(x) = 1\)?">f(x) = 1?</text><path d="M515 100L565 100" class="edge"/><rect x="565" y="65" width="160" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="645" y="105" text-anchor="middle" class="" data-max-width="138" data-math="Yes: return \(x\)">Yes: return x</text><path d="M420 155L420 215" class="edge"/><rect x="310" y="215" width="250" height="80" rx="5" fill="#fff" stroke="#a7bccd"/><text x="435" y="249" text-anchor="middle" class="" data-max-width="228">No: revise schedule</text><text x="435" y="271" text-anchor="middle" class="" data-max-width="228">and try again</text><path d="M310 255H150V155" class="edge"/></svg>
