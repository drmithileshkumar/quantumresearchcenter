<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Compute, phase, uncompute</title><desc id="desc">A computes the answer and workspace. Z changes the answer-one sign. The inverse A restores the answer and workspace to zero, leaving the input phase. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Compute, phase, uncompute</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 250L810 250"/><path class="wire" d="M189 257L199 243"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="180" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92">A</text><rect class="gate" x="430.0" y="160" width="100" height="40" rx="3"/><text x="480" y="186" text-anchor="middle" class="" data-max-width="92">Z</text><rect class="gate" x="670.0" y="90" width="100" height="180" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="A^\dagger">A†</text><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{x,0,0}\longmapsto(-1)^{f(x)}\ket{x,0,0}">|x,0,0⟩longmapsto(−1)^(f(x))|x,0,0⟩</text></svg>
