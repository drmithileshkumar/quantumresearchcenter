<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Interfere the input branches</title><desc id="desc">After U_f, H on each input combines contributions from all four inputs. A constant f returns the readout 00 with certainty; for AND the target’s record keeps the branches apart, and 00 has probability 5/8. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Interfere the input branches</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120" data-tex="z_1">z₁</text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L720.0 180"/><path class="wire" d="M720.0 177L810 177"/><path class="wire" d="M720.0 183L810 183"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120" data-tex="z_2">z₂</text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 250L810 250"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="350.0" y="90" width="100" height="180" rx="3"/><text x="400" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="510.0" y="90" width="100" height="40" rx="3"/><text x="560" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="510.0" y="160" width="100" height="40" rx="3"/><text x="560" y="186" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880" data-math="Constant \(f\): readout 00 with certainty">Constant f: readout 00 with certainty</text></svg>
