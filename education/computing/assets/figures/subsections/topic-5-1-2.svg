<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Gates compose in time order</title><desc id="desc">The same wire passes through U1 and then U2. The output is U2 U1 applied to the input. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Gates compose in time order</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{\psi_{\rm in}}">|ψ_(rm in)⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_1">U₁</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_2">U₂</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{\psi_{\rm out}}=U_2U_1\ket{\psi_{\rm in}}">|ψ_(rm out)⟩=U₂U₁|ψ_(rm in)⟩</text></svg>
