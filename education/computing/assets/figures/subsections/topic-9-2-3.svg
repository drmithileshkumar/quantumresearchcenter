<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">One pair of reflections</title><desc id="desc">On a bundled register the oracle acts first and D second. Their product rotates the two-component state by 2 theta; D is the reflection about the prepared uniform state. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">One pair of reflections</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket s">|s⟩</text><path class="wire" d="M170 110L810 110"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="O_f">O_f</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">D</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="\sin\theta\ket G+\cos\theta\ket B\longmapsto\sin(3\theta)\ket G+\cos(3\theta)\ket B">sinθ|G⟩+cosθ|B⟩longmapstosin(3θ)|G⟩+cos(3θ)|B⟩</text></svg>
