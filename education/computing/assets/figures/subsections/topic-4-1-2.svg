<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" role="img" aria-labelledby="title desc"><title id="title">Paths from an initial state to a final state</title><desc id="desc">The arrow into configuration j carries ⟨j|ψ⟩, and the arrow from j into the final state carries ⟨φ|j⟩. Each path multiplies the two and the paths add, giving ⟨φ|ψ⟩. For the final state |0⟩, only the path through 0 contributes, because ⟨0|0⟩=1 and ⟨0|1⟩=0. |ψ⟩ → 0 (weight ⟨0|ψ⟩); |ψ⟩ → 1 (weight ⟨1|ψ⟩); 0 → |φ⟩ (weight ⟨φ|0⟩); 1 → |φ⟩ (weight ⟨φ|1⟩). |ψ⟩ → 0 (weight ⟨0|ψ⟩); |ψ⟩ → 1 (weight ⟨1|ψ⟩); 0 → |0⟩ (weight ⟨0|0⟩=1); 1 → |0⟩ (weight ⟨0|1⟩=0).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Paths from an initial state to a final state</text><text x="66" y="56" text-anchor="middle" class="small" data-max-width="116.667">initial</text><text x="205" y="56" text-anchor="middle" class="small" data-max-width="116.667">configuration</text><text x="344" y="56" text-anchor="middle" class="small" data-max-width="116.667">final</text><path d="M88.6204 139.165L181.069 111.231" class="edge"/><text x="129.734" y="110.916" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket0\psi">⟨0|ψ⟩</text><path d="M88.6204 152.835L181.069 180.769" class="edge"/><text x="129.734" y="191.084" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket1\psi">⟨1|ψ⟩</text><path d="M227.974 110.942L320.422 138.876" class="edge"/><text x="280.266" y="110.916" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket\phi0">⟨φ|0⟩</text><path d="M227.974 181.058L320.422 153.124" class="edge"/><text x="280.266" y="191.084" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket\phi1">⟨φ|1⟩</text><rect x="44.2" y="126" width="43.6" height="40" rx="20" fill="none" stroke="#246593" stroke-width="1.7"/><text x="66" y="151" text-anchor="middle" class="" data-max-width="37.6" data-tex="\ket\psi">|ψ⟩</text><circle cx="205" cy="104" r="22" fill="none" stroke="#246593" stroke-width="1.7"/><text x="205" y="109" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="205" cy="188" r="22" fill="none" stroke="#246593" stroke-width="1.7"/><text x="205" y="193" text-anchor="middle" class="" data-max-width="38">1</text><rect x="322.2" y="126" width="43.6" height="40" rx="20" fill="none" stroke="#246593" stroke-width="1.7"/><text x="344" y="151" text-anchor="middle" class="" data-max-width="37.6" data-tex="\ket\phi">|φ⟩</text><text x="416" y="56" text-anchor="middle" class="small" data-max-width="116.667">initial</text><text x="555" y="56" text-anchor="middle" class="small" data-max-width="116.667">configuration</text><text x="694" y="56" text-anchor="middle" class="small" data-max-width="116.667">final</text><path d="M438.62 139.165L531.069 111.231" class="edge"/><text x="479.734" y="110.916" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket0\psi">⟨0|ψ⟩</text><path d="M438.62 152.835L531.069 180.769" class="edge"/><text x="479.734" y="191.084" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket1\psi">⟨1|ψ⟩</text><path d="M577.974 110.942L670.422 138.876" class="edge"/><text x="630.869" y="108.923" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket00=1">⟨0|0⟩=1</text><path d="M577.974 181.058L670.422 153.124" class="edge"/><text x="630.869" y="193.077" text-anchor="middle" class="small" data-max-width="120" data-tex="\braket01=0">⟨0|1⟩=0</text><rect x="394.2" y="126" width="43.6" height="40" rx="20" fill="none" stroke="#246593" stroke-width="1.7"/><text x="416" y="151" text-anchor="middle" class="" data-max-width="37.6" data-tex="\ket\psi">|ψ⟩</text><circle cx="555" cy="104" r="22" fill="none" stroke="#246593" stroke-width="1.7"/><text x="555" y="109" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="555" cy="188" r="22" fill="none" stroke="#246593" stroke-width="1.7"/><text x="555" y="193" text-anchor="middle" class="" data-max-width="38">1</text><rect x="672.2" y="126" width="43.6" height="40" rx="20" fill="none" stroke="#246593" stroke-width="1.7"/><text x="694" y="151" text-anchor="middle" class="" data-max-width="37.6" data-tex="\ket0">|0⟩</text></svg>
