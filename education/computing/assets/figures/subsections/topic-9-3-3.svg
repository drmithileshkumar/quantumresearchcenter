<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">Verify a measured candidate</title><desc id="desc">After a search run returns candidate x, a separate basis-input query checks it. A failed check calls for another run with the prescribed iteration schedule and budget. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Verify a measured candidate</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">x</text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="H^{\otimes n}">H^(⊗ n)</text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="(DO_f)^{k}">(DO_f)ᵏ</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="259" text-anchor="middle" class="small" data-max-width="700">Verification run</text><text x="150" y="305" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 300L810 300"/><path class="wire" d="M189 307L199 293"/><text x="830" y="305" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="375" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 370L720.0 370"/><path class="wire" d="M720.0 367L810 367"/><path class="wire" d="M720.0 373L810 373"/><text x="830" y="375" text-anchor="start" class="" data-max-width="120">f(x)</text><rect class="gate" x="190.0" y="280" width="100" height="110" rx="3"/><text x="240" y="341" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="670.0" y="350" width="100" height="40" rx="3"/><text x="720" y="376" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="422" text-anchor="middle" class="small" data-max-width="880">Accept only when the measured predicate bit is 1.</text></svg>
