<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" role="img" aria-labelledby="title desc"><title id="title">The intermediate state retains the starting value</title><desc id="desc">For either basis input i, two unmeasured Hadamard steps return i. Measuring the intermediate state instead gives zero or one with equal probability. Those probabilities alone cannot distinguish the two starting preparations. start → middle: H; middle → end: H; middle → zero: p=1/2; middle → one: p=1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The intermediate state retains the starting value</text><path d="M123 125L352 125" class="edge"/><text x="235" y="109" text-anchor="middle" class="" data-max-width="190" data-tex="H">H</text><path d="M408 125L637 125" class="edge"/><text x="525" y="109" text-anchor="middle" class="" data-max-width="190" data-tex="H">H</text><path d="M361.165 145.718L248.835 269.282" class="edge"/><text x="220" y="211" text-anchor="middle" class="" data-max-width="190" data-tex="p=1/2">p=1/2</text><path d="M398.835 145.718L511.165 269.282" class="edge"/><text x="540" y="211" text-anchor="middle" class="" data-max-width="190" data-tex="p=1/2">p=1/2</text><circle cx="95" cy="125" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="95" y="130" text-anchor="middle" class="" data-max-width="48" data-tex="\ket i">|i⟩</text><circle cx="380" cy="125" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="130" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{\psi_i}">|ψᵢ⟩</text><circle cx="665" cy="125" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="665" y="130" text-anchor="middle" class="" data-max-width="48" data-tex="\ket i">|i⟩</text><circle cx="230" cy="290" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="230" y="295" text-anchor="middle" class="" data-max-width="48" data-tex="0">0</text><circle cx="530" cy="290" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="530" y="295" text-anchor="middle" class="" data-max-width="48" data-tex="1">1</text><text x="380" y="65" text-anchor="middle" class="small" data-max-width="700" data-tex="i\in\{0,1\},\qquad\ket{\psi_i}=H\ket i">i∈{0,1}, |ψᵢ⟩=H|i⟩</text><text x="380" y="246" text-anchor="middle" class="small" data-max-width="700">Measure instead</text><text x="380" y="365" text-anchor="middle" class="small" data-max-width="700">Equal measurement probabilities do not imply identical states.</text></svg>
