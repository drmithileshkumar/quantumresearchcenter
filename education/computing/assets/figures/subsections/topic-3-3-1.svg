<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">One step looks random; two steps do not</title><desc id="desc">COIN matches a single application and an interrupted pair, but not two unobserved applications. The unobserved qubit keeps information that the probabilities do not. Columns: Experiment, COIN, Observed qubit. Apply once, then measure, 0 or 1, each 1/2, 0 or 1, each 1/2; Apply twice from 0, 0 or 1, each 1/2, 0 every time; Apply twice, measuring between, 0 or 1, each 1/2, 0 or 1, each 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">One step looks random; two steps do not</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Experiment</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">COIN</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Observed qubit</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">Apply once, then measure</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210">0 or 1, each 1/2</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210">0 or 1, each 1/2</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210">Apply twice from 0</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210">0 or 1, each 1/2</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210">0 every time</text><rect x="32" y="198" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="223" text-anchor="middle" class="" data-max-width="210">Apply twice, measuring</text><text x="148" y="245" text-anchor="middle" class="" data-max-width="210">between</text><rect x="264" y="198" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="234" text-anchor="middle" class="" data-max-width="210">0 or 1, each 1/2</text><rect x="496" y="198" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="234" text-anchor="middle" class="" data-max-width="210">0 or 1, each 1/2</text></svg>
