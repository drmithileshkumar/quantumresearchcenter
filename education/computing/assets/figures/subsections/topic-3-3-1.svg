<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="title desc"><title id="title">Signs multiply along a path</title><desc id="desc">Each row is a path through configurations i, j, and k, with transition weights on the arrows. One negative arrow gives path weight −1/4; two negative arrows give path weight +1/4. The rows are separate examples. i1 → j1: 1/2; j1 → k1: −1/2; i2 → j2: −1/2; j2 → k2: −1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Signs multiply along a path</text><path d="M108 110L352 110" class="edge"/><text x="230" y="90" text-anchor="middle" class="" data-max-width="190" data-tex="1/2">1/2</text><path d="M408 110L652 110" class="edge"/><text x="530" y="90" text-anchor="middle" class="" data-max-width="190" data-tex="-1/2">−1/2</text><path d="M108 275L352 275" class="edge"/><text x="230" y="255" text-anchor="middle" class="" data-max-width="190" data-tex="-1/2">−1/2</text><path d="M408 275L652 275" class="edge"/><text x="530" y="255" text-anchor="middle" class="" data-max-width="190" data-tex="-1/2">−1/2</text><circle cx="80" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="i">i</text><circle cx="380" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="j">j</text><circle cx="680" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="k">k</text><circle cx="80" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="i">i</text><circle cx="380" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="j">j</text><circle cx="680" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="k">k</text><text x="380" y="175" text-anchor="middle" class="small" data-max-width="700" data-tex="W(i\to j\to k)=(1/2)(-1/2)=-1/4">W(i→ j→ k)=(1/2)(−1/2)=−1/4</text><text x="380" y="340" text-anchor="middle" class="small" data-max-width="700" data-tex="W(i\to j\to k)=(-1/2)(-1/2)=+1/4">W(i→ j→ k)=(−1/2)(−1/2)=+1/4</text></svg>
