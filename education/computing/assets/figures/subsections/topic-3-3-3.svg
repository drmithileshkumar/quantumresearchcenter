<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" role="img" aria-labelledby="title desc"><title id="title">A record keeps the paths apart</title><desc id="desc">Copying the intermediate configuration into a record separates the paths, so their amplitudes no longer meet. Uncomputing the record restores the interference. |00⟩ → H: (|00⟩+|10⟩)/√2 → CNOT: (|00⟩+|11⟩)/√2 → H: qubit shows 1 with probability 1/2; |00⟩ → H, CNOT, CNOT: (|00⟩+|10⟩)/√2 → H: |00⟩ → Qubit shows 0 with certainty</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A record keeps the paths apart</text><rect x="32" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="104" text-anchor="middle" class="" data-max-width="131" data-tex="\ket{00}">|00⟩</text><path d="M185 99L213 99" class="edge"/><rect x="213" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="93" text-anchor="middle" class="" data-max-width="131" data-math="\(H\):">H:</text><text x="289.5" y="115" text-anchor="middle" class="" data-max-width="131" data-tex="(\ket{00}+\ket{10})/\sqrt2">(|00⟩+|10⟩)/√2</text><path d="M366 99L394 99" class="edge"/><rect x="394" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="93" text-anchor="middle" class="" data-max-width="131">CNOT:</text><text x="470.5" y="115" text-anchor="middle" class="" data-max-width="131" data-tex="(\ket{00}+\ket{11})/\sqrt2">(|00⟩+|11⟩)/√2</text><path d="M547 99L575 99" class="edge"/><rect x="575" y="54" width="153" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="82" text-anchor="middle" class="" data-max-width="131" data-math="\(H\): qubit shows">H: qubit shows</text><text x="651.5" y="104" text-anchor="middle" class="" data-max-width="131" data-math="\(1\) with">1 with</text><text x="651.5" y="126" text-anchor="middle" class="" data-max-width="131" data-math="probability \(1/2\)">probability 1/2</text><rect x="32" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="208" text-anchor="middle" class="" data-max-width="131" data-tex="\ket{00}">|00⟩</text><path d="M185 203L213 203" class="edge"/><rect x="213" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="197" text-anchor="middle" class="" data-max-width="131" data-math="\(H\), CNOT, CNOT:">H, CNOT, CNOT:</text><text x="289.5" y="219" text-anchor="middle" class="" data-max-width="131" data-tex="(\ket{00}+\ket{10})/\sqrt2">(|00⟩+|10⟩)/√2</text><path d="M366 203L394 203" class="edge"/><rect x="394" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="208" text-anchor="middle" class="" data-max-width="131" data-math="\(H\): \(\ket{00}\)">H: |00⟩</text><path d="M547 203L575 203" class="edge"/><rect x="575" y="168" width="153" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="197" text-anchor="middle" class="" data-max-width="131" data-math="Qubit shows \(0\)">Qubit shows 0</text><text x="651.5" y="219" text-anchor="middle" class="" data-max-width="131">with certainty</text></svg>
