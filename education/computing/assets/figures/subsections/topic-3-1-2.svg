<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">The coin step gives the same distribution from either input</title><desc id="desc">Each column of the coin table F is the distribution (1/2,1/2)ᵀ. Because the columns are equal, the output reveals nothing about the input. From 0: next 0: 0.5; From 0: next 1: 0.5; From 1: next 0: 0.5; From 1: next 1: 0.5</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The coin step gives the same distribution from either input</text><path d="M85 266H715" class="grid"/><text x="68" y="271" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M85 221H715" class="grid"/><text x="68" y="226" text-anchor="middle" class="small" data-max-width="700">0.25</text><path d="M85 176H715" class="grid"/><text x="68" y="181" text-anchor="middle" class="small" data-max-width="700">0.5</text><path d="M85 131H715" class="grid"/><text x="68" y="136" text-anchor="middle" class="small" data-max-width="700">0.75</text><path d="M85 86H715" class="grid"/><text x="68" y="91" text-anchor="middle" class="small" data-max-width="700">1</text><text x="88" y="60" text-anchor="start" class="small" data-max-width="700">Probability</text><rect x="143" y="176" width="74" height="90" fill="#246593"/><text x="180" y="164" text-anchor="middle" class="small" data-max-width="700">0.5</text><text x="180" y="298" text-anchor="middle" class="small" data-max-width="140">From 0: next 0</text><rect x="293" y="176" width="74" height="90" fill="#246593"/><text x="330" y="164" text-anchor="middle" class="small" data-max-width="700">0.5</text><text x="330" y="298" text-anchor="middle" class="small" data-max-width="140">From 0: next 1</text><rect x="443" y="176" width="74" height="90" fill="#246593"/><text x="480" y="164" text-anchor="middle" class="small" data-max-width="700">0.5</text><text x="480" y="298" text-anchor="middle" class="small" data-max-width="140">From 1: next 0</text><rect x="593" y="176" width="74" height="90" fill="#246593"/><text x="630" y="164" text-anchor="middle" class="small" data-max-width="700">0.5</text><text x="630" y="298" text-anchor="middle" class="small" data-max-width="140">From 1: next 1</text></svg>
