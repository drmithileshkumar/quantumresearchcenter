<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc"><title id="title">Multiply along a classical route</title><desc id="desc">First choose the left branch with probability 1/2. Conditional on that branch, success has probability 1/3. The probability of this complete route is 1/6. Start → Left branch
probability 1/2 → Success given left
probability 1/3 → Route probability
1/2 × 1/3 = 1/6</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Multiply along a classical route</text><rect x="32" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="104" text-anchor="middle" class="" data-max-width="131">Start</text><path d="M185 99L213 99" class="edge"/><rect x="213" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="93" text-anchor="middle" class="" data-max-width="131">Left branch</text><text x="289.5" y="115" text-anchor="middle" class="" data-max-width="131" data-math="probability \(1/2\)">probability 1/2</text><path d="M366 99L394 99" class="edge"/><rect x="394" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="82" text-anchor="middle" class="" data-max-width="131">Success given</text><text x="470.5" y="104" text-anchor="middle" class="" data-max-width="131">left</text><text x="470.5" y="126" text-anchor="middle" class="" data-max-width="131" data-math="probability \(1/3\)">probability 1/3</text><path d="M547 99L575 99" class="edge"/><rect x="575" y="54" width="153" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="82" text-anchor="middle" class="" data-max-width="131">Route</text><text x="651.5" y="104" text-anchor="middle" class="" data-max-width="131">probability</text><text x="651.5" y="126" text-anchor="middle" class="" data-max-width="131" data-tex="1/2 \times 1/3 = 1/6">1/2 × 1/3 = 1/6</text></svg>
