<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Route an interaction through a neighbour</title><desc id="desc">For a linear three-qubit layout, SWAP brings the third logical qubit next to the first. CNOT acts there, and the second SWAP restores the original ordering. Each SWAP itself requires implementation. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Route an interaction through a neighbour</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket a">|a⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket b">|b⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="255" text-anchor="end" class="" data-max-width="145" data-tex="\ket c">|c⟩</text><path class="wire" d="M170 250L810 250"/><text x="830" y="255" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 180L240.0 250"/><path class="wire" d="M232.0 172L248.0 188"/><path class="wire" d="M232.0 188L248.0 172"/><path class="wire" d="M232.0 242L248.0 258"/><path class="wire" d="M232.0 258L248.0 242"/><path class="wire" d="M480.0 110L480.0 180"/><circle cx="480.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="480.0" cy="180" r="14"/><path class="wire" d="M466.0 180L494.0 180"/><path class="wire" d="M480.0 166L480.0 194"/><path class="wire" d="M720.0 180L720.0 250"/><path class="wire" d="M712.0 172L728.0 188"/><path class="wire" d="M712.0 188L728.0 172"/><path class="wire" d="M712.0 242L728.0 258"/><path class="wire" d="M712.0 258L728.0 242"/><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880" data-math="Output on basis inputs: \(\ket{a,b,c\oplus a}\)">Output on basis inputs: |a,b,c⊕ a⟩</text></svg>
