<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1204" role="img" aria-labelledby="title desc"><title id="title">Four possible one-bit oracles</title><desc id="desc">The four reversible circuits encode the four Boolean functions. They retain x and update y by XOR with f(x). This anticipates the reversible query definition in 7.1.3. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Four possible one-bit oracles</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">Constant: f(x) = 0</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket y">|y⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="160" width="100" height="40" rx="3"/><text x="480" y="186" text-anchor="middle" class="" data-max-width="92">I</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{x,y}\mapsto\ket{x,y\oplus f(x)}">|x,y⟩↦|x,y⊕ f(x)⟩</text><text x="480" y="357" text-anchor="middle" class="small" data-max-width="700">Constant: f(x) = 1</text><text x="150" y="403" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 398L810 398"/><text x="830" y="403" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="473" text-anchor="end" class="" data-max-width="145" data-tex="\ket y">|y⟩</text><path class="wire" d="M170 468L810 468"/><text x="830" y="473" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="448" width="100" height="40" rx="3"/><text x="480" y="474" text-anchor="middle" class="" data-max-width="92">X</text><text x="480" y="520" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{x,y}\mapsto\ket{x,y\oplus f(x)}">|x,y⟩↦|x,y⊕ f(x)⟩</text><text x="480" y="645" text-anchor="middle" class="small" data-max-width="700">Balanced: f(x) = x</text><text x="150" y="691" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 686L810 686"/><text x="830" y="691" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="761" text-anchor="end" class="" data-max-width="145" data-tex="\ket y">|y⟩</text><path class="wire" d="M170 756L810 756"/><text x="830" y="761" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M480 686L480 756"/><circle cx="480" cy="686" r="5" fill="#476b70"/><circle class="gate" cx="480" cy="756" r="14"/><path class="wire" d="M466 756L494 756"/><path class="wire" d="M480 742L480 770"/><text x="480" y="808" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{x,y}\mapsto\ket{x,y\oplus f(x)}">|x,y⟩↦|x,y⊕ f(x)⟩</text><text x="480" y="933" text-anchor="middle" class="small" data-max-width="700">Balanced: f(x) = 1 XOR x</text><text x="150" y="979" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 974L810 974"/><text x="830" y="979" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="1049" text-anchor="end" class="" data-max-width="145" data-tex="\ket y">|y⟩</text><path class="wire" d="M170 1044L810 1044"/><text x="830" y="1049" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M240.0 974L240.0 1044"/><circle cx="240.0" cy="974" r="5" fill="#476b70"/><circle class="gate" cx="240.0" cy="1044" r="14"/><path class="wire" d="M226.0 1044L254.0 104