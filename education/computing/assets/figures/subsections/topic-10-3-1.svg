<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">The circuit family covered by a query bound</title><desc id="desc">A query algorithm alternates oracle calls with operations independent of the hidden input. The two-query drawing is one instance of this general form; a lower bound must cover every allowed sequence. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">The circuit family covered by a query bound</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="204.16666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_0">U₀</text><rect class="gate" x="300.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="336" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="O_z">O_z</text><rect class="gate" x="396.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="432" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_1">U₁</text><rect class="gate" x="492.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="528" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="O_z">O_z</text><rect class="gate" x="588.1666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="624" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_2">U₂</text><rect class="gate" x="684.1666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667">M</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880">The hidden input enters only through the oracle gates.</text></svg>
