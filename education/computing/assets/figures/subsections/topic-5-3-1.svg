<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 924" role="img" aria-labelledby="title desc"><title id="title">The Pauli gates on one wire</title><desc id="desc">These are four separate circuits on the same arbitrary input. The displayed output vectors include their phase factors. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">The Pauli gates on one wire</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">I</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92">I</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="a\ket0+b\ket1">a|0⟩+b|1⟩</text><text x="480" y="287" text-anchor="middle" class="small" data-max-width="700">X</text><text x="150" y="333" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 328L810 328"/><text x="830" y="333" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="308" width="100" height="40" rx="3"/><text x="480" y="334" text-anchor="middle" class="" data-max-width="92">X</text><text x="480" y="380" text-anchor="middle" class="small" data-max-width="880" data-tex="b\ket0+a\ket1">b|0⟩+a|1⟩</text><text x="480" y="505" text-anchor="middle" class="small" data-max-width="700">Y</text><text x="150" y="551" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 546L810 546"/><text x="830" y="551" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="526" width="100" height="40" rx="3"/><text x="480" y="552" text-anchor="middle" class="" data-max-width="92">Y</text><text x="480" y="598" text-anchor="middle" class="small" data-max-width="880" data-tex="-ib\ket0+ia\ket1">−ib|0⟩+ia|1⟩</text><text x="480" y="723" text-anchor="middle" class="small" data-max-width="700">Z</text><text x="150" y="769" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 764L810 764"/><text x="830" y="769" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="744" width="100" height="40" rx="3"/><text x="480" y="770" text-anchor="middle" class="" data-max-width="92">Z</text><text x="480" y="816" text-anchor="middle" class="small" data-max-width="880" data-tex="a\ket0-b\ket1">a|0⟩−b|1⟩</text></svg>
