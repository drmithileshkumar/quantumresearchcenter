<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Relative phase changes how paths combine</title><desc id="desc">Prepare equal-magnitude amplitudes with relative phase φ, then apply H. Only the routes to final outcome zero are shown. The phase changes their sum, even though it leaves the intermediate computational-basis probabilities unchanged. start → zero: 1/√2; start → one: e^(iφ)/√2; zero → end: 1/√2; one → end: 1/√2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Relative phase changes how paths combine</text><path d="M106.94 182.367L353.06 112.633" class="edge"/><text x="220" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><path d="M106.94 197.633L353.06 267.367" class="edge"/><text x="220" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="e^{i\phi}/\sqrt2">e^(iφ)/√2</text><path d="M406.94 112.633L653.06 182.367" class="edge"/><text x="540" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><path d="M406.94 267.367L653.06 197.633" class="edge"/><text x="540" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><circle cx="80" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="\ket0">|0⟩</text><circle cx="380" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="0">0</text><circle cx="380" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="1">1</text><circle cx="680" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="0">0</text><text x="220" y="61" text-anchor="middle" class="small" data-max-width="700">Preparation</text><text x="540" y="61" text-anchor="middle" class="small" data-max-width="700" data-tex="H">H</text><text x="380" y="348" text-anchor="middle" class="small" data-max-width="700" data-tex="p(0)=\left|(1+e^{i\phi})/2\right|^2=(1+\cos\phi)/2">p(0)=|(1+e^(iφ))/2|²=(1+cosφ)/2</text></svg>
