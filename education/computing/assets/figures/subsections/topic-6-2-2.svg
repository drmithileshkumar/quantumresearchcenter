<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">The Bell coefficients cannot be a product</title><desc id="desc">A product (a|0⟩+b|1⟩)(c|0⟩+d|1⟩) would require ac and bd nonzero. Then all four factors are nonzero, contradicting ad=bc=0. Columns: Joint label, Product coefficient, Required Bell coefficient. 00, ac, 1/√2; 01, ad, 0; 10, bc, 0; 11, bd, 1/√2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The Bell coefficients cannot be a product</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Joint label</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Product coefficient</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Required Bell</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">coefficient</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210">00</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210">ac</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="1/\sqrt{2}">1/√2</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210">01</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210">ad</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210">0</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210">10</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210">bc</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210">0</text><rect x="32" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="289" text-anchor="middle" class="" data-max-width="210">11</text><rect x="264" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="289" text-anchor="middle" class="" data-max-width="210">bd</text><rect x="496" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="289" text-anchor="middle" class="" data-max-width="210" data-tex="1/\sqrt{2}">1/√2</text></svg>
