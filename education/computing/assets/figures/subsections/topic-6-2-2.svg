<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">A gate that prevents factorization</title><desc id="desc">Before CNOT the two wires have a product state. After it, the coefficients of 00 and 11 are nonzero while those of 01 and 10 vanish; no product of two local vectors has these coefficients. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">A gate that prevents factorization</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><path class="wire" d="M720.0 110L720.0 180"/><circle cx="720.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="180" r="14"/><path class="wire" d="M706.0 180L734.0 180"/><path class="wire" d="M720.0 166L720.0 194"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{00}\longmapsto\ket+\ket0\longmapsto(\ket{00}+\ket{11})/\sqrt2">|00⟩longmapsto|+⟩|0⟩longmapsto(|00⟩+|11⟩)/√2</text></svg>
