<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Amplification uses the prepared success weight</title><desc id="desc">A nonuniform preparation can still be resolved into normalized good and bad components. This example has p=1/4, so its amplitudes are 1/2 and √3/2 regardless of how many underlying labels contribute. √(1−p)|B⟩ + √p|G⟩: 30 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Amplification uses the prepared success weight</text><circle cx="225" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M70 230L390 230" class="edge" style="stroke:#6b7885"/><path d="M225 380L225 75" class="edge" style="stroke:#6b7885"/><text x="225" y="409" text-anchor="middle" class="small" data-max-width="350">Bad component</text><text x="225" y="60" text-anchor="middle" class="small" data-max-width="350">Good component</text><path d="M225 230L324.593 172.5" class="edge" style="stroke:#246593"/><circle cx="324.593" cy="172.5" r="4" fill="#246593"/><path d="M425 115H455" stroke="#246593" stroke-width="3"/><text x="600" y="120" text-anchor="middle" class="small" data-max-width="260" data-tex="\sqrt{1-p}\ket{B} + \sqrt{p}\ket{G}">√(1−p)|B⟩ + √p|G⟩</text></svg>
