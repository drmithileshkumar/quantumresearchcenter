<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" role="img" aria-labelledby="title desc"><title id="title">Read the relative sign</title><desc id="desc">The final H makes equal and opposite oracle signs distinguishable. M reads the parity of the two function values, not their individual values. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Read the relative sign</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{\phi_f}">|φ_f⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-math="Input: \((s_0\ket0+s_1\ket1)/\sqrt2\)">Input: (s₀|0⟩+s₁|1⟩)/√2</text><text x="480" y="190" text-anchor="middle" class="small" data-max-width="880" data-tex="s_x=(-1)^{f(x)};\quad y=f(0)\oplus f(1)">s_x=(−1)^(f(x));  y=f(0)⊕ f(1)</text></svg>
