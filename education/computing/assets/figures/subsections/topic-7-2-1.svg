<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Evaluate on a superposition</title><desc id="desc">H prepares both input alternatives coherently. The oracle acts on their joint superposition; it has not supplied two classical answers. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Evaluate on a superposition</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="90" width="100" height="110" rx="3"/><text x="720" y="151" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Before readout: \((\ket{0,f(0)}+\ket{1,f(1)})/\sqrt2\)">Before readout: (|0,f(0)⟩+|1,f(1)⟩)/√2</text></svg>
