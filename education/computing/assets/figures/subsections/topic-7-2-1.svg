<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 238" role="img" aria-labelledby="title desc"><title id="title">Gates act differently on different inputs</title><desc id="desc">X exchanges basis labels; Z changes one sign; H changes basis. Their action on arbitrary superpositions follows by linearity. 0 → 1 (weight 1); 1 → 0 (weight 1). 0 → 0 (weight 1); 1 → 1 (weight −1). 0 → 0 (weight 1/√2); 0 → 1 (weight 1/√2); 1 → 0 (weight 1/√2); 1 → 1 (weight −1/√2).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Gates act differently on different inputs</text><text x="146.667" y="56" text-anchor="middle" class="" data-max-width="116.667" data-tex="X">X</text><path d="M87.2874 115.084L205.159 176.455" class="edge"/><rect x="106.8" y="119.2" width="15.2" height="20" rx="3" fill="#fff"/><text x="114.4" y="134.2" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M87.2874 176.916L205.159 115.545" class="edge"/><rect x="171.333" y="119.2" width="15.2" height="20" rx="3" fill="#fff"/><text x="178.933" y="134.2" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><circle cx="66" cy="104" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="66" y="109" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="66" cy="188" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="66" y="193" text-anchor="middle" class="" data-max-width="38">1</text><circle cx="227.333" cy="104" r="22" fill="#fff" s