<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Apply the oracle term by term</title><desc id="desc">With f(0)=0 and f(1)=1, each amplitude follows its own arrow. The input superposition with a blank target becomes (|00⟩+|11⟩)/√2: the target is now correlated with the input. 00 → 00; 01 → 01; 10 → 11; 11 → 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Apply the oracle term by term</text><text x="380" y="70" text-anchor="middle" class="" data-max-width="350" data-tex="U_f">U_f</text><path d="M166 118L593 118" class="edge"/><path d="M166 202L593 202" class="edge"/><path d="M165.635 290.171L593.38 365.655" class="edge"/><path d="M165.635 365.829L593.38 290.345" class="edge"/><circle cx="142" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="123" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="142" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="207" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="142" cy="286" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="291" text-anchor="middle" class="" data-max-width="38">10</text><circle cx="142" cy="370" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="375" text-anchor="middle" class="" data-max-width="38">11</text><circle cx="618" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="123" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="618" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="207" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="618" cy="286" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="291" text-anchor="middle" class="" data-max-width="38">10</text><circle cx="618" cy="370" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="375" text-anchor="middle" class="" data-max-width="38">11</text><text x="110" y="123" text-anchor="end" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="110" y="291" text-anchor="end" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="650" y="123" text-anchor="start" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="650" y="375" text-anchor="start" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text></svg>
