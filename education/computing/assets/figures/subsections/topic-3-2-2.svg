<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Sum the paths to a common endpoint</title><desc id="desc">Each route passes through an intermediate configuration j. Multiply along each route, then sum over all intermediate configurations; the dots stand for any additional routes. i → j1: w(i→ j₁); i → jm: w(i→ j_m); j1 → k: w(j₁→ k); jm → k: w(j_m→ k)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Sum the paths to a common endpoint</text><path d="M106.94 182.367L353.06 112.633" class="edge"/><text x="220" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="w(i\to j_1)">w(i→ j₁)</text><path d="M106.94 197.633L353.06 267.367" class="edge"/><text x="220" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="w(i\to j_m)">w(i→ j_m)</text><path d="M406.94 112.633L653.06 182.367" class="edge"/><text x="540" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="w(j_1\to k)">w(j₁→ k)</text><path d="M406.94 267.367L653.06 197.633" class="edge"/><text x="540" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="w(j_m\to k)">w(j_m→ k)</text><circle cx="80" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="i">i</text><circle cx="380" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="j_1">j₁</text><circle cx="380" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="j_m">j_m</text><circle cx="680" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="k">k</text><text x="380" y="195" text-anchor="middle" class="small" data-max-width="700">⋮</text><text x="380" y="347" text-anchor="middle" class="small" data-max-width="700" data-tex="w(i\Rightarrow k)=\sum_j w(j\to k)w(i\to j)">w(i⇒ k)=Σⱼ w(j→ k)w(i→ j)</text></svg>
