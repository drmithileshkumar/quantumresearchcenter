<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" aria-labelledby="title desc"><title id="title">Flip eigenstates on a wire</title><desc id="desc">X leaves the plus state unchanged and multiplies the minus state by a common minus sign. In a controlled operation that factor becomes a relative phase between control alternatives. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Flip eigenstates on a wire</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket+">|+⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92">X</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="X\ket+=\ket+">X|+⟩=|+⟩</text><text x="480" y="287" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="333" text-anchor="end" class="" data-max-width="145" data-tex="\ket-">|−⟩</text><path class="wire" d="M170 328L810 328"/><text x="830" y="333" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="308" width="100" height="40" rx="3"/><text x="480" y="334" text-anchor="middle" class="" data-max-width="92">X</text><text x="480" y="380" text-anchor="middle" class="small" data-max-width="880" data-tex="X\ket-=-\ket-">X|−⟩=−|−⟩</text></svg>
