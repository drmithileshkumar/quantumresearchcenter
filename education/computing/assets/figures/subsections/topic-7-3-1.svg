<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-labelledby="title desc"><title id="title">The target eigenvalue supplies the sign</title><desc id="desc">A bit flip moves each amplitude to the other configuration. For |−⟩ the result is −|−⟩: the target is unchanged apart from a sign, which the oracle can pass to the input. 0 → 1 (weight 1); 1 → 0 (weight 1).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The target eigenvalue supplies the sign</text><text x="380" y="70" text-anchor="middle" class="" data-max-width="350" data-tex="X">X</text><path d="M165.635 122.171L593.38 197.655" class="edge"/><text x="380" y="151" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M165.635 197.829L593.38 122.345" class="edge"/><text x="380" y="151" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><circle cx="142" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="123" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="142" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="207" text-anchor="middle" class="" data-max-width="38">1</text><circle cx="618" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="123" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="618" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="207" text-anchor="middle" class="" data-max-width="38">1</text><text x="110" y="123" text-anchor="end" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="110" y="207" text-anchor="end" class="" data-max-width="120" data-tex="-1/\sqrt2">−1/√2</text><text x="650" y="123" text-anchor="start" class="" data-max-width="120" data-tex="-1/\sqrt2">−1/√2</text><text x="650" y="207" text-anchor="start" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text></svg>
