<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-labelledby="title desc"><title id="title">Sum joint probabilities to get a marginal</title><desc id="desc">For the Bell state, the row sums give the first-qubit probabilities. Conditional on the first bit being zero, only the 00 entry remains possible. Columns: First bit, Second = 0, Second = 1, Row sum. 0, 1/2, 0, 1/2; 1, 0, 1/2, 1/2; Column sum, 1/2, 1/2, 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Sum joint probabilities to get a marginal</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152">First bit</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Second \(= 0\)">Second = 0</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Second \(= 1\)">Second = 1</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Row sum</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">1</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152">0</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="32" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="227" text-anchor="middle" class="" data-max-width="152">Column sum</text><rect x="206" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="380" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="554" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="227" text-anchor="middle" class="" data-max-width="152">1</text></svg>
