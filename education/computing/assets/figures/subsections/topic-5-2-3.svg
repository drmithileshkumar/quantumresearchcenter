<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" role="img" aria-labelledby="title desc"><title id="title">Phase becomes an output probability</title><desc id="desc">The final Hadamard converts the relative phase into measurement probabilities. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Phase becomes an output probability</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="350.0" y="90" width="100" height="40" rx="3"/><text x="400" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="R_\phi">R_φ</text><rect class="gate" x="510.0" y="90" width="100" height="40" rx="3"/><text x="560" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="p(0)=(1+\cos\phi)/2,\quad p(1)=(1-\cos\phi)/2">p(0)=(1+cosφ)/2,  p(1)=(1−cosφ)/2</text></svg>
