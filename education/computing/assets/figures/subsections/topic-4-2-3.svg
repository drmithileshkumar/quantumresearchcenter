<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">One amplitude for every joint configuration</title><desc id="desc">Independent pure-state preparations give products of local amplitudes. A general joint state has an amplitude for each pair that need not factor this way. Columns: A label, B label, Joint basis state, Product amplitude. 0, 0, |00⟩, ac; 0, 1, |01⟩, ad; 1, 0, |10⟩, bc; 1, 1, |11⟩, bd</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">One amplitude for every joint configuration</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152">A label</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">B label</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Joint basis state</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Product amplitude</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{00}">|00⟩</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="ac">ac</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">0</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152">1</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{01}">|01⟩</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="ad">ad</text><rect x="32" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="227" text-anchor="middle" class="" data-max-width="152">1</text><rect x="206" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="227" text-anchor="middle" class="" data-max-width="152">0</text><rect x="380" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{10}">|10⟩</text><rect x="554" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="bc">bc</text><rect x="32" y="246" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="275" text-anchor="middle" class="" data-max-width="152">1</text><rect x="206" y="246" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="275" text-anchor="middle" class="" data-max-width="152">1</text><rect x="380" y="246" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="275" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{11}">|11⟩</text><rect x="554" y="246" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="275" text-anchor="middle" class="" data-max-width="152" data-tex="bd">bd</text></svg>
