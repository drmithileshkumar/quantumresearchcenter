<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" role="img" aria-labelledby="title desc"><title id="title">Bounded error is a per-input requirement</title><desc id="desc">Both classes concern polynomial-time decision procedures with a bounded error on every allowed input. The computational model differs. Columns: Class, Model, Typical success guarantee. BPP, Classical randomized, At least 2/3 on each input; BQP, Quantum, At least 2/3 on each input</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Bounded error is a per-input requirement</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Class</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Model</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Typical success</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">guarantee</text><rect x="32" y="116" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="152" text-anchor="middle" class="" data-max-width="210">BPP</text><rect x="264" y="116" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="152" text-anchor="middle" class="" data-max-width="210">Classical randomized</text><rect x="496" y="116" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="141" text-anchor="middle" class="" data-max-width="210" data-math="At least \(2/3\) on each">At least 2/3 on each</text><text x="612" y="163" text-anchor="middle" class="" data-max-width="210">input</text><rect x="32" y="178" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="214" text-anchor="middle" class="" data-max-width="210">BQP</text><rect x="264" y="178" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="214" text-anchor="middle" class="" data-max-width="210">Quantum</text><rect x="496" y="178" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="203" text-anchor="middle" class="" data-max-width="210" data-math="At least \(2/3\) on each">At least 2/3 on each</text><text x="612" y="225" text-anchor="middle" class="" data-max-width="210">input</text></svg>
