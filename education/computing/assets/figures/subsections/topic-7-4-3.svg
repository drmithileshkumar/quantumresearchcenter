<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc"><title id="title">Every stage contributes to correctness</title><desc id="desc">The target |−⟩ lets the oracle encode a phase without keeping an input-dependent target record. The final H converts that phase into the answer. Prepare
|+⟩|−⟩ → Oracle
encode signs → H on input
combine amplitudes → Measure input
constant or balanced</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Every stage contributes to correctness</text><rect x="32" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="93" text-anchor="middle" class="" data-max-width="131">Prepare</text><text x="108.5" y="115" text-anchor="middle" class="" data-max-width="131" data-tex="\ket{+}\ket{-}">|+⟩|−⟩</text><path d="M185 99L213 99" class="edge"/><rect x="213" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="93" text-anchor="middle" class="" data-max-width="131">Oracle</text><text x="289.5" y="115" text-anchor="middle" class="" data-max-width="131">encode signs</text><path d="M366 99L394 99" class="edge"/><rect x="394" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="82" text-anchor="middle" class="" data-max-width="131" data-math="\(H\) on input">H on input</text><text x="470.5" y="104" text-anchor="middle" class="" data-max-width="131">combine</text><text x="470.5" y="126" text-anchor="middle" class="" data-max-width="131">amplitudes</text><path d="M547 99L575 99" class="edge"/><rect x="575" y="54" width="153" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="82" text-anchor="middle" class="" data-max-width="131">Measure input</text><text x="651.5" y="104" text-anchor="middle" class="" data-max-width="131">constant or</text><text x="651.5" y="126" text-anchor="middle" class="" data-max-width="131">balanced</text></svg>
