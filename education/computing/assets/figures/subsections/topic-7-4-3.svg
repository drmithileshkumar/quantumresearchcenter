ire" d="M170 700L810 700"/><text x="830" y="705" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="610" width="100" height="40" rx="3"/><text x="240" y="636" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="190.0" y="680" width="100" height="40" rx="3"/><text x="240" y="706" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="430.0" y="610" width="100" height="110" rx="3"/><text x="480" y="671" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="670.0" y="610" width="100" height="40" rx="3"/><text x="720" y="636" text-anchor="middle" class="" data-max-width="92">M</text></svg>
