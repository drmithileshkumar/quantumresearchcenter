<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">A record separates the final configurations</title><desc id="desc">The second qubit records the intermediate value of the first. The two routes shown both give first-qubit outcome one, but end in different joint configurations, 10 and 11. Their amplitudes cannot cancel: add their squared magnitudes when ignoring the record. The routes to first-qubit outcome zero are omitted. start → a: 1/√2; start → b: 1/√2; a → c: 1/√2; b → d: −1/√2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A record separates the final configurations</text><path d="M106.832 181.997L338.168 113.003" class="edge"/><text x="215" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><path d="M106.832 198.003L338.168 266.997" class="edge"/><text x="215" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><path d="M393 105L637 105" class="edge"/><text x="515" y="85" text-anchor="middle" class="" data-max-width="190" data-tex="1/\sqrt2">1/√2</text><path d="M393 275L637 275" class="edge"/><text x="515" y="255" text-anchor="middle" class="" data-max-width="190" data-tex="-1/\sqrt2">−1/√2</text><circle cx="80" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{00}">|00⟩</text><circle cx="365" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="365" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{00}">|00⟩</text><circle cx="365" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="365" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{11}">|11⟩</text><circle cx="665" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="665" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{10}">|10⟩</text><circle cx="665" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="665" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="\ket{11}">|11⟩</text><text x="215" y="61" text-anchor="middle" class="small" data-max-width="700" data-math="\(H\), then CNOT">H, then CNOT</text><text x="515" y="61" text-anchor="middle" class="small" data-max-width="700" data-math="\(H\) on the first qubit">H on the first qubit</text><text x="380" y="348" text-anchor="middle" class="small" data-max-width="700" data-tex="p(\text{first qubit}=1)=|1/2|^2+|-1/2|^2=1/2">p(first qubit=1)=|1/2|²+|−1/2|²=1/2</text></svg>
