<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">A derivation generates a string</title><desc id="desc">Apply S→ aSb twice, then S→ empty string. This demonstrates generation of aabb; it does not yet give a procedure for rejecting arbitrary strings. Parse tree. The start symbol S expands by S → aSb into a, S, b; the inner S expands the same way; the innermost S becomes the empty string. Reading the leaves from left to right gives aabb.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A derivation generates a string</text><path d="M230 85L168 165" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M250 105L250 145" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M270 85L332 165" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M250 185L195 229" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M250 185L250 225" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M250 185L305 229" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M250 265L250 309" fill="none" stroke="#6b7885" stroke-width="1.7"/><path d="M150 181L150 380" fill="none" stroke="#347449" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M195 261L195 380" fill="none" stroke="#347449" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M305 261L305 380" fill="none" stroke="#347449" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M350 181L350 380" fill="none" stroke="#347449" stroke-width="1.2" str