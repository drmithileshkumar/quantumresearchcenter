ill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="305" y="400" text-anchor="middle" class="" data-max-width="22" data-tex="b">b</text><rect x="333" y="380" width="34" height="30" rx="6" fill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="350" y="400" text-anchor="middle" class="" data-max-width="22" data-tex="b">b</text><text x="470" y="72" text-anchor="start" class="small" data-max-width="700">rule applied</text><text x="610" y="72" text-anchor="start" class="small" data-max-width="700">string so far</text><text x="470" y="130" text-anchor="start" class="" style="fill:#246593" data-max-width="700" data-tex="S\to aSb">S→ aSb</text><text x="610" y="130" text-anchor="start" class="" data-max-width="700" data-tex="aSb">aSb</text><text x="470" y="210" text-anchor="start" class="" style="fill:#246593" data-max-width="700" data-tex="S\to aSb">S→ aSb</text><text x="610" y="210" text-anchor="start" class="" data-max-width="700" data-tex="aaSbb">aaSbb</text><text x="470" y="290" text-anchor="start" class="" style="fill:#246593" data-max-width="700" data-tex="S\to\varepsilon">S→ε</text><text x="610" y="290" text-anchor="start" class="" data-max-width="700" data-tex="aabb">aabb</text><text x="470" y="397" text-anchor="start" class="small" data-max-width="270">Leaves, left to right: aabb</text></svg>
