<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" role="img" aria-labelledby="title desc"><title id="title">The oracle inside a circuit</title><desc id="desc">Deutsch’s algorithm uses one oracle gate between its preparation and readout gates. The Uf box specifies a joint operation, not its internal gate count. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">The oracle inside a circuit</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">y</text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket1">|1⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="350.0" y="90" width="100" height="110" rx="3"/><text x="400" y="151" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="510.0" y="90" width="100" height="40" rx="3"/><text x="560" y="116" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">M</text></svg>
