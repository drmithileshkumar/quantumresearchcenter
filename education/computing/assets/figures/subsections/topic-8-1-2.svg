<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Marking changes a sign, not a probability</title><desc id="desc">The oracle keeps every configuration and multiplies the amplitude of the marked item 11 by −1. Every immediate measurement probability stays 1/4, so another operation is needed to turn the sign into an advantage. 00 → 00 (weight 1); 01 → 01 (weight 1); 10 → 10 (weight 1); 11 → 11 (weight −1).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Marking changes a sign, not a probability</text><text x="380" y="70" text-anchor="middle" class="" data-max-width="350" data-tex="O_f">O_f</text><path d="M166 118L593 118" class="edge"/><text x="380" y="109" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M166 202L593 202" class="edge"/><text x="380" y="193" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M166 286L593 286" class="edge"/><text x="380" y="277" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M166 370L593 370" class="edge"/><text x="380" y="361" text-anchor="middle" class="small" data-max-width="120" data-tex="-1">−1</text><circle cx="142" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="123" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="142" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="207" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="142" cy="286" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="291" text-anchor="middle" class="" data-max-width="38">10</text><circle cx="142" cy="370" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="375" text-anchor="middle" class="" data-max-width="38">11</text><circle cx="618" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="123" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="618" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="207" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="618" cy="286" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="291" text-anchor="middle" class="" data-max-width="38">10</text><circle cx="618" cy="370" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="375" text-anchor="middle" class="" data-max-width="38">11</text><text x="110" y="123" text-anchor="end" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="110" y="207" text-anchor="end" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="110" y="291" text-anchor="end" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="110" y="375" text-anchor="end" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="650" y="123" text-anchor="start" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="650" y="207" text-anchor="start" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="650" y="291" text-anchor="start" class="" data-max-width="120" data-tex="1/2">1/2</text><text x="650" y="375" text-anchor="start" class="" data-max-width="120" data-tex="-1/2">−1/2</text></svg>
