<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 298" role="img" aria-labelledby="title desc"><title id="title">Pay for both preparation and its inverse</title><desc id="desc">One amplification round applies the success reflection, inverse preparation, zero-state reflection, and preparation. Repeat the round coherently before measuring; the zero-reflection cost must also be included when significant. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Pay for both preparation and its inverse</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="I-2P_G">I−2P_G</text><rect class="gate" x="350.0" y="90" width="100" height="40" rx="3"/><text x="400" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="A^\dagger">A†</text><rect class="gate" x="510.0" y="90" width="100" height="40" rx="3"/><text x="560" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="R_0">R₀</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92">A</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="R_0=2\ket0\bra0-I;\quad R_\psi=A R_0 A^\dagger">R₀=2|0⟩⟨0|−I;  R_ψ=A R₀ A†</text><text x="480" y="190" text-anchor="middle" class="small" data-max-width="880" data-math="One round costs \(C_G+2C_A+C_{R_0}\).">One round costs C_G+2C_A+C_(R₀).</text></svg>
