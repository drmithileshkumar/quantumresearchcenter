<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" role="img" aria-labelledby="title desc"><title id="title">Count the work inside each amplification round</title><desc id="desc">For small p, the improvement concerns repeated use of coherent preparation and the success test. Their implementation costs must be included. Columns: Method, Repetitions for constant success, Work used. Independent trials, Order 1/p, Prepare and test; Amplitude amplification, Order 1/√p, A, A†, phase test per round</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Count the work inside each amplification round</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Method</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="79" text-anchor="middle" class="small" data-max-width="210">Repetitions for constant</text><text x="380" y="101" text-anchor="middle" class="small" data-max-width="210">success</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="90" text-anchor="middle" class="small" data-max-width="210">Work used</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210">Independent trials</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210" data-math="Order \(1/p\)">Order 1/p</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210">Prepare and test</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210">Amplitude amplification</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210" data-math="Order \(1/\sqrt{p}\)">Order 1/√p</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210" data-math="\(A\), \(A^\dagger\), phase test per">A, A†, phase test per</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">round</text></svg>
