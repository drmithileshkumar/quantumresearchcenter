<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 216" role="img" aria-labelledby="title desc"><title id="title">The product rule along one path</title><desc id="desc">The weight of the path i→ j→ k, with step S and then step T, is the product of its two arrow weights. : i → j → k; weights ⟨j|S|i⟩, ⟨k|T|j⟩; ⟨k|T|j⟩ ⟨j|S|i⟩</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The product rule along one path</text><text x="180" y="59" text-anchor="middle" class="small" data-max-width="700">Time 0</text><text x="380" y="59" text-anchor="middle" class="small" data-max-width="700">Time 1</text><text x="580" y="59" text-anchor="middle" class="small" data-max-width="700">Time 2</text><text x="38" y="89" text-anchor="start" class="heading" data-max-width="680"></text><circle cx="180" cy="126" r="23" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="180" y="131" text-anchor="middle" class="" data-max-width="40" data-tex="i">i</text><circle cx="380" cy="126" r="23" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="40" data-tex="j">j</text><circle cx="580" cy="126" r="23" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="580" y="131" text-anchor="middle" class="" data-max-width="40" data-tex="k">k</text><path d="M203 126L357 126" class="edge"/><text x="280" y="112" text-anchor="middle" class="" data-max-width="130" data-tex="\bra jS\ket i">⟨j|S|i⟩</text><path d="M403 126L557 126" class="edge"/><text x="480" y="112" text-anchor="middle" class="" data-max-width="130" data-tex="\bra kT\ket j">⟨k|T|j⟩</text><text x="380" y="177" text-anchor="middle" class="small" data-max-width="680" data-tex="\bra kT\ket j\,\bra jS\ket i">⟨k|T|j⟩ ⟨j|S|i⟩</text></svg>
