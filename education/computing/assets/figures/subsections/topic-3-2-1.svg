<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">The product rule on the path 0 to 1 to 0</title><desc id="desc">Multiplying the weights along the path 0→1→0 gives its weight in each model. Columns: Rule, Arrow weights, Path weight. NOT (deterministic), 1 and 1, 1; Keep or flip (nondeterministic), yes and yes, possible; Coin step (probabilistic), 1/2 and 1/2, 1/4</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The product rule on the path 0 to 1 to 0</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Rule</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Arrow weights</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Path weight</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">NOT (deterministic)</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(1\) and \(1\)">1 and 1</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="175" text-anchor="middle" class="" data-max-width="210">Keep or flip</text><text x="148" y="197" text-anchor="middle" class="" data-max-width="210">(nondeterministic)</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="186" text-anchor="middle" class="" data-max-width="210">yes and yes</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="186" text-anchor="middle" class="" data-max-width="210">possible</text><rect x="32" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="237" text-anchor="middle" class="" data-max-width="210">Coin step</text><text x="148" y="259" text-anchor="middle" class="" data-max-width="210">(probabilistic)</text><rect x="264" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="248" text-anchor="middle" class="" data-max-width="210" data-math="\(1/2\) and \(1/2\)">1/2 and 1/2</text><rect x="496" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="248" text-anchor="middle" class="" data-max-width="210" data-tex="1/4">1/4</text></svg>
