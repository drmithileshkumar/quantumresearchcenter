<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 328" role="img" aria-labelledby="title desc"><title id="title">One Hadamard creates two amplitudes</title><desc id="desc">Starting in |0⟩, H produces equal amplitudes. The computational-basis measurement therefore has two equally likely outcomes. |0⟩ → H → (|0⟩ + |1⟩)/√2; Amplitude of 0: 1/√2 → Square magnitude → Probability of 0: 1/2; Amplitude of 1: 1/√2 → Square magnitude → Probability of 1: 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">One Hadamard creates two amplitudes</text><rect x="32" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="\ket0">|0⟩</text><path d="M245.333 89L273.333 89" class="edge"/><rect x="273.333" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="H">H</text><path d="M486.667 89L514.667 89" class="edge"/><rect x="514.667" y="54" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="(\ket0 + \ket1)/\sqrt{2}">(|0⟩ + |1⟩)/√2</text><rect x="32" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="188" text-anchor="middle" class="" data-max-width="191.333" data-math="Amplitude of 0: \(1/\sqrt{2}\)">Amplitude of 0: 1/√2</text><path d="M245.333 183L273.333 183" class="edge"/><rect x="273.333" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="188" text-anchor="middle" class="" data-max-width="191.333">Square magnitude</text><path d="M486.667 183L514.667 183" class="edge"/><rect x="514.667" y="148" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="188" text-anchor="middle" class="" data-max-width="191.333" data-math="Probability of 0: \(1/2\)">Probability of 0: 1/2</text><rect x="32" y="242" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="282" text-anchor="middle" class="" data-max-width="191.333" data-math="Amplitude of 1: \(1/\sqrt{2}\)">Amplitude of 1: 1/√2</text><path d="M245.333 277L273.333 277" class="edge"/><rect x="273.333" y="242" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="282" text-anchor="middle" class="" data-max-width="191.333">Square magnitude</text><path d="M486.667 277L514.667 277" class="edge"/><rect x="514.667" y="242" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="282" text-anchor="middle" class="" data-max-width="191.333" data-math="Probability of 1: \(1/2\)">Probability of 1: 1/2</text></svg>
