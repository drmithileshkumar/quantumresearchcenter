<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" aria-labelledby="title desc"><title id="title">Compare hidden inputs in the same circuit</title><desc id="desc">The two circuits use identical intervening gates and differ only in the oracle. The lower-bound argument compares their final states; the diagram itself is not a proof of the bound. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Compare hidden inputs in the same circuit</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 110L720.0 110"/><path class="wire" d="M720.0 107L810 107"/><path class="wire" d="M720.0 113L810 113"/><path class="wire" d="M189 117L199 103"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="204.16666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_0">U₀</text><rect class="gate" x="300.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="336" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="O_w">O_w</text><rect class="gate" x="396.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="432" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_1">U₁</text><rect class="gate" x="492.1666666666667" y="90" width="71.66666666666667" height="40" rx="3"/><text x="528" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="O_w">O_w</text><rect class="gate" x="588.1666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="624" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_2">U₂</text><rect class="gate" x="684.1666666666666" y="90" width="71.66666666666667" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="63.66666666666667">M</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880">Marked oracle: one hidden position changes phase.</text><text x="480" y="287" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="333" text-anchor="end" class="" data-max-width="145" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M170 328L720.0 328"/><path class="wire" d="M720.0 325L810 325"/><path class="wire" d="M720.0 331L810 331"/><path class="wire" d="M189 335L199 321"/><text x="830" y="333" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="204.16666666666666" y="308" width="71.66666666666667" height="40" rx="3"/><text x="240" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_0">U₀</text><rect class="gate" x="300.1666666666667" y="308" width="71.66666666666667" height="40" rx="3"/><text x="336" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="I">I</text><rect class="gate" x="396.1666666666667" y="308" width="71.66666666666667" height="40" rx="3"/><text x="432" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_1">U₁</text><rect class="gate" x="492.1666666666667" y="308" width="71.66666666666667" height="40" rx="3"/><text x="528" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="I">I</text><rect class="gate" x="588.1666666666666" y="308" width="71.66666666666667" height="40" rx="3"/><text x="624" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667" data-tex="U_2">U₂</text><rect class="gate" x="684.1666666666666" y="308" width="71.66666666666667" height="40" rx="3"/><text x="720" y="334" text-anchor="middle" class="" data-max-width="63.66666666666667">M</text><text x="480" y="380" text-anchor="middle" class="small" data-max-width="880">Reference oracle: no positions change phase.</text></svg>
