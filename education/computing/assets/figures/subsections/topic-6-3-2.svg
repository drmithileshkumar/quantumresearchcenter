<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="title desc"><title id="title">The proposed copying circuit</title><desc id="desc">U? is a hypothetical universal copying unitary, not an available gate. The required output overlap differs from the input overlap, so the two requested actions cannot belong to one unitary. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">The proposed copying circuit</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0\text{ or }\ket+">|0⟩ or |+⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="110" rx="3"/><text x="480" y="151" text-anchor="middle" class="" data-max-width="92">U?</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Required outputs: \(\ket{00}\) or \(\ket{++}\)">Required outputs: |00⟩ or |++⟩</text><text x="480" y="260" text-anchor="middle" class="small" data-max-width="880" data-math="Input overlap \(1/\sqrt2\); required output overlap \(1/2\)">Input overlap 1/√2; required output overlap 1/2</text></svg>
