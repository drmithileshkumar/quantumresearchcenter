ket0">|0⟩</text><path class="wire" d="M170 440L720.0 440"/><path class="wire" d="M720.0 437L810 437"/><path class="wire" d="M720.0 443L810 443"/><text x="830" y="445" text-anchor="start" class="" data-max-width="120">f(1)</text><rect class="gate" x="190.0" y="350" width="100" height="110" rx="3"/><text x="240" y="411" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><rect class="gate" x="670.0" y="420" width="100" height="40" rx="3"/><text x="720" y="446" text-anchor="middle" class="" data-max-width="92">M</text></svg>
