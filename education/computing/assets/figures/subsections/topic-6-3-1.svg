<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Copying basis labels</title><desc id="desc">CNOT copies a basis label into a blank target. For a superposition the joint output is entangled, rather than two independent copies. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Copying basis labels</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\alpha\ket0+\beta\ket1">α|0⟩+β|1⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><path class="wire" d="M480 110L480 180"/><circle cx="480" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="480" cy="180" r="14"/><path class="wire" d="M466 180L494 180"/><path class="wire" d="M480 166L480 194"/><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket{\rm out}=\alpha\ket{00}+\beta\ket{11}">|rm out⟩=α|00⟩+β|11⟩</text></svg>
