th="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="p(00)=p(11)=1/2">p(00)=p(11)=1/2</text><text x="480" y="357" text-anchor="middle" class="small" data-max-width="700">Hadamards before readout</text><text x="150" y="403" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 398L720.0 398"/><path class="wire" d="M720.0 395L810 395"/><path class="wire" d="M720.0 401L810 401"/><text x="830" y="403" text-anchor="start" class="" data-max-width="120">a</text><text x="150" y="473" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 468L720.0 468"/><path class="wire" d="M720.0 465L810 465"/><path class="wire" d="M720.0 471L810 471"/><text x="830" y="473" text-anchor="start" class="" data-max-width="120">b</text><rect class="gate" x="190.0" y="378" width="100" height="40" rx="3"/><text x="240" y="404" text-anchor="middle" class="" data-max-width="92">H</text><path class="wire" d="M400.0 398L400.0 468"/><circle cx="400.0" cy="398" r="5" fill="#476b70"/><circle class="gate" cx="400.0" cy="468" r="14"/><path class="wire" d="M386.0 468L414.0 468"/><path class="wire" d="M400.0 454L400.0 482"/><rect class="gate" x="510.0" y="378" width="100" height="40" rx="3"/><text x="560" y="404" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="510.0" y="448" width="100" height="40" rx="3"/><text x="560" y="474" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="378" width="100" height="40" rx="3"/><text x="720" y="404" text-anchor="middle" class="" data-max-width="92">M</text><rect class="gate" x="670.0" y="448" width="100" height="40" rx="3"/><text x="720" y="474" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="520" text-anchor="middle" class="small" data-max-width="880" data-tex="p(00)=p(11)=1/2;\quad p(01)=p(10)=0">p(00)=p(11)=1/2;  p(01)=p(10)=0</text></svg>
