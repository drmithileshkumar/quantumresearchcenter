<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">The reversible query gate</title><desc id="desc">The box acts on both wires and retains the input label. One use counts as one query in the specified oracle model. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">The reversible query gate</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket x">|x⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket y">|y⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="110" rx="3"/><text x="480" y="151" text-anchor="middle" class="" data-max-width="92" data-tex="U_f">U_f</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="U_f\ket{x,y}=\ket{x,y\oplus f(x)}">U_f|x,y⟩=|x,y⊕ f(x)⟩</text></svg>
