<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">From path amplitudes to an outcome probability</title><desc id="desc">Two coherent routes reach the same outcome k. For real transition amplitudes a,b,c,d, their amplitudes ca and db add before the total is squared. These labels describe the routes shown; a full operation must also satisfy normalization. i → j1: a; i → j2: b; j1 → k: c; j2 → k: d</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">From path amplitudes to an outcome probability</text><path d="M106.94 182.367L353.06 112.633" class="edge"/><text x="220" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="a">a</text><path d="M106.94 197.633L353.06 267.367" class="edge"/><text x="220" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="b">b</text><path d="M406.94 112.633L653.06 182.367" class="edge"/><text x="540" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="c">c</text><path d="M406.94 267.367L653.06 197.633" class="edge"/><text x="540" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="d">d</text><circle cx="80" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="i">i</text><circle cx="380" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="j_1">j₁</text><circle cx="380" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="j_2">j₂</text><circle cx="680" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="k">k</text><text x="380" y="345" text-anchor="middle" class="small" data-max-width="700" data-tex="v_k=ca+db,\qquad p(k)=(ca+db)^2">vₖ=ca+db,  p(k)=(ca+db)²</text></svg>
