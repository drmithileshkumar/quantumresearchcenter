<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 344" role="img" aria-labelledby="title desc"><title id="title">Which probability rule allows observation 1?</title><desc id="desc">With probability |w|^p, every operation must preserve Σⱼ|vⱼ|^p. Only p=2 allows an operation that sends a configuration to an equal superposition. Columns: Probability rule, Quantity preserved, Allowed operations, Observation 1 possible?. |w|^p, p≠2, Σⱼ|vⱼ|^p, Each configuration to one configuration, weight ±1, No; w², Σⱼvⱼ², Outgoing squares sum to 1; cross sums vanish, Yes</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Which probability rule allows observation 1?</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152">Probability rule</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="79" text-anchor="middle" class="small" data-max-width="152">Quantity</text><text x="293" y="101" text-anchor="middle" class="small" data-max-width="152">preserved</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="79" text-anchor="middle" class="small" data-max-width="152">Allowed</text><text x="467" y="101" text-anchor="middle" class="small" data-max-width="152">operations</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="79" text-anchor="middle" class="small" data-max-width="152">Observation 1</text><text x="641" y="101" text-anchor="middle" class="small" data-max-width="152">possible?</text><rect x="32" y="116" width="174" height="128" fill="#fff" class="grid"/><text x="119" y="185" text-anchor="middle" class="" data-max-width="152" data-math="\(|w|^p\), \(p\neq2\)">|w|^p, p≠2</text><rect x="206" y="116" width="174" height="128" fill="#fff" class="grid"/><text x="293" y="185" text-anchor="middle" class="" data-max-width="152" data-tex="\sum_j|v_j|^p">Σⱼ|vⱼ|^p</text><rect x="380" y="116" width="174" height="128" fill="#fff" class="grid"/><text x="467" y="141" text-anchor="middle" class="" data-max-width="152">Each</text><text x="467" y="163" text-anchor="middle" class="" data-max-width="152">configuration to</text><text x="467" y="185" text-anchor="middle" class="" data-max-width="152">one</text><text x="467" y="207" text-anchor="middle" class="" data-max-width="152">configuration,</text><text x="467" y="229" text-anchor="middle" class="" data-max-width="152" data-math="weight \(\pm1\)">weight ±1</text><rect x="554" y="116" width="174" height="128" fill="#fff" class="grid"/><text x="641" y="185" text-anchor="middle" class="" data-max-width="152">No</text><rect x="32" y="244" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="119" y="291" text-anchor="middle" class="" data-max-width="152" data-tex="w^2">w²</text><rect x="206" y="244" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="293" y="291" text-anchor="middle" class="" data-max-width="152" data-tex="\sum_jv_j^2">Σⱼvⱼ²</text><rect x="380" y="244" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="467" y="269" text-anchor="middle" class="" data-max-width="152">Outgoing squares</text><text x="467" y="291" text-anchor="middle" class="" data-max-width="152">sum to 1; cross</text><text x="467" y="313" text-anchor="middle" class="" data-max-width="152">sums vanish</text><rect x="554" y="244" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="641" y="291" text-anchor="middle" class="" data-max-width="152">Yes</text></svg>
