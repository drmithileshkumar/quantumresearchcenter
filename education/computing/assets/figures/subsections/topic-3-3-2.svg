<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Add amplitudes before taking the square</title><desc id="desc">The Born rule assigns probabilities to total amplitudes. Contributions from indistinguishable alternatives are added before the squared magnitude is taken. Opposite amplitudes cancel. Columns: Contributions to one outcome, Total amplitude, Probability. 1/2, 1/2, 1, 1; 1/2, −1/2, 0, 0; 1/√2, 0, 1/√2, 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Add amplitudes before taking the square</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="79" text-anchor="middle" class="small" data-max-width="210">Contributions to one</text><text x="148" y="101" text-anchor="middle" class="small" data-max-width="210">outcome</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Total amplitude</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="90" text-anchor="middle" class="small" data-max-width="210">Probability</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="1/2,\;1/2">1/2, 1/2</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="1/2,\;-1/2">1/2, −1/2</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="1/\sqrt2,\;0">1/√2, 0</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="1/\sqrt2">1/√2</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="1/2">1/2</text></svg>
