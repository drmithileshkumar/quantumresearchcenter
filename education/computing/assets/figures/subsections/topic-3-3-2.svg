<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Cancellation at a common endpoint</title><desc id="desc">Two paths to the same configuration k contribute ca and db. With a=b=c=1/2 and d=−1/2, the contributions cancel although both paths are present. i → j1: a=1/2; i → j2: b=1/2; j1 → k: c=1/2; j2 → k: d=−1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Cancellation at a common endpoint</text><path d="M106.94 182.367L353.06 112.633" class="edge"/><text x="220" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="a=1/2">a=1/2</text><path d="M106.94 197.633L353.06 267.367" class="edge"/><text x="220" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="b=1/2">b=1/2</text><path d="M406.94 112.633L653.06 182.367" class="edge"/><text x="540" y="121" text-anchor="middle" class="" data-max-width="190" data-tex="c=1/2">c=1/2</text><path d="M406.94 267.367L653.06 197.633" class="edge"/><text x="540" y="272" text-anchor="middle" class="" data-max-width="190" data-tex="d=-1/2">d=−1/2</text><circle cx="80" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="80" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="i">i</text><circle cx="380" cy="105" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="110" text-anchor="middle" class="" data-max-width="48" data-tex="j_1">j₁</text><circle cx="380" cy="275" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="280" text-anchor="middle" class="" data-max-width="48" data-tex="j_2">j₂</text><circle cx="680" cy="190" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="680" y="195" text-anchor="middle" class="" data-max-width="48" data-tex="k">k</text><text x="380" y="345" text-anchor="middle" class="small" data-max-width="700" data-tex="W(i\to k)=ca+db=1/4-1/4=0">W(i→ k)=ca+db=1/4−1/4=0</text></svg>
