<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Approximate a gate sequence</title><desc id="desc">Each Vj approximates the corresponding Uj with a specified operator-norm error. The diagram compares two circuits; it does not assert an exact finite-alphabet synthesis. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Approximate a gate sequence</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">Ideal circuit</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_1">U₁</text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_2">U₂</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_3">U₃</text><text x="480" y="259" text-anchor="middle" class="small" data-max-width="700">Approximate circuit</text><text x="150" y="305" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 300L810 300"/><text x="830" y="305" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="280" width="100" height="40" rx="3"/><text x="240" y="306" text-anchor="middle" class="" data-max-width="92" data-tex="V_1">V₁</text><rect class="gate" x="430.0" y="280" width="100" height="40" rx="3"/><text x="480" y="306" text-anchor="middle" class="" data-max-width="92" data-tex="V_2">V₂</text><rect class="gate" x="670.0" y="280" width="100" height="40" rx="3"/><text x="720" y="306" text-anchor="middle" class="" data-max-width="92" data-tex="V_3">V₃</text><text x="480" y="352" text-anchor="middle" class="small" data-max-width="880" data-tex="\|U_3U_2U_1-V_3V_2V_1\|\leq\epsilon_1+\epsilon_2+\epsilon_3">|U₃U₂U₁−V₃V₂V₁|≤ε₁+ε₂+ε₃</text></svg>
