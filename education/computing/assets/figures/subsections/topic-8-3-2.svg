<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Local gates with entangling connections</title><desc id="desc">A representative circuit uses arbitrary single-qubit gates and CNOT. This finite example shows the gate repertoire; it does not claim that two CNOTs synthesize every two-qubit unitary. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Local gates with entangling connections</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket\phi">|φ⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="197.0" y="90" width="86.0" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="78.0">U</text><rect class="gate" x="197.0" y="160" width="86.0" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="78.0">V</text><path class="wire" d="M360.0 110L360.0 180"/><circle cx="360.0" cy="110" r="5" fill="#476b70"/><circle class="gate" cx="360.0" cy="180" r="14"/><path class="wire" d="M346.0 180L374.0 180"/><path class="wire" d="M360.0 166L360.0 194"/><rect class="gate" x="437.0" y="90" width="86.0" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="78.0">W</text><rect class="gate" x="437.0" y="160" width="86.0" height="40" rx="3"/><text x="480" y="186" text-anchor="middle" class="" data-max-width="78.0">R</text><path class="wire" d="M600.0 180L600.0 110"/><circle cx="600.0" cy="180" r="5" fill="#476b70"/><circle class="gate" cx="600.0" cy="110" r="14"/><path class="wire" d="M586.0 110L614.0 110"/><path class="wire" d="M600.0 96L600.0 124"/><rect class="gate" x="677.0" y="90" width="86.0" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="78.0">S</text><rect class="gate" x="677.0" y="160" width="86.0" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="78.0">T</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880">U, V, W, R, S, T here denote arbitrary single-qubit unitaries.</text></svg>
