<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">The final conditional joint state</title><desc id="desc">After correction the unknown state occupies Bob’s wire. Alice’s two basis labels are the classical record; none of the four equally likely records contains the unknown amplitudes. Columns: Record, Alice’s two qubits, Bob’s qubit, Probability. 00, |00⟩, |ψ⟩, 1/4; 01, |01⟩, |ψ⟩, 1/4; 10, |10⟩, |ψ⟩, 1/4; 11, |11⟩, |ψ⟩, 1/4</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The final conditional joint state</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152">Record</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="79" text-anchor="middle" class="small" data-max-width="152">Alice’s two</text><text x="293" y="101" text-anchor="middle" class="small" data-max-width="152">qubits</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="90" text-anchor="middle" class="small" data-max-width="152">Bob’s qubit</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="90" text-anchor="middle" class="small" data-max-width="152">Probability</text><rect x="32" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="145" text-anchor="middle" class="" data-max-width="152">00</text><rect x="206" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{00}">|00⟩</text><rect x="380" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket\psi">|ψ⟩</text><rect x="554" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="145" text-anchor="middle" class="" data-max-width="152">1/4</text><rect x="32" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="193" text-anchor="middle" class="" data-max-width="152">01</text><rect x="206" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{01}">|01⟩</text><rect x="380" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket\psi">|ψ⟩</text><rect x="554" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="193" text-anchor="middle" class="" data-max-width="152">1/4</text><rect x="32" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="241" text-anchor="middle" class="" data-max-width="152">10</text><rect x="206" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{10}">|10⟩</text><rect x="380" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\ket\psi">|ψ⟩</text><rect x="554" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="241" text-anchor="middle" class="" data-max-width="152">1/4</text><rect x="32" y="260" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="289" text-anchor="middle" class="" data-max-width="152">11</text><rect x="206" y="260" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="289" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{11}">|11⟩</text><rect x="380" y="260" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="289" text-anchor="middle" class="" data-max-width="152" data-tex="\ket\psi">|ψ⟩</text><rect x="554" y="260" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="289" text-anchor="middle" class="" data-max-width="152">1/4</text></svg>
