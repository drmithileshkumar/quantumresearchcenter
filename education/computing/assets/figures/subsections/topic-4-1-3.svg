<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">The same state in two bases</title><desc id="desc">These rows change coordinates without changing the physical state. The plus/minus basis is defined by |±⟩=(|0⟩±|1⟩)/√2. Columns: Physical state, Computational coordinates, Plus/minus coordinates. |0⟩, (1, 0), (1/√2, 1/√2); |+⟩, (1/√2, 1/√2), (1, 0)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The same state in two bases</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Physical state</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="79" text-anchor="middle" class="small" data-max-width="210">Computational</text><text x="380" y="101" text-anchor="middle" class="small" data-max-width="210">coordinates</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="90" text-anchor="middle" class="small" data-max-width="210">Plus/minus coordinates</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="\ket0">|0⟩</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210">(1, 0)</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="(1/\sqrt{2}, 1/\sqrt{2})">(1/√2, 1/√2)</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="\ket{+}">|+⟩</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="(1/\sqrt{2}, 1/\sqrt{2})">(1/√2, 1/√2)</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210">(1, 0)</text></svg>
