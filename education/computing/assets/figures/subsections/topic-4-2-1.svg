<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">Normalization of a state vector</title><desc id="desc">The vector (3,4)ᵀ has norm five. Dividing it by five gives a unit vector, whose squared coordinates sum to one. Columns: Vector, Squared norm, Configuration probabilities. (3,4)ᵀ, 3²+4²=25, Not normalized; (3/5,4/5)ᵀ, 9/25+16/25=1, 9/25, 16/25</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Normalization of a state vector</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Vector</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Squared norm</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Configuration</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">probabilities</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="(3,4)^T">(3,4)ᵀ</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="3^2+4^2=25">3²+4²=25</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210">Not normalized</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="(3/5,4/5)^T">(3/5,4/5)ᵀ</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="9/25+16/25=1">9/25+16/25=1</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="9/25,\ 16/25">9/25, 16/25</text></svg>
