<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-labelledby="title desc"><title id="title">Unitary evolution preserves state geometry</title><desc id="desc">Every arrow ends on the unit circle: both states have length one before and after the operation. The same rotation carries |ψ⟩ to U|ψ⟩ and |chi⟩ to U|chi⟩, preserving the angle between them. This real-amplitude example shows a rotation in state space; general unitaries preserve inner products in complex state space. Two unit circles show two states before and after a common rotation of 40 degrees. Both radii remain one and the angle between the states is unchanged.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Unitary evolution preserves state geometry</text><text x="190" y="68" text-anchor="middle" class="heading" data-max-width="330">Before</text><circle cx="190" cy="230" r="114" fill="#f7fafc" stroke="#a7bccd" stroke-width="1.5"/><path d="M52 230L330 230" class="edge" style="stroke:#a7bccd"/><path d="M190 364L190 94" class="edge" style="stroke:#a7bccd"/><text x="331" y="252" text-anchor="middle" class="small" data-max-width="35" data-tex="v_0">v₀</text><text x="209" y="95" text-anchor="middle" class="small" data-max-width="35" data-tex="v_1">v₁</text><path d="M190 230L297.125 191.01" class="edge" style="stroke:#246593"/><circle cx="297.125" cy="191.01" r="3.5" fill="#246593"/><text x="319.678" y="187.801" text-anchor="middle" class="" data-max-width="68" data-tex="\ket\psi">|ψ⟩</text><path d="M190 230L238.178 126.681" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="238.178" cy="126.681" r="3.5" fill="#a64d26"/><text x="248.321" y="109.93" text-anchor="middle" class="" data-max-width="68" data-tex="\ket\chi">|chi⟩</text><path d="M229.467 215.635 A42 42 0 0 0 207.75 191.935" fill="none" stroke="#6b7885" stroke-width="1.5"/><text x="238.66" y="189.411" text-anchor="middle" class="" data-max-width="28" data-tex="\gamma">γ</text><text x="190" y="380" text-anchor="middle" class="small" data-max-width="330">Unit radius · same angle γ</text><text x="570" y="68" text-anchor="middle" class="heading" data-max-width="330">After the same unitary U</text><circle cx="570" cy="230" r="114" fill="#f7fafc" stroke="#a7bccd" stroke-width="1.5"/><path d="M432 230L710 230" class="edge" style="stroke:#a7bccd"/><path d="M570 364L570 94" class="edge" style="stroke:#a7bccd"/><text x="711" y="252" text-anchor="middle" class="small" data-max-width="35" data-tex="v_0">v₀</text><text x="589" y="95" text-anchor="middle" class="small" data-max-width="35" data-tex="v_1">v₁</text><path d="M570 230L627 131.273" class="edge" style="stroke:#246593"/><circle cx="627" cy="131.273" r="3.5" fill="#246593"/><text x="639" y="115.488" text-anchor="middle" class="" data-max-width="68" data-tex="U\ket\psi">U|ψ⟩</text><path d="M570 230L540.495 119.884" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="540.495" cy="119.884" r="3.5" fill="#a64d26"/><text x="534.283" y="101.702" text-anchor="middle" class="" data-max-width="68" data-tex="U\ket\chi">U|chi⟩</text><path d="M591 193.627 A42 42 0 0 0 559.13 189.431" fill="none" stroke="#6b7885" stroke-width="1.5"/><text x="578.615" y="168.565" text-anchor="middle" class="" data-max-width="28" data-tex="\gamma">γ</text><text x="570" y="380" text-anchor="middle" class="small" data-max-width="330">Unit radius · same angle γ</text><path d="M347 230L413 230" class="edge"/><text x="380" y="210" text-anchor="middle" class="heading" data-max-width="40">U</text><text x="380" y="420" text-anchor="middle" class="" data-max-width="700" data-tex="\|U\psi\|=\|\psi\|=1,\qquad \braket{U\chi}{U\psi}=\braket\chi\psi">|Uψ|=|ψ|=1,  ⟨Uchi|Uψ⟩=⟨chi|ψ⟩</text></svg>
