<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 706" role="img" aria-labelledby="title desc"><title id="title">Rotations and phase gates</title><desc id="desc">These are separate single-qubit circuits. Rotation parameters are continuous; S and T are fixed phase operations. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Rotations and phase gates</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="R_P(\theta)">R_P(θ)</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="R_P(\theta)=\cos(\theta/2)I-i\sin(\theta/2)P">R_P(θ)=cos(θ/2)I−isin(θ/2)P</text><text x="480" y="287" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="333" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 328L720.0 328"/><path class="wire" d="M720.0 325L810 325"/><path class="wire" d="M720.0 331L810 331"/><text x="830" y="333" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="190.0" y="308" width="100" height="40" rx="3"/><text x="240" y="334" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="350.0" y="308" width="100" height="40" rx="3"/><text x="400" y="334" text-anchor="middle" class="" data-max-width="92">S</text><rect class="gate" x="510.0" y="308" width="100" height="40" rx="3"/><text x="560" y="334" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="308" width="100" height="40" rx="3"/><text x="720" y="334" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="380" text-anchor="middle" class="small" data-max-width="880" data-tex="p(1)=1/2">p(1)=1/2</text><text x="480" y="505" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="551" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 546L720.0 546"/><path class="wire" d="M720.0 543L810 543"/><path class="wire" d="M720.0 549L810 549"/><text x="830" y="551" text-anchor="start" class="" data-max-width="120">y</text><rect class="gate" x="190.0" y="526" width="100" height="40" rx="3"/><text x="240" y="552" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="350.0" y="526" width="100" height="40" rx="3"/><text x="400" y="552" text-anchor="middle" class="" data-max-width="92">T</text><rect class="gate" x="510.0" y="526" width="100" height="40" rx="3"/><text x="560" y="552" text-anchor="middle" class="" data-max-width="92">H</text><rect class="gate" x="670.0" y="526" width="100" height="40" rx="3"/><text x="720" y="552" text-anchor="middle" class="" data-max-width="92">M</text><text x="480" y="598" text-anchor="middle" class="small" data-max-width="880" data-tex="p(1)=(1-\cos(\pi/4))/2">p(1)=(1−cos(π/4))/2</text></svg>
