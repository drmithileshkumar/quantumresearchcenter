<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-labelledby="title desc"><title id="title">Use conjugation when normalizing</title><desc id="desc">For the complex vector (3,4i), the squared norm is 9+16=25. Dividing by five gives a unit vector; the imaginary coordinate contributes positively to its norm. Two ways to square the length of v = (3, 4i). Transpose only: 3·3 + (4i)(4i) = 9 − 16 = −7, which cannot be a squared length. Conjugate transpose: 9 + 16 = 25, so the norm is 5 and v/5 = (3/5, 4i/5) is a unit vector.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Use conjugation when normalizing</text><polyline points="300,92 300,268" fill="none" stroke="#9aa7b3" stroke-width="1" stroke-dasharray="5 4"/><polyline points="300,118 381,118" fill="none" stroke="#246593" stroke-width="2.6" marker-end="url(#arrow)"/><polyline points="381,140 237,140" fill="none" stroke="#a64d26" stroke-width="2.6" marker-end="url(#arrow)"/><polyline points="237,108 237,150" fill="none" stroke="#a64d26" stroke-width="2"/><polyline points="300,214 381,214" fill="none" stroke="#246593" stroke-width="2.6" marker-end="url(#arrow)"/><polyline points="381,236 525,236" fill="none" stroke="#347449" stroke-width="2.6" marker-end="url(#arrow)"/><polyline points="525,204 525,246" fill="none" stroke="#347449" stroke-width="2"/><rect x="170" y="296" width="420" height="44" rx="22" fill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="380" y="323" text-anchor="middle" class="" data-max-width="408" data-math="\(v/\|v\|=(3/5,\;4i/5)^T\), length \(1\)">v/|v|=(3/5, 4i/5)ᵀ, length 1</text><text x="300" y="280" text-anchor="middle" class="small" data-max-width="700">0</text><text x="40" y="96" text-anchor="start" class="" style="fill:#a64d26" data-max-width="700">Transpose only</text><text x="40" y="120" text-anchor="start" class="small" data-max-width="700" data-tex="v^{T}v=9+(4i)^2">vᵀv=9+(4i)²</text><text x="340.5" y="110" text-anchor="middle" class="small" style="fill:#246593" data-max-width="700" data-tex="+9">+9</text><text x="273" y="160" text-anchor="middle" class="small" style="fill:#a64d26" data-max-width="700" data-tex="-16">−16</text><text x="227" y="134" text-anchor="end" class="" style="fill:#a64d26" data-max-width="700" data-tex="-7">−7</text><text x="40" y="146" text-anchor="start" class="small" style="fill:#a64d26" data-max-width="700">not a squared length</text><text x="40" y="200" text-anchor="start" class="" style="fill:#347449" data-max-width="700">Conjugate transpose</text><text x="40" y="224" text-anchor="start" class="small" data-max-width="700" data-tex="v^\dagger v=9+\overline{(4i)}(4i)">v† v=9+overline(4i)(4i)</text><text x="340.5" y="206" text-anchor="middle" class="small" style="fill:#246593" data-max-width="700" data-tex="+9">+9</text><text x="453" y="256" text-anchor="middle" class="small" style="fill:#347449" data-max-width="700" data-tex="+16">+16</text><text x="537" y="230" text-anchor="start" class="" style="fill:#347449" data-max-width="700" data-tex="25=\|v\|^2">25=|v|²</text></svg>
