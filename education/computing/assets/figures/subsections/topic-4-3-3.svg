<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">The same unitary preserves both states’ overlap</title><desc id="desc">H sends |0⟩ to |+⟩ and |+⟩ to |0⟩. The inner product of the two states is 1/√2 before and after. Arrows here denote unitary evolution. a → b: H; c → e: H</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The same unitary preserves both states’ overlap</text><path d="M198 110L562 110" class="edge"/><text x="380" y="90" text-anchor="middle" class="" data-max-width="190" data-tex="H">H</text><path d="M198 250L562 250" class="edge"/><text x="380" y="230" text-anchor="middle" class="" data-max-width="190" data-tex="H">H</text><circle cx="170" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="170" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="\ket0">|0⟩</text><circle cx="590" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="590" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="\ket+">|+⟩</text><circle cx="170" cy="250" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="170" y="255" text-anchor="middle" class="" data-max-width="48" data-tex="\ket+">|+⟩</text><circle cx="590" cy="250" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="590" y="255" text-anchor="middle" class="" data-max-width="48" data-tex="\ket0">|0⟩</text><text x="170" y="55" text-anchor="middle" class="small" data-max-width="700">Inputs</text><text x="590" y="55" text-anchor="middle" class="small" data-max-width="700">Outputs</text><text x="380" y="325" text-anchor="middle" class="small" data-max-width="700" data-tex="\braket0+=\braket+0=1/\sqrt2">⟨0|+⟩=⟨+|0⟩=1/√2</text></svg>
