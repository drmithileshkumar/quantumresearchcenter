<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 406" role="img" aria-labelledby="title desc"><title id="title">Preserve the input; update the target</title><desc id="desc">Configurations are written xt, here with f(0)=0 and f(1)=1. U_f flips the target exactly when f(x)=1, and applying it twice returns every configuration. 00 → 00; 01 → 01; 10 → 11; 11 → 10; 00 → 00; 01 → 01; 10 → 11; 11 → 10.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Preserve the input; update the target</text><text x="236" y="56" text-anchor="middle" class="" data-max-width="233.333" data-tex="U_f">U_f</text><text x="524" y="56" text-anchor="middle" class="" data-max-width="233.333" data-tex="U_f">U_f</text><path d="M116 104L355 104" class="edge"/><path d="M116 188L355 188" class="edge"/><path d="M115.04 278.72L356 349" class="edge"/><path d="M115.04 349.28L356 279" class="edge"/><path d="M404 104L643 104" class="edge"/><path d="M404 188L643 188" class="edge"/><path d="M403.04 278.72L644 349" class="edge"/><path d="M403.04 349.28L644 279" class="edge"/><circle cx="92" cy="104" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="109" text-anchor="middle" class="" data-max-width="38">00</text><circle cx="92" cy="188" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="193" text-anchor="middle" class="" data-max-width="38">01</text><circle cx="92" cy="272" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="92" y="277" text-anchor="middle" class