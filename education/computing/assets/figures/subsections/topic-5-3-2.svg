<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 488" role="img" aria-labelledby="title desc"><title id="title">A matrix sum is not a gate sequence</title><desc id="desc">H equals the normalized matrix sum of X and Z. Applying X then Z instead gives their product ZX, a different circuit. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">A matrix sum is not a gate sequence</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700">Hadamard</text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92">H</text><text x="480" y="162" text-anchor="middle" class="small" data-max-width="880" data-tex="H=(X+Z)/\sqrt2;\quad H\ket0=\ket+">H=(X+Z)/√2;  H|0⟩=|+⟩</text><text x="480" y="287" text-anchor="middle" class="small" data-max-width="700">Pauli sequence</text><text x="150" y="333" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 328L810 328"/><text x="830" y="333" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="308" width="100" height="40" rx="3"/><text x="240" y="334" text-anchor="middle" class="" data-max-width="92">X</text><rect class="gate" x="670.0" y="308" width="100" height="40" rx="3"/><text x="720" y="334" text-anchor="middle" class="" data-max-width="92">Z</text><text x="480" y="380" text-anchor="middle" class="small" data-max-width="880" data-tex="ZX\ket0=-\ket1">ZX|0⟩=−|1⟩</text></svg>
