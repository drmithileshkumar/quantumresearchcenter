<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Update one component of the state</title><desc id="desc">Each initial weight vᵢ contributes ⟨j|S|i⟩ vᵢ to the new weight at j. The new state contains one such sum for every output configuration. i1 → j: ⟨j|S|i₁⟩; im → j: ⟨j|S|i_m⟩</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Update one component of the state</text><path d="M197.524 115.142L597.476 189.858" class="edge"/><text x="390" y="128" text-anchor="middle" class="" data-max-width="190" data-tex="\bra jS\ket{i_1}">⟨j|S|i₁⟩</text><path d="M197.524 274.858L597.476 200.142" class="edge"/><text x="390" y="277" text-anchor="middle" class="" data-max-width="190" data-tex="\bra jS\ket{i_m}">⟨j|S|i_m⟩</text><circle cx="170" cy="110" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="170" y="115" text-anchor="middle" class="" data-max-width="48" data-tex="i_1">i₁</text><circle cx="170" cy="280" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="170" y="285" text-anchor="middle" class="" data-max-width="48" data-tex="i_m">i_m</text><circle cx="625" cy="195" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="625" y="200" text-anchor="middle" class="" data-max-width="48" data-tex="j">j</text><text x="170" y="64" text-anchor="middle" class="small" data-max-width="700" data-tex="v_{i_1}">v_(i₁)</text><text x="170" y="195" text-anchor="middle" class="small" data-max-width="700">⋮</text><text x="170" y="330" text-anchor="middle" class="small" data-max-width="700" data-tex="v_{i_m}">v_(i_m)</text><text x="625" y="147" text-anchor="middle" class="small" data-max-width="700" data-tex="v^\prime_j">v′ⱼ</text><text x="380" y="385" text-anchor="middle" class="small" data-max-width="700" data-tex="v^\prime_j=\sum_i\bra jS\ket i\,v_i">v′ⱼ=Σᵢ⟨j|S|i⟩ vᵢ</text></svg>
