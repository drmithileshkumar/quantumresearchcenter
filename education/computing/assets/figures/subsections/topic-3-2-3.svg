<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-labelledby="title desc"><title id="title">One COIN step from different states</title><desc id="desc">COIN sends every distribution to the state with weights 1/2 and 1/2, so the state after the step does not determine the state before it. Columns: Weights before, Weights after. 1 and 0, 1/2 and 1/2; 0 and 1, 1/2 and 1/2; 3/4 and 1/4, 1/2 and 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">One COIN step from different states</text><rect x="32" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="206" y="83" text-anchor="middle" class="small" data-max-width="326">Weights before</text><rect x="380" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="554" y="83" text-anchor="middle" class="small" data-max-width="326">Weights after</text><rect x="32" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="131" text-anchor="middle" class="" data-max-width="326" data-math="\(1\) and \(0\)">1 and 0</text><rect x="380" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="131" text-anchor="middle" class="" data-max-width="326" data-math="\(1/2\) and \(1/2\)">1/2 and 1/2</text><rect x="32" y="150" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="206" y="179" text-anchor="middle" class="" data-max-width="326" data-math="\(0\) and \(1\)">0 and 1</text><rect x="380" y="150" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="554" y="179" text-anchor="middle" class="" data-max-width="326" data-math="\(1/2\) and \(1/2\)">1/2 and 1/2</text><rect x="32" y="198" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="227" text-anchor="middle" class="" data-max-width="326" data-math="\(3/4\) and \(1/4\)">3/4 and 1/4</text><rect x="380" y="198" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="227" text-anchor="middle" class="" data-max-width="326" data-math="\(1/2\) and \(1/2\)">1/2 and 1/2</text></svg>
