<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-labelledby="title desc"><title id="title">A sign disappears in an isolated probability</title><desc id="desc">Squaring magnitudes removes a sign. The sign can still affect later interference when an amplitude is added to another contribution. Columns: Amplitude, Squared magnitude, Probability. +1/2, |+1/2|², 1/4; −1/2, |−1/2|², 1/4</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A sign disappears in an isolated probability</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Amplitude</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Squared magnitude</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Probability</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="+1/2">+1/2</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="|+1/2|^2">|+1/2|²</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="1/4">1/4</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="-1/2">−1/2</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="|-1/2|^2">|−1/2|²</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="1/4">1/4</text></svg>
