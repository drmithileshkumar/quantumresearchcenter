<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" role="img" aria-labelledby="title desc"><title id="title">Independent preparation on two wires</title><desc id="desc">A and B are single-qubit preparation unitaries. Their independent actions give the four joint amplitudes ac, ad, bc, bd; each box can require several elementary gates. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Independent preparation on two wires</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket0">|0⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="430.0" y="90" width="100" height="40" rx="3"/><text x="480" y="116" text-anchor="middle" class="" data-max-width="92">A</text><rect class="gate" x="430.0" y="160" width="100" height="40" rx="3"/><text x="480" y="186" text-anchor="middle" class="" data-max-width="92">B</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-tex="A\ket0=a\ket0+b\ket1,\quad B\ket0=c\ket0+d\ket1">A|0⟩=a|0⟩+b|1⟩,  B|0⟩=c|0⟩+d|1⟩</text><text x="480" y="260" text-anchor="middle" class="small" data-max-width="880" data-tex="\ket\Psi=ac\ket{00}+ad\ket{01}+bc\ket{10}+bd\ket{11}">|Psi⟩=ac|00⟩+ad|01⟩+bc|10⟩+bd|11⟩</text></svg>
