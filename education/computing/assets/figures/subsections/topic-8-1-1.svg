<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" role="img" aria-labelledby="title desc"><title id="title">Time order and matrix order</title><desc id="desc">The circuit applies H first and Z second. On a column vector the rightmost matrix acts first, so the combined operator is ZH. |0⟩ → H → |+⟩ → Z → |−⟩; Time: left to right → Combined matrix: ZH → Output: ZH|0⟩</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Time order and matrix order</text><rect x="32" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="\ket0">|0⟩</text><path d="M245.333 89L273.333 89" class="edge"/><rect x="273.333" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="H \to \ket{+}">H → |+⟩</text><path d="M486.667 89L514.667 89" class="edge"/><rect x="514.667" y="54" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="Z \to \ket{-}">Z → |−⟩</text><rect x="32" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="188" text-anchor="middle" class="" data-max-width="191.333">Time: left to right</text><path d="M245.333 183L273.333 183" class="edge"/><rect x="273.333" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="188" text-anchor="middle" class="" data-max-width="191.333">Combined matrix: ZH</text><path d="M486.667 183L514.667 183" class="edge"/><rect x="514.667" y="148" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="188" text-anchor="middle" class="" data-max-width="191.333" data-math="Output: \(ZH\ket0\)">Output: ZH|0⟩</text></svg>
