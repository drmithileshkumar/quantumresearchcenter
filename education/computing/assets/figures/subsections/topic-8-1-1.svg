<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-labelledby="title desc"><title id="title">Time order and matrix order</title><desc id="desc">The circuit applies H first and Z second, as the columns run from left to right. The combined operator is written ZH: on a column vector the rightmost matrix acts first. 0 → 0 (weight 1/√2); 0 → 1 (weight 1/√2); 1 → 0 (weight 1/√2); 1 → 1 (weight −1/√2); 0 → 0 (weight 1); 1 → 1 (weight −1).</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Time order and matrix order</text><text x="261" y="70" text-anchor="middle" class="" data-max-width="233.333" data-tex="H">H</text><text x="499" y="70" text-anchor="middle" class="" data-max-width="233.333" data-tex="Z">Z</text><path d="M166 118L355 118" class="edge"/><text x="261" y="109" text-anchor="middle" class="small" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><path d="M164.632 125.988L356.425 193.679" class="edge"/><rect x="195" y="133.2" width="36.8" height="20" rx="3" fill="#fff"/><text x="213.4" y="148.2" text-anchor="middle" class="small" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><path d="M164.632 194.012L356.425 126.321" class="edge"/><rect x="290.2" y="133.2" width="36.8" height="20" rx="3" fill="#fff"/><text x="308.6" y="148.2" text-anchor="middle" class="small" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><path d="M166 202L355 202" class="edge"/><text x="261" y="221" text-anchor="middle" class="small" data-max-width="120" data-tex="-1/\sqrt2">−1/√2</text><path d="M404 118L593 118" class="edge"/><text x="499" y="109" text-anchor="middle" class="small" data-max-width="120" data-tex="1">1</text><path d="M404 202L593 202" class="edge"/><text x="499" y="193" text-anchor="middle" class="small" data-max-width="120" data-tex="-1">−1</text><circle cx="142" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="123" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="142" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="142" y="207" text-anchor="middle" class="" data-max-width="38">1</text><circle cx="380" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="123" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="380" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="380" y="207" text-anchor="middle" class="" data-max-width="38">1</text><circle cx="618" cy="118" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="123" text-anchor="middle" class="" data-max-width="38">0</text><circle cx="618" cy="202" r="22" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="618" y="207" text-anchor="middle" class="" data-max-width="38">1</text><text x="110" y="123" text-anchor="end" class="" data-max-width="120" data-tex="1">1</text><text x="110" y="207" text-anchor="end" class="" data-max-width="120" data-tex="0">0</text><text x="380" y="86" text-anchor="middle" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="380" y="170" text-anchor="middle" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="650" y="123" text-anchor="start" class="" data-max-width="120" data-tex="1/\sqrt2">1/√2</text><text x="650" y="207" text-anchor="start" class="" data-max-width="120" data-tex="-1/\sqrt2">−1/√2</text></svg>
