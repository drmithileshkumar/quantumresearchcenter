<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-labelledby="title desc"><title id="title">A controlled operation has two branches</title><desc id="desc">CNOT preserves its control bit. For control zero it leaves the target alone; for control one it flips the target. Each branch can be undone. Columns: Control x, Target before, Target after, Control after. 0, t, t, 0; 1, t, t  XOR  1, 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A controlled operation has two branches</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Control \(x\)">Control x</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">Target before</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Target after</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Control after</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="t">t</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="t">t</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">1</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="t">t</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="t \text{ XOR } 1">t  XOR  1</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152">1</text></svg>
