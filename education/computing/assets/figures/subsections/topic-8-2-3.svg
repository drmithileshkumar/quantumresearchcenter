<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Two reflections advance the state</title><desc id="desc">For θ=30°, the initial state is at 30°. The oracle reflects it to −30° about the bad axis; reflection about the initial direction then sends it to 90°. These are real coordinates in the good/bad plane. Initial: 30°: 30 degrees; After oracle: −30°: -30 degrees; After diffusion: 90°: 90 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Two reflections advance the state</text><circle cx="225" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M70 230L390 230" class="edge" style="stroke:#6b7885"/><path d="M225 380L225 75" class="edge" style="stroke:#6b7885"/><text x="225" y="409" text-anchor="middle" class="small" data-max-width="350">Bad component</text><text x="225" y="60" text-anchor="middle" class="small" data-max-width="350">Good component</text><path d="M225 230L324.593 172.5" class="edge" style="stroke:#246593"/><circle cx="324.593" cy="172.5" r="4" fill="#246593"/><path d="M425 115H455" stroke="#246593" stroke-width="3"/><text x="600" y="120" text-anchor="middle" class="small" data-max-width="260" data-math="Initial: \(30^\circ\)">Initial: 30°</text><path d="M225 230L324.593 287.5" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="324.593" cy="287.5" r="4" fill="#a64d26"/><path d="M425 189H455" stroke="#a64d26" stroke-width="3" stroke-dasharray="5 4"/><text x="600" y="194" text-anchor="middle" class="small" data-max-width="260" data-math="After oracle: \(-30^\circ\)">After oracle: −30°</text><path d="M225 230L225 115" class="edge" style="stroke:#347449"/><circle cx="225" cy="115" r="4" fill="#347449"/><path d="M425 263H455" stroke="#347449" stroke-width="3"/><text x="600" y="268" text-anchor="middle" class="small" data-max-width="260" data-math="After diffusion: \(90^\circ\)">After diffusion: 90°</text></svg>
