<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Distinct vectors need not be orthogonal</title><desc id="desc">The real slice shown contains |0⟩ and |+⟩ at 45°. Their overlap is 1/√2, so one copy cannot always reveal which was prepared. Angles here represent state-vector geometry, not physical space. |0⟩: 0 degrees; |+⟩: 45 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Distinct vectors need not be orthogonal</text><circle cx="225" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M70 230L390 230" class="edge" style="stroke:#6b7885"/><path d="M225 380L225 75" class="edge" style="stroke:#6b7885"/><text x="225" y="409" text-anchor="middle" class="small" data-max-width="350" data-math="\(\ket0\) coefficient">|0⟩ coefficient</text><text x="225" y="60" text-anchor="middle" class="small" data-max-width="350" data-math="\(\ket1\) coefficient">|1⟩ coefficient</text><path d="M225 230L340 230" class="edge" style="stroke:#246593"/><circle cx="340" cy="230" r="4" fill="#246593"/><path d="M425 115H455" stroke="#246593" stroke-width="3"/><text x="600" y="120" text-anchor="middle" class="small" data-max-width="260" data-tex="\ket0">|0⟩</text><path d="M225 230L306.317 148.683" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="306.317" cy="148.683" r="4" fill="#a64d26"/><path d="M425 189H455" stroke="#a64d26" stroke-width="3" stroke-dasharray="5 4"/><text x="600" y="194" text-anchor="middle" class="small" data-max-width="260" data-tex="\ket{+}">|+⟩</text></svg>
