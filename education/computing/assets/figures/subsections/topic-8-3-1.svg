<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">Local gates preserve product states</title><desc id="desc">No wire connection appears in this circuit. Each output depends only on the input on its own wire, so local gates cannot create entanglement from a product input. Read each circuit left to right.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}</style><text x="480" y="28" text-anchor="middle" class="small" data-max-width="700">Local gates preserve product states</text><text x="480" y="69" text-anchor="middle" class="small" data-max-width="700"></text><text x="150" y="115" text-anchor="end" class="" data-max-width="145" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M170 110L810 110"/><text x="830" y="115" text-anchor="start" class="" data-max-width="120"></text><text x="150" y="185" text-anchor="end" class="" data-max-width="145" data-tex="\ket\phi">|φ⟩</text><path class="wire" d="M170 180L810 180"/><text x="830" y="185" text-anchor="start" class="" data-max-width="120"></text><rect class="gate" x="190.0" y="90" width="100" height="40" rx="3"/><text x="240" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="U_1">U₁</text><rect class="gate" x="190.0" y="160" width="100" height="40" rx="3"/><text x="240" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="U_2">U₂</text><rect class="gate" x="670.0" y="90" width="100" height="40" rx="3"/><text x="720" y="116" text-anchor="middle" class="" data-max-width="92" data-tex="V_1">V₁</text><rect class="gate" x="670.0" y="160" width="100" height="40" rx="3"/><text x="720" y="186" text-anchor="middle" class="" data-max-width="92" data-tex="V_2">V₂</text><text x="480" y="232" text-anchor="middle" class="small" data-max-width="880" data-math="Output: \((V_1U_1\ket\psi)\otimes(V_2U_2\ket\phi)\)">Output: (V₁U₁|ψ⟩)⊗(V₂U₂|φ⟩)</text></svg>
