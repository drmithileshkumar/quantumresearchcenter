<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" role="img" aria-labelledby="title desc"><title id="title">The same gate count can give different depths</title><desc id="desc">Four independent gates on four wires can occupy one layer. Four dependent gates on one wire require four layers. Parallelism may use more workspace. Columns: Circuit arrangement, Gates, Depth, Wires used. One gate on each of four wires, 4, 1, 4; Four gates in sequence on one wire, 4, 4, 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The same gate count can give different depths</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="79" text-anchor="middle" class="small" data-max-width="152">Circuit</text><text x="119" y="101" text-anchor="middle" class="small" data-max-width="152">arrangement</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="90" text-anchor="middle" class="small" data-max-width="152">Gates</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="90" text-anchor="middle" class="small" data-max-width="152">Depth</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="90" text-anchor="middle" class="small" data-max-width="152">Wires used</text><rect x="32" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="119" y="141" text-anchor="middle" class="" data-max-width="152">One gate on each</text><text x="119" y="163" text-anchor="middle" class="" data-max-width="152">of four wires</text><rect x="206" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="293" y="152" text-anchor="middle" class="" data-max-width="152">4</text><rect x="380" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="467" y="152" text-anchor="middle" class="" data-max-width="152">1</text><rect x="554" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="641" y="152" text-anchor="middle" class="" data-max-width="152">4</text><rect x="32" y="178" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="119" y="203" text-anchor="middle" class="" data-max-width="152">Four gates in</text><text x="119" y="225" text-anchor="middle" class="" data-max-width="152">sequence on one</text><text x="119" y="247" text-anchor="middle" class="" data-max-width="152">wire</text><rect x="206" y="178" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="293" y="225" text-anchor="middle" class="" data-max-width="152">4</text><rect x="380" y="178" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="467" y="225" text-anchor="middle" class="" data-max-width="152">4</text><rect x="554" y="178" width="174" height="84" fill="#f5f8fa" class="grid"/><text x="641" y="225" text-anchor="middle" class="" data-max-width="152">1</text></svg>
