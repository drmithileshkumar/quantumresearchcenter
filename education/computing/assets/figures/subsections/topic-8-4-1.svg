80" r="14"/><path class="wire" d="M466.0 180L494.0 180"/><path class="wire" d="M480.0 166L480.0 194"/><path class="wire" d="M720.0 180L720.0 250"/><circle cx="720.0" cy="180" r="5" fill="#476b70"/><circle class="gate" cx="720.0" cy="250" r="14"/><path class="wire" d="M706.0 250L734.0 250"/><path class="wire" d="M720.0 236L720.0 264"/><text x="480" y="302" text-anchor="middle" class="small" data-max-width="880">Gate count: 5     Depth: 3     Width: 3</text></svg>
