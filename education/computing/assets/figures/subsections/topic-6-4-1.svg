<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 234" role="img" aria-labelledby="title desc"><title id="title">A sign pattern becomes a measured bit</title><desc id="desc">Ignoring a common global sign, constant functions leave the input in |+⟩ and balanced functions produce |−⟩. The final H converts this distinction into a definite basis outcome. Constant: |+⟩ → H → |0⟩ → outcome 0; Balanced: |−⟩ → H → |1⟩ → outcome 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A sign pattern becomes a measured bit</text><rect x="32" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="94" text-anchor="middle" class="" data-max-width="191.333" data-math="Constant: \(\ket{+}\)">Constant: |+⟩</text><path d="M245.333 89L273.333 89" class="edge"/><rect x="273.333" y="54" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="94" text-anchor="middle" class="" data-max-width="191.333" data-tex="H">H</text><path d="M486.667 89L514.667 89" class="edge"/><rect x="514.667" y="54" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="94" text-anchor="middle" class="" data-max-width="191.333" data-math="\(\ket0 \to\) outcome 0">|0⟩ → outcome 0</text><rect x="32" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="138.667" y="188" text-anchor="middle" class="" data-max-width="191.333" data-math="Balanced: \(\ket{-}\)">Balanced: |−⟩</text><path d="M245.333 183L273.333 183" class="edge"/><rect x="273.333" y="148" width="213.333" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="380" y="188" text-anchor="middle" class="" data-max-width="191.333" data-tex="H">H</text><path d="M486.667 183L514.667 183" class="edge"/><rect x="514.667" y="148" width="213.333" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="621.333" y="188" text-anchor="middle" class="" data-max-width="191.333" data-math="\(\ket1 \to\) outcome 1">|1⟩ → outcome 1</text></svg>
