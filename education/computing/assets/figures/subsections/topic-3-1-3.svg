<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Same paths, different weights</title><desc id="desc">Every model combines weights along a path and then across paths. Only the kind of weight, and with it the arithmetic, changes. Columns: Model, Weight of one path, Combining paths. Deterministic, 1 or 0, Only one path has weight 1; Nondeterministic, Possible or not, Possible if any path is; Probabilistic, Product of probabilities, Sum of the products</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Same paths, different weights</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Model</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Weight of one path</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Combining paths</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Deterministic</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210">1 or 0</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">Only one path has weight</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">1</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210">Nondeterministic</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210">Possible or not</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210">Possible if any path is</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210">Probabilistic</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210">Product of probabilities</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210">Sum of the products</text></svg>
