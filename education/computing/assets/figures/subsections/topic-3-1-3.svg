<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" role="img" aria-labelledby="title desc"><title id="title">Existence of a path is not its probability</title><desc id="desc">With eight equally likely paths and one successful path, nondeterministic acceptance and randomized success answer different questions. Columns: Description, Question, Result in this example. Nondeterministic, Does a successful path exist?, Yes; Uniform random choice, How often is it selected?, Probability 1/8</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Existence of a path is not its probability</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Description</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Question</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Result in this example</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Nondeterministic</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">Does a successful path</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">exist?</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="138" text-anchor="middle" class="" data-max-width="210">Yes</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210">Uniform random choice</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="189" text-anchor="middle" class="" data-max-width="210">How often is it</text><text x="380" y="211" text-anchor="middle" class="" data-max-width="210">selected?</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="200" text-anchor="middle" class="" data-max-width="210" data-math="Probability \(1/8\)">Probability 1/8</text></svg>
