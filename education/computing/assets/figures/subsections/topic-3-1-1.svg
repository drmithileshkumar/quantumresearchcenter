<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">A two-outcome probability distribution</title><desc id="desc">The bar heights are probabilities, not guaranteed frequencies in a short sample. Their sum is one. Outcome 0: 0.7; Outcome 1: 0.3</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A two-outcome probability distribution</text><path d="M85 266H715" class="grid"/><text x="68" y="271" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M85 221H715" class="grid"/><text x="68" y="226" text-anchor="middle" class="small" data-max-width="700">0.25</text><path d="M85 176H715" class="grid"/><text x="68" y="181" text-anchor="middle" class="small" data-max-width="700">0.5</text><path d="M85 131H715" class="grid"/><text x="68" y="136" text-anchor="middle" class="small" data-max-width="700">0.75</text><path d="M85 86H715" class="grid"/><text x="68" y="91" text-anchor="middle" class="small" data-max-width="700">1</text><text x="88" y="60" text-anchor="start" class="small" data-max-width="700">Probability</text><rect x="218" y="140" width="74" height="126" fill="#246593"/><text x="255" y="128" text-anchor="middle" class="small" data-max-width="700">0.7</text><text x="255" y="298" text-anchor="middle" class="small" data-max-width="290">Outcome 0</text><rect x="518" y="212" width="74" height="54" fill="#246593"/><text x="555" y="200" text-anchor="middle" class="small" data-max-width="700">0.3</text><text x="555" y="298" text-anchor="middle" class="small" data-max-width="290">Outcome 1</text></svg>
