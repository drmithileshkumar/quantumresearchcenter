<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" role="img" aria-labelledby="title desc"><title id="title">Each column says where a configuration goes</title><desc id="desc">Each column of a transition table lists where one configuration goes. NOT keeps the two configurations distinct; the reset R merges them, so it cannot be undone. Columns: Current configuration, NOT sends it to, Reset R sends it to. 0, 1, 0; 1, 0, 0</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Each column says where a configuration goes</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Current configuration</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">NOT sends it to</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Reset \(R\) sends it to">Reset R sends it to</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="0">0</text></svg>
