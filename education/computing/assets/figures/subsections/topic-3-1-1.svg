<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" role="img" aria-labelledby="title desc"><title id="title">A state of one bit</title><desc id="desc">Each configuration carries a weight. The state is the pair of weights v₀ and v₁. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A state of one bit</text><circle cx="300" cy="140" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="300" y="145" text-anchor="middle" class="" data-max-width="48" data-tex="0">0</text><circle cx="500" cy="140" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="500" y="145" text-anchor="middle" class="" data-max-width="48" data-tex="1">1</text><text x="300" y="92" text-anchor="middle" class="small" data-max-width="700" data-tex="v_0">v₀</text><text x="500" y="92" text-anchor="middle" class="small" data-max-width="700" data-tex="v_1">v₁</text></svg>
