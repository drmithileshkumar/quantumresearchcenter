<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="title desc"><title id="title">Undecidability and incompleteness concern different objects</title><desc id="desc">Undecidability excludes an always-correct total algorithm for a specified decision problem. Incompleteness says that in a consistent effective theory with enough arithmetic there is a sentence P such that neither P nor not P has a proof.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Undecidability and incompleteness concern different objects</text><rect x="25" y="65" width="315" height="175" rx="5" class="accent"/><text x="182.5" y="124.5" text-anchor="middle" class="">UNDECIDABILITY</text><text x="182.5" y="146.5" text-anchor="middle" class="">Object: a decision problem</text><text x="182.5" y="168.5" text-anchor="middle" class="">No algorithm always halts</text><text x="182.5" y="190.5" text-anchor="middle" class="">with the correct yes/no answer.</text><rect x="380" y="65" width="315" height="175" rx="5" class="accent"/><text x="537.5" y="124.5" text-anchor="middle" class="">INCOMPLETENESS</text><text x="537.5" y="146.5" text-anchor="middle" class="">Object: a fixed theory T</text><text x="537.5" y="168.5" text-anchor="middle" class="">For some sentence P,</text><text x="537.5" y="190.5" text-anchor="middle" class="">T proves neither P nor ¬P.</text><text x="182" y="271" text-anchor="middle" class="small">Example: the general halting problem</text><text x="537" y="271" text-anchor="middle" class="small">T: consistent, effective,</text><text x="537" y="291" text-anchor="middle" class="small">and sufficiently strong for arithmetic</text></svg>
