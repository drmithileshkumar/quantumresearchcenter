<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 410" role="img" aria-labelledby="title desc"><title id="title">Transition amplitudes and matrix entries</title><desc id="desc">Two input nodes and two output nodes show one step. From input 0, the arrows to outputs 0 and 1 have weights a and b; these form matrix column 0. From input 1, the arrows to outputs 0 and 1 have weights c and d; these form column 1. Output 0 selects row 0, containing a and c. Output 1 selects row 1, containing b and d. Thus U equals the matrix with rows a,c and b,d, and U ji is the weight of i to j.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.weight{font:15px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.6}.unused{fill:#fff;stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:1.6;marker-end:url(#arrow)}.rule{stroke:#d3dee7;stroke-width:1}</style><text x="205" y="30" text-anchor="middle" class="heading">One-step transition graph</text><text x="710" y="30" text-anchor="middle" class="heading">Matrix of the same transition</text><text x="80" y="72" text-anchor="middle" class="small" data-math="Input \(i\)">Input i</text><text x="330" y="72" text-anchor="middle" class="small" data-math="Output \(j\)">Output j</text><path class="edge" d="M104 120H306" style="stroke:#246593"/><text x="205" y="108" text-anchor="middle" class="weight" style="fill:#246593" data-tex="a">a</text><path class="edge" d="M99 135L311 265" style="stroke:#246593"/><text x="160" y="201" text-anchor="middle" class="weight" style="fill:#246593" data-tex="b">b</text><path class="edge" d="M99 265L311 135" style="stroke:#a64d26"/><text x="250" y="201" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="c">c</text><path class="edge" d="M104 280H306" style="stroke:#a64d26"/><text x="205" y="309" text-anchor="middle" class="weight" style="fill:#a64d26" data-tex="d">d</text><circle cx="80" cy="120" r="24" class="node"/><text x="80" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="80" cy="280" r="24" class="node"/><text x="80" y="286" text-anchor="middle" class="" data-tex="1">1</text><circle cx="330" cy="120" r="24" class="node"/><text x="330" y="126" text-anchor="middle" class="" data-tex="0">0</text><circle cx="330" cy="280" r="24" class="node"/><text x="330" y="286" text-anchor="middle" class="" data-tex="1">1</text><path class="rule" d="M430 55V330"/><rect x="596" y="120" width="100" height="160" rx="4" fill="#eaf1f7"/><rect x="726" y="120" width="100" height="160" rx="4" fill="#fbefe8"/><text x="646" y="85" text-anchor="middle" class="small" data-math="from \(0\)">from 0</text><text x="776" y="85" text-anchor="middle" class="small" data-math="from \(1\)">from 1</text><text x="528" y="160" text-anchor="middle" class="small" data-math="to \(0\)">to 0</text><text x="528" y="245" text-anchor="middle" class="small" data-math="to \(1\)">to 1</text><text x="552" y="205" text-anchor="middle" class="" data-tex="U=">U=</text><path d="M590 125H580V275H590 M832 125H842V275H832" fill="none" stroke="#30343b" stroke-width="1.6"/><text x="646" y="160" text-anchor="middle" style="fill:#246593;font-size:22px" data-tex="a">a</text><text x="646" y="245" text-anchor="middle" style="fill:#246593;font-size:22px" data-tex="b">b</text><text x="776" y="160" text-anchor="middle" style="fill:#a64d26;font-size:22px" data-tex="c">c</text><text x="776" y="245" text-anchor="middle" style="fill:#a64d26;font-size:22px" data-tex="d">d</text><text x="710" y="320" text-anchor="middle" class="small">Rows: destinations. Columns: sources.</text><text x="480" y="382" text-anchor="middle" class="" data-tex="U_{ji}=\bra jU\ket i,\qquad U=\begin{pmatrix}a&amp;c\\b&amp;d\end{pmatrix}">Uⱼᵢ=⟨j|U|i⟩,  U=beginpmatrixa&amp;c\b&amp;dendpmatrix</text></svg>
