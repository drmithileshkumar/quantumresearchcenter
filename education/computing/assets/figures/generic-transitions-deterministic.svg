<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 355" role="img" aria-labelledby="title desc"><title id="title">Generic deterministic transitions across multiple states and steps</title><desc id="desc">A four-configuration, four-step time-expanded diagram starting from configuration 1 at t=0. Because exactly one arrow leaves each configuration at each step, the run follows a single unbranched path 1 to 0 to 2 to 3 to 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker><marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#cbd6e0"/></marker></defs><style>text{font:15px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.muted{font:13px system-ui,sans-serif;fill:#8a99a8}.weight{font:600 14px Georgia,serif;fill:#246593}.node{fill:#fff;stroke:#246593;stroke-width:1.8}.active{fill:#eaf1f7;stroke:#246593;stroke-width:2.2}.unused{fill:#fff;stroke:#b8c7d4;stroke-width:1.2;stroke-dasharray:4 3}.edge{fill:none;stroke:#246593;stroke-width:2.2;marker-end:url(#arrow)}.muted-edge{fill:none;stroke:#d5dfe8;stroke-width:1.2;stroke-dasharray:3 3;marker-end:url(#arrow-muted)}</style><text x="410" y="32" text-anchor="middle" class="heading">Multi-state, multi-step deterministic run: a single path from start to finish</text><text x="110" y="64" text-anchor="middle" class="small" data-tex="t=0">t=0</text><text x="250" y="64" text-anchor="middle" class="small" data-tex="t=1">t=1</text><text x="390" y="64" text-anchor="middle" class="small" data-tex="t=2">t=2</text><text x="530" y="64" text-anchor="middle" class="small" data-tex="t=3">t=3</text><text x="670" y="64" text-anchor="middle" class="small" data-tex="t=4">t=4</text><path d="M126 100L233 100" class="muted-edge"/><path d="M124.7 213.7L234.4 166.7" class="muted-edge"/><path d="M126 280L233 280" class="muted-edge"/><path d="M264.7 166.3L374.4 213.3" class="muted-edge"/><path d="M264.7 213.7L374.4 166.7" class="muted-edge"/><path d="M266 280L373 280" class="muted-edge"/><path d="M404.7 106.3L514.4 153.3" class="muted-edge"/><path d="M404.7 153.7L514.4 106.7" class="muted-edge"/><path d="M404.7 273.7L514.4 226.7" class="muted-edge"/><path d="M546 100L653 100" class="muted-edge"/><path d="M544.7 166.3L654.4 213.3" class="muted-edge"/><path d="M544.7 226.3L654.4 273.3" class="muted-edge"/><path d="M124.7 153.7L234.4 106.7" class="edge"/><path d="M262.1 110.4L377.1 208.9" class="edge"/><path d="M404.7 226.3L514.4 273.3" class="edge"/><path d="M544.7 273.7L654.4 226.7" class="edge"/><circle cx="110" cy="100" r="16" class="unused"/><text x="110" y="105" text-anchor="middle" class="muted">0</text><circle cx="110" cy="160" r="16" class="active"/><text x="110" y="165" text-anchor="middle">1</text><circle cx="110" cy="220" r="16" class="unused"/><text x="110" y="225" text-anchor="middle" class="muted">2</text><circle cx="110" cy="280" r="16" class="unused"/><text x="110" y="285" text-anchor="middle" class="muted">3</text><text x="78" y="165" text-anchor="end" class="weight">start</text><circle cx="250" cy="100" r="16" class="active"/><text x="250" y="105" text-anchor="middle">0</text><circle cx="250" cy="160" r="16" class="unused"/><text x="250" y="165" text-anchor="middle" class="muted">1</text><circle cx="250" cy="220" r="16" class="unused"/><text x="250" y="225" text-anchor="middle" class="muted">2</text><circle cx="250" cy="280" r="16" class="unused"/><text x="250" y="285" text-anchor="middle" class="muted">3</text><circle cx="390" cy="100" r="16" class="unused"/><text x="390" y="105" text-anchor="middle" class="muted">0</text><circle cx="390" cy="160" r="16" class="unused"/><text x="390" y="165" text-anchor="middle" class="muted">1</text><circle cx="390" cy="220" r="16" class="active"/><text x="390" y="225" text-anchor="middle">2</text><circle cx="390" cy="280" r="16" class="unused"/><text x="390" y="285" text-anchor="middle" class="muted">3</text><circle cx="530" cy="100" r="16" class="unused"/><text x="530" y="105" text-anchor="middle" class="muted">0</text><circle cx="530" cy="160" r="16" class="unused"/><text x="530" y="165" text-anchor="middle" class="muted">1</text><circle cx="530" cy="220" r="16" class="unused"/><text x="530" y="225" text-anchor="middle" class="muted">2</text><circle cx="530" cy="280" r="16" class="active"/><text x="530" y="285" text-anchor="middle">3</text><circle cx="670" cy="100" r="16" class="unused"/><text x="670" y="105" text-anchor="middle" class="muted">0</text><circle cx="670" cy="160" r="16" class="unused"/><text x="670" y="165" text-anchor="middle" class="muted">1</text><circle cx="670" cy="220" r="16" class="active"/><text x="670" y="225" text-anchor="middle">2</text><circle cx="670" cy="280" r="16" class="unused"/><text x="670" y="285" text-anchor="middle" class="muted">3</text><text x="702" y="105" text-anchor="start" class="muted">weight 0</text><text x="702" y="165" text-anchor="start" class="muted">weight 0</text><text x="702" y="225" text-anchor="start" class="weight">weight 1</text><text x="702" y="285" text-anchor="start" class="muted">weight 0</text><text x="410" y="332" text-anchor="middle" class="small">Exactly one arrow leaves each state at every step, tracing a single path 1 → 0 → 2 → 3 → 2.</text></svg>

