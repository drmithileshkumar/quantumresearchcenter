<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc"><title id="title">Undo the record before the final H</title><desc id="desc">Each left node has amplitude one over square root of two. A second controlled NOT sends 00 to 00 and 11 to 10. The final H contributes plus one half twice to 00, and opposite one halves to 10.</desc><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="#246593"/></marker></defs><style>text{font:17px Georgia,serif;fill:#30343b}.heading{font:600 14px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.edge{fill:none;stroke:#246593;stroke-width:1.8;marker-end:url(#arrow)}.node{fill:white;stroke:#246593;stroke-width:1.7}</style>
<text x="480" y="27" text-anchor="middle" class="heading">Undo the record before the final H</text>
<text x="130" y="70" text-anchor="middle" class="heading">After recording</text>
<text x="400" y="70" text-anchor="middle" class="heading">Record undone</text>
<text x="720" y="70" text-anchor="middle" class="heading">After final H</text>
<text x="870" y="95" text-anchor="middle" class="small">Amplitude</text>
<text x="130" y="99" text-anchor="middle" class="small">Each amplitude: 1/√2</text>
<path class="edge" d="M155.00 170.00L373.00 170.00"/>
<text x="265" y="152" text-anchor="middle" class="">1</text>
<path class="edge" d="M155.00 330.00L373.00 330.00"/>
<text x="265" y="312" text-anchor="middle" class="">1</text>
<text x="265" y="120" text-anchor="middle" class="small">CNOT</text>
<path class="edge" d="M425.00 170.00L693.00 170.00"/>
<path class="edge" d="M422.36 181.18L695.85 317.93"/>
<path class="edge" d="M422.36 318.82L695.85 182.07"/>
<path class="edge" d="M425.00 330.00L693.00 330.00"/>
<text x="560" y="150" text-anchor="middle" class="" data-tex="1/\sqrt2">1/√2</text>
<text x="560" y="361" text-anchor="middle" class="" data-tex="-1/\sqrt2">−1/√2</text>
<text x="480" y="190" text-anchor="middle" class="" data-tex="1/\sqrt2">1/√2</text>
<text x="480" y="322" text-anchor="middle" class="" data-tex="1/\sqrt2">1/√2</text>
<circle class="node" cx="720" cy="170" r="24"/>
<text x="720" y="176" text-anchor="middle" class="">00</text>
<text x="865" y="176" text-anchor="middle" class="" data-tex="1/2+1/2=1">1/2 + 1/2 = 1</text>
<circle class="node" cx="720" cy="330" r="24"/>
<text x="720" y="336" text-anchor="middle" class="">10</text>
<text x="865" y="336" text-anchor="middle" class="" data-tex="1/2-1/2=0">1/2 − 1/2 = 0</text>
<circle class="node" cx="130" cy="170" r="24"/>
<text x="130" y="176" text-anchor="middle" class="">00</text>
<circle class="node" cx="400" cy="170" r="24"/>
<text x="400" y="176" text-anchor="middle" class="">00</text>
<circle class="node" cx="130" cy="330" r="24"/>
<text x="130" y="336" text-anchor="middle" class="">11</text>
<circle class="node" cx="400" cy="330" r="24"/>
<text x="400" y="336" text-anchor="middle" class="">10</text>
<text x="480" y="434" text-anchor="middle" class="small">Nodes name complete configurations; edge labels are transition weights.</text>
</svg>