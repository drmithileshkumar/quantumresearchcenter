<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Measurement: project, square the length, then normalize</title>
<desc id="desc">A unit state vector with coordinates square root of three over two and one half has orthogonal projections onto the zero and one axes. The squared lengths give probabilities three quarters and one quarter. Conditional on the observed outcome, the corresponding projection is normalized to the unit basis vector. Only one outcome occurs per run.</desc>
<defs><marker id="measurement-arrow" markerWidth="7" markerHeight="7" refX="9" refY="5" orient="auto" viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
<style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:13px system-ui,sans-serif;fill:#4b5864}.axis{stroke:#a7bccd;stroke-width:1.3}.arrow{fill:none;stroke-width:2.5;marker-end:url(#measurement-arrow)}.guide{stroke:#a7bccd;stroke-width:1.2;stroke-dasharray:5 4;fill:none}</style>
<text class="heading" x="225" y="28" text-anchor="middle">1. Resolve the state into projections</text>
<path class="axis" d="M85 290H355 M85 290V60" fill="none"/>
<path class="guide" d="M285 174.53V290 M285 174.53H85"/>
<path class="arrow" stroke="#246593" d="M85 290L285 174.53"/>
<path class="arrow" stroke="#a64d26" d="M85 290H285"/>
<path class="arrow" stroke="#347449" d="M85 290V174.53"/>
<text x="305" y="160" data-tex="\ket\psi">|ψ⟩</text>
<text x="365" y="297" data-tex="\ket0">|0⟩</text>
<text x="70" y="53" data-tex="\ket1">|1⟩</text>
<text x="185" y="320" text-anchor="middle" data-tex="P_0\ket\psi=\frac{\sqrt3}{2}\ket0">P₀|ψ⟩ = (√3/2)|0⟩</text>
<text x="105" y="155" data-tex="P_1\ket\psi=\frac12\ket1">P₁|ψ⟩ = ½|1⟩</text>
<text class="small" x="225" y="359" text-anchor="middle">Squared projection length = outcome probability</text>
<path class="axis" d="M440 55V335"/>
<text class="heading" x="665" y="28" text-anchor="middle">2. Normalize the observed component</text>
<rect x="475" y="65" width="380" height="115" rx="8" fill="#fcf3ee"/>
<text x="495" y="94" class="heading">Outcome 0 · probability 3/4</text>
<path class="arrow" stroke="#a64d26" d="M510 145H600"/>
<text x="720" y="143" text-anchor="middle" data-tex="\frac{P_0\ket\psi}{\sqrt{3/4}}=\ket0">P₀|ψ⟩ / √(3/4) = |0⟩</text>
<rect x="475" y="200" width="380" height="115" rx="8" fill="#eef6ef"/>
<text x="495" y="229" class="heading">Outcome 1 · probability 1/4</text>
<path class="arrow" stroke="#347449" d="M535 300V245"/>
<text x="720" y="278" text-anchor="middle" data-tex="\frac{P_1\ket\psi}{\sqrt{1/4}}=\ket1">P₁|ψ⟩ / √(1/4) = |1⟩</text>
<text class="small" x="665" y="359" text-anchor="middle">One outcome per run; the retained state has unit length.</text>
</svg>