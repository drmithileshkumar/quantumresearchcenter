<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-labelledby="title desc"><title id="title">Phase kickback</title><desc id="desc">A joint function oracle acts on input x and target minus. The target remains minus while the input acquires the function-dependent sign.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="80" text-anchor="middle" data-tex="\ket{x}">|x⟩</text><line x1="85" y1="75" x2="660" y2="75"/><text x="40" y="165" text-anchor="middle" data-tex="\ket-">|−⟩</text><line x1="85" y1="160" x2="660" y2="160"/><rect x="260.0" y="49.5" width="80" height="135" rx="4"/><text x="300" y="123" text-anchor="middle" data-tex="U_f">U_f</text><text x="515" y="50" text-anchor="middle" data-tex="(-1)^{f(x)}\ket{x}">(−1)^(f(x))|x⟩</text><text x="580" y="145" text-anchor="middle" data-tex="\ket-">|−⟩</text><text x="350" y="220" text-anchor="middle" class="small">No input-dependent record remains in the target.</text></svg>