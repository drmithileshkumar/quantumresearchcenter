<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 245" role="img" aria-labelledby="title desc"><title id="title">Euclid’s algorithm: what stays fixed, what decreases</title><desc id="desc">The pairs 48,18; 18,12; 12,6; and 6,0 have the same greatest common divisor, six. Their second entries decrease from 18 to 12 to 6 to zero, proving termination.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Euclid’s algorithm: what stays fixed, what decreases</text><rect x="30" y="75" width="135" height="55" rx="5" class="node"/><text x="97.5" y="107.5" text-anchor="middle" class="">(48, 18)</text><path d="M165 102 L205 102" class="edge"/><rect x="205" y="75" width="135" height="55" rx="5" class="node"/><text x="272.5" y="107.5" text-anchor="middle" class="">(18, 12)</text><path d="M340 102 L380 102" class="edge"/><rect x="380" y="75" width="135" height="55" rx="5" class="node"/><text x="447.5" y="107.5" text-anchor="middle" class="">(12, 6)</text><path d="M515 102 L555 102" class="edge"/><rect x="555" y="75" width="135" height="55" rx="5" class="accent"/><text x="622.5" y="107.5" text-anchor="middle" class="">(6, 0)</text><text x="360" y="170" text-anchor="middle" class="label">Invariant: gcd(a, b) = 6 throughout this run</text><text x="360" y="203" text-anchor="middle" class="small">Decreasing nonnegative measure: 18 → 12 → 6 → 0</text><text x="360" y="231" text-anchor="middle" class="small">Preservation gives correctness; decrease gives termination.</text></svg>
