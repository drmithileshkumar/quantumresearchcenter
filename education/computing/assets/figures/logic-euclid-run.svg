<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="title desc"><title id="title">Euclid’s algorithm: what stays fixed, what decreases</title><desc id="desc">The pairs 48,18; 18,12; 12,6; and 6,0 all have greatest common divisor six, shown as a constant band. Bars below show the second entry falling from 18 to 12 to 6 to zero, the nonnegative measure that proves termination.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Euclid’s algorithm: what stays fixed, what decreases</text><rect x="30" y="56" width="135" height="50" rx="5" class="node"/><text x="97.5" y="86" text-anchor="middle" class="">(48, 18)</text><path d="M165 81 L205 81" class="edge"/><rect x="205" y="56" width="135" height="50" rx="5" class="node"/><text x="272.5" y="86" text-anchor="middle" class="">(18, 12)</text><path d="M340 81 L380 81" class="edge"/><rect x="380" y="56" width="135" height="50" rx="5" class="node"/><text x="447.5" y="86" text-anchor="middle" class="">(12, 6)</text><path d="M515 81 L555 81" class="edge"/><rect x="555" y="56" width="135" height="50" rx="5" class="accent"/><text x="622.5" y="86" text-anchor="middle" class="">(6, 0)</text><rect x="30" y="122" width="660" height="28" rx="14" fill="#edf5ef" stroke="#9fc4aa"/><text x="360" y="141" text-anchor="middle" class="label" style="fill:#347449" data-math="invariant: \(\gcd(a,b)=6\) at every step">invariant: gcd(a,b)=6 at every step</text><path d="M24 272H696" stroke="#a7bccd" stroke-width="1.2"/><rect x="73.5" y="174.8" width="48" height="97.2" rx="3" fill="#246593" fill-opacity=".8"/><text x="97.5" y="166.8" text-anchor="middle" class="small">b = 18</text><rect x="248.5" y="207.2" width="48" height="64.8" rx="3" fill="#246593" fill-opacity=".8"/><text x="272.5" y="199.2" text-anchor="middle" class="small">b = 12</text><rect x="423.5" y="239.6" width="48" height="32.4" rx="3" fill="#246593" fill-opacity=".8"/><text x="447.5" y="231.6" text-anchor="middle" class="small">b = 6</text><text x="622.5" y="264" text-anchor="middle" class="small">b = 0</text><text x="30" y="292" text-anchor="start" class="small">measure b (nonnegative)</text><text x="690" y="292" text-anchor="end" class="small">b = 0: stop</text><text x="360" y="318" text-anchor="middle" class="small">Preservation gives correctness; decrease gives termination.</text></svg>
