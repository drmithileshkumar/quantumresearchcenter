<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 180" role="img" aria-labelledby="title desc"><title id="title">Reflection about a prepared state</title><desc id="desc">Apply A dagger, reflect about the all-zero state, then apply A. Operations act from left to right.</desc><style>text{font:16px Georgia,serif;fill:#26434b}.small{font:13px Arial,sans-serif}line,path{stroke:#476b70;stroke-width:2;fill:none}rect{fill:#f8fbf9;stroke:#476b70;stroke-width:2}circle{stroke:#476b70;stroke-width:2;fill:#f8fbf9}</style><text x="40" y="80" text-anchor="middle" data-tex="\ket{v}">|v⟩</text><line x1="85" y1="75" x2="710" y2="75"/><rect x="155.0" y="55.0" width="60" height="40" rx="4"/><text x="185" y="81" text-anchor="middle" data-tex="A^\dagger">A†</text><rect x="290.0" y="55.0" width="180" height="40" rx="4"/><text x="380" y="81" text-anchor="middle" data-tex="2\ketbra00-I">2|0⟩⟨0|−I</text><rect x="565.0" y="55.0" width="60" height="40" rx="4"/><text x="595" y="81" text-anchor="middle" data-tex="A">A</text><text x="375" y="145" text-anchor="middle" class="small" data-math="Result: \((2\ketbra\psi\psi-I)\ket{v}\), where \(\ket\psi=A\ket0\)">Result: (2|ψ⟩⟨ψ|−I)|v⟩, where |ψ⟩=A|0⟩</text></svg>