<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Formal model equivalence and the Church–Turing thesis</title><desc id="desc">Turing machines, lambda calculus, and recursive functions compute the same class of functions. Their formal equivalence is proved. Identifying this class with every effective mechanical procedure is the Church–Turing thesis.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#246593"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.small{font:13px system-ui,sans-serif;fill:#626c77}.label{font:600 13px system-ui,sans-serif;fill:#246593}.node{fill:#fff;stroke:#a7bccd;stroke-width:1.5}.accent{fill:#eaf1f7;stroke:#246593;stroke-width:1.5}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}.frame{fill:none;stroke:#a7bccd;stroke-width:1.3;stroke-dasharray:5 4}</style><text x="360" y="28" text-anchor="middle" class="label">Formal model equivalence and the Church–Turing thesis</text><rect x="20" y="65" width="195" height="60" rx="5" class="node"/><text x="117.5" y="100.0" text-anchor="middle" class="">Turing machines</text><rect x="260" y="65" width="195" height="60" rx="5" class="node"/><text x="357.5" y="100.0" text-anchor="middle" class="">Lambda calculus</text><rect x="500" y="65" width="200" height="60" rx="5" class="node"/><text x="600.0" y="100.0" text-anchor="middle" class="">Recursive functions</text><path d="M215 84 L260 84" class="edge"/><path d="M260 106 L215 106" class="edge"/><path d="M455 84 L500 84" class="edge"/><path d="M500 106 L455 106" class="edge"/><text x="360" y="160" text-anchor="middle" class="label">Same computable functions: equivalence of formal models</text><rect x="160" y="220" width="400" height="60" rx="5" class="accent"/><text x="360.0" y="255.0" text-anchor="middle" class="">Informal notion of an effective procedure</text><path d="M360 220 L360 176" class="edge" stroke-dasharray="5 4"/><text x="575" y="202" text-anchor="middle" class="small">Church–Turing thesis</text><text x="360" y="307" text-anchor="middle" class="small">Equivalence concerns computability, not equal running time.</text></svg>
