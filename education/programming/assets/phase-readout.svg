<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc"><title id="title">phase-readout</title><desc id="desc">Phase-oracle readout. U_f is the reversible bit oracle on the input register and the minus target, not an elementary gate. The final input measurement reads the encoded pattern.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H781" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|0…0⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">z</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|1⟩</text><text x="930" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|−⟩</text><rect x="179.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="205" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H⊗n</text><rect x="181.0" y="116" width="48" height="48" rx="3" fill="#e7efeb" /><text x="205" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><rect x="599.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="625" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H⊗n</text><rect x="781.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="805" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M829 62H860 M829 68H860" /><rect x="380" y="35" width="90" height="135" rx="3" fill="#e7efeb" /><text x="425" y="110" text-anchor="middle" stroke="none" fill="#203b37" font-family="DejaVu Sans, sans-serif" font-size="23">U<tspan baseline-shift="sub" font-size="16">f</tspan></text></g></svg>