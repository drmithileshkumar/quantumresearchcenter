<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc"><title id="title">qft-two</title><desc id="desc">Positive-sign two-qubit Fourier circuit. The final SWAP exchanges the two wires; its connected endpoints are a two-wire operation. The controlled phase applies only when both bits are one.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">high bit</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">low bit</text><rect x="186.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="210" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><path d="M390 65V140" /><circle cx="390" cy="140" r="6" fill="#234c46" /><rect x="348.0" y="41" width="84" height="48" rx="3" fill="#e7efeb" /><text x="390" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">P(π/2)</text><rect x="531.0" y="116" width="48" height="48" rx="3" fill="#e7efeb" /><text x="555" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><path d="M740 65V140" /><path d="M730 55L750 75 M730 75L750 55" /><path d="M730 130L750 150 M730 150L750 130" /></g></svg>