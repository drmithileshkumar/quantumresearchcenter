<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 325" width="1000" height="325" role="img" aria-labelledby="title desc"><title id="title">teleport</title><desc id="desc">Teleportation with classical feedforward. Alice’s top measurement gives m and the middle gives n; Bob applies X^n then Z^m using the communicated records. No quantum control from the measured wires is implied.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H621" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">input |ψ⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">m</text><path d="M140 140H621" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">Alice |0⟩</text><text x="930" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">n</text><path d="M140 215H860" /><text x="66" y="221" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">Bob |0⟩</text><text x="930" y="221" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|ψ⟩</text><rect x="176.0" y="116" width="48" height="48" rx="3" fill="#e7efeb" /><text x="200" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><path d="M300 140V215" /><circle cx="300" cy="140" r="6" fill="#234c46" /><circle cx="300" cy="215" r="15" fill="#faf9f6" /><path d="M285 215h30 M300 200v30" /><path d="M420 65V140" /><circle cx="420" cy="65" r="6" fill="#234c46" /><circle cx="420" cy="140" r="15" fill="#faf9f6" /><path d="M405 140h30 M420 125v30" /><rect x="506.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="530" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><rect x="621.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="645" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M669 62H860 M669 68H860" /><rect x="621.0" y="116" width="48" height="48" rx="3" fill="#e7efeb" /><text x="645" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M669 137H860 M669 143H860" /><rect x="709.5" y="191" width="51" height="48" rx="3" fill="#e7efeb" /><text x="735" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">X^n</text><rect x="794.5" y="191" width="51" height="48" rx="3" fill="#e7efeb" /><text x="820" y="222" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">Z^m</text></g></svg>