<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc"><title id="title">coined-walk</title><desc id="desc">A coined cycle-walk step. The open control selects coin zero and the filled control selects coin one. Position arithmetic must be reversible on its specified register.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">coin |0⟩</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">position |x⟩</text><rect x="196.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="220" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><path d="M420 65V140" /><circle cx="420" cy="65" r="6" fill="#faf9f6" /><rect x="367.0" y="116" width="106" height="48" rx="3" fill="#e7efeb" /><text x="420" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">−1 mod N</text><path d="M680 65V140" /><circle cx="680" cy="65" r="6" fill="#234c46" /><rect x="627.0" y="116" width="106" height="48" rx="3" fill="#e7efeb" /><text x="680" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">+1 mod N</text></g></svg>