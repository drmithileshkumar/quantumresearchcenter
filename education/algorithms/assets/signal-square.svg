<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" role="img" aria-labelledby="title desc"><title id="title">signal-square</title><desc id="desc">Two signal calls. Their selected amplitude is 2x²−1, not x², because amplitudes through the other signal state can return.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H860" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">signal qubit</text><rect x="254.0" y="41" width="62" height="48" rx="3" fill="#e7efeb" /><text x="285" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">W(x)</text><rect x="549.0" y="41" width="62" height="48" rx="3" fill="#e7efeb" /><text x="580" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">W(x)</text></g></svg>