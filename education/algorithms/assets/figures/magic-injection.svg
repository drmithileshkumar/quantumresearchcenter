<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" role="img" aria-labelledby="title desc"><title id="title">Injecting a T gate from a magic state</title><desc id="desc">A CNOT from the data to the magic state |A⟩=T|+⟩, a measurement of the magic qubit, and a classically controlled S apply T to the data. Only Clifford operations act; the non-Clifford resource is the state |A⟩, prepared and distilled separately. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Injecting a T gate from a magic state</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="T\ket\psi">T|ψ⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket A">|A⟩</text><path class="wire" d="M135 164L400 164"/><path class="wire" d="M423 161L650 161"/><path class="wire" d="M423 167L650 167"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="m">m</text><path class="wire" d="M205 100L205 164"/><circle cx="205" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="205.0" cy="164" r="14"/><path class="wire" d="M191 164L219 164"/><path class="wire" d="M205 150L205 178"/><rect class="gate" x="377" y="143" width="46" height="42" rx="3"/><path d="M386 170A14 14 0 0 1 414 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M400 170L410 154" stroke="#476b70" stroke-width="1.8"/><path class="wire" d="M592 164L592 121"/><path class="wire" d="M598 164L598 121"/><circle cx="595.0" cy="164" r="4" fill="#476b70"/><rect class="gate" x="566.5" y="79" width="57" height="42" rx="3"/><text x="595" y="106" text-anchor="middle" class="" data-max-width="51" data-tex="S^m">S^m</text></svg>
