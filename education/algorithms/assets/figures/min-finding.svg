<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-labelledby="title desc"><title id="title">Minimum finding as amplification in a classical loop</title><desc id="desc">Each round uses exponential search with a comparator predicate. The expected total number of queries is O(√N); the comparator and the oracle for T are charged per query. Random candidate y → Threshold search for T(x)&lt;T(y) → Found? Set y← x → Budget exhausted: output y</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Minimum finding as amplification in a classical loop</text><rect x="32" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="93" text-anchor="middle" class="" data-max-width="131">Random</text><text x="108.5" y="115" text-anchor="middle" class="" data-max-width="131" data-math="candidate \(y\)">candidate y</text><path d="M185 99L213 99" class="edge"/><rect x="213" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="82" text-anchor="middle" class="" data-max-width="131">Threshold</text><text x="289.5" y="104" text-anchor="middle" class="" data-max-width="131">search for</text><text x="289.5" y="126" text-anchor="middle" class="" data-max-width="131" data-tex="T(x)&lt;T(y)">T(x)&lt;T(y)</text><path d="M366 99L394 99" class="edge"/><rect x="394" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="104" text-anchor="middle" class="" data-max-width="131" data-math="Found? Set \(y\leftarrow x\)">Found? Set y← x</text><path d="M547 99L575 99" class="edge"/><rect x="575" y="54" width="153" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="82" text-anchor="middle" class="" data-max-width="131">Budget</text><text x="651.5" y="104" text-anchor="middle" class="" data-max-width="131">exhausted:</text><text x="651.5" y="126" text-anchor="middle" class="" data-max-width="131" data-math="output \(y\)">output y</text></svg>
