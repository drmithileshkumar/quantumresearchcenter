<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="title desc"><title id="title">Minimum finding as amplification in a classical loop</title><desc id="desc">Each round uses exponential search with a comparator predicate. The expected total number of queries is O(√N); the comparator and the oracle for T are charged per query. A loop. Start with a random candidate y. While the query budget lasts, run a quantum threshold search for some x with T(x) &lt; T(y); if it returns a better x, set y to x, and repeat. When the budget is exhausted, output y.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Minimum finding as amplification in a classical loop</text><path d="M150 175L190 175" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M370 175L430 175" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><text x="400" y="167" text-anchor="middle" class="small" style="fill:#246593" data-max-width="200">yes</text><path d="M280 139L280 96" fill="none" stroke="#347449" stroke-width="1.7" marker-end="url(#arrow)"/><text x="292" y="124" text-anchor="start" class="small" style="fill:#347449" data-max-width="200">no</text><path d="M560 203L560 260" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M460 282L280 282L280 211" fill="none" stroke="#6b7885" stroke-width="1.7" marker-end="url(#arrow)"/><text x="296" y="272" text-anchor="start" class="small" style="fill:#6b7885" data-max-width="200">repeat, lower threshold</text><rect x="30" y="155" width="120" height="40" rx="20" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="90" y="180" text-anchor="middle" class="" data-max-width="108" data-math="random \(y\)">random y</text><path d="M280 139L370 175L280 211L190 175Z" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="280" y="180" text-anchor="middle" class="" data-max-width="168">budget left?</text><rect x="210" y="56" width="140" height="40" rx="20" fill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="280" y="81" text-anchor="middle" class="" data-max-width="128" data-math="output \(y\)">output y</text><rect x="430" y="147" width="260" height="56" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="560" y="170" text-anchor="middle" class="" data-max-width="248" data-math="threshold search for \(x\) with">threshold search for x with</text><text x="560" y="190" text-anchor="middle" class="" data-max-width="248" data-tex="T(x)&lt;T(y)">T(x)&lt;T(y)</text><rect x="460" y="260" width="200" height="44" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="560" y="287" text-anchor="middle" class="" data-max-width="188" data-math="if better: \(y\leftarrow x\)">if better: y← x</text><text x="380" y="332" text-anchor="middle" class="small" data-max-width="680" data-math="expected total queries \(O(\sqrt N)\); comparator and \(T\)-oracle charged per query">expected total queries O(√N); comparator and T-oracle charged per query</text></svg>
