<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Why simulation degree is about αt</title><desc id="desc">log₁₀|Jₖ(tau)| for tau=α t=20. The Jacobi–Anger coefficients of e^(−itau x) stay of moderate size up to k≈tau and then fall off faster than exponentially, so truncating at k≈tau+O(log(1/ε)) costs little extra degree for high precision. Horizontal axis: Chebyshev degree k; vertical axis: log₁₀|Jₖ(20)|. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Why simulation degree is about αt</text><path d="M95 304.375H700" class="grid"/><text x="83" y="309.375" text-anchor="end" class="small" data-max-width="700">-15</text><path d="M95 226.25H700" class="grid"/><text x="83" y="231.25" text-anchor="end" class="small" data-max-width="700">-10</text><path d="M95 148.125H700" class="grid"/><text x="83" y="153.125" text-anchor="end" class="small" data-max-width="700">-5</text><path d="M95 70H700" class="grid"/><text x="83" y="75" text-anchor="end" class="small" data-max-width="700">0</text><path d="M106.635 320V326" stroke="#6b7885"/><text x="106.635" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M222.981 320V326" stroke="#6b7885"/><text x="222.981" y="344" text-anchor="middle" class="small" data-max-width="700">10</text><path d="M339.327 320V326" stroke="#6b7885"/><text x="339.327" y="344" text-anchor="middle" class="small" data-max-width="700">20</text><path d="M455.673 320V326" st