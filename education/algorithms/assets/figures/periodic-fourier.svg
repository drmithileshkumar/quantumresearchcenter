<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">A period-2 pattern becomes two frequencies</title><desc id="desc">Probabilities before and after F₈ for the state 1/2(|0⟩+|2⟩+|4⟩+|6⟩). Four positions spaced by 2 become two frequencies spaced by 8/2=4. Shifting the input pattern by one changes only phases of the output, not these probabilities. Horizontal axis: basis label x or y; vertical axis: probability. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A period-2 pattern becomes two frequencies</text><path d="M95 320H700" class="grid"/><text x="83" y="325" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 215.833H700" class="grid"/><text x="83" y="220.833" text-anchor="end" class="small" data-max-width="700">0.25</text><path d="M95 111.667H700" class="grid"/><text x="83" y="116.667" text-anchor="end" class="small" data-max-width="700">0.5</text><path d="M139.268 320V326" stroke="#6b7885"/><text x="139.268" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M213.049 320V326" stroke="#6b7885"/><text x="213.049" y="344" text-anchor="middle" class="small" data-max-width="700">1</text><path d="M286.829 320V326" stroke="#6b7885"/><text x="286.829" y="344" text-anchor="middle" class="small" data-max-width="700">2</text><path d="M360.61 320V326" stroke="#6b7885"/><text x="360.61" y="344" text-anchor="middle" class="small" data-max-width="700">3</text><path d="M434.39 320V326" stroke="#6b7885"/><text x="434.39" y="344" text-anchor="middle" class="small" data-max-width="700">4</text><path d="M508.171 320V326" stroke="#6b7885"/><text x="508.171" y="344" text-anchor="middle" class="small" data-max-width="700">5</text><path d="M581.951 320V326" stroke="#6b7885"/><text x="581.951" y="344" text-anchor="middle" class="small" data-max-width="700">6</text><path d="M655.732 320V326" stroke="#6b7885"/><text x="655.732" y="344" text-anchor="middle" class="small" data-max-width="700">7</text><path d="M95 320H700M95 320V70" stroke="#6b7885" fill="none"/><text x="397.5" y="372" text-anchor="middle" class="small" data-max-width="560" data-math="basis label \(x\) or \(y\)">basis label x or y</text><text x="91" y="54" text-anchor="start" class="small" data-max-width="400">probability</text><rect x="118.726" y="215.833" width="16" height="104.167" fill="#246593"/><rect x="192.506" y="320" width="16" height="0" fill="#246593"/><rect x="266.287" y="215.833" width="16" height="104.167" fill="#246593"/><rect x="340.067" y="320" width="16" height="0" fill="#246593"/><rect x="413.848" y="215.833" width="16" height="104.167" fill="#246593"/><rect x="487.628" y="320" width="16" height="0" fill="#246593"/><rect x="561.409" y="215.833" width="16" height="104.167" fill="#246593"/><rect x="635.189" y="320" width="16" height="0" fill="#246593"/><path d="M530 73H560" stroke="#246593" stroke-width="3"/><text x="568" y="78" text-anchor="start" class="small" data-max-width="170" data-math="before: \(|\psi_0\rangle\)">before: |ψ₀⟩</text><rect x="143.811" y="111.667" width="16" height="208.333" fill="#a64d26"/><rect x="217.591" y="320" width="16" height="0" fill="#a64d26"/><rect x="291.372" y="320" width="16" height="0" fill="#a64d26"/><rect x="365.152" y="320" width="16" height="0" fill="#a64d26"/><rect x="438.933" y="111.667" width="16" height="208.333" fill="#a64d26"/><rect x="512.713" y="320" width="16" height="0" fill="#a64d26"/><rect x="586.494" y="320"