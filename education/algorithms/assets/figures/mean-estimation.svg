<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">Encoding a mean as a success probability</title><desc id="desc">P prepares Σ_x√(q(x))|x⟩. The rotation, controlled on a clean computation of v(x)∈[0,1], puts amplitude √(v(x)) on the flag value 1, so the flag is 1 with probability mathbb E[v]. This whole circuit is the A handed to amplitude estimation. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Encoding a mean as a success probability</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\ket x">|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-math="flag \(\ket0\)">flag |0⟩</text><path class="wire" d="M135 164L595 164"/><path class="wire" d="M618 161L650 161"/><path class="wire" d="M618 167L650 167"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-math="1 w.p. \(\mathbb E[v]\)">1 w.p. mathbb E[v]</text><rect class="gate" x="222" y="79" width="46" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="P">P</text><path class="wire" d="M420 100L420 143"/><circle cx="420" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="378" y="143" width="84" height="42" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="78" data-tex="R_{v(x)}">R_(v(x))</text><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><path d="M581 170A14 14 0 0 1 609 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 170L605 154" stroke="#476b70" stroke-width="1.8"/><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-tex="R_{v}\ket0=\sqrt{1-v}\,\ket0+\sqrt v\,\ket1">R_v|0⟩=√(1−v) |0⟩+√v |1⟩</text></svg>
