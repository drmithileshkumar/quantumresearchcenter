<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">Resources for the Deutsch circuit as drawn</title><desc id="desc">Ideal oracle access is assumed. A concrete implementation must add the cost of building the oracle, which the query count deliberately excludes. Columns: Resource, Cost or assumption. Queries, One application of U_f; Qubits, Two, plus any workspace inside the oracle; Other gates, Three Hadamards, and one X if both qubits start in |0⟩; Measurement, One computational-basis measurement; Repetitions, One: the ideal circuit is exact; Oracle construction, Excluded from the query count; charged in a gate count</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Resources for the Deutsch circuit as drawn</text><rect x="32" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="206" y="83" text-anchor="middle" class="small" data-max-width="326">Resource</text><rect x="380" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="554" y="83" text-anchor="middle" class="small" data-max-width="326">Cost or assumption</text><rect x="32" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="131" text-anchor="middle" class="" data-max-width="326">Queries</text><rect x="380" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="131" text-anchor="middle" class="" data-max-width="326" data-math="One application of \(U_f\)">One application of U_f</text><rect x="32" y="150" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="206" y="186" text-anchor="middle" class="" data-max-width="326">Qubits</text><rect x="380" y="150" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="554" y="175" text-anchor="middle" class="" data-max-width="326">Two, plus any workspace inside the</text><text x="554" y="197" text-anchor="middle" class="" data-max-width="326">oracle</text><rect x="32" y="212" width="348" height="62" fill="#fff" class="grid"/><text x="206" y="248" text-anchor="middle" class="" data-max-width="326">Other gates</text><rect x="380" y="212" width="348" height="62" fill="#fff" class="grid"/><text x="554" y="237" text-anchor="middle" class="" data-max-width="326" data-math="Three Hadamards, and one \(X\) if both">Three Hadamards, and one X if both</text><text x="554" y="259" text-anchor="middle" class="" data-max-width="326" data-math="qubits start in \(\ket0\)">qubits start in |0⟩</text><rect x="32" y="274" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="206" y="303" text-anchor="middle" class="" data-max-width="326">Measurement</text><rect x="380" y="274" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="554" y="303" text-anchor="middle" class="" data-max-width="326">One computational-basis measurement</text><rect x="32" y="322" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="351" text-anchor="middle" class="" data-max-width="326">Repetitions</text><rect x="380" y="322" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="351" text-anchor="middle" class="" data-max-width="326">One: the ideal circuit is exact</text><rect x="32" y="370" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="206" y="406" text-anchor="middle" class="" data-max-width="326">Oracle construction</text><rect x="380" y="370" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="554" y="395" text-anchor="middle" class="" data-max-width="326">Excluded from the query count; charged</text><text x="554" y="417" text-anchor="middle" class="" data-max-width="326">in a gate count</text></svg>
