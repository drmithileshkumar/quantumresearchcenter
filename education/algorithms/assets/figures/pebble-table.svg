<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 318" role="img" aria-labelledby="title desc"><title id="title">Trading time for space in reversible computation</title><desc id="desc">For a chain of k stages, each computed from the previous one. A pebble is a stored intermediate value. The recursive strategy holds fewer values at once but recomputes some of them. Columns: Strategy, Pebbles held at once, Moves, Example k=4. Keep everything, then uncompute, k, 2k−1, 4 pebbles, 7 moves; Recursive (Bennett), about log₂k+1, about k^(log₂ 3)≈ k^(1.58), 3 pebbles, 9 moves; Minimum possible, ⌈log₂(k+1)⌉, grows quickly as pebbles shrink, 2 pebbles: impossible</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Trading time for space in reversible computation</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152">Strategy</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="79" text-anchor="middle" class="small" data-max-width="152">Pebbles held at</text><text x="293" y="101" text-anchor="middle" class="small" data-max-width="152">once</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="90" text-anchor="middle" class="small" data-max-width="152">Moves</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="90" text-anchor="middle" class="small" data-max-width="152" data-math="Example \(k=4\)">Example k=4</text><rect x="32" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="119" y="141" text-anchor="middle" class="" data-max-width="152">Keep everything,</text><text x="119" y="163" text-anchor="middle" class="" data-max-width="152">then uncompute</text><rect x="206" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="293" y="152" text-anchor="middle" class="" data-max-width="152" data-tex="k">k</text><rect x="380" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="467" y="152" text-anchor="middle" class="" data-max-width="152" data-tex="2k-1">2k−1</text><rect x="554" y="116" width="174" height="62" fill="#fff" class="grid"/><text x="641" y="141" text-anchor="middle" class="" data-max-width="152">4 pebbles, 7</text><text x="641" y="163" text-anchor="middle" class="" data-max-width="152">moves</text><rect x="32" y="178" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="119" y="203" text-anchor="middle" class="" data-max-width="152">Recursive</text><text x="119" y="225" text-anchor="middle" class="" data-max-width="152">(Bennett)</text><rect x="206" y="178" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="293" y="214" text-anchor="middle" class="" data-max-width="152" data-math="about \(\log_2k+1\)">about log₂k+1</text><rect x="380" y="178" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="467" y="203" text-anchor="middle" class="" data-max-width="152">about</text><text x="467" y="225" text-anchor="middle" class="" data-max-width="152" data-tex="k^{\log_2 3}\approx k^{1.58}">k^(log₂ 3)≈ k^(1.58)</text><rect x="554" y="178" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="641" y="203" text-anchor="middle" class="" data-max-width="152">3 pebbles, 9</text><text x="641" y="225" text-anchor="middle" class="" data-max-width="152">moves</text><rect x="32" y="240" width="174" height="62" fill="#fff" class="grid"/><text x="119" y="276" text-anchor="middle" class="" data-max-width="152">Minimum possible</text><rect x="206" y="240" width="174" height="62" fill="#fff" class="grid"/><text x="293" y="276" text-anchor="middle" class="" data-max-width="152" data-tex="\lceil\log_2(k+1)\rceil">⌈log₂(k+1)⌉</text><rect x="380" y="240" width="174" height="62" fill="#fff" class="grid"/><text x="467" y="265" text-anchor="middle" class="" data-max-width="152">grows quickly as</text><text x="467" y="287" text-anchor="middle" class="" data-max-width="152">pebbles shrink</text><rect x="554" y="240" width="174" height="62" fill="#fff" class="grid"/><text x="641" y="265" text-anchor="middle" class="" data-max-width="152">2 pebbles:</text><text x="641" y="287" text-anchor="middle" class="" data-max-width="152">impossible</text></svg>
