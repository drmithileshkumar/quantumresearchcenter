<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Eigenvalues of a cycle are cosines</title><desc id="desc">The adjacency matrix of a cycle of N=12 vertices has Fourier modes as eigenvectors, with eigenvalues 2cos(2π k/N) (bars). The curve shows the continuous dispersion relation; its slope sets the speed of a wave packet. Horizontal axis: mode k; vertical axis: eigenvalue. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Eigenvalues of a cycle are cosines</text><path d="M95 308.636H700" class="grid"/><text x="83" y="313.636" text-anchor="end" class="small" data-max-width="700">-2</text><path d="M95 251.818H700" class="grid"/><text x="83" y="256.818" text-anchor="end" class="small" data-max-width="700">-1</text><path d="M95 195H700" class="grid"/><text x="83" y="200" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 138.182H700" class="grid"/><text x="83" y="143.182" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 81.3636H700" class="grid"/><text x="83" y="86.3636" text-anchor="end" class="small" data-max-width="700">2</text><path d="M119.2 320V326" stroke="#6b7885"/><text x="119.2" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M264.4 320V326" stroke="#6b7885"/><text x="264.4" y="344" text-anchor="middle" class="small" data-max-width="700">3</text><path d="M409.6 320V326" stroke="#6b7885"/><text x="409.6" y="344" text-anchor=