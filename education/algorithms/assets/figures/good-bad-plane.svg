<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">Amplification in the good–bad plane</title><desc id="desc">The prepared state |ψ⟩ lies at angle θ above the bad axis, with sin²θ=p. The predicate reflection S_G sends it to angle −θ; the reflection about |ψ⟩ then sends it to 3θ. Each iteration rotates by 2θ toward |G⟩. Drawn for θ=20°. |ψ⟩ at θ: 20 degrees; S_G|ψ⟩ at −θ: -20 degrees; Q|ψ⟩ at 3θ: 60 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Amplification in the good–bad plane</text><circle cx="215" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M75 230L360 230" class="edge" style="stroke:#6b7885"/><path d="M215 370L215 85" class="edge" style="stroke:#6b7885"/><text x="366" y="236" text-anchor="start" class="small" data-max-width="120" data-math="bad direction \(\ket B\)">bad direction |B⟩</text><text x="215" y="73" text-anchor="middle" class="small" data-max-width="300" data-math="good direction \(\ket G\)">good direction |G⟩</text><path d="M215 230L323.065 190.668" class="edge" style="stroke:#246593"/><circle cx="323.065" cy="190.668" r="4" fill="#246593"/><path d="M430 120H460" stroke="#246593" stroke-width="3"/><text x="472" y="125" text-anchor="start" class="small" data-max-width="270" data-math="\(\ket\psi\) at \(\theta\)">|ψ⟩ at θ</text><path d="M215 230L323.065 269.332" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="323.065" cy="269.332" r="4" fill="#a64d26"/><path d="M430 190H460" stroke="#a64d26" stroke-width="3" stroke-dasharray="5 4"/><text x="472" y="195" text-anchor="start" class="small" data-max-width="270" data-math="\(S_G\ket\psi\) at \(-\theta\)">S_G|ψ⟩ at −θ</text><path d="M215 230L272.5 130.407" class="edge" style="stroke:#347449"/><circle cx="272.5" cy="130.407" r="4" fill="#347449"/><path d="M430 260H460" stroke="#347449" stroke-width="3"/><text x="472" y="265" text-anchor="start" class="small" data-max-width="270" data-math="\(Q\ket\psi\) at \(3\theta\)">Q|ψ⟩ at 3θ</text></svg>
