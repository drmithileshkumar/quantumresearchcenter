<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">What amplification can and cannot do</title><desc id="desc">Query counts in the black-box model. The Ω(√N) bound holds for every quantum algorithm that accesses the input only through the oracle; larger speedups need structure. Columns: Task, Classical queries, Quantum queries. Find 1 of N marked, Θ(N), Θ(√N), optimal; Find minimum of N, Θ(N), Θ(√N); Estimate p to ε, Θ(1/ε²) samples, Θ(1/ε); Brute-force SAT, n variables, 2ⁿ, 2^(n/2), still exponential; Period finding, superpolynomial (best known), polynomial, uses structure</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">What amplification can and cannot do</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Task</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Classical queries</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Quantum queries</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210" data-math="Find 1 of \(N\) marked">Find 1 of N marked</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="\Theta(N)">Θ(N)</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(\Theta(\sqrt N)\), optimal">Θ(√N), optimal</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210" data-math="Find minimum of \(N\)">Find minimum of N</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="\Theta(N)">Θ(N)</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="\Theta(\sqrt N)">Θ(√N)</text><rect x="32" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="227" text-anchor="middle" class="" data-max-width="210" data-math="Estimate \(p\) to \(\epsilon\)">Estimate p to ε</text><rect x="264" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="210" data-math="\(\Theta(1/\epsilon^2)\) samples">Θ(1/ε²) samples</text><rect x="496" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="\Theta(1/\epsilon)">Θ(1/ε)</text><rect x="32" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="271" text-anchor="middle" class="" data-max-width="210" data-math="Brute-force SAT, \(n\)">Brute-force SAT, n</text><text x="148" y="293" text-anchor="middle" class="" data-max-width="210">variables</text><rect x="264" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="282" text-anchor="middle" class="" data-max-width="210" data-tex="2^n">2ⁿ</text><rect x="496" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="271" text-anchor="middle" class="" data-max-width="210" data-math="\(2^{n/2}\), still">2^(n/2), still</text><text x="612" y="293" text-anchor="middle" class="" data-max-width="210">exponential</text><rect x="32" y="308" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="344" text-anchor="middle" class="" data-max-width="210">Period finding</text><rect x="264" y="308" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="333" text-anchor="middle" class="" data-max-width="210">superpolynomial (best</text><text x="380" y="355" text-anchor="middle" class="" data-max-width="210">known)</text><rect x="496" y="308" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="333" text-anchor="middle" class="" data-max-width="210">polynomial, uses</text><text x="612" y="355" text-anchor="middle" class="" data-max-width="210">structure</text></svg>
