<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 370" role="img" aria-labelledby="title desc"><title id="title">The variational loop</title><desc id="desc">The quantum computer prepares trial states and measures Pauli groups; the classical computer estimates E(θ) and its gradient and chooses new parameters. The loop repeats until improvements fall below their statistical uncertainty. A loop across two machines. On the quantum computer: prepare U(θ)|0ⁿ⟩, then measure grouped Pauli strings. The bit strings go to the classical computer, which estimates E(θ) and its gradient and updates θ; the new θ returns to the quantum computer. The loop stops when improvements fall below their statistical uncertainty.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The variational loop</text><rect x="30" y="52" width="700" height="112" rx="12" fill="#f1ecf7" fill-opacity=".55" stroke="#b39dd0" stroke-dasharray="4 4"/><text x="44" y="74" text-anchor="start" class="small" style="font-weight:600;fill:#765391;letter-spacing:.04em">QUANTUM COMPUTER</text><rect x="30" y="200" width="700" height="112" rx="12" fill="#eef4f8" fill-opacity=".55" stroke="#a7bccd" stroke-dasharray="4 4"/><text x="44" y="222" text-anchor="start" class="small" style="font-weight:600;fill:#246593;letter-spacing:.04em">CLASSICAL COMPUTER</text><path d="M330 112L405 112" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M520 136L520 238" fill="none" stroke="#765391" stroke-width="1.7" marker-end="url(#arrow)"/><text x="532" y="186" text-anchor="start" class="small" style="fill:#765391" data-max-width="200">bit strings</text><path d="M405 262L330 262" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><text x="367.5" y="254" text-anchor="middle" class="small" style="fill:#246593" data-max-width="200" data-math="\(E\), \(\nabla E\)">E, nabla E</text><path d="M215 238L215 136" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><text x="203" y="186" text-anchor="end" class="small" style="fill:#246593" data-max-width="200" data-math="new \(\theta\)">new θ</text><rect x="100" y="88" width="230" height="48" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="215" y="117" text-anchor="middle" class="" data-max-width="218" data-math="prepare \(U(\theta)\ket{0^n}\)">prepare U(θ)|0ⁿ⟩</text><rect x="405" y="88" width="230" height="48" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="520" y="107" text-anchor="middle" class="" data-max-width="218">measure grouped Pauli</text><text x="520" y="127" text-anchor="middle" class="" data-max-width="218">strings</text><rect x="405" y="238" width="230" height="48" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="520" y="257" text-anchor="middle" class="" data-max-width="218" data-math="estimate \(E(\theta)\) and">estimate E(θ) and</text><text x="520" y="277" text-anchor="middle" class="" data-max-width="218">gradient</text><rect x="100" y="238" width="230" height="48" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="215" y="267" text-anchor="middle" class="" data-max-width="218" data-math="update \(\theta\)">update θ</text><text x="380" y="345" text-anchor="middle" class="small" data-max-width="680">repeat until improvements fall below their statistical uncertainty</text></svg>
