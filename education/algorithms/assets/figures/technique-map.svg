<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 914" role="img" aria-labelledby="title desc"><title id="title">Techniques of the course and where they are used</title><desc id="desc">Named algorithms are applications or compositions of techniques. Later chapters reuse the analysis of earlier ones rather than repeating it. Columns: Chapter, Technique, Representative uses. 2, Coherent computation, Clean oracles, reversible arithmetic, reflections; 3, Phase encoding, Bernstein–Vazirani, Deutsch–Jozsa, phase arithmetic; 4, Fourier methods, Phase estimation, period finding, factoring; 5, Amplitude manipulation, Amplification, amplitude estimation, minimum finding; 6, Quantum walks, Walk search, element distinctness; 7, Operator embedding, Block encodings, linear combinations of unitaries; 8, Polynomial transformations, Signal processing, filtering, matrix inversion; 9, Evolution engineering, Product formulas, simulation, adiabatic evolution; 10, Variational methods, Variational eigensolver, QAOA; 11, Adaptive measurement, Iterative phase estimation, measurement-based computation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Techniques of the course and where they are used</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Chapter</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-