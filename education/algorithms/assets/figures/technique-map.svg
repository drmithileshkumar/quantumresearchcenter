 x="612" y="755" text-anchor="middle" class="" data-max-width="210">Variational eigensolver,</text><text x="612" y="777" text-anchor="middle" class="" data-max-width="210">QAOA</text><rect x="32" y="792" width="232" height="106" fill="#f5f8fa" class="grid"/><text x="148" y="850" text-anchor="middle" class="" data-max-width="210">11</text><rect x="264" y="792" width="232" height="106" fill="#f5f8fa" class="grid"/><text x="380" y="850" text-anchor="middle" class="" data-max-width="210">Adaptive measurement</text><rect x="496" y="792" width="232" height="106" fill="#f5f8fa" class="grid"/><text x="612" y="817" text-anchor="middle" class="" data-max-width="210">Iterative phase</text><text x="612" y="839" text-anchor="middle" class="" data-max-width="210">estimation,</text><text x="612" y="861" text-anchor="middle" class="" data-max-width="210">measurement-based</text><text x="612" y="883" text-anchor="middle" class="" data-max-width="210">computation</text></svg>
