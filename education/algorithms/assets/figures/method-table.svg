ta-max-width="152">QSP</text><rect x="206" y="226" width="174" height="62" fill="#fff" class="grid"/><text x="293" y="251" text-anchor="middle" class="" data-max-width="152" data-tex="\lambda t+\log(1/\epsilon)">λ t+log(1/ε)</text><text x="293" y="273" text-anchor="middle" class="" data-max-width="152">calls</text><rect x="380" y="226" width="174" height="62" fill="#fff" class="grid"/><text x="467" y="262" text-anchor="middle" class="" data-max-width="152" data-tex="O(\log L)">O(log L)</text><rect x="554" y="226" width="174" height="62" fill="#fff" class="grid"/><text x="641" y="262" text-anchor="middle" class="" data-max-width="152">optimal scaling</text></svg>
