<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-labelledby="title desc"><title id="title">Three families of simulation methods</title><desc id="desc">Costs for H=ΣⱼhⱼPⱼ with L terms and 1-norm λ, up to constants and logarithmic factors. Block-encoding calls each cost a PREPARE and SELECT over all terms. Columns: Method, Cost, Ancillas, Strength. Product formula, order 2k, L t^(1+1/2k)/ε^(1/2k) exponentials, none, simple; exploits commuting terms; Truncated Taylor (LCU), λ tlog(λ t/ε) calls, O(log L)+, log precision; Qubitization + QSP, λ t+log(1/ε) calls, O(log L), optimal scaling</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Three families of simulation methods</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152">Method</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">Cost</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Ancillas</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Strength</text><rect x="32" y="102" width="174" height="62" fill="#fff" class="grid"/><text x="119" y="127" text-anchor="middle" class="" data-max-widt