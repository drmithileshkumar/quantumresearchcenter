<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 476" role="img" aria-labelledby="title desc"><title id="title">Element distinctness on the Johnson graph</title><desc id="desc">Vertices are r-subsets with their stored values. Choosing r=N^(2/3) balances setup against search and gives O(N^(2/3)) queries, which is optimal. The algorithm stores r values in coherent memory. Columns: Parameter, Value, Reason. Setup S, r queries, query every element of the first subset; Update U, O(1) queries, swap one element, reuse the rest; Check C, 0 queries, stored values reveal a collision; Marked fraction ε, ≈ r²/N², subset must contain both colliding indices; Spectral gap delta, ≈1/r, property of the Johnson graph; Total, r+N/√r, minimized at r=N^(2/3)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Element distinctness on the Johnson graph</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Parameter</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Value</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Reason</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210" data-math="Setup \(\mathsf S\)">Setup S</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210" data-math="\(r\) queries">r queries</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">query every element of</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">the first subset</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210" data-math="Update \(\mathsf U\)">Update U</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210" data-math="\(O(1)\) queries">O(1) queries</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210">swap one element, reuse</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">the rest</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210" data-math="Check \(\mathsf C\)">Check C</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="262" text-anchor="middle" class="" data-max-width="210">0 queries</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="251" text-anchor="middle" class="" data-max-width="210">stored values reveal a</text><text x="612" y="273" text-anchor="middle" class="" data-max-width="210">collision</text><rect x="32" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="324" text-anchor="middle" class="" data-max-width="210" data-math="Marked fraction \(\varepsilon\)">Marked fraction ε</text><rect x="264" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="324" text-anchor="middle" class="" data-max-width="210" data-tex="\approx r^2/N^2">≈ r²/N²</text><rect x="496" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="313" text-anchor="middle" class="" data-max-width="210">subset must contain both</text><text x="612" y="335" text-anchor="middle" class="" data-max-width="210">colliding indices</text><rect x="32" y="350" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="386" text-anchor="middle" class="" data-max-width="210" data-math="Spectral gap \(\delta\)">Spectral gap delta</text><rect x="264" y="350" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="386" text-anchor="middle" class="" data-max-width="210" data-tex="\approx1/r">≈1/r</text><rect x="496" y="350" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="375" text-anchor="middle" class="" data-max-width="210">property of the Johnson</text><text x="612" y="397" text-anchor="middle" class="" data-max-width="210">graph</text><rect x="32" y="412" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="441" text-anchor="middle" class="" data-max-width="210">Total</text><rect x="264" y="412" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="441" text-anchor="middle" class="" data-max-width="210" data-tex="r+N/\sqrt r">r+N/√r</text><rect x="496" y="412" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="441" text-anchor="middle" class="" data-max-width="210" data-math="minimized at \(r=N^{2/3}\)">minimized at r=N^(2/3)</text></svg>
