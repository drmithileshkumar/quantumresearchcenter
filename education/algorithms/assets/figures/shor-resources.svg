<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">Where the cost of Shor’s algorithm goes</title><desc id="desc">Asymptotic counts for an n-bit modulus with schoolbook arithmetic. Concrete estimates for cryptographic sizes also depend on the error-correction scheme, physical error rates, and arithmetic optimizations. Columns: Component, Gates, Qubits. Modular exponentiation, O(n³), n plus O(n) workspace; Inverse QFT, O(n²), or O(nlog n) approximate, 2n, or 1 recycled; Continued fractions, gcd, classical, polynomial, none; Repetitions, a few runs, none</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Where the cost of Shor’s algorithm goes</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Component</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Gates</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Qubits</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">Modular exponentiation</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="O(n^3)">O(n³)</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(n\) plus \(O(n)\) workspace">n plus O(n) workspace</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="186" text-anchor="middle" class="" data-max-width="210">Inverse QFT</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="175" text-anchor="middle" class="" data-max-width="210" data-math="\(O(n^2)\), or \(O(n\log n)\)">O(n²), or O(nlog n)</text><text x="380" y="197" text-anchor="middle" class="" data-max-width="210">approximate</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="186" text-anchor="middle" class="" data-max-width="210" data-math="\(2n\), or 1 recycled">2n, or 1 recycled</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210">Continued fractions, gcd</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210">classical, polynomial</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210">none</text><rect x="32" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="289" text-anchor="middle" class="" data-max-width="210">Repetitions</text><rect x="264" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="289" text-anchor="middle" class="" data-max-width="210">a few runs</text><rect x="496" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="289" text-anchor="middle" class="" data-max-width="210">none</text></svg>
