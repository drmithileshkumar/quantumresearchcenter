<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">A non-unitary matrix changes lengths unevenly</title><desc id="desc">A=diag(1,1/2) leaves |0⟩ unchanged, halves |1⟩, and maps |+⟩ to a vector of length √(5/8) pointing closer to |0⟩. No unitary, which preserves every length, can do this. (Vectors are drawn at unit length; the legend gives the true lengths.) |+⟩, length 1: 45 degrees; A|+⟩, length √(5/8)≈0.79: 26.57 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A non-unitary matrix changes lengths unevenly</text><circle cx="215" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M75 230L360 230" class="edge" style="stroke:#6b7885"/><path d="M215 370L215 85" class="edge" style="stroke:#6b7885"/><text x="366" y="236" text-anchor="start" class="small" data-max-width="120" data-tex="\ket0">|0⟩</text><text x="215" y="73" text-anchor="middle" class="small" data-max-width="300" data-tex="\ket1">|1⟩</text><path d="M215 230L296.317 148.683" class="edge" style="stroke:#246593"/><circle cx="296.317" cy="148.683" r="4" fill="#246593"/><path d="M430 120H460" stroke="#246593" stroke-width="3"/><text x="472" y="125" text-anchor="start" class="small" data-max-width="270" data-math="\(\ket+\), length 1">|+⟩, length 1</text><path d="M215 230L317.855 178.562" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="317.855" cy="178.562" r="4" fill="#a64d26"/><path d="M430 190H460" stroke="#a64d26" stroke-width="3" stroke-dasharray="5 4"/><text x="472" y="195" text-anchor="start" class="small" data-max-width="270" data-math="\(A\ket+\), length \(\sqrt{5/8}\approx0.79\)">A|+⟩, length √(5/8)≈0.79</text></svg>
