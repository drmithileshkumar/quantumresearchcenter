<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" role="img" aria-labelledby="title desc"><title id="title">Forms of access and what they do not include</title><desc id="desc">Each form of access is a separate assumption. Possessing one does not provide the others, and each must be implemented and paid for in an end-to-end cost. Columns: Given, Allows, Does not by itself provide. Oracle U as a sealed box, Applying U, also on superpositions, U†, controlled-U, a gate count; Gate sequence for U, Inverse and controlled versions, cost, Cheap implementation if the sequence is long; One copy of |ψ⟩, One use of the state, More copies; a preparation circuit; Classical table of N entries, Reading entries, A quantum state or oracle without loading cost</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Forms of access and what they do not include</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Given</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Allows</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Does not by itself</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">provide</text><rect x="32" y="116" width="232" height="62" 