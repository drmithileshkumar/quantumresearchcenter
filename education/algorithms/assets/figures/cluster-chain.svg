<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">Measurement-based computation on a chain</title><desc id="desc">Qubits in |+⟩ entangled by controlled-Z gates form a cluster chain. Measuring qubit 1 at angle α₁ and qubit 2 at angle α₂ (each a basis change followed by measurement) applies HP(−α₂)HP(−α₁) to the input, up to Pauli byproducts tracked in the Pauli frame. The second angle depends on the first outcome. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="430" y="26" text-anchor="middle" class="small" data-max-width="700">Measurement-based computation on a chain</text><text x="430" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 100L487 100"/><path class="wire" d="M510 97L730 97"/><path class="wire" d="M510 103L730 103"/><text x="744" y="106" text-anchor="start" class="" data-max-width="112" data-tex="m_1">m₁</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket+">|+⟩</text><path class="wire" d="M135 164L675 164"/><path class="wire" d="M698 161L730 161"/><path class="wire" d="M698 167L730 167"/><text x="744" y="170" text-anchor="start" class="" data-max-width="112" data-tex="m_2">m₂</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket+">|+⟩</text><path class="wire" d="M135 228L730 228"/><text x="744" y="234" text-anchor="start" class="" data-max-width="112">output</text><path class="wire" d="M205 100L205 164"/><circle cx="205" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="205" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><path class="wire" d="M299 164L299 228"/><circle cx="299" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="299" cy="228" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="370" y="79" width="46" height="42" rx="3"/><text x="393" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="\alpha_1">α₁</text><rect class="gate" x="464" y="79" width="46" height="42" rx="3"/><path d="M473 106A14 14 0 0 1 501 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M487 106L497 90" stroke="#476b70" stroke-width="1.8"/><path class="wire" d="M578 100L578 143"/><path class="wire" d="M584 100L584 143"/><circle cx="581.0" cy="100" r="4" fill="#476b70"/><rect class="gate" x="552.8" y="143" width="56.4" height="42" rx="3"/><text x="581" y="170" text-anchor="middle" class="" data-max-width="50.4" data-tex="\pm\alpha_2">±α₂</text><rect class="gate" x="652" y="143" width="46" height="42" rx="3"/><path d="M661 170A14 14 0 0 1 689 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M675 170L685 154" stroke="#476b70" stroke-width="1.8"/></svg>
