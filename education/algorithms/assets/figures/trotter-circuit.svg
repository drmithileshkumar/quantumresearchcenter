<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-labelledby="title desc"><title id="title">First-order product formula for X + Z</title><desc id="desc">One step applies e^(−idelta X) and then e^(−idelta Z) with delta=t/r; the step is repeated r times. As a matrix product, the step is e^(−idelta Z)e^(−idelta X) read right to left. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">First-order product formula for X + Z</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="205" y="84" text-anchor="middle" class="head" data-max-width="137.5">step 1</text><text x="465" y="84" text-anchor="middle" class="head" data-max-width="137.5">step 2</text><text x="122" y="136" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 130L650 130"/><text x="664" y="136" text-anchor="start" class="" data-max-width="112" data-tex="\approx e^{-it(X+Z)}\ket\psi">≈ e^(−it(X+Z))|ψ⟩</text><rect class="gate" x="169.9" y="109" width="70.2" height="42" rx="3"/><text x="205" y="136" text-anchor="middle" class="" data-max-width="64.2" data-tex="e^{-i\delta X}">e^(−idelta X)</text><rect class="gate" x="299.9" y="109" width="70.2" height="42" rx="3"/><text x="335" y="136" text-anchor="middle" class="" data-max-width="64.2" data-tex="e^{-i\delta Z}">e^(−idelta Z)</text><rect class="gate" x="429.9" y="109" width="70.2" height="42" rx="3"/><text x="465" y="136" text-anchor="middle" class="" data-max-width="64.2" data-tex="e^{-i\delta X}">e^(−idelta X)</text><rect class="gate" x="559.9" y="109" width="70.2" height="42" rx="3"/><text x="595" y="136" text-anchor="middle" class="" data-max-width="64.2" data-tex="e^{-i\delta Z}">e^(−idelta Z)</text><text x="390" y="182" text-anchor="middle" class="small" data-max-width="740" data-math="\(\cdots\) repeated \(r\) times, \(\delta=t/r\)">⋯ repeated r times, delta=t/r</text></svg>
