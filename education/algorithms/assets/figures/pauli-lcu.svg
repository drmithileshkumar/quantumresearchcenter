<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 298" role="img" aria-labelledby="title desc"><title id="title">An LCU block encoding of a two-qubit Hamiltonian</title><desc id="desc">For H=0.5 Z⊗ Z−0.3 X⊗ I, the 1-norm is λ=0.8. The sign of the second coefficient is absorbed into its unitary. The circuit encodes H/0.8. Columns: Term j, Coefficient, Unitary Uⱼ, PREPARE amplitude. 0, 0.5, Z⊗ Z, √(0.5/0.8)=√(5/8); 1, 0.3, −X⊗ I, √(0.3/0.8)=√(3/8); total, λ=0.8, , squared amplitudes sum to 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">An LCU block encoding of a two-qubit Hamiltonian</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Term \(j\)">Term j</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">Coefficient</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152" data-math="Unitary \(U_j\)">Unitary Uⱼ</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">PREPARE amplitude</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">0</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="0.5">0.5</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="Z\otimes Z">Z⊗ Z</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="\sqrt{0.5/0.8}=\sqrt{5/8}">√(0.5/0.8)=√(5/8)</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">1</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="0.3">0.3</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="-X\otimes I">−X⊗ I</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="\sqrt{0.3/0.8}=\sqrt{3/8}">√(0.3/0.8)=√(3/8)</text><rect x="32" y="198" width="174" height="84" fill="#fff" class="grid"/><text x="119" y="245" text-anchor="middle" class="" data-max-width="152">total</text><rect x="206" y="198" width="174" height="84" fill="#fff" class="grid"/><text x="293" y="245" text-anchor="middle" class="" data-max-width="152" data-tex="\lambda=0.8">λ=0.8</text><rect x="380" y="198" width="174" height="84" fill="#fff" class="grid"/><text x="467" y="245" text-anchor="middle" class="" data-max-width="152"></text><rect x="554" y="198" width="174" height="84" fill="#fff" class="grid"/><text x="641" y="223" text-anchor="middle" class="" data-max-width="152">squared</text><text x="641" y="245" text-anchor="middle" class="" data-max-width="152">amplitudes sum to</text><text x="641" y="267" text-anchor="middle" class="" data-max-width="152">1</text></svg>
