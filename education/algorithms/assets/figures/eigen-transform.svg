<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">Functions of a Hermitian matrix</title><desc id="desc">A function acts on each eigenvalue separately, f(H)=Σⱼf(λⱼ)|vⱼ⟩⟨vⱼ|, and so on every component of a superposition at once, without measuring which eigenvector is present. Columns: Function f, f(H) does, Application. step at μ, projects onto eigenvalues below μ, ground-state preparation, filtering; 1/x, inverts H, linear systems; e^(−ixt), evolves for time t, Hamiltonian simulation; xᵏ, powers, moments, power methods</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Functions of a Hermitian matrix</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Function \(f\)">Function f</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="\(f(H)\) does">f(H) does</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Application</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210" data-math="step at \(\mu\)">step at μ</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">projects onto</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210" data-math="eigenvalues below \(\mu\)">eigenvalues below μ</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">ground-state</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">preparation, filtering</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="1/x">1/x</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-math="inverts \(H\)">inverts H</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210">linear systems</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="e^{-ixt}">e^(−ixt)</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210" data-math="evolves for time \(t\)">evolves for time t</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210">Hamiltonian simulation</text><rect x="32" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="289" text-anchor="middle" class="" data-max-width="210" data-tex="x^k">xᵏ</text><rect x="264" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="289" text-anchor="middle" class="" data-max-width="210">powers</text><rect x="496" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="289" text-anchor="middle" class="" data-max-width="210">moments, power methods</text></svg>
