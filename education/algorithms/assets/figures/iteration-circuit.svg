<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 230" role="img" aria-labelledby="title desc"><title id="title">One amplification iteration</title><desc id="desc">S_G is the clean phase oracle for the predicate; A†, the zero-state reflection S₀, and A together reflect about |ψ⟩=A|0ⁿ⟩. Each box can contain many gates; A is often the most expensive part. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">One amplification iteration</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="245" y="84" text-anchor="middle" class="head" data-max-width="110">prepare</text><text x="420" y="84" text-anchor="middle" class="head" data-max-width="110" data-math="reflect about \(\ket\psi\)">reflect about |ψ⟩</text><text x="122" y="136" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M135 130L650 130"/><path class="wire" d="M151 138L163 122"/><text x="165" y="120" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="136" text-anchor="start" class="" data-max-width="112" data-tex="Q^k\ket\psi">Qᵏ|ψ⟩</text><rect class="gate" x="222" y="109" width="46" height="42" rx="3"/><text x="245" y="136" text-anchor="middle" class="" data-max-width="40" data-tex="A">A</text><rect class="gate" x="307.3" y="109" width="50.4" height="42" rx="3"/><text x="332.5" y="136" text-anchor="middle" class="" data-max-width="44.4" data-tex="S_G">S_G</text><rect class="gate" x="397" y="109" width="46" height="42" rx="3"/><text x="420" y="136" text-anchor="middle" class="" data-max-width="40" data-tex="A^\dagger">A†</text><rect class="gate" x="484.5" y="109" width="46" height="42" rx="3"/><text x="507.5" y="136" text-anchor="middle" class="" data-max-width="40" data-tex="S_0">S₀</text><rect class="gate" x="572" y="109" width="46" height="42" rx="3"/><text x="595" y="136" text-anchor="middle" class="" data-max-width="40" data-tex="A">A</text><text x="390" y="182" text-anchor="middle" class="small" data-max-width="740" data-math="iteration \(Q=R_\psi S_G\), repeated \(k\) times">iteration Q=R_ψ S_G, repeated k times</text></svg>
