<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" role="img" aria-labelledby="title desc"><title id="title">Deferring a measurement</title><desc id="desc">Top: measure, then apply V if the outcome is 1. Bottom: apply controlled-V coherently and measure the control at the end. The joint distribution of all final outcomes is the same; the resources are not. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Deferring a measurement</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700">measure, then classically controlled V</text><text x="122" y="106" text-anchor="end" class="" data-max-width="115">control</text><path class="wire" d="M135 100L245 100"/><path class="wire" d="M268 97L650 97"/><path class="wire" d="M268 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115">target</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="222" y="79" width="46" height="42" rx="3"/><path d="M231 106A14 14 0 0 1 259 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M245 106L255 90" stroke="#476b70" stroke-width="1.8"/><path class="wire" d="M592 100L592 143"/><path class="wire" d="M598 100L598 143"/><circle cx="595.0" cy="100" r="4" fill="#476b70"/><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><text x="595" y="170" text-anchor="middle" class="" data-max-width="40" data-tex="V">V</text><text x="390" y="240" text-anchor="middle" class="small" data-max-width="700">coherently controlled V, measure last</text><text x="122" y="292" text-anchor="end" class="" data-max-width="115">control</text><path class="wire" d="M135 286L595 286"/><path class="wire" d="M618 283L650 283"/><path class="wire" d="M618 289L650 289"/><text x="664" y="292" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="356" text-anchor="end" class="" data-max-width="115">target</text><path class="wire" d="M135 350L650 350"/><path class="wire" d="M151 358L163 342"/><text x="165" y="340" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="356" text-anchor="start" class="" data-max-width="112"></text><path class="wire" d="M245 286L245 329"/><circle cx="245" cy="286" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="222" y="329" width="46" height="42" rx="3"/><text x="245" y="356" text-anchor="middle" class="" data-max-width="40" data-tex="V">V</text><rect class="gate" x="572" y="265" width="46" height="42" rx="3"/><path d="M581 292A14 14 0 0 1 609 292" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 292L605 276" stroke="#476b70" stroke-width="1.8"/></svg>
