<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-labelledby="title desc"><title id="title">Exponential of a Pauli string</title><desc id="desc">e^(−iθ X₁Z₂Z₃): a Hadamard turns X₁ into Z₁; a CNOT ladder computes the parity of the three bits into the last qubit; R_z(2θ)=e^(−iθ Z) applies the phase; the ladder and basis change are undone. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="430" y="26" text-anchor="middle" class="small" data-max-width="700">Exponential of a Pauli string</text><text x="430" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115">1</text><path class="wire" d="M135 100L730 100"/><text x="744" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115">2</text><path class="wire" d="M135 164L730 164"/><text x="744" y="170" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="234" text-anchor="end" class="" data-max-width="115">3</text><path class="wire" d="M135 228L730 228"/><text x="744" y="234" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="182" y="79" width="46" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M283.333 100L283.333 164"/><circle cx="283.333" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="283.3333333333333" cy="164" r="14"/><path class="wire" d="M269.333 164L297.333 164"/><path class="wire" d="M283.333 150L283.333 178"/><path class="wire" d="M361.667 164L361.667 228"/><circle cx="361.667" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="361.66666666666663" cy="228" r="14"/><path class="wire" d="M347.667 228L375.667 228"/><path class="wire" d="M361.667 214L361.667 242"/><rect class="gate" x="415.829" y="207" width="48.3429" height="42" rx="3"/><text x="440" y="234" text-anchor="middle" class="" data-max-width="42.3429" data-tex="R_z(2\theta)">R_z(2θ)</text><path class="wire" d="M518.333 164L518.333 228"/><circle cx="518.333" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="518.3333333333333" cy="228" r="14"/><path class="wire" d="M504.333 228L532.333 228"/><path class="wire" d="M518.333 214L518.333 242"/><path class="wire" d="M596.667 100L596.667 164"/><circle cx="596.667" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="596.6666666666667" cy="164" r="14"/><path class="wire" d="M582.667 164L610.667 164"/><path class="wire" d="M596.667 150L596.667 178"/><rect class="gate" x="652" y="79" width="46" height="42" rx="3"/><text x="675" y="106" text-anchor="middle" class="" data-max-width="40">H</text></svg>
