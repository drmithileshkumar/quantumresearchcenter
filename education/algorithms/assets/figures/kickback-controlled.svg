<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">Phase kickback from an eigenstate</title><desc id="desc">With the target in an eigenstate |u⟩ of V, controlled-V leaves the target unchanged and attaches the eigenvalue e^(iφ) to the control’s |1⟩ branch, where it is a relative phase. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Phase kickback from an eigenstate</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket+">|+⟩</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\tfrac{1}{\sqrt2}(\ket0+e^{i\phi}\ket1)">1/√2(|0⟩+e^(iφ)|1⟩)</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket u">|u⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket u">|u⟩</text><path class="wire" d="M420 100L420 143"/><circle cx="420" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="397" y="143" width="46" height="42" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="40" data-tex="V">V</text><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-tex="V\ket u=e^{i\phi}\ket u">V|u⟩=e^(iφ)|u⟩</text></svg>
