<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">How block-encoding errors combine</title><desc id="desc">Errors are operator-norm distances between the implemented and intended blocks. Because blocks have norm at most one, errors add to first order. An error in the block A/α corresponds to an error α times larger in A. Columns: Operation, Intended block, Error bound. Product of two encodings, AB/(αβ), ε+delta+εdelta; Product of k encodings, prod Aᵢ/αᵢ, about Σεᵢ; Encoded A itself, A, αε; PREPARE amplitude error eta, Σ aⱼUⱼ/α, about 2etaΣⱼ√(aⱼ/α)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">How block-encoding errors combine</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Operation</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Intended block</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Error bound</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">Product of two encodings</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="AB/(\alpha\beta)">AB/(αβ)</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="\epsilon+\delta+\epsilon\delta">ε+delta+εdelta</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210" data-math="Product of \(k\) encodings">Product of k encodings</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="\prod A_i/\alpha_i">prod Aᵢ/αᵢ</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-math="about \(\sum\epsilon_i\)">about Σεᵢ</text><rect x="32" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="227" text-anchor="middle" class="" data-max-width="210" data-math="Encoded \(A\) itself">Encoded A itself</text><rect x="264" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="A">A</text><rect x="496" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="\alpha\epsilon">αε</text><rect x="32" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="271" text-anchor="middle" class="" data-max-width="210">PREPARE amplitude error</text><text x="148" y="293" text-anchor="middle" class="" data-max-width="210" data-tex="\eta">eta</text><rect x="264" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="282" text-anchor="middle" class="" data-max-width="210" data-tex="\sum a_jU_j/\alpha">Σ aⱼUⱼ/α</text><rect x="496" y="246" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="282" text-anchor="middle" class="" data-max-width="210" data-math="about \(2\eta\sum_j\sqrt{a_j/\alpha}\)">about 2etaΣⱼ√(aⱼ/α)</text></svg>
