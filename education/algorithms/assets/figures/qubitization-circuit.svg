<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 264" role="img" aria-labelledby="title desc"><title id="title">The qubitized walk</title><desc id="desc">U is a Hermitian block encoding of H/α; R reflects about the ancillas being zero. For each eigenvalue λⱼ, W=RU rotates within its own plane by θⱼ=arccos(λⱼ/α), so phase rotations on the ancilla between steps implement signal processing on every eigenvalue at once. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="450" y="26" text-anchor="middle" class="small" data-max-width="700">The qubitized walk</text><text x="450" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-math="ancillas \(\ket0\)">ancillas |0⟩</text><path class="wire" d="M135 100L770 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="784" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 164L770 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="784" y="170" text-anchor="start" class="" data-max-width="112"></text><rect class="big" x="216.8" y="79" width="56.4" height="106" rx="3"/><text x="245" y="138" text-anchor="middle" class="" data-max-width="50.4" data-tex="U">U</text><rect class="gate" x="316" y="79" width="46" height="42" rx="3"/><text x="339" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="R">R</text><rect class="gate" x="404.8" y="79" width="56.4" height="42" rx="3"/><text x="433" y="106" text-anchor="middle" class="" data-max-width="50.4" data-tex="e^{i\phi_1}">e^(iφ₁)</text><rect class="big" x="498.8" y="79" width="56.4" height="106" rx="3"/><text x="527" y="138" text-anchor="middle" class="" data-max-width="50.4" data-tex="U">U</text><rect class="gate" x="598" y="79" width="46" height="42" rx="3"/><text x="621" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="R">R</text><rect class="gate" x="686.8" y="79" width="56.4" height="42" rx="3"/><text x="715" y="106" text-anchor="middle" class="" data-max-width="50.4" data-tex="e^{i\phi_2}">e^(iφ₂)</text><text x="450" y="216" text-anchor="middle" class="small" data-max-width="860" data-math="\(W=RU\): eigenvalues \(e^{\pm i\theta_j}\) with \(\cos\theta_j=\lambda_j/\alpha\)">W=RU: eigenvalues e^(± iθⱼ) with cosθⱼ=λⱼ/α</text></svg>
