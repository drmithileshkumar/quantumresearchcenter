<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" role="img" aria-labelledby="title desc"><title id="title">A bit oracle from a controlled phase oracle</title><desc id="desc">The target |y⟩ is moved to the Hadamard basis, used as the control of the phase oracle O_f, and moved back. The control-0 branch receives no sign, which fixes the global phase that an uncontrolled O_f leaves ambiguous. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A bit oracle from a controlled phase oracle</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\ket x">|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket y">|y⟩</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket{y\oplus f(x)}">|y⊕ f(x)⟩</text><rect class="gate" x="222" y="143" width="46" height="42" rx="3"/><text x="245" y="170" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M420 164L420 121"/><circle cx="420" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="391.5" y="79" width="57" height="42" rx="3"/><text x="420" y="106" text-anchor="middle" class="" data-max-width="51" data-tex="O_f">O_f</text><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><text x="595" y="170" text-anchor="middle" class="" data-max-width="40">H</text></svg>
