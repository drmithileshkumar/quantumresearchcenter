<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 256" role="img" aria-labelledby="title desc"><title id="title">One step of Szegedy’s walk</title><desc id="desc">V|x⟩|0⟩=|x⟩Σ_y√(P_(xy))|y⟩. The first three boxes reflect about the span of the states |ψ_x⟩ (R_A); swapping the registers and repeating gives R_B. Each V needs coherent access to the neighbours of a vertex. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="460" y="26" text-anchor="middle" class="small" data-max-width="700">One step of Szegedy’s walk</text><text x="460" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="315" y="84" text-anchor="middle" class="head" data-max-width="101.25" data-tex="R_A">R_A</text><text x="595" y="84" text-anchor="middle" class="head" data-max-width="101.25" data-tex="R_B">R_B</text><text x="122" y="136" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 130L790 130"/><path class="wire" d="M151 138L163 122"/><text x="165" y="120" text-anchor="start" class="small" data-max-width="40"></text><text x="804" y="136" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="200" text-anchor="end" class="" data-max-width="115" data-tex="\ket y">|y⟩</text><path class="wire" d="M135 194L790 194"/><path class="wire" d="M151 202L163 186"/><text x="165" y="184" text-anchor="start" class="small" data-max-width="40"></text><text x="804" y="200" text-anchor="start" class="" data-max-width="112"></text><rect class="big" x="222.95" y="109" width="44.1" height="106" rx="3"/><text x="245" y="168" text-anchor="middle" class="" data-max-width="38.1" data-tex="V^\dagger">V†</text><rect class="gate" x="292.95" y="173" width="44.1" height="42" rx="3"/><text x="315" y="200" text-anchor="middle" class="" data-max-width="38.1" data-tex="S_0">S₀</text><rect class="big" x="362.95" y="109" width="44.1" height="106" rx="3"/><text x="385" y="168" text-anchor="middle" class="" data-max-width="38.1" data-tex="V">V</text><path class="wire" d="M455 130L455 194"/><path class="wire" d="M446 121L464 139"/><path class="wire" d="M446 139L464 121"/><path class="wire" d="M446 185L464 203"/><path class="wire" d="M446 203L464 185"/><rect class="big" x="502.95" y="109" width="44.1" height="106" rx="3"/><text x="525" y="168" text-anchor="middle" class="" data-max-width="38.1" data-tex="V^\dagger">V†</text><rect class="gate" x="572.95" y="173" width="44.1" height="42" rx="3"/><text x="595" y="200" text-anchor="middle" class="" data-max-width="38.1" data-tex="S_0">S₀</text><rect class="big" x="642.95" y="109" width="44.1" height="106" rx="3"/><text x="665" y="168" text-anchor="middle" class="" data-max-width="38.1" data-tex="V">V</text><path class="wire" d="M735 130L735 194"/><path class="wire" d="M726 121L744 139"/><path class="wire" d="M726 139L744 121"/><path class="wire" d="M726 185L744 203"/><path class="wire" d="M726 203L744 185"/></svg>
