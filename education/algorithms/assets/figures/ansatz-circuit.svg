<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">A one-parameter entangled ansatz</title><desc id="desc">R_y(θ)=e^(−iθ Y/2) followed by a CNOT prepares cosθ/2|00⟩+sinθ/2|11⟩. Measure directly to estimate ⟨ ZZ⟩, or after H on both qubits to estimate ⟨ XX⟩. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A one-parameter entangled ansatz</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 164L595 164"/><path class="wire" d="M618 161L650 161"/><path class="wire" d="M618 167L650 167"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="169.9" y="79" width="70.2" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="64.2" data-tex="R_y(\theta)">R_y(θ)</text><path class="wire" d="M335 100L335 164"/><circle cx="335" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="335.0" cy="164" r="14"/><path class="wire" d="M321 164L349 164"/><path class="wire" d="M335 150L335 178"/><rect class="gate" x="429.9" y="79" width="70.2" height="42" rx="3"/><text x="465" y="106" text-anchor="middle" class="" data-max-width="64.2">basis</text><rect class="gate" x="429.9" y="143" width="70.2" height="42" rx="3"/><text x="465" y="170" text-anchor="middle" class="" data-max-width="64.2">basis</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><path d="M581 170A14 14 0 0 1 609 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 170L605 154" stroke="#476b70" stroke-width="1.8"/><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-math="basis: nothing for \(ZZ\); \(H\) for \(XX\)">basis: nothing for ZZ; H for XX</text></svg>
