<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" role="img" aria-labelledby="title desc"><title id="title">Phase estimation on a superposition of eigenstates</title><desc id="desc">For |ψ⟩=Σ_sc_s|u_s⟩, phase estimation returns an estimate of one eigenphase φ_s, chosen with probability |c_s|², and leaves the target close to |u_s⟩. It samples eigenvalues; it does not list them. Columns: Target component, Outcome, Probability, Target afterwards. c₀|u₀⟩, estimate of φ₀, |c₀|², ≈|u₀⟩; c₁|u₁⟩, estimate of φ₁, |c₁|², ≈|u₁⟩; vdots, vdots, vdots, vdots</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Phase estimation on a superposition of eigenstates</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152">Target component</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">Outcome</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Probability</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Target afterwards</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="c_0\ket{u_0}">c₀|u₀⟩</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152" data-math="estimate of \(\phi_0\)">estimate of φ₀</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="|c_0|^2">|c₀|²</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="\approx\ket{u_0}">≈|u₀⟩</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="c_1\ket{u_1}">c₁|u₁⟩</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152" data-math="estimate of \(\phi_1\)">estimate of φ₁</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="|c_1|^2">|c₁|²</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152" data-tex="\approx\ket{u_1}">≈|u₁⟩</text><rect x="32" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="\vdots">vdots</text><rect x="206" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="\vdots">vdots</text><rect x="380" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="\vdots">vdots</text><rect x="554" y="198" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="227" text-anchor="middle" class="" data-max-width="152" data-tex="\vdots">vdots</text></svg>
