<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc"><title id="title">The answer states before the final Hadamard</title><desc id="desc">Constant functions leave the input along |+⟩ and balanced functions along |−⟩, up to sign. These states are orthogonal, so a measurement in their basis separates them with certainty; the Hadamard rotates that basis onto |0⟩,|1⟩. |+⟩: constant, H|+⟩=|0⟩: 45 degrees; |−⟩: balanced, H|−⟩=|1⟩: -45 degrees</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The answer states before the final Hadamard</text><circle cx="215" cy="230" r="115" fill="none" stroke="#c4d1dc"/><path d="M75 230L360 230" class="edge" style="stroke:#6b7885"/><path d="M215 370L215 85" class="edge" style="stroke:#6b7885"/><text x="366" y="236" text-anchor="start" class="small" data-max-width="120" data-math="amplitude of \(\ket0\)">amplitude of |0⟩</text><text x="215" y="73" text-anchor="middle" class="small" data-max-width="300" data-math="amplitude of \(\ket1\)">amplitude of |1⟩</text><path d="M215 230L296.317 148.683" class="edge" style="stroke:#246593"/><circle cx="296.317" cy="148.683" r="4" fill="#246593"/><path d="M430 120H460" stroke="#246593" stroke-width="3"/><text x="472" y="125" text-anchor="start" class="small" data-max-width="270" data-math="\(\ket+\): constant, \(H\ket+=\ket0\)">|+⟩: constant, H|+⟩=|0⟩</text><path d="M215 230L296.317 311.317" class="edge" style="stroke:#a64d26" stroke-dasharray="5 4"/><circle cx="296.317" cy="311.317" r="4" fill="#a64d26"/><path d="M430 190H460" stroke="#a64d26" stroke-width="3" stroke-dasharray="5 4"/><text x="472" y="195" text-anchor="start" class="small" data-max-width="270" data-math="\(\ket-\): balanced, \(H\ket-=\ket1\)">|−⟩: balanced, H|−⟩=|1⟩</text></svg>
