<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" role="img" aria-labelledby="title desc"><title id="title">Shor’s reduction from factoring to order finding</title><desc id="desc">Only the order-finding step is quantum. For odd L with at least two distinct prime factors, each random a succeeds with probability at least 1/2; failures lead back to a new random choice. Pick random a; if gcd(a,L)&gt;1, done → Quantum order finding: r → Is r even and a^(r/2)notequiv−1? → gcd(a^(r/2)±1,L) are factors; If not, pick a new a → Example: L=21, a=2, r=6 → 2³=8notequiv−1 → gcd(7,21)=7, gcd(9,21)=3</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Shor’s reduction from factoring to order finding</text><rect x="32" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="82" text-anchor="middle" class="" data-max-width="131" data-math="Pick random \(a\);">Pick random a;</text><text x="108.5" y="104" text-anchor="middle" class="" data-max-width="131" data-math="if \(\gcd(a,L)&gt;1\),">if gcd(a,L)&gt;1,</text><text x="108.5" y="126" text-anchor="middle" class="" data-max-width="131">done</text><path d="M185 99L213 99" class="edge"/><rect x="213" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="93" text-anchor="middle" class="" data-max-width="131">Quantum order</text><text x="289.5" y="115" text-anchor="middle" class="" data-max-width="131" data-math="finding: \(r\)">finding: r</text><path d="M366 99L394 99" class="edge"/><rect x="394" y="54" width="153" height="90" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="93" text-anchor="middle" class="" data-max-width="131" data-math="Is \(r\) even and">Is r even and</text><text x="470.5" y="115" text-anchor="middle" class="" data-max-width="131" data-math="\(a^{r/2}\not\equiv-1\)?">a^(r/2)notequiv−1?</text><path d="M547 99L575 99" class="edge"/><rect x="575" y="54" width="153" height="90" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="93" text-anchor="middle" class="" data-max-width="131" data-tex="\gcd(a^{r/2}\pm1,L)">gcd(a^(r/2)±1,L)</text><text x="651.5" y="115" text-anchor="middle" class="" data-max-width="131">are factors</text><rect x="32" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="108.5" y="197" text-anchor="middle" class="" data-max-width="131">If not, pick a</text><text x="108.5" y="219" text-anchor="middle" class="" data-max-width="131" data-math="new \(a\)">new a</text><path d="M185 203L213 203" class="edge"/><rect x="213" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="289.5" y="197" text-anchor="middle" class="" data-max-width="131" data-math="Example: \(L=21\),">Example: L=21,</text><text x="289.5" y="219" text-anchor="middle" class="" data-max-width="131" data-math="\(a=2\), \(r=6\)">a=2, r=6</text><path d="M366 203L394 203" class="edge"/><rect x="394" y="168" width="153" height="70" rx="5" fill="#fff" stroke="#a7bccd"/><text x="470.5" y="208" text-anchor="middle" class="" data-max-width="131" data-tex="2^3=8\not\equiv-1">2³=8notequiv−1</text><path d="M547 203L575 203" class="edge"/><rect x="575" y="168" width="153" height="70" rx="5" fill="#eaf1f7" stroke="#a7bccd"/><text x="651.5" y="197" text-anchor="middle" class="" data-max-width="131" data-math="\(\gcd(7,21)=7\),">gcd(7,21)=7,</text><text x="651.5" y="219" text-anchor="middle" class="" data-max-width="131" data-tex="\gcd(9,21)=3">gcd(9,21)=3</text></svg>
