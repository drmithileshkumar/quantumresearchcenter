<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Shor’s reduction from factoring to order finding</title><desc id="desc">Only the order-finding step is quantum. For odd L with at least two distinct prime factors, each random a succeeds with probability at least 1/2; failures lead back to a new random choice. Flowchart. Pick a random a. If gcd(a, L) &gt; 1, a factor is found. Otherwise run quantum order finding to get r. If r is even and a^(r/2) is not −1 mod L, gcd(a^(r/2) ± 1, L) are factors; if not, pick a new a. Example L = 21, a = 2: gcd is 1, r = 6, 2^3 = 8 ≢ −1, and gcd(7, 21) = 7, gcd(9, 21) = 3.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Shor’s reduction from factoring to order finding</text><rect x="505" y="46" width="230" height="436" rx="12" fill="#f5f7f9" fill-opacity=".55" stroke="#c6d0d9" stroke-dasharray="4 4"/><text x="519" y="68" text-anchor="start" class="small" style="font-weight:600;fill:#6b7885;letter-spacing:.04em">EXAMPLE  L = 21</text><path d="M210 104L210 132" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M325 165L367 165" fill="none" stroke="#347449" stroke-width="1.7" marker-end="url(#arrow)"/><text x="345" y="158" text-anchor="start" class="small" style="fill:#347449" data-max-width="200">yes</text><path d="M210 198L210 232" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><text x="228" y="216" text-anchor="start" class="small" style="fill:#246593" data-max-width="200">no</text><path d="M210 278L210 310" fill="none" stroke="#246593" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M210 394L210 428" fill="none" stroke="#347449" stroke-width="1.7" marker-end="url(#arrow)"/><text x="228" y="418" text-anchor="start" class="small" style="fill:#347449" data-max-width="200">yes</text><path d="M65 352L38 352L38 82L80 82" fill="none" stroke="#a64d26" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrow)"/><text x="46" y="225" text-anchor="start" class="small" style="fill:#a64d26" data-max-width="200" data-math="no: new \(a\)">no: new a</text><rect x="80" y="60" width="260" height="44" rx="6" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="210" y="87" text-anchor="middle" class="" data-max-width="248" data-math="Pick random \(a\), \(1&lt;a&lt;L\)">Pick random a, 1&lt;a&lt;L</text><path d="M210 132L325 165L210 198L95 165Z" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="210" y="170" text-anchor="middle" class="" data-max-width="218" data-math="\(\gcd(a,L)&gt;1\)?">gcd(a,L)&gt;1?</text><rect x="367" y="146" width="130" height="38" rx="19" fill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="432" y="170" text-anchor="middle" class="" data-max-width="118">factor found</text><rect x="80" y="232" width="260" height="46" rx="6" fill="#f1ecf7" stroke="#b39dd0" stroke-width="1.3"/><text x="210" y="260" text-anchor="middle" class="" data-max-width="248" data-math="Quantum order finding: \(r\)">Quantum order finding: r</text><path d="M210 310L355 352L210 394L65 352Z" fill="#fff" stroke="#a7bccd" stroke-width="1.3"/><text x="210" y="347" text-anchor="middle" class="" data-max-width="278" data-math="\(r\) even and">r even and</text><text x="210" y="367" text-anchor="middle" class="" data-max-width="278" data-math="\(a^{r/2}\not\equiv-1\)?">a^(r/2)≢−1?</text><rect x="75" y="428" width="270" height="44" rx="6" fill="#edf5ef" stroke="#9fc4aa" stroke-width="1.3"/><text x="210" y="455" text-anchor="middle" class="" data-max-width="258" data-math="\(\gcd(a^{r/2}\pm1,L)\) are factors">gcd(a^(r/2)±1,L) are factors</text><text x="620" y="87" text-anchor="middle" class="small" data-max-width="210" data-tex="a=2">a=2</text><text x="620" y="170" text-anchor="middle" class="small" data-max-width="210" data-tex="\gcd(2,21)=1">gcd(2,21)=1</text><text x="620" y="252" text-anchor="middle" class="small" data-max-width="210" data-math="\(2^6=64\equiv1\), so \(r=6\)">2⁶=64≡1, so r=6</text><text x="620" y="268" text-anchor="middle" class="small" data-max-width="210">(the quantum step)</text><text x="620" y="348" text-anchor="middle" class="small" data-max-width="210" data-math="\(r\) even; \(2^3=8\not\equiv-1\)">r even; 2³=8≢−1</text><text x="620" y="366" text-anchor="middle" class="small" data-max-width="210" data-tex="\pmod{21}"> (mod 21)</text><text x="620" y="446" text-anchor="middle" class="small" data-max-width="210" data-tex="\gcd(7,21)=7">gcd(7,21)=7</text><text x="620" y="464" text-anchor="middle" class="small" data-max-width="210" data-tex="\gcd(9,21)=3">gcd(9,21)=3</text></svg>
