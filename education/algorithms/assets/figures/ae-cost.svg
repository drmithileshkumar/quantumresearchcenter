<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Sampling versus amplitude estimation</title><desc id="desc">Calls to A needed to estimate p≈0.3 to additive precision ε with constant confidence. Sampling uses many short independent runs; amplitude estimation uses one long coherent circuit with controlled access to A and A†. Columns: Precision ε, Sampling, order p(1−p)/ε², Amplitude estimation, order 1/ε. 10⁻², about 2×10³, about 3×10²; 10⁻³, about 2×10⁵, about 3×10³; 10⁻⁴, about 2×10⁷, about 3×10⁴</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Sampling versus amplitude estimation</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210" data-math="Precision \(\epsilon\)">Precision ε</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="79" text-anchor="middle" class="small" data-max-width="210">Sampling, order</text><text x="380" y="101" text-anchor="middle" class="small" data-max-width="210" data-tex="p(1-p)/\epsilon^2">p(1−p)/ε²</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Amplitude estimation,</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210" data-math="order \(1/\epsilon\)">order 1/ε</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-2}">10⁻²</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210" data-math="about \(2\times10^3\)">about 2×10³</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210" data-math="about \(3\times10^2\)">about 3×10²</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-3}">10⁻³</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-math="about \(2\times10^5\)">about 2×10⁵</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210" data-math="about \(3\times10^3\)">about 3×10³</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-4}">10⁻⁴</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210" data-math="about \(2\times10^7\)">about 2×10⁷</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210" data-math="about \(3\times10^4\)">about 3×10⁴</text></svg>
