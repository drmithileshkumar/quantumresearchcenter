<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="title desc"><title id="title">A phase oracle from a clean computation</title><desc id="desc">C computes f(x) into the qubit t together with garbage in the workspace. A Z on t multiplies by (−1)^(f(x)); C⁻¹ then clears both t and the workspace, leaving only the sign on the input. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A phase oracle from a clean computation</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="(-1)^{f(x)}\ket x">(−1)^(f(x))|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^w}">|0^w⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket{0^w}">|0^w⟩</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="t:\ket0">t:|0⟩</text><path class="wire" d="M135 228L650 228"/><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="\ket0">|0⟩</text><rect class="big" x="203" y="79" width="84" height="170" rx="3"/><text x="245" y="170" text-anchor="middle" class="" data-max-width="78" data-tex="C">C</text><rect class="gate" x="397" y="207" width="46" height="42" rx="3"/><text x="420" y="234" text-anchor="middle" class="" data-max-width="40" data-tex="Z">Z</text><rect class="big" x="553" y="79" width="84" height="170" rx="3"/><text x="595" y="170" text-anchor="middle" class="" data-max-width="78" data-tex="C^{-1}">C⁻¹</text></svg>
