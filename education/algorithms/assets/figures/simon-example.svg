<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-labelledby="title desc"><title id="title">Simon’s algorithm for n = 3 and s = 110</title><desc id="desc">Collision pairs {x,x⊕ s}, the strings z the circuit can return, and how two independent samples determine s by linear algebra modulo two. Columns: Collision pairs, Possible outputs z, Example run. {000,110}, {001,111}, 000, 001, sample z=001: s₃=0; {010,100}, {011,101}, 110, 111, sample z=111: s₁⊕ s₂⊕ s₃=0; each pair shares one value of f, each with probability 1/4, nonzero solution s=110</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Simon’s algorithm for n = 3 and s = 110</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Collision pairs</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Possible outputs \(z\)">Possible outputs z</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Example run</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(\{000,110\}\), \(\{001,111\}\)">{000,110}, {001,111}</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(000\), \(001\)">000, 001</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-math="sample \(z=001\): \(s_3=0\)">sample z=001: s₃=0</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="186" text-anchor="middle" class="" data-max-width="210" data-math="\(\{010,100\}\), \(\{011,101\}\)">{010,100}, {011,101}</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="186" text-anchor="middle" class="" data-max-width="210" data-math="\(110\), \(111\)">110, 111</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="175" text-anchor="middle" class="" data-max-width="210" data-math="sample \(z=111\):">sample z=111:</text><text x="612" y="197" text-anchor="middle" class="" data-max-width="210" data-tex="s_1\oplus s_2\oplus s_3=0">s₁⊕ s₂⊕ s₃=0</text><rect x="32" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="237" text-anchor="middle" class="" data-max-width="210">each pair shares one</text><text x="148" y="259" text-anchor="middle" class="" data-max-width="210" data-math="value of \(f\)">value of f</text><rect x="264" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="237" text-anchor="middle" class="" data-max-width="210">each with probability</text><text x="380" y="259" text-anchor="middle" class="" data-max-width="210" data-tex="1/4">1/4</text><rect x="496" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="248" text-anchor="middle" class="" data-max-width="210" data-math="nonzero solution \(s=110\)">nonzero solution s=110</text></svg>
