<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" role="img" aria-labelledby="title desc"><title id="title">The Grover iterate as a rotation with complex eigenvectors</title><desc id="desc">In the good–bad plane, Q rotates by 2θ. Its eigenvectors |v_±⟩=(|G⟩± i|B⟩)/√2 have eigenphases ±2θ, and |ψ⟩ has equal weight on both, so phase estimation returns θ/π or 1−θ/π, each with probability 1/2. Columns: Eigenvector, Eigenvalue, Fraction of a turn, Weight in |ψ⟩. |v₊⟩, e^(2iθ), θ/π, 1/2; |v₋⟩, e^(−2iθ), 1−θ/π, 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The Grover iterate as a rotation with complex eigenvectors</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152">Eigenvector</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="90" text-anchor="middle" class="small" data-max-width="152">Eigenvalue</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="79" text-anchor="middle" class="small" data-max-width="152">Fraction of a</text><text x="467" y="101" text-anchor="middle" class="small" data-max-width="152">turn</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="90" text-anchor="middle" class="small" data-max-width="152" data-math="Weight in \(\ket\psi\)">Weight in |ψ⟩</text><rect x="32" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{v_+}">|v₊⟩</text><rect x="206" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="e^{2i\theta}">e^(2iθ)</text><rect x="380" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\theta/\pi">θ/π</text><rect x="554" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text><rect x="32" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket{v_-}">|v₋⟩</text><rect x="206" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="e^{-2i\theta}">e^(−2iθ)</text><rect x="380" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="1-\theta/\pi">1−θ/π</text><rect x="554" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="1/2">1/2</text></svg>
