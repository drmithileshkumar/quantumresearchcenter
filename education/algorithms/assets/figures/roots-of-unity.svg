<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">The eighth roots of unity</title><desc id="desc">The powers of omega=e^(2π i/8) are eight equally spaced unit arrows. Their sum is zero, and so is the sum of omega^(kx) over x for any k not divisible by 8: the arrows are evenly spread, possibly winding several times around the circle. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The eighth roots of unity</text><circle cx="230" cy="215" r="140" fill="none" stroke="#c4d1dc"/><path d="M80 215H380M230 65V365" stroke="#d3dee7"/><path d="M230 215L370 215" class="edge" style="stroke:#246593"/><circle cx="370" cy="215" r="4" fill="#246593"/><text x="400" y="220" text-anchor="middle" class="small" data-max-width="700" data-tex="1">1</text><path d="M230 215L328.995 116.005" class="edge" style="stroke:#246593"/><circle cx="328.995" cy="116.005" r="4" fill="#246593"/><text x="350.208" y="102.62" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega">omega</text><path d="M230 215L230 75" class="edge" style="stroke:#246593"/><circle cx="230" cy="75" r="4" fill="#246593"/><text x="230" y="54" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{2}">omega²</text><path d="M230 215L131.005 116.005" class="edge" style="stroke:#246593"/><circle cx="131.005" cy="116.005" r="4" fill="#246593"/><text x="109.792" y="102.62" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{3}">omega³</text><path d="M230 215L90 215" class="edge" style="stroke:#246593"/><circle cx="90" cy="215" r="4" fill="#246593"/><text x="60" y="220" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{4}">omega⁴</text><path d="M230 215L131.005 313.995" class="edge" style="stroke:#246593"/><circle cx="131.005" cy="313.995" r="4" fill="#246593"/><text x="109.792" y="337.38" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{5}">omega⁵</text><path d="M230 215L230 355" class="edge" style="stroke:#246593"/><circle cx="230" cy="355" r="4" fill="#246593"/><text x="230" y="386" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{6}">omega⁶</text><path d="M230 215L328.995 313.995" class="edge" style="stroke:#246593"/><circle cx="328.995" cy="313.995" r="4" fill="#246593"/><text x="350.208" y="337.38" text-anchor="middle" class="small" data-max-width="700" data-tex="\omega^{7}">omega⁷</text><text x="560" y="150" text-anchor="middle" class="" data-max-width="330" data-math="\(\omega=e^{2\pi i/8}\), \(\omega^8=1\)">omega=e^(2π i/8), omega⁸=1</text><text x="560" y="184" text-anchor="middle" class="" data-max-width="330" data-tex="\sum_{x=0}^{7}\omega^{x}=0">Σ_(x=0)⁷omega^x=0</text><text x="560" y="218" text-anchor="middle" class="" data-max-width="330" data-tex="\sum_{x=0}^{7}\omega^{2x}=0">Σ_(x=0)⁷omega^(2x)=0</text><text x="560" y="252" text-anchor="middle" class="" data-max-width="330" data-tex="\sum_{x=0}^{7}\omega^{8x}=8">Σ_(x=0)⁷omega^(8x)=8</text></svg>
