<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="title desc"><title id="title">A coherent output is not a table of values</title><desc id="desc">A subroutine’s contract should state which output form it delivers. Converting a state into classical data costs repetitions that grow with the amount of data and the precision required. Columns: Output form, What a user can collect, Example. Classical bit string, The string itself, Bernstein–Vazirani returns s; Sample from a distribution, One draw per run, Measuring Σ_xα_x|x⟩|f(x)⟩; Estimate of one number, Value within ε after many runs, Amplitude estimation (Chapter 5); State for a later routine, Nothing directly; it feeds a further circuit, Linear-system solution states (Chapter 8)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A coherent output is not a table of values</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Output form</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">What a user can collect</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Example</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Classical bit string</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210">The string itself</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">Bernstein–Vazirani</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210" data-math="returns \(s\)">returns s</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="189" text-anchor="middle" class="" data-max-width="210">Sample from a</text><text x="148" y="211" text-anchor="middle" class="" data-max-width="210">distribution</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210">One draw per run</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210">Measuring</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210" data-tex="\sum_x\alpha_x\ket x\ket{f(x)}">Σ_xα_x|x⟩|f(x)⟩</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210">Estimate of one number</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="251" text-anchor="middle" class="" data-max-width="210" data-math="Value within \(\epsilon\) after">Value within ε after</text><text x="380" y="273" text-anchor="middle" class="" data-max-width="210">many runs</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="251" text-anchor="middle" class="" data-max-width="210">Amplitude estimation</text><text x="612" y="273" text-anchor="middle" class="" data-max-width="210">(Chapter 5)</text><rect x="32" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="313" text-anchor="middle" class="" data-max-width="210">State for a later</text><text x="148" y="335" text-anchor="middle" class="" data-max-width="210">routine</text><rect x="264" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="313" text-anchor="middle" class="" data-max-width="210">Nothing directly; it</text><text x="380" y="335" text-anchor="middle" class="" data-max-width="210">feeds a further circuit</text><rect x="496" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="313" text-anchor="middle" class="" data-max-width="210">Linear-system solution</text><text x="612" y="335" text-anchor="middle" class="" data-max-width="210">states (Chapter 8)</text></svg>
