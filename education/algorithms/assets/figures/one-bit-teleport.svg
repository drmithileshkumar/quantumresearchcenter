<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 226" role="img" aria-labelledby="title desc"><title id="title">Applying a gate by one-bit teleportation</title><desc id="desc">Controlled-Z entangles the input with an auxiliary |+⟩. Measuring the input in the basis |±_α⟩ (a phase gate P(−α), a Hadamard, and a computational-basis measurement) leaves X^mHP(−α)|ψ⟩ on the auxiliary qubit; the classically controlled X removes the byproduct. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="430" y="26" text-anchor="middle" class="small" data-max-width="700">Applying a gate by one-bit teleportation</text><text x="430" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 100L557.5 100"/><path class="wire" d="M580.5 97L730 97"/><path class="wire" d="M580.5 103L730 103"/><text x="744" y="106" text-anchor="start" class="" data-max-width="112" data-tex="m">m</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket+">|+⟩</text><path class="wire" d="M135 164L730 164"/><text x="744" y="170" text-anchor="start" class="" data-max-width="112" data-tex="HP(-\alpha)\ket\psi">HP(−α)|ψ⟩</text><path class="wire" d="M205 100L205 164"/><circle cx="205" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="205" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="288.66" y="79" width="67.68" height="42" rx="3"/><text x="322.5" y="106" text-anchor="middle" class="" data-max-width="61.68" data-tex="P(-\alpha)">P(−α)</text><rect class="gate" x="417" y="79" width="46" height="42" rx="3"/><text x="440" y="106" text-anchor="middle" class="" data-max-width="40">H</text><rect class="gate" x="534.5" y="79" width="46" height="42" rx="3"/><path d="M543.5 106A14 14 0 0 1 571.5 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M557.5 106L567.5 90" stroke="#476b70" stroke-width="1.8"/><path class="wire" d="M672 100L672 143"/><path class="wire" d="M678 100L678 143"/><circle cx="675.0" cy="100" r="4" fill="#476b70"/><rect class="gate" x="646.5" y="143" width="57" height="42" rx="3"/><text x="675" y="170" text-anchor="middle" class="" data-max-width="51" data-tex="X^m">X^m</text></svg>
