<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" role="img" aria-labelledby="title desc"><title id="title">Controlling a known circuit gate by gate</title><desc id="desc">If U=G₂G₁, then controlled-U is controlled-G₁ followed by controlled-G₂. On the control-0 branch nothing acts; on the control-1 branch both gates act. The global phase of U must be fixed first, because it becomes a phase on the control. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Controlling a known circuit gate by gate</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700" data-math="Controlled-\(U\)">Controlled-U</text><text x="122" y="106" text-anchor="end" class="" data-max-width="115">control</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115">target</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112"></text><path class="wire" d="M400 100L400 143"/><circle cx="400" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="377" y="143" width="46" height="42" rx="3"/><text x="400" y="170" text-anchor="middle" class="" data-max-width="40" data-tex="U">U</text><text x="390" y="240" text-anchor="middle" class="small" data-max-width="700">Built from controlled gates</text><text x="122" y="292" text-anchor="end" class="" data-max-width="115">control</text><path class="wire" d="M135 286L650 286"/><text x="664" y="292" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="356" text-anchor="end" class="" data-max-width="115">target</text><path class="wire" d="M135 350L650 350"/><text x="664" y="356" text-anchor="start" class="" data-max-width="112"></text><path class="wire" d="M205 286L205 329"/><circle cx="205" cy="286" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="182" y="329" width="46" height="42" rx="3"/><text x="205" y="356" text-anchor="middle" class="" data-max-width="40" data-tex="G_1">G₁</text><path class="wire" d="M595 286L595 329"/><circle cx="595" cy="286" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="572" y="329" width="46" height="42" rx="3"/><text x="595" y="356" text-anchor="middle" class="" data-max-width="40" data-tex="G_2">G₂</text></svg>
