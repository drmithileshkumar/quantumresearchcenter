<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">The signs of the two-qubit Hadamard transform</title><desc id="desc">Entry (x,z) is the sign of |z⟩ in H^(⊗2)|x⟩, namely (−1)^(x· z); every entry also carries the factor 1/2. Distinct rows are orthogonal, so a row pattern is mapped back to its label. Columns: x \ z, 00, 01, 10, 11. 00, +, +, +, +; 01, +, −, +, −; 10, +, +, −, −; 11, +, −, −, +</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The signs of the two-qubit Hadamard transform</text><rect x="32" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="101.6" y="83" text-anchor="middle" class="small" data-max-width="117.2" data-math="\(x\) \ \(z\)">x \ z</text><rect x="171.2" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="240.8" y="83" text-anchor="middle" class="small" data-max-width="117.2">00</text><rect x="310.4" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="117.2">01</text><rect x="449.6" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="519.2" y="83" text-anchor="middle" class="small" data-max-width="117.2">10</text><rect x="588.8" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="658.4" y="83" text-anchor="middle" class="small" data-max-width="117.2">11</text><rect x="32" y="102" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="131" text-anchor="middle" class="" data-max-width="117.2">00</text><rect x="171.2" y="102" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="131" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="310.4" y="102" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="449.6" y="102" width="139.2" height="48" fill="#fff" class="grid"/><text x="519.2" y="131" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="588.8" y="102" width="139.2" height="48" fill="#fff" class="grid"/><text x="658.4" y="131" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="32" y="150" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="101.6" y="179" text-anchor="middle" class="" data-max-width="117.2">01</text><rect x="171.2" y="150" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="240.8" y="179" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="310.4" y="150" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="449.6" y="150" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="519.2" y="179" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="588.8" y="150" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="658.4" y="179" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="32" y="198" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="227" text-anchor="middle" class="" data-max-width="117.2">10</text><rect x="171.2" y="198" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="227" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="310.4" y="198" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="449.6" y="198" width="139.2" height="48" fill="#fff" class="grid"/><text x="519.2" y="227" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="588.8" y="198" width="139.2" height="48" fill="#fff" class="grid"/><text x="658.4" y="227" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="32" y="246" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="101.6" y="275" text-anchor="middle" class="" data-max-width="117.2">11</text><rect x="171.2" y="246" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="240.8" y="275" text-anchor="middle" class="" data-max-width="117.2">+</text><rect x="310.4" y="246" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="275" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="449.6" y="246" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="519.2" y="275" text-anchor="middle" class="" data-max-width="117.2">−</text><rect x="588.8" y="246" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="658.4" y="275" text-anchor="middle" class="" data-max-width="117.2">+</text></svg>
