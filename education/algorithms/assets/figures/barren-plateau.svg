<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="title desc"><title id="title">Barren plateaus: causes and responses</title><desc id="desc">A barren plateau makes gradients exponentially small in the number of qubits, so estimating them needs exponentially many shots. Avoiding one is necessary for training but does not guarantee success. Columns: Cause, Why gradients vanish, Response. Deep random circuits, states concentrate near the average, problem-inspired, shallow ansätze; Global cost functions, observable spans all qubits, local cost functions; Excess entanglement, information spread to unmeasured qubits, structured entanglement; Hardware noise, state approaches the maximally mixed state, fewer gates, mitigation</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Barren plateaus: causes and responses</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Cause</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Why gradients vanish</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Response</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Deep random circuits</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">states concentrate near</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">the average</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">problem-inspired,</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">shallow ansätze</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210">Global cost functions</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="189" text-anchor="middle" class="" data-max-width="210">observable spans all</text><text x="380" y="211" text-anchor="middle" class="" data-max-width="210">qubits</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="200" text-anchor="middle" class="" data-max-width="210">local cost functions</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210">Excess entanglement</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="251" text-anchor="middle" class="" data-max-width="210">information spread to</text><text x="380" y="273" text-anchor="middle" class="" data-max-width="210">unmeasured qubits</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="262" text-anchor="middle" class="" data-max-width="210">structured entanglement</text><rect x="32" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="324" text-anchor="middle" class="" data-max-width="210">Hardware noise</text><rect x="264" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="313" text-anchor="middle" class="" data-max-width="210">state approaches the</text><text x="380" y="335" text-anchor="middle" class="" data-max-width="210">maximally mixed state</text><rect x="496" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="324" text-anchor="middle" class="" data-max-width="210">fewer gates, mitigation</text></svg>
