<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc"><title id="title">Shots needed to estimate an energy</title><desc id="desc">With optimal shot allocation Rⱼpropto|hⱼ|sigmaⱼ, the variance is at most λ²/R, so precision ε needs about λ²/ε² shots per energy evaluation. An optimization needs many evaluations. Columns: 1-norm λ, Precision ε, Shots λ²/ε². 2, 10⁻², 4×10⁴; 2, 10⁻³, 4×10⁶; 50, 10⁻³, 2.5×10⁹; 500, 10⁻³, 2.5×10¹¹</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Shots needed to estimate an energy</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="1-norm \(\lambda\)">1-norm λ</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Precision \(\epsilon\)">Precision ε</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Shots \(\lambda^2/\epsilon^2\)">Shots λ²/ε²</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">2</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-2}">10⁻²</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="4\times10^4">4×10⁴</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210">2</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-3}">10⁻³</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="4\times10^6">4×10⁶</text><rect x="32" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="227" text-anchor="middle" class="" data-max-width="210">50</text><rect x="264" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-3}">10⁻³</text><rect x="496" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="2.5\times10^9">2.5×10⁹</text><rect x="32" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="275" text-anchor="middle" class="" data-max-width="210">500</text><rect x="264" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="275" text-anchor="middle" class="" data-max-width="210" data-tex="10^{-3}">10⁻³</text><rect x="496" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="275" text-anchor="middle" class="" data-max-width="210" data-tex="2.5\times10^{11}">2.5×10¹¹</text></svg>
