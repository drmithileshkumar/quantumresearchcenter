<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 354" role="img" aria-labelledby="title desc"><title id="title">Phase estimation with three control qubits</title><desc id="desc">The target holds an eigenstate |u⟩ of U with eigenvalue e^(2π iφ). Control j applies U^(2ʲ) and receives the phase e^(2π i2ʲφ); the inverse Fourier transform F† (a composite operation) maps the resulting phase ramp to the digits of φ. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Phase estimation with three control qubits</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="j_2">j₂</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 164L595 164"/><path class="wire" d="M618 161L650 161"/><path class="wire" d="M618 167L650 167"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="j_1">j₁</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 228L595 228"/><path class="wire" d="M618 225L650 225"/><path class="wire" d="M618 231L650 231"/><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="j_0">j₀</text><text x="122" y="298" text-anchor="end" class="" data-max-width="115" data-tex="\ket u">|u⟩</text><path class="wire" d="M135 292L650 292"/><path class="wire" d="M151 300L163 284"/><text x="165" y="282" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="298" text-anchor="start" class="" data-max-width="112" data-tex="\ket u">|u⟩</text><rect class="gate" x="224" y="79" width="42" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="36">H</text><rect class="gate" x="224" y="143" width="42" height="42" rx="3"/><text x="245" y="170" text-anchor="middle" class="" data-max-width="36">H</text><rect class="gate" x="224" y="207" width="42" height="42" rx="3"/><text x="245" y="234" text-anchor="middle" class="" data-max-width="36">H</text><path class="wire" d="M315 228L315 271"/><circle cx="315" cy="228" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="294" y="271" width="42" height="42" rx="3"/><text x="315" y="298" text-anchor="middle" class="" data-max-width="36" data-tex="U">U</text><path class="wire" d="M385 164L385 271"/><circle cx="385" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="364" y="271" width="42" height="42" rx="3"/><text x="385" y="298" text-anchor="middle" class="" data-max-width="36" data-tex="U^2">U²</text><path class="wire" d="M455 100L455 271"/><circle cx="455" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="434" y="271" width="42" height="42" rx="3"/><text x="455" y="298" text-anchor="middle" class="" data-max-width="36" data-tex="U^4">U⁴</text><rect class="big" x="504" y="79" width="42" height="170" rx="3"/><text x="525" y="170" text-anchor="middle" class="" data-max-width="36" data-tex="F^\dagger">F†</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><path d="M581 170A14 14 0 0 1 609 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 170L605 154" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="572" y="207" width="46" height="42" rx="3"/><path d="M581 234A14 14 0 0 1 609 234" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 234L605 218" stroke="#476b70" stroke-width="1.8"/></svg>
