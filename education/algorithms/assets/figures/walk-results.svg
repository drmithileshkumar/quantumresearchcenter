<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" role="img" aria-labelledby="title desc"><title id="title">What quantum walks achieve</title><desc id="desc">Query complexities with coherent neighbour access. Time complexity adds the cost of implementing that access and any coherent data structures. Columns: Problem, Classical, Quantum walk. Search, complete graph, N, √N; Search, 2D grid, Nlog N, √Nlog N; Element distinctness, N, N^(2/3), optimal; Glued trees traversal, exponential, polynomial; General Markov chain hitting, 1/(εdelta), 1/√εdelta</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">What quantum walks achieve</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Problem</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Classical</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Quantum walk</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">Search, complete graph</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="N">N</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="\sqrt N">√N</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210">Search, 2D grid</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="N\log N">Nlog N</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="\sqrt N\log N">√Nlog N</text><rect x="32" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="227" text-anchor="middle" class="" data-max-width="210">Element distinctness</text><rect x="264" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="N">N</text><rect x="496" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="227" text-anchor="middle" class="" data-max-width="210" data-math="\(N^{2/3}\), optimal">N^(2/3), optimal</text><rect x="32" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="275" text-anchor="middle" class="" data-max-width="210">Glued trees traversal</text><rect x="264" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="275" text-anchor="middle" class="" data-max-width="210">exponential</text><rect x="496" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="275" text-anchor="middle" class="" data-max-width="210">polynomial</text><rect x="32" y="294" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="319" text-anchor="middle" class="" data-max-width="210">General Markov chain</text><text x="148" y="341" text-anchor="middle" class="" data-max-width="210">hitting</text><rect 