<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 418" role="img" aria-labelledby="title desc"><title id="title">Direct reversible translation leaves garbage</title><desc id="desc">A Toffoli computes g=a∧ b; two CNOTs compute t=g⊕ c. The answer t=f(a,b,c) is accompanied by the input-dependent garbage bit g. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Direct reversible translation leaves garbage</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket a">|a⟩</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\ket a">|a⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket b">|b⟩</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket b">|b⟩</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket c">|c⟩</text><path class="wire" d="M135 228L650 228"/><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="\ket c">|c⟩</text><text x="122" y="298" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 292L650 292"/><text x="664" y="298" text-anchor="start" class="" data-max-width="112" data-math="\(\ket{ab}\) garbage">|ab⟩ garbage</text><text x="122" y="362" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 356L650 356"/><text x="664" y="362" text-anchor="start" class="" data-max-width="112" data-tex="\ket{f(a,b,c)}">|f(a,b,c)⟩</text><path class="wire" d="M205 100L205 292"/><circle cx="205" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="205" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="205.0" cy="292" r="14"/><path class="wire" d="M191 292L219 292"/><path class="wire" d="M205 278L205 306"/><path class="wire" d="M400 292L400 356"/><circle cx="400" cy="292" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="400.0" cy="356" r="14"/><path class="wire" d="M386 356L414 356"/><path class="wire" d="M400 342L400 370"/><path class="wire" d="M595 228L595 356"/><circle cx="595" cy="228" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="595.0" cy="356" r="14"/><path class="wire" d="M581 356L609 356"/><path class="wire" d="M595 342L595 370"/></svg>
