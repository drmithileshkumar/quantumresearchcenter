<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-labelledby="title desc"><title id="title">An interference test separates clean from dirty oracles</title><desc id="desc">Input (|000⟩+|110⟩)/√2; apply the phase oracle, then a CNOT from the first input bit to the second and a Hadamard on the first. Columns show input register and workspace. Columns: Step, Clean oracle, Dirty oracle (no uncompute). After phase oracle, 1/√2(|000⟩−|110⟩)|00⟩, 1/√2(|000⟩|00⟩−|110⟩|11⟩); After CNOT, |−⟩|00⟩|00⟩, 1/√2(|000⟩|00⟩−|100⟩|11⟩); After H on first bit, |1⟩|00⟩|00⟩, four terms of amplitude ±1/2; First bit reads 1, with probability 1, with probability 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">An interference test separates clean from dirty oracles</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Step</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Clean oracle</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Dirty oracle (no</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">uncompute)</text><rect x="32" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="145" text-anchor="middle" class="" data-max-width="210">After phase oracle</text><rect x="264" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="\tfrac{1}{\sqrt2}(\ket{000}-\ket{110})\ket{00}">1/√2(|000⟩−|110⟩)|00⟩</text><rect x="496" y="116" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="145" text-anchor="middle" class="" data-max-width="210" data-tex="\tfrac{1}{\sqrt2}(\ket{000}\ket{00}-\ket{110}\ket{11})">1/√2(|000⟩|00⟩−|110⟩|11⟩)</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210">After CNOT</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="\ket-\ket{00}\ket{00}">|−⟩|00⟩|00⟩</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210" data-tex="\tfrac{1}{\sqrt2}(\ket{000}\ket{00}-\ket{100}\ket{11})">1/√2(|000⟩|00⟩−|100⟩|11⟩)</text><rect x="32" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="248" text-anchor="middle" class="" data-max-width="210">After H on first bit</text><rect x="264" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="248" text-anchor="middle" class="" data-max-width="210" data-tex="\ket1\ket{00}\ket{00}">|1⟩|00⟩|00⟩</text><rect x="496" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="237" text-anchor="middle" class="" data-max-width="210">four terms of amplitude</text><text x="612" y="259" text-anchor="middle" class="" data-max-width="210" data-tex="\pm\tfrac12">±1/2</text><rect x="32" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="303" text-anchor="middle" class="" data-max-width="210">First bit reads 1</text><rect x="264" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="303" text-anchor="middle" class="" data-max-width="210">with probability 1</text><rect x="496" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="303" text-anchor="middle" class="" data-max-width="210">with probability 1/2</text></svg>
