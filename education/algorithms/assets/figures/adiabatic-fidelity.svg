<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Slow enough evolution follows the ground state</title><desc id="desc">Probability of ending in |0⟩ after evolving under H(s) with s=t/T, starting from |+⟩, as a function of total time T (numerical simulation). It rises from the sudden value 1/2 to nearly 1 once T is several times 1/g_(min)². Horizontal axis: total time T; vertical axis: final ground-state probability. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Slow enough evolution follows the ground state</text><path d="M95 279.677H700" class="grid"/><text x="83" y="284.677" text-anchor="end" class="small" data-max-width="700">0.5</text><path d="M95 178.871H700" class="grid"/><text x="83" y="183.871" text-anchor="end" class="small" data-max-width="700">0.75</text><path d="M95 78.0645H700" class="grid"/><text x="83" y="83.0645" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M216 320V326" stroke="#6b7885"/><text x="216" y="344" text-anchor="middle" class="small" data-max-width="700">2</text><path d="M337 320V326" stroke="#6b7885"/><text x="337" y="344" text-anchor="middle" class="small" data-max-width="700">4</text><path d="M458 320V326" stroke="#6b7885"/><text x="458" y="344" text-anchor="middle" class="small" data-max-width="700">6</text><path d="M579 320V326" stroke="#6b7885"/><text x="579" y="344" text-anchor="middle" class="small" data-max-width="700">8</text><path d="M700 320V326" stroke="#6b7885"/><text x="700" y="344" text-anchor="middle" class="small" data-max-width="700">10</text><path d="M95 320H700M95 320V70" stroke="#6b7885" fill="none"/><text x="397.5" y="372" text-anchor="middle" class="small" data-max-width="560" data-math="total time \(T\)">total time T</text><text x="91" y="54" text-anchor="start" class="small" data-max-width="400">final ground-state probability</text><path d="M110.1 277.6L125.2 271.4L140.4 261.5L155.5 248.4L170.6 232.7L185.8 215.2L200.9 196.7L216.0 178.0L231.1 159.9L246.2 143.0L261.4 127.8L276.5 114.6L291.6 103.7L306.8 95.0L321.9 88.5L337.0 83.9L352.1 80.8L367.2 79.1L382.4 78.3L397.5 78.1L412.6 78.2L427.8 78.5L442.9 78.7L458.0 78.8L473.1 78.8L488.2 78.7L503.4 78.5L518.5 78.3L533.6 78.2L548.8 78.1L563.9 78.1L579.0 78.2L594.1 78.4L609.2 78.6L624.4 78.8L639.5 79.1L654.6 79.2L669.8 79.3L684.9 79.3L700.0 79.2" fill="none" stroke="#246593" stroke-width="2.4"/></svg>
