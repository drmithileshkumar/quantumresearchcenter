<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img" aria-labelledby="title desc"><title id="title">A quantum signal processing sequence</title><desc id="desc">Signal calls W(x) alternate with Z-rotations by the phase factors φ₀,…,φ_d. The top-left entry of the product is a polynomial P(x) of degree at most d; the phases select which polynomial. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="450" y="26" text-anchor="middle" class="small" data-max-width="700">A quantum signal processing sequence</text><text x="450" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L770 100"/><text x="784" y="106" text-anchor="start" class="" data-max-width="112" data-tex="P(x)\ket0+\cdots">P(x)|0⟩+⋯</text><rect class="gate" x="168.28" y="79" width="73.44" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="67.44" data-tex="e^{i\phi_0Z}">e^(iφ₀Z)</text><rect class="gate" x="298.5" y="79" width="68" height="42" rx="3"/><text x="332.5" y="106" text-anchor="middle" class="" data-max-width="62" data-tex="W(x)">W(x)</text><rect class="gate" x="423.28" y="79" width="73.44" height="42" rx="3"/><text x="460" y="106" text-anchor="middle" class="" data-max-width="67.44" data-tex="e^{i\phi_1Z}">e^(iφ₁Z)</text><rect class="gate" x="553.5" y="79" width="68" height="42" rx="3"/><text x="587.5" y="106" text-anchor="middle" class="" data-max-width="62" data-tex="W(x)">W(x)</text><rect class="gate" x="678.28" y="79" width="73.44" height="42" rx="3"/><text x="715" y="106" text-anchor="middle" class="" data-max-width="67.44" data-tex="e^{i\phi_2Z}">e^(iφ₂Z)</text><text x="450" y="152" text-anchor="middle" class="small" data-max-width="860" data-math="two calls: \(\bra0W\,e^{i\phi Z}\,W\ket0=\cos\phi\,(2x^2-1)+i\sin\phi\)">two calls: ⟨0|W e^(iφ Z) W|0⟩=cosφ (2x²−1)+isinφ</text></svg>
