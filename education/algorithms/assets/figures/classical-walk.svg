<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="title desc"><title id="title">A random walk on a four-cycle</title><desc id="desc">Each step moves to one of the two neighbours with probability 1/2. Probabilities of routes multiply along a route and add across routes; nothing can cancel. After t steps on the line, the spread is about √t. 0 → 1: 1/2; 1 → 2: 1/2; 2 → 3: 1/2; 3 → 0: 1/2</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A random walk on a four-cycle</text><path d="M278 90L482 90" class="edge"/><text x="380" y="78" text-anchor="middle" class="" data-max-width="190">1/2</text><path d="M510 118L510 222" class="edge"/><text x="540" y="175" text-anchor="middle" class="" data-max-width="190">1/2</text><path d="M482 250L278 250" class="edge"/><text x="380" y="275" text-anchor="middle" class="" data-max-width="190">1/2</text><path d="M250 222L250 118" class="edge"/><text x="222" y="175" text-anchor="middle" class="" data-max-width="190">1/2</text><circle cx="250" cy="90" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="250" y="95" text-anchor="middle" class="" data-max-width="48">0</text><circle cx="510" cy="90" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="510" y="95" text-anchor="middle" class="" data-max-width="48">1</text><circle cx="510" cy="250" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="510" y="255" text-anchor="middle" class="" data-max-width="48">2</text><circle cx="250" cy="250" r="28" fill="#fff" stroke="#246593" stroke-width="1.7"/><text x="250" y="255" text-anchor="middle" class="" data-max-width="48">3</text><text x="380" y="318" text-anchor="middle" class="small" data-max-width="700">each vertex also steps the other way with probability 1/2 (arrows show one direction)</text></svg>
