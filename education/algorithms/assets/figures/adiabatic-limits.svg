<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" role="img" aria-labelledby="title desc"><title id="title">What adiabatic optimization achieves</title><desc id="desc">Runtimes are governed by the minimum gap along the path. Small worked examples and proofs for search do not establish efficiency for hard optimization problems. Columns: Problem, Minimum gap, Runtime. One-qubit example, √2, constant; Unstructured search, linear schedule, sim1/√N, sim N; Unstructured search, local schedule, sim1/√N, sim√N (optimal); Hard optimization instances, can be exponentially small, can be exponential</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">What adiabatic optimization achieves</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Problem</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Minimum gap</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Runtime</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">One-qubit example</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="\sqrt2">√2</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210">constant</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="175" text-anchor="middle" class="" data-max-width="210">Unstructured search,</text><text x="148" y="197" text-anchor="middle" class="" data-max-width="210">linear schedule</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="186" text-anchor="middle" class="" data-max-width="210" data-tex="\sim1/\sqrt N">sim1/√N</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="186" text-anchor="middle" class="" data-max-width="210" data-tex="\sim N">sim N</text><rect x="32" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="237" text-anchor="middle" class="" data-max-width="210">Unstructured search,</text><text x="148" y="259" text-anchor="middle" class="" data-max-width="210">local schedule</text><rect x="264" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="248" text-anchor="middle" class="" data-max-width="210" data-tex="\sim1/\sqrt N">sim1/√N</text><rect x="496" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="248" text-anchor="middle" class="" data-max-width="210" data-math="\(\sim\sqrt N\) (optimal)">sim√N (optimal)</text><rect x="32" y="274" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="299" text-anchor="middle" class="" data-max-width="210">Hard optimization</text><text x="148" y="321" text-anchor="middle" class="" data-max-width="210">instances</text><rect x="264" y="274" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="299" text-anchor="middle" class="" data-max-width="210">can be exponentially</text><text x="380" y="321" text-anchor="middle" class="" data-max-width="210">small</text><rect x="496" y="274" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="310" text-anchor="middle" class="" data-max-width="210">can be exponential</text></svg>
