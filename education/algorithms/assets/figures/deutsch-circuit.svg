<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 288" role="img" aria-labelledby="title desc"><title id="title">Deutsch’s algorithm with one query</title><desc id="desc">Register order is input, then target. The Hadamards prepare |+⟩|−⟩; the query kicks (−1)^(f(x)) onto the input; the final Hadamard turns the relative sign into the bit d. The target is not measured. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Deutsch’s algorithm with one query</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="205" y="84" text-anchor="middle" class="head" data-max-width="105">Prepare</text><text x="361" y="84" text-anchor="middle" class="head" data-max-width="105">Query</text><text x="517" y="84" text-anchor="middle" class="head" data-max-width="105">Read out</text><text x="122" y="136" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 130L595 130"/><path class="wire" d="M618 127L650 127"/><path class="wire" d="M618 133L650 133"/><text x="664" y="136" text-anchor="start" class="" data-max-width="112" data-tex="d">d</text><text x="122" y="200" text-anchor="end" class="" data-max-width="115" data-tex="\ket1">|1⟩</text><path class="wire" d="M135 194L650 194"/><text x="664" y="200" text-anchor="start" class="" data-max-width="112" data-tex="\ket-">|−⟩</text><path class="slice" d="M283 96V224"/><text x="283" y="244" text-anchor="middle" class="small" data-max-width="150" data-tex="\ket+\ket-">|+⟩|−⟩</text><path class="slice" d="M439 96V224"/><text x="439" y="244" text-anchor="middle" class="small" data-max-width="150" data-math="\((-1)^{f(x)}\) on the input">(−1)^(f(x)) on the input</text><rect class="gate" x="182" y="109" width="46" height="42" rx="3"/><text x="205" y="136" text-anchor="middle" class="" data-max-width="40">H</text><rect class="gate" x="182" y="173" width="46" height="42" rx="3"/><text x="205" y="200" text-anchor="middle" class="" data-max-width="40">H</text><rect class="big" x="337.6" y="109" width="46.8" height="106" rx="3"/><text x="361" y="168" text-anchor="middle" class="" data-max-width="40.8" data-tex="U_f">U_f</text><rect class="gate" x="494" y="109" width="46" height="42" rx="3"/><text x="517" y="136" text-anchor="middle" class="" data-max-width="40">H</text><rect class="gate" x="572" y="109" width="46" height="42" rx="3"/><path d="M581 136A14 14 0 0 1 609 136" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 136L605 120" stroke="#476b70" stroke-width="1.8"/></svg>
