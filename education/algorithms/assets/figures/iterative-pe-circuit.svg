<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 264" role="img" aria-labelledby="title desc"><title id="title">One stage of iterative phase estimation</title><desc id="desc">At stage k, the single control qubit applies U^(2ᵏ⁻¹), receives a phase-gate correction P(−omegaₖ) computed from the bits already measured, and is read in the Hadamard basis to give bₖ. It is then reset for the next stage. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="430" y="26" text-anchor="middle" class="small" data-max-width="700">One stage of iterative phase estimation</text><text x="430" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L675 100"/><path class="wire" d="M698 97L730 97"/><path class="wire" d="M698 103L730 103"/><text x="744" y="106" text-anchor="start" class="" data-max-width="112" data-tex="b_k">bₖ</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket u">|u⟩</text><path class="wire" d="M135 164L730 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="744" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket u">|u⟩</text><rect class="gate" x="222" y="79" width="46" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M352.5 100L352.5 143"/><circle cx="352.5" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="321.54" y="143" width="61.92" height="42" rx="3"/><text x="352.5" y="170" text-anchor="middle" class="" data-max-width="55.92" data-tex="U^{2^{k-1}}">U^(2ᵏ⁻¹)</text><rect class="gate" x="429.04" y="79" width="61.92" height="42" rx="3"/><text x="460" y="106" text-anchor="middle" class="" data-max-width="55.92" data-tex="P(-\omega_k)">P(−omegaₖ)</text><rect class="gate" x="544.5" y="79" width="46" height="42" rx="3"/><text x="567.5" y="106" text-anchor="middle" class="" data-max-width="40">H</text><rect class="gate" x="652" y="79" width="46" height="42" rx="3"/><path d="M661 106A14 14 0 0 1 689 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M675 106L685 90" stroke="#476b70" stroke-width="1.8"/><text x="430" y="216" text-anchor="middle" class="small" data-max-width="820" data-math="\(\omega_k=2\pi\,(0.0\,b_{k+1}\cdots b_m)\) from earlier outcomes">omegaₖ=2π (0.0 bₖ₊₁⋯ b_m) from earlier outcomes</text></svg>
