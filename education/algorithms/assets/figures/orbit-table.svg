<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 166" role="img" aria-labelledby="title desc"><title id="title">The orbit of 1 under multiplication by 7 modulo 15</title><desc id="desc">U₇ cycles 1→7→4→13→1, so the order is r=4. Classically, finding r by following the orbit can take a number of steps comparable to L. Columns: k, 0, 1, 2, 3, 4. 7ᵏ mod 15, 1, 7, 4, 13, 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The orbit of 1 under multiplication by 7 modulo 15</text><rect x="32" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="90" y="83" text-anchor="middle" class="small" data-max-width="94" data-tex="k">k</text><rect x="148" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="206" y="83" text-anchor="middle" class="small" data-max-width="94">0</text><rect x="264" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="322" y="83" text-anchor="middle" class="small" data-max-width="94">1</text><rect x="380" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="438" y="83" text-anchor="middle" class="small" data-max-width="94">2</text><rect x="496" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="554" y="83" text-anchor="middle" class="small" data-max-width="94">3</text><rect x="612" y="54" width="116" height="48" fill="#eaf1f7" class="grid"/><text x="670" y="83" text-anchor="middle" class="small" data-max-width="94">4</text><rect x="32" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="90" y="131" text-anchor="middle" class="" data-max-width="94" data-tex="7^k\bmod15">7ᵏ mod 15</text><rect x="148" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="206" y="131" text-anchor="middle" class="" data-max-width="94">1</text><rect x="264" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="322" y="131" text-anchor="middle" class="" data-max-width="94">7</text><rect x="380" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="438" y="131" text-anchor="middle" class="" data-max-width="94">4</text><rect x="496" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="554" y="131" text-anchor="middle" class="" data-max-width="94">13</text><rect x="612" y="102" width="116" height="48" fill="#fff" class="grid"/><text x="670" y="131" text-anchor="middle" class="" data-max-width="94">1</text></svg>
