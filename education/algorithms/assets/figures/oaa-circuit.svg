<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">Oblivious amplitude amplification</title><desc id="desc">If W block-encodes 1/2V with V unitary, one round, W, the ancilla reflection R, W†, R, W, yields |0⟩V|ψ⟩ exactly for every input. R acts only on the ancillas, so no knowledge of |ψ⟩ is needed. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Oblivious amplitude amplification</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-math="ancillas \(\ket0\)">ancillas |0⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\ket0">|0⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="V\ket\psi">V|ψ⟩</text><rect class="big" x="219.8" y="79" width="50.4" height="106" rx="3"/><text x="245" y="138" text-anchor="middle" class="" data-max-width="44.4" data-tex="W">W</text><rect class="gate" x="309.5" y="79" width="46" height="42" rx="3"/><text x="332.5" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="R">R</text><rect class="big" x="394.8" y="79" width="50.4" height="106" rx="3"/><text x="420" y="138" text-anchor="middle" class="" data-max-width="44.4" data-tex="W^\dagger">W†</text><rect class="gate" x="484.5" y="79" width="46" height="42" rx="3"/><text x="507.5" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="R">R</text><rect class="big" x="569.8" y="79" width="50.4" height="106" rx="3"/><text x="595" y="138" text-anchor="middle" class="" data-max-width="44.4" data-tex="W">W</text><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-math="\(R=(2\ket0\bra0-I)\otimes I\); overall sign \(-1\) omitted">R=(2|0⟩⟨0|−I)⊗ I; overall sign −1 omitted</text></svg>
