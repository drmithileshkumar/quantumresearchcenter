<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">Adding one modulo four</title><desc id="desc">The high bit b₁ is drawn first. The CNOT adds the carry from the low bit; the X flips the low bit. The map is 0→1→2→3→0, a permutation, so it acts on superpositions without measurement. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Adding one modulo four</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket{b_1}">|b₁⟩</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112">high bit</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket{b_0}">|b₀⟩</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112">low bit</text><path class="wire" d="M205 100L205 164"/><circle cx="205" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="205.0" cy="100" r="14"/><path class="wire" d="M191 100L219 100"/><path class="wire" d="M205 86L205 114"/><circle class="gate" cx="595.0" cy="164" r="14"/><path class="wire" d="M581 164L609 164"/><path class="wire" d="M595 150L595 178"/><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-tex="\ket{00}\to\ket{01}\to\ket{10}\to\ket{11}\to\ket{00}">|00⟩→|01⟩→|10⟩→|11⟩→|00⟩</text></svg>
