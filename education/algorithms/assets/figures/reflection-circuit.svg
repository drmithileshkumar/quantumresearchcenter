<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" role="img" aria-labelledby="title desc"><title id="title">Reflection about a prepared state</title><desc id="desc">Top: R_ψ=A S₀ A† with A|0ⁿ⟩=|ψ⟩; the matrix product is read right to left, the circuit left to right. Bottom: one construction of S₀ on three qubits, up to a global sign: X on every qubit, a doubly controlled Z, and X again. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Reflection about a prepared state</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700" data-tex="R_\psi=2\ket\psi\bra\psi-I">R_ψ=2|ψ⟩⟨ψ|−I</text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-math="\(n\) qubits">n qubits</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="222" y="79" width="46" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="A^\dagger">A†</text><rect class="gate" x="397" y="79" width="46" height="42" rx="3"/><text x="420" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="S_0">S₀</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><text x="595" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="A">A</text><text x="390" y="176" text-anchor="middle" class="small" data-max-width="700" data-math="\(-S_0=I-2\ket{000}\bra{000}\) on three qubits">−S₀=I−2|000⟩⟨000| on three qubits</text><text x="122" y="228" text-anchor="end" class="" data-max-width="115"></text><path class="wire" d="M135 222L650 222"/><text x="664" y="228" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="292" text-anchor="end" class="" data-max-width="115"></text><path class="wire" d="M135 286L650 286"/><text x="664" y="292" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="356" text-anchor="end" class="" data-max-width="115"></text><path class="wire" d="M135 350L650 350"/><text x="664" y="356" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="182" y="201" width="46" height="42" rx="3"/><text x="205" y="228" text-anchor="middle" class="" data-max-width="40">X</text><rect class="gate" x="182" y="265" width="46" height="42" rx="3"/><text x="205" y="292" text-anchor="middle" class="" data-max-width="40">X</text><rect class="gate" x="182" y="329" width="46" height="42" rx="3"/><text x="205" y="356" text-anchor="middle" class="" data-max-width="40">X</text><path class="wire" d="M400 222L400 350"/><circle cx="400" cy="222" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="400" cy="286" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle cx="400" cy="350" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="572" y="201" width="46" height="42" rx="3"/><text x="595" y="228" text-anchor="middle" class="" data-max-width="40">X</text><rect class="gate" x="572" y="265" width="46" height="42" rx="3"/><text x="595" y="292" text-anchor="middle" class="" data-max-width="40">X</text><rect class="gate" x="572" y="329" width="46" height="42" rx="3"/><text x="595" y="356" text-anchor="middle" class="" data-max-width="40">X</text></svg>
