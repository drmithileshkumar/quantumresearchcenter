<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">First- and second-order formulas</title><desc id="desc">Error for e^(−i(X+Z)) with r steps of the first-order formula (falls as 1/r) and of the symmetric second-order formula (falls as 1/r²), on logarithmic axes. At r=10 the errors are about 0.07 and 0.003. Horizontal axis: number of steps r (log scale); vertical axis: error (log scale). </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">First- and second-order formulas</text><path d="M95 270H700" class="grid"/><text x="83" y="275" text-anchor="end" class="small" data-max-width="700">1e-4</text><path d="M95 220H700" class="grid"/><text x="83" y="225" text-anchor="end" class="small" data-max-width="700">1e-3</text><path d="M95 170H700" class="grid"/><text x="83" y="175" text-anchor="end" class="small" data-max-width="700">0.01</text><path d="M95 120H700" class="grid"/><text x="83" y="125" text-anchor="end" class="small" data-max-width="700">0.1</text><path d="M95 70H700" class="grid"/><text x="83" y="75" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">1</text><path d="M397.5 320V326" stroke="#6b7885"/><text x="397.5" y="344" text-anchor="middle" class="small" data-max-width="700">10</text><path d="M700 320V326" stroke="#6b7885"/><text x="700" y="344" text-anchor="middle" class="small" 