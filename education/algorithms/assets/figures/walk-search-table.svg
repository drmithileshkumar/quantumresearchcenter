<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" role="img" aria-labelledby="title desc"><title id="title">Classical and quantum walk search</title><desc id="desc">Costs in walk steps and checks, with setup omitted. ε is the marked fraction and delta the spectral gap. The quantum framework square-roots both factors. Columns: Graph, delta, ε, Classical, Quantum. Complete graph, 1 marked, ≈1, 1/N, N, √N (Grover); 2D grid, 1 marked, ≈1/N, 1/N, Nlog N (hitting), √Nlog N; General, delta, ε, 1/ε(1/deltaU+C), 1/√ε(1/√deltaU+C)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Classical and quantum walk search</text><rect x="32" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="101.6" y="83" text-anchor="middle" class="small" data-max-width="117.2">Graph</text><rect x="171.2" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="240.8" y="83" text-anchor="middle" class="small" data-max-width="117.2" data-tex="\delta">delta</text><rect x="310.4" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="117.2" data-tex="\varepsilon">ε</text><rect x="449.6" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="519.2" y="83" text-anchor="middle" class="small" data-max-width="117.2">Classical</text><rect x="588.8" y="54" width="139.2" height="48" fill="#eaf1f7" class="grid"/><text x="658.4" y="83" text-anchor="middle" class="small" data-max-width="117.2">Quantum</text><rect x="32" y="102" width="139.2" height="84" fill="#fff" class="grid"/><text x="101.6" y="127" text-anchor="middle" class="" data-max-width="117.2">Complete</text><text x="101.6" y="149" text-anchor="middle" class="" data-max-width="117.2">graph, 1</text><text x="101.6" y="171" text-anchor="middle" class="" data-max-width="117.2">marked</text><rect x="171.2" y="102" width="139.2" height="84" fill="#fff" class="grid"/><text x="240.8" y="149" text-anchor="middle" class="" data-max-width="117.2" data-tex="\approx1">≈1</text><rect x="310.4" y="102" width="139.2" height="84" fill="#fff" class="grid"/><text x="380" y="149" text-anchor="middle" class="" data-max-width="117.2" data-tex="1/N">1/N</text><rect x="449.6" y="102" width="139.2" height="84" fill="#fff" class="grid"/><text x="519.2" y="149" text-anchor="middle" class="" data-max-width="117.2" data-tex="N">N</text><rect x="588.8" y="102" width="139.2" height="84" fill="#fff" class="grid"/><text x="658.4" y="149" text-anchor="middle" class="" data-max-width="117.2" data-math="\(\sqrt N\) (Grover)">√N (Grover)</text><rect x="32" y="186" width="139.2" height="62" fill="#f5f8fa" class="grid"/><text x="101.6" y="211" text-anchor="middle" class="" data-max-width="117.2">2D grid, 1</text><text x="101.6" y="233" text-anchor="middle" class="" data-max-width="117.2">marked</text><rect x="171.2" y="186" width="139.2" height="62" fill="#f5f8fa" class="grid"/><text x="240.8" y="222" text-anchor="middle" class="" data-max-width="117.2" data-tex="\approx1/N">≈1/N</text><rect x="310.4" y="186" width="139.2" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="222" text-anchor="middle" class="" data-max-width="117.2" data-tex="1/N">1/N</text><rect x="449.6" y="186" width="139.2" height="62" fill="#f5f8fa" class="grid"/><text x="519.2" y="211" text-anchor="middle" class="" data-max-width="117.2" data-tex="N\log N">Nlog N</text><text x="519.2" y="233" text-anchor="middle" class="" data-max-width="117.2">(hitting)</text><rect x="588.8" y="186" width="139.2" height="62" fill="#f5f8fa" class="grid"/><text x="658.4" y="222" text-anchor="middle" class="" data-max-width="117.2" data-tex="\sqrt N\log N">√Nlog N</text><rect x="32" y="248" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="277" text-anchor="middle" class="" data-max-width="117.2">General</text><rect x="171.2" y="248" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="277" text-anchor="middle" class="" data-max-width="117.2" data-tex="\delta">delta</text><rect x="310.4" y="248" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="277" text-anchor="middle" class="" data-max-width="117.2" data-tex="\varepsilon">ε</text><rect x="449.6" y="248" width="139.2" height="48" fill="#fff" class="grid"/><text x="519.2" y="277" text-anchor="middle" class="" data-max-width="117.2" data-tex="\frac1\varepsilon(\frac1\delta\mathsf U+\mathsf C)">1/ε(1/deltaU+C)</text><rect x="588.8" y="248" width="139.2" height="48" fill="#fff" class="grid"/><text x="658.4" y="277" text-anchor="middle" class="" data-max-width="117.2" data-tex="\frac{1}{\sqrt\varepsilon}(\frac{1}{\sqrt\delta}\mathsf U+\mathsf C)">1/√ε(1/√deltaU+C)</text></svg>
