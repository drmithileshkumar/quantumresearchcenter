<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-labelledby="title desc"><title id="title">Singular value transformation</title><desc id="desc">QSVT replaces each singular value sigmaⱼ of A/α by P(sigmaⱼ/α). Odd polynomials map input directions to output directions; even polynomials map input directions to themselves. Columns: Polynomial parity, Encoded operator, Example. odd, ΣⱼP(sigmaⱼ/α)|uⱼ⟩⟨wⱼ|, amplification, pseudoinverse; even, ΣⱼP(sigmaⱼ/α)|wⱼ⟩⟨wⱼ|, projector onto large singular values; Hermitian A, eigenvalue transformation, simulation, filtering</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Singular value transformation</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Polynomial parity</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Encoded operator</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Example</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">odd</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210" data-tex="\sum_jP(\sigma_j/\alpha)\ket{u_j}\bra{w_j}">ΣⱼP(sigmaⱼ/α)|uⱼ⟩⟨wⱼ|</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">amplification,</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">pseudoinverse</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210">even</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210" data-tex="\sum_jP(\sigma_j/\alpha)\ket{w_j}\bra{w_j}">ΣⱼP(sigmaⱼ/α)|wⱼ⟩⟨wⱼ|</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210">projector onto large</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">singular values</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210" data-math="Hermitian \(A\)">Hermitian A</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="251" text-anchor="middle" class="" data-max-width="210">eigenvalue</text><text x="380" y="273" text-anchor="middle" class="" data-max-width="210">transformation</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="262" text-anchor="middle" class="" data-max-width="210">simulation, filtering</text></svg>
