<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 374" role="img" aria-labelledby="title desc"><title id="title">Two kinds of noise in variational methods</title><desc id="desc">Shot noise is statistical and averages away with more measurements; hardware noise biases the estimate and does not. Columns: , Shot noise, Hardware noise. Origin, finite number of measurements, decoherence and gate errors; Effect, random error, mean zero, systematic bias; Scaling, standard deviation propto1/√R, grows with circuit size; Remedy, more shots, better allocation, shorter circuits, mitigation, error correction</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Two kinds of noise in variational methods</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210"></text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Shot noise</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Hardware noise</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Origin</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">finite number of</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">measurements</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">decoherence and gate</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">errors</text><rect x="32" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="193" text-anchor="middle" class="" data-max-width="210">Effect</text><rect x="264" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="193" text-anchor="middle" class="" data-max-width="210">random error, mean zero</text><rect x="496" y="164" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="193" text-anchor="middle" class="" data-max-width="210">systematic bias</text><rect x="32" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="248" text-anchor="middle" class="" data-max-width="210">Scaling</text><rect x="264" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="237" text-anchor="middle" class="" data-max-width="210">standard deviation</text><text x="380" y="259" text-anchor="middle" class="" data-max-width="210" data-tex="\propto1/\sqrt R">propto1/√R</text><rect x="496" y="212" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="248" text-anchor="middle" class="" data-max-width="210">grows with circuit size</text><rect x="32" y="274" width="232" height="84" fill="#f5f8fa" class="grid"/><text x="148" y="321" text-anchor="middle" class="" data-max-width="210">Remedy</text><rect x="264" y="274" width="232" height="84" fill="#f5f8fa" class="grid"/><text x="380" y="310" text-anchor="middle" class="" data-max-width="210">more shots, better</text><text x="380" y="332" text-anchor="middle" class="" data-max-width="210">allocation</text><rect x="496" y="274" width="232" height="84" fill="#f5f8fa" class="grid"/><text x="612" y="299" text-anchor="middle" class="" data-max-width="210">shorter circuits,</text><text x="612" y="321" text-anchor="middle" class="" data-max-width="210">mitigation, error</text><text x="612" y="343" text-anchor="middle" class="" data-max-width="210">correction</text></svg>
