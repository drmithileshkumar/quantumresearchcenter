<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 358" role="img" aria-labelledby="title desc"><title id="title">Exact amplification by lowering the angle</title><desc id="desc">With p known, choose k=⌈π/(4θ)−1/2⌉ and θ&#x27;=π/(4k+2)≤θ. A flag qubit with probability p&#x27;/p of being 1 reduces the success probability to p&#x27;=sin²θ&#x27;, and k iterations on the joint preparation then succeed with certainty. Columns: Quantity, General, Example p=1/2. angle, θ=arcsin√p, 45°; iterations, k=⌈π/(4θ)−1/2⌉, 1; lowered angle, θ&#x27;=π/(4k+2), 30°; flag probability, p&#x27;/p, 1/2; final success, sin²((2k+1)θ&#x27;)=1, 1</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Exact amplification by lowering the angle</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Quantity</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">General</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210" data-math="Example \(p=1/2\)">Example p=1/2</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210">angle</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="\theta=\arcsin\sqrt p">θ=arcsin√p</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-tex="45^\circ">45°</text><rect x="32" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="179" text-anchor="middle" class="" data-max-width="210">iterations</text><rect x="264" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="k=\lceil\pi/(4\theta)-1/2\rceil">k=⌈π/(4θ)−1/2⌉</text><rect x="496" y="150" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="179" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text><rect x="32" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="227" text-anchor="middle" class="" data-max-width="210">lowered angle</text><rect x="264" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="\theta&#x27;=\pi/(4k+2)">θ&#x27;=π/(4k+2)</text><rect x="496" y="198" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="227" text-anchor="middle" class="" data-max-width="210" data-tex="30^\circ">30°</text><rect x="32" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="275" text-anchor="middle" class="" data-max-width="210">flag probability</text><rect x="264" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="275" text-anchor="middle" class="" data-max-width="210" data-tex="p&#x27;/p">p&#x27;/p</text><rect x="496" y="246" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="275" text-anchor="middle" class="" data-max-width="210" data-tex="1/2">1/2</text><rect x="32" y="294" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="323" text-anchor="middle" class="" data-max-width="210">final success</text><rect x="264" y="294" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="323" text-anchor="middle" class="" data-max-width="210" data-tex="\sin^2((2k+1)\theta&#x27;)=1">sin²((2k+1)θ&#x27;)=1</text><rect x="496" y="294" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="323" text-anchor="middle" class="" data-max-width="210" data-tex="1">1</text></svg>
