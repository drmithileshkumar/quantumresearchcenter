<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">A polynomial filter</title><desc id="desc">A degree-24 even polynomial (solid) approximating a smoothed filter that keeps eigenvalues with |x|&lt;0.3 and removes those with |x|&gt;0.5 (the gap between is shaded by the transition). The polynomial stays within [−1,1] everywhere, as any achievable response must. Horizontal axis: eigenvalue of H/α; vertical axis: filter value. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">A polynomial filter</text><path d="M95 298.261H700" class="grid"/><text x="83" y="303.261" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 189.565H700" class="grid"/><text x="83" y="194.565" text-anchor="end" class="small" data-max-width="700">0.5</text><path d="M95 80.8696H700" class="grid"/><text x="83" y="85.8696" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">-1</text><path d="M246.25 320V326" stroke="#6b7885"/><text x="246.25" y="344" text-anchor="middle" class="small" data-max-width="700">-0.5</text><path d="M306.75 320V326" stroke="#6b7885"/><text x="306.75" y="344" text-anchor="middle" class="small" data-max-width="700">-0.3</text><path d="M397.5 320V326" stroke="#6b7885"/><text x="397.5" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M488.25 320V3