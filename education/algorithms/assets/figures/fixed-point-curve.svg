<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Ordinary versus fixed-point amplification</title><desc id="desc">Success probability after one step as a function of the initial success probability p. An ordinary iteration (sin²(3θ)) is excellent near p=1/4 but overshoots for larger p. One π/3 fixed-point step (1−(1−p)³) never decreases success. Both use three calls to A or A†. Horizontal axis: initial success probability p; vertical axis: success after one step. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Ordinary versus fixed-point amplification</text><path d="M95 320H500" class="grid"/><text x="83" y="325" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 195H500" class="grid"/><text x="83" y="200" text-anchor="end" class="small" data-max-width="700">0.5</text><path d="M95 70H500" class="grid"/><text x="83" y="75" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M196.25 320V326" stroke="#6b7885"/><text x="196.25" y="344" text-anchor="middle" class="small" data-max-width="700">0.25</text><path d="M297.5 320V326" stroke="#6b7885"/><text x="297.5" y="344" text-anchor="middle" class="small" data-max-width="700">0.5</text><path d="M398.75 320V326" stroke="#6b7885"/><text x="398.75" y="344" text-anchor="middle" class="small" data-max-width