<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 290" role="img" aria-labelledby="title desc"><title id="title">The quantum Fourier transform on three qubits</title><desc id="desc">Inputs x₂x₁x₀, high bit on top. Each wire receives a Hadamard and controlled phase gates P(π/2), P(π/4) from lower bits, building the factors of the product representation in reverse order; the final swap restores the order. Output y₂y₁y₀. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="460" y="26" text-anchor="middle" class="small" data-max-width="700">The quantum Fourier transform on three qubits</text><text x="460" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket{x_2}">|x₂⟩</text><path class="wire" d="M135 100L790 100"/><text x="804" y="106" text-anchor="start" class="" data-max-width="112" data-tex="y_2">y₂</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket{x_1}">|x₁⟩</text><path class="wire" d="M135 164L790 164"/><text x="804" y="170" text-anchor="start" class="" data-max-width="112" data-tex="y_1">y₁</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket{x_0}">|x₀⟩</text><path class="wire" d="M135 228L790 228"/><text x="804" y="234" text-anchor="start" class="" data-max-width="112" data-tex="y_0">y₀</text><rect class="gate" x="182" y="79" width="46" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M293.333 164L293.333 121"/><circle cx="293.333" cy="164" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="266.076" y="79" width="54.5143" height="42" rx="3"/><text x="293.333" y="106" text-anchor="middle" class="" data-max-width="48.5143" data-tex="P_{\pi/2}">P_(π/2)</text><path class="wire" d="M381.667 228L381.667 121"/><circle cx="381.667" cy="228" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="354.41" y="79" width="54.5143" height="42" rx="3"/><text x="381.667" y="106" text-anchor="middle" class="" data-max-width="48.5143" data-tex="P_{\pi/4}">P_(π/4)</text><rect class="gate" x="447" y="143" width="46" height="42" rx="3"/><text x="470" y="170" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M558.333 228L558.333 185"/><circle cx="558.333" cy="228" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="531.076" y="143" width="54.5143" height="42" rx="3"/><text x="558.333" y="170" text-anchor="middle" class="" data-max-width="48.5143" data-tex="P_{\pi/2}">P_(π/2)</text><rect class="gate" x="623.667" y="207" width="46" height="42" rx="3"/><text x="646.667" y="234" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M735 100L735 228"/><path class="wire" d="M726 91L744 109"/><path class="wire" d="M726 109L744 91"/><path class="wire" d="M726 219L744 237"/><path class="wire" d="M726 237L744 219"/></svg>
