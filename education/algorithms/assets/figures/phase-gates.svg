<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 354" role="img" aria-labelledby="title desc"><title id="title">A phase from a computed integer</title><desc id="desc">C computes a three-bit value v=4v₂+2v₁+v₀ from x. Phase gates Z, S, T on the bits multiply by e^(2π iv/8); C⁻¹ then clears the register so that only the phase remains on |x⟩. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A phase from a computed integer</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="e^{2\pi iv(x)/8}\ket x">e^(2π iv(x)/8)|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="v_2:\ket0">v₂:|0⟩</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket0">|0⟩</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="v_1:\ket0">v₁:|0⟩</text><path class="wire" d="M135 228L650 228"/><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="\ket0">|0⟩</text><text x="122" y="298" text-anchor="end" class="" data-max-width="115" data-tex="v_0:\ket0">v₀:|0⟩</text><path class="wire" d="M135 292L650 292"/><text x="664" y="298" text-anchor="start" class="" data-max-width="112" data-tex="\ket0">|0⟩</text><rect class="big" x="203" y="79" width="84" height="234" rx="3"/><text x="245" y="202" text-anchor="middle" class="" data-max-width="78" data-tex="C">C</text><rect class="gate" x="397" y="143" width="46" height="42" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="40" data-tex="Z">Z</text><rect class="gate" x="397" y="207" width="46" height="42" rx="3"/><text x="420" y="234" text-anchor="middle" class="" data-max-width="40" data-tex="S">S</text><rect class="gate" x="397" y="271" width="46" height="42" rx="3"/><text x="420" y="298" text-anchor="middle" class="" data-max-width="40" data-tex="T">T</text><rect class="big" x="553" y="79" width="84" height="234" rx="3"/><text x="595" y="202" text-anchor="middle" class="" data-max-width="78" data-tex="C^{-1}">C⁻¹</text></svg>
