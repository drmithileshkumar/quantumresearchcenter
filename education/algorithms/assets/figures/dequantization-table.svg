<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" role="img" aria-labelledby="title desc"><title id="title">Speedups under compatible access</title><desc id="desc">When quantum algorithms assume data structures that support efficient state preparation, classical algorithms given the matching sampling access can sometimes match them up to polynomial factors. Columns: Setting, Quantum assumption, Classical comparison. Low-rank recommendation, QRAM-style state preparation, sampling access: polynomial gap only; Sparse, implicitly defined H, entry oracles from a formula, no comparable shortcut known; Dense classical matrix, block encoding given, reading the input already costs N²</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Speedups under compatible access</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Setting</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Quantum assumption</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Classical comparison</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210">Low-rank recommendation</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">QRAM-style state</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">preparation</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">sampling access:</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">polynomial gap only</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="189" text-anchor="middle" class="" data-max-width="210">Sparse, implicitly</text><text x="148" y="211" text-anchor="middle" class="" data-max-width="210" data-math="defined \(H\)">defined H</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="189" text-anchor="middle" class="" data-max-width="210">entry oracles from a</text><text x="380" y="211" text-anchor="middle" class="" data-max-width="210">formula</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210">no comparable shortcut</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">known</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210">Dense classical matrix</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="262" text-anchor="middle" class="" data-max-width="210">block encoding given</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="251" text-anchor="middle" class="" data-max-width="210">reading the input</text><text x="612" y="273" text-anchor="middle" class="" data-max-width="210" data-math="already costs \(N^2\)">already costs N²</text></svg>
