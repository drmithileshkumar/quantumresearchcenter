<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" role="img" aria-labelledby="title desc"><title id="title">One coherent query on a superposition of inputs</title><desc id="desc">U_f is the two-register oracle, a composite operation. After the query both values of f appear in the state, but measuring both registers returns one input with its value. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">One coherent query on a superposition of inputs</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="x">x</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 164L595 164"/><path class="wire" d="M618 161L650 161"/><path class="wire" d="M618 167L650 167"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="f(x)">f(x)</text><path class="slice" d="M497.5 66V194"/><text x="497.5" y="214" text-anchor="middle" class="small" data-max-width="150" data-tex="\ket{0,f(0)}+\ket{1,f(1)}">|0,f(0)⟩+|1,f(1)⟩</text><rect class="gate" x="182" y="79" width="46" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="40">H</text><rect class="big" x="354" y="79" width="92" height="106" rx="3"/><text x="400" y="138" text-anchor="middle" class="" data-max-width="86" data-tex="U_f">U_f</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><path d="M581 170A14 14 0 0 1 609 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 170L605 154" stroke="#476b70" stroke-width="1.8"/></svg>
