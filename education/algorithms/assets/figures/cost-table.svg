<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 436" role="img" aria-labelledby="title desc"><title id="title">What one gate costs depends on the gate set</title><desc id="desc">Typical constructions in the Clifford+T gate set. Counts are for standard textbook circuits and can be reduced in context, for example when a Toffoli is later uncomputed. Columns: Operation, Elementary cost, Remark. CNOT, H, S, 1 gate each, Clifford gates; cheap in most error-corrected schemes; T=diag(1,e^(iπ/4)), 1 gate, Usually the dominant cost; Toffoli, 7 T, 6 CNOT, 2 H, Exact decomposition without ancilla; k-controlled X, about 2k Toffolis, With k−2 clean ancillas; Clean oracle from T-gate C, 2T+m gates, Compute, copy m bits, uncompute</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">What one gate costs depends on the gate set</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Operation</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Elementary cost</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Remark</text><rect x="32" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="148" y="149" text-anchor="middle" class="" data-max-width="210" data-math="CNOT, \(H\), \(S\)">CNOT, H, S</text><rect x="264" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">1 gate each</text><rect x="496" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">Clifford gates; cheap in</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210">most error-corrected</text><text x="612" y="171" text-anchor="middle" class="" data-max-width="210">schemes</text><rect x="32" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="222" text-anchor="middle" class="" data-max-width="210" data-tex="T=\mathrm{diag}(1,e^{i\pi/4})">T=diag(1,e^(iπ/4))</text><rect x="264" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="222" text-anchor="middle" class="" data-max-width="210">1 gate</text><rect x="496" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">Usually the dominant</text><text x="612" y="233" text-anchor="middle" class="" data-max-width="210">cost</text><rect x="32" y="248" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="284" text-anchor="middle" class="" data-max-width="210">Toffoli</text><rect x="264" y="248" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="284" text-anchor="middle" class="" data-max-width="210" data-math="7 \(T\), 6 CNOT, 2 \(H\)">7 T, 6 CNOT, 2 H</text><rect x="496" y="248" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="273" text-anchor="middle" class="" data-max-width="210">Exact decomposition</text><text x="612" y="295" text-anchor="middle" class="" data-max-width="210">without ancilla</text><rect x="32" y="310" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="339" text-anchor="middle" class="" data-max-width="210" data-math="\(k\)-controlled \(X\)">k-controlled X</text><rect x="264" y="310" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="339" text-anchor="middle" class="" data-max-width="210" data-math="about \(2k\) Toffolis">about 2k Toffolis</text><rect x="496" y="310" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="339" text-anchor="middle" class="" data-max-width="210" data-math="With \(k-2\) clean ancillas">With k−2 clean ancillas</text><rect x="32" y="358" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="383" text-anchor="middle" class="" data-max-width="210" data-math="Clean oracle from \(T\)-gate">Clean oracle from T-gate</text><text x="148" y="405" text-anchor="middle" class="" data-max-width="210" data-tex="C">C</text><rect x="264" y="358" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="394" text-anchor="middle" class="" data-max-width="210" data-math="\(2T+m\) gates">2T+m gates</text><rect x="496" y="358" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="383" text-anchor="middle" class="" data-max-width="210" data-math="Compute, copy \(m\) bits,">Compute, copy m bits,</text><text x="612" y="405" text-anchor="middle" class="" data-max-width="210">uncompute</text></svg>
