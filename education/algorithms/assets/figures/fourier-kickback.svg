<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" role="img" aria-labelledby="title desc"><title id="title">Phase kickback from modular addition</title><desc id="desc">The register holding |chi⟩=M^(−1/2)Σ_ye^(−2π iy/M)|y⟩ is an eigenstate of adding v modulo M, with eigenvalue e^(2π iv/M). A clean addition of a computed v(x) therefore kicks the phase back onto |x⟩ and leaves |chi⟩ unchanged for reuse. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Phase kickback from modular addition</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="e^{2\pi iv(x)/M}\ket x">e^(2π iv(x)/M)|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket\chi">|chi⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket\chi">|chi⟩</text><rect class="big" x="345" y="79" width="150" height="106" rx="3"/><text x="420" y="138" text-anchor="middle" class="" data-max-width="144" data-math="add \(v(x)\) mod \(M\)">add v(x) mod M</text></svg>
