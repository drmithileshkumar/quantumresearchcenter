<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Evolving through eigenvectors</title><desc id="desc">For H=γ X, expand |0⟩ in eigenvectors, give each its phase e^(−iλ t), and recombine. Motion comes from the difference between the two phases. Columns: Eigenvector, Eigenvalue, Coefficient in |0⟩, Coefficient at time t. |+⟩, γ, 1/√2, e^(−iγ t)/√2; |−⟩, −γ, 1/√2, e^(iγ t)/√2; result, , |0⟩, cosγ t |0⟩−isinγ t |1⟩</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Evolving through eigenvectors</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152">Eigenvector</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="90" text-anchor="middle" class="small" data-max-width="152">Eigenvalue</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="79" text-anchor="middle" class="small" data-max-width="152">Coefficient in</text><text x="467" y="101" text-anchor="middle" class="small" data-max-width="152" data-tex="\ket0">|0⟩</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="79" text-anchor="middle" class="small" data-max-width="152">Coefficient at</text><text x="641" y="101" text-anchor="middle" class="small" data-max-width="152" data-math="time \(t\)">time t</text><rect x="32" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket+">|+⟩</text><rect x="206" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\gamma">γ</text><rect x="380" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="1/\sqrt2">1/√2</text><rect x="554" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="e^{-i\gamma t}/\sqrt2">e^(−iγ t)/√2</text><rect x="32" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket-">|−⟩</text><rect x="206" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="-\gamma">−γ</text><rect x="380" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="1/\sqrt2">1/√2</text><rect x="554" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="e^{i\gamma t}/\sqrt2">e^(iγ t)/√2</text><rect x="32" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="241" text-anchor="middle" class="" data-max-width="152">result</text><rect x="206" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="241" text-anchor="middle" class="" data-max-width="152"></text><rect x="380" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\ket0">|0⟩</text><rect x="554" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\cos\gamma t\,\ket0-i\sin\gamma t\,\ket1">cosγ t |0⟩−isinγ t |1⟩</text></svg>
