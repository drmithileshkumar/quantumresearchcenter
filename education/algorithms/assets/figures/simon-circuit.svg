<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 258" role="img" aria-labelledby="title desc"><title id="title">One run of Simon’s algorithm</title><desc id="desc">Both registers have n qubits. Measuring the output collapses the input onto a pair {x₀,x₀⊕ s}; the Hadamard layer turns the unknown x₀ into a phase and returns a random z with s· z=0. The output measurement may be omitted without changing the statistics of z. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">One run of Simon’s algorithm</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="z">z</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^n}">|0ⁿ⟩</text><path class="wire" d="M135 164L420 164"/><path class="wire" d="M443 161L650 161"/><path class="wire" d="M443 167L650 167"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="f(x_0)">f(x₀)</text><path class="slice" d="M463.75 66V194"/><text x="463.75" y="214" text-anchor="middle" class="small" data-max-width="150" data-tex="\tfrac{1}{\sqrt2}(\ket{x_0}+\ket{x_0\oplus s})">1/√2(|x₀⟩+|x₀⊕ s⟩)</text><rect class="gate" x="219.8" y="79" width="50.4" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="44.4" data-tex="H^{\otimes n}">H^(⊗ n)</text><rect class="big" x="307.3" y="79" width="50.4" height="106" rx="3"/><text x="332.5" y="138" text-anchor="middle" class="" data-max-width="44.4" data-tex="U_f">U_f</text><rect class="gate" x="397" y="143" width="46" height="42" rx="3"/><path d="M406 170A14 14 0 0 1 434 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M420 170L430 154" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="482.3" y="79" width="50.4" height="42" rx="3"/><text x="507.5" y="106" text-anchor="middle" class="" data-max-width="44.4" data-tex="H^{\otimes n}">H^(⊗ n)</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/></svg>
