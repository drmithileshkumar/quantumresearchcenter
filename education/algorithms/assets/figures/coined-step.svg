<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">One step of a coined walk on a cycle</title><desc id="desc">The coin qubit is rotated by H; then the position register is decremented if the coin is 0 (open control) and incremented if it is 1 (filled control), modulo N. Each shift box is reversible arithmetic built as in Chapter 2. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">One step of a coined walk on a cycle</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115">coin</text><path class="wire" d="M135 100L650 100"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112"></text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-math="position \(\ket x\)">position |x⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="222" y="79" width="46" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M420 100L420 143"/><circle cx="420" cy="100" r="6" fill="#fff" stroke="#476b70" stroke-width="2"/><rect class="gate" x="391.5" y="143" width="57" height="42" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="51" data-tex="x-1">x−1</text><path class="wire" d="M595 100L595 143"/><circle cx="595" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><rect class="gate" x="566.5" y="143" width="57" height="42" rx="3"/><text x="595" y="170" text-anchor="middle" class="" data-max-width="51" data-tex="x+1">x+1</text><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-math="\(W=S(H\otimes I)\), with \(S\ket{0,x}=\ket{0,x-1}\) and \(S\ket{1,x}=\ket{1,x+1}\)">W=S(H⊗ I), with S|0,x⟩=|0,x−1⟩ and S|1,x⟩=|1,x+1⟩</text></svg>
