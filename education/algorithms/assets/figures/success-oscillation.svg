<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Success probability oscillates with the number of iterations</title><desc id="desc">For p=0.01, the success probability after k iterations is sin²((2k+1)θ) with θ=arcsin0.1. It peaks near k=7, returns almost to zero near k=15, and keeps oscillating. More iterations are not always better. Horizontal axis: iterations k; vertical axis: success probability. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Success probability oscillates with the number of iterations</text><path d="M95 320H700" class="grid"/><text x="83" y="325" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 195H700" class="grid"/><text x="83" y="200" text-anchor="end" class="small" data-max-width="700">0.5</text><path d="M95 70H700" class="grid"/><text x="83" y="75" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M236.167 320V326" stroke="#6b7885"/><text x="236.167" y="344" text-anchor="middle" class="small" data-max-width="700">7</text><path d="M397.5 320V326" stroke="#6b7885"/><text x="397.5" y="344" text-anchor="middle" class="small" data-max-width="700">15</text><path d="M538.667 320V326" stroke="#6b7885"/><text x="538.667" y="344" text-anchor="middle" class="small" data-max-width="700">22</text><path d="M700 320V326" strok