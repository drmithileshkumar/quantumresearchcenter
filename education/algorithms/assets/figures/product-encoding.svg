<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="title desc"><title id="title">Multiplying encoded matrices</title><desc id="desc">U_B encodes B/β with its own ancillas and U_A encodes A/α with others. Keeping both ancilla registers at 0 applies AB/(αβ). Reusing one ancilla register for both would let failure amplitude return to the selected block. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Multiplying encoded matrices</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-math="\(a\) ancillas \(\ket0\)">a ancillas |0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112">keep 0</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-math="\(b\) ancillas \(\ket0\)">b ancillas |0⟩</text><path class="wire" d="M135 164L595 164"/><path class="wire" d="M618 161L650 161"/><path class="wire" d="M618 167L650 167"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112">keep 0</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 228L650 228"/><path class="wire" d="M151 236L163 220"/><text x="165" y="218" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="\propto AB\ket\psi">propto AB|ψ⟩</text><rect class="big" x="203" y="143" width="84" height="106" rx="3"/><text x="245" y="202" text-anchor="middle" class="" data-max-width="78" data-tex="U_B">U_B</text><rect class="big" x="378" y="79" width="84" height="170" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="78" data-tex="U_A">U_A</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><rect class="gate" x="572" y="143" width="46" height="42" rx="3"/><path d="M581 170A14 14 0 0 1 609 170" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 170L605 154" stroke="#476b70" stroke-width="1.8"/></svg>
