<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Exact gradients from shifted circuits</title><desc id="desc">For a single Pauli rotation, E(θ) is a sinusoid, and 1/2[E(θ+π/2)−E(θ−π/2)] equals the derivative exactly. In the example, E=−1−sinθ (solid) and dE/dθ=−cosθ (dashed). Horizontal axis: parameter θ; vertical axis: value. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Exact gradients from shifted circuits</text><path d="M95 312.188H500" class="grid"/><text x="83" y="317.188" text-anchor="end" class="small" data-max-width="700">-2</text><path d="M95 234.062H500" class="grid"/><text x="83" y="239.062" text-anchor="end" class="small" data-max-width="700">-1</text><path d="M95 155.938H500" class="grid"/><text x="83" y="160.938" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 77.8125H500" class="grid"/><text x="83" y="82.8125" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M196.25 320V326" stroke="#6b7885"/><text x="196.25" y="344" text-anchor="middle" class="small" data-max-width="700">π/2</text><path d="M297.5 320V326" stroke="#6b7885"/><text x="297.5" y="344" text-anchor="middle" class="small" data-max-width="700">π</text><path d="M398.75 320V326" stroke="#6b7885"/><text x="398.75" y="344" text-anchor="middle" class="small" data-max