<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 596" role="img" aria-labelledby="title desc"><title id="title">The design process applied to Deutsch’s problem</title><desc id="desc">Each row is a design question that applies to every algorithm in the course. The answers for Deutsch’s problem are developed in the sections before this one. Columns: Design step, Question, Deutsch’s answer. Problem, What output, for which inputs, with what success?, d=f(0)⊕ f(1), all four f, exact; Access, How may the input be consulted?, Coherent oracle U_f, one use per query; Encoding, How does the property enter amplitudes?, Phase kickback: (−1)^(f(x)) via target |−⟩; Interference, Which branches meet, and what blocks them?, Both inputs meet under H; no target record; Readout, Which measurement separates the answers?, H then computational basis: |±⟩→|0⟩,|1⟩; Proof, Why is it correct on every input?, Amplitudes 1/2((−1)^(f(0))±(−1)^(f(1))); Resources, What does it cost, against which baseline?, 1 query vs 2 classical; 2 qubits; 3–4 gates</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The design process applied to Deutsch’s problem</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Design step</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Question</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Deutsch’s answer</text><rect x="32" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="148" y="149" text-anchor="middle" class="" data-max-width="210">Problem</text><rect x="264" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="380" y="127" text-anchor="middle" class="" data-max-width="210">What output, for which</text><text x="380" y="149" text-anchor="middle" class="" data-max-width="210">inputs, with what</text><text x="380" y="171" text-anchor="middle" class="" data-max-width="210">success?</text><rect x="496" y="102" width="232" height="84" fill="#fff" class="grid"/><text x="612" y="138" text-anchor="middle" class="" data-max-width="210" data-math="\(d=f(0)\oplus f(1)\), all four">d=f(0)⊕ f(1), all four</text><text x="612" y="160" text-anchor="middle" class="" data-max-width="210" data-math="\(f\), exact">f, exact</text><rect x="32" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="222" text-anchor="middle" class="" data-max-width="210">Access</text><rect x="264" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="211" text-anchor="middle" class="" data-max-width="210">How may the input be</text><text x="380" y="233" text-anchor="middle" class="" data-max-width="210">consulted?</text><rect x="496" y="186" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="211" text-anchor="middle" class="" data-max-width="210" data-math="Coherent oracle \(U_f\), one">Coherent oracle U_f, one</text><text x="612" y="233" text-anchor="middle" class="" data-max-width="210">use per query</text><rect x="32" y="248" width="232" height="84" fill="#fff" class="grid"/><text x="148" y="295" text-anchor="middle" class="" data-max-width="210">Encoding</text><rect x="264" y="248" width="232" height="84" fill="#fff" class="grid"/><text x="380" y="284" text-anchor="middle" class="" data-max-width="210">How does the property</text><text x="380" y="306" text-anchor="middle" class="" data-max-width="210">enter amplitudes?</text><rect x="496" y="248" width="232" height="84" fill="#fff" class="grid"/><text x="612" y="273" text-anchor="middle" class="" data-max-width="210">Phase kickback:</text><text x="612" y="295" text-anchor="middle" class="" data-max-width="210" data-math="\((-1)^{f(x)}\) via target">(−1)^(f(x)) via target</text><text x="612" y="317" text-anchor="middle" class="" data-max-width="210" data-tex="\ket-">|−⟩</text><rect x="32" y="332" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="368" text-anchor="middle" class="" data-max-width="210">Interference</text><rect x="264" y="332" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="357" text-anchor="middle" class="" data-max-width="210">Which branches meet, and</text><text x="380" y="379" text-anchor="middle" class="" data-max-width="210">what blocks them?</text><rect x="496" y="332" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="357" text-anchor="middle" class="" data-max-width="210">Both inputs meet under</text><text x="612" y="379" text-anchor="middle" class="" data-max-width="210" data-math="\(H\); no target record">H; no target record</text><rect x="32" y="394" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="430" text-anchor="middle" class="" data-max-width="210">Readout</text><rect x="264" y="394" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="419" text-anchor="middle" class="" data-max-width="210">Which measurement</text><text x="380" y="441" text-anchor="middle" class="" data-max-width="210">separates the answers?</text><rect x="496" y="394" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="419" text-anchor="middle" class="" data-max-width="210" data-math="\(H\) then computational">H then computational</text><text x="612" y="441" text-anchor="middle" class="" data-max-width="210" data-math="basis: \(\ket\pm\to\ket{0},\ket1\)">basis: |±⟩→|0⟩,|1⟩</text><rect x="32" y="456" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="492" text-anchor="middle" class="" data-max-width="210">Proof</text><rect x="264" y="456" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="481" text-anchor="middle" class="" data-max-width="210">Why is it correct on</text><text x="380" y="503" text-anchor="middle" class="" data-max-width="210">every input?</text><rect x="496" y="456" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="481" text-anchor="middle" class="" data-max-width="210">Amplitudes</text><text x="612" y="503" text-anchor="middle" class="" data-max-width="210" data-tex="\tfrac12((-1)^{f(0)}\pm(-1)^{f(1)})">1/2((−1)^(f(0))±(−1)^(f(1)))</text><rect x="32" y="518" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="554" text-anchor="middle" class="" data-max-width="210">Resources</text><rect x="264" y="518" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="543" text-anchor="middle" class="" data-max-width="210">What does it cost,</text><text x="380" y="565" text-anchor="middle" class="" data-max-width="210">against which baseline?</text><rect x="496" y="518" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="543" text-anchor="middle" class="" data-max-width="210">1 query vs 2 classical;</text><text x="612" y="565" text-anchor="middle" class="" data-max-width="210">2 qubits; 3–4 gates</text></svg>
