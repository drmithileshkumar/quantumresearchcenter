<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">A block encoding with one ancilla</title><desc id="desc">U acts on the ancilla and the system. With the ancilla starting in |0⟩, the ancilla-0 branch of the output is A|ψ⟩/α and the ancilla-1 branch carries the remaining length. Measuring the ancilla and keeping outcome 0 applies A up to normalization. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A block encoding with one ancilla</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-math="ancilla \(\ket0\)">ancilla |0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112">keep 0</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket\psi">|ψ⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\propto A\ket\psi">propto A|ψ⟩</text><rect class="big" x="199" y="79" width="92" height="106" rx="3"/><text x="245" y="138" text-anchor="middle" class="" data-max-width="86" data-tex="U">U</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-tex="U\ket0\ket\psi=\ket0\tfrac{A}{\alpha}\ket\psi+\ket1\ket{\ast}">U|0⟩|ψ⟩=|0⟩A/α|ψ⟩+|1⟩|ast⟩</text></svg>
