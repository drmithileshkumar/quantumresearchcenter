<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Phase estimation for a phase between grid points</title><desc id="desc">Outcome probabilities for M=8 and φ=0.3, so Mφ=2.4. The two nearest grid points 2 and 3 carry probability about 0.84; the distribution falls off roughly as the inverse square of the distance from Mφ. Horizontal axis: outcome j; vertical axis: probability. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Phase estimation for a phase between grid points</text><path d="M95 320H700" class="grid"/><text x="83" y="325" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 248.571H700" class="grid"/><text x="83" y="253.571" text-anchor="end" class="small" data-max-width="700">0.2</text><path d="M95 177.143H700" class="grid"/><text x="83" y="182.143" text-anchor="end" class="small" data-max-width="700">0.4</text><path d="M95 105.714H700" class="grid"/><text x="83" y="110.714" text-anchor="end" class="small" data-max-width="700">0.6</text><path d="M139.268 320V326" stroke="#6b7885"/><text x="139.268" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M213.049 320V326" stroke="#6b7885"/><text x="213.049" y="344" text-anchor="middle" class="small" data-max-width="700">1</text><path d="M286.829 320V326" stroke="#6b7885"/><text x="286.829" y="344" text-anchor="middle" class="small" data-max-width="700">2</text><path d="M360.61 320V326" stroke="#6b7885"/><text x="360.61" y="344" text-anchor="middle" class="small" data-max-width="700">3</text><path d="M434.39 320V326" stroke="#6b7885"/><text x="434.39" y="344" text-anchor="middle" class="small" data-max-width="700">4</text><path d="M508.171 320V326" stroke="#6b7885"/><text x="508.171" y="344" text-anchor="middle" class="small" data-max-width="700">5</text><path d="M581.951 320V326" stroke="#6b7885"/><text x="581.951" y="344" text-anchor="middle" class="small" data-max-width="700">6</text><path d="M655.732 320V326" stroke="#6b7885"/><text x="655.732" y="344" text-anchor="middle" class="small" data-max-width="700">7</text><path d="M95 320H700M95 320V70" stroke="#6b7885" fill="none"/><text x="397.5" y="372" text-anchor="middle" class="small" data-max-width="560" data-math="outcome \(j\)">outcome j</text><text x="91" y="54" text-anchor="start" class="small" data-max-width="400">probability</text><rect x="122.268" y="312.286" width="34" height="7.71429" fill="#246593"/><rect x="196.049" y="301.5" width="34" height="18.5" fill="#246593"/><rect x="269.829" y="113.75" width="34" height="206.25" fill="#246593"/><rect x="343.61" y="227.393" width="34" height="92.6071" fill="#246593"/><rect x="417.39" y="305.393" width="34" height="14.6071" fill="#246593"/><rect x="491.171" y="313.071" width="34" height="6.92857" fill="#246593"/><rect x="564.951" y="314.821" width="34" height="5.17857" fill="#246593"/><rect x="638.732" y="314.679" width="34" height="5.32143" fill="#246593"/><text x="330" y="118" text-anchor="middle" class="small" data-max-width="120" data-tex="M\phi=2.4">Mφ=2.4</text></svg>
