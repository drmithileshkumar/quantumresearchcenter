<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Postselection for A = diag(1, 1/2)</title><desc id="desc">Success probability |Aψ|²/α² (here α=1) and the normalized output on success. The success probability depends on the input; it is the price of applying a non-unitary map. Columns: Input |ψ⟩, A|ψ⟩, Success probability, Output on success. |0⟩, |0⟩, 1, |0⟩; |1⟩, 1/2|1⟩, 1/4, |1⟩; |+⟩, 1/√2(|0⟩+1/2|1⟩), 5/8, 1/√5(2|0⟩+|1⟩)</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Postselection for A = diag(1, 1/2)</text><rect x="32" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="119" y="90" text-anchor="middle" class="small" data-max-width="152" data-math="Input \(\ket\psi\)">Input |ψ⟩</text><rect x="206" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="293" y="90" text-anchor="middle" class="small" data-max-width="152" data-tex="A\ket\psi">A|ψ⟩</text><rect x="380" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="467" y="79" text-anchor="middle" class="small" data-max-width="152">Success</text><text x="467" y="101" text-anchor="middle" class="small" data-max-width="152">probability</text><rect x="554" y="54" width="174" height="62" fill="#eaf1f7" class="grid"/><text x="641" y="90" text-anchor="middle" class="small" data-max-width="152">Output on success</text><rect x="32" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket0">|0⟩</text><rect x="206" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket0">|0⟩</text><rect x="380" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="145" text-anchor="middle" class="" data-max-width="152">1</text><rect x="554" y="116" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="145" text-anchor="middle" class="" data-max-width="152" data-tex="\ket0">|0⟩</text><rect x="32" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket1">|1⟩</text><rect x="206" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\tfrac12\ket1">1/2|1⟩</text><rect x="380" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="193" text-anchor="middle" class="" data-max-width="152">1/4</text><rect x="554" y="164" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="193" text-anchor="middle" class="" data-max-width="152" data-tex="\ket1">|1⟩</text><rect x="32" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\ket+">|+⟩</text><rect x="206" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\tfrac{1}{\sqrt2}(\ket0+\tfrac12\ket1)">1/√2(|0⟩+1/2|1⟩)</text><rect x="380" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="241" text-anchor="middle" class="" data-max-width="152">5/8</text><rect x="554" y="212" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="241" text-anchor="middle" class="" data-max-width="152" data-tex="\tfrac{1}{\sqrt5}(2\ket0+\ket1)">1/√5(2|0⟩+|1⟩)</text></svg>
