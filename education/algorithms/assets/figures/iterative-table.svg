<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" role="img" aria-labelledby="title desc"><title id="title">Iterative phase estimation for φ = 3/8 = 0.011 in binary</title><desc id="desc">Bits are acquired from last to first. Each correction subtracts the contribution of the bits already known, leaving a phase of 0 or π that a Hadamard reads exactly. Columns: Stage, Power, Phase / 2π, Correction / 2π, Remaining, Bit. 3, U⁴, 1/2, 0, 1/2, b₃=1; 2, U², 3/4, 1/4, 1/2, b₂=1; 1, U, 3/8, 3/8, 0, b₁=0</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Iterative phase estimation for φ = 3/8 = 0.011 in binary</text><rect x="32" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="90" y="90" text-anchor="middle" class="small" data-max-width="94">Stage</text><rect x="148" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="206" y="90" text-anchor="middle" class="small" data-max-width="94">Power</text><rect x="264" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="322" y="90" text-anchor="middle" class="small" data-max-width="94" data-math="Phase / \(2\pi\)">Phase / 2π</text><rect x="380" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="438" y="79" text-anchor="middle" class="small" data-max-width="94">Correction</text><text x="438" y="101" text-anchor="middle" class="small" data-max-width="94" data-math="/ \(2\pi\)">/ 2π</text><rect x="496" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="554" y="90" text-anchor="middle" class="small" data-max-width="94">Remaining</text><rect x="612" y="54" width="116" height="62" fill="#eaf1f7" class="grid"/><text x="670" y="90" text-anchor="middle" class="small" data-max-width="94">Bit</text><rect x="32" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="90" y="145" text-anchor="middle" class="" data-max-width="94">3</text><rect x="148" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="206" y="145" text-anchor="middle" class="" data-max-width="94" data-tex="U^4">U⁴</text><rect x="264" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="322" y="145" text-anchor="middle" class="" data-max-width="94" data-tex="1/2">1/2</text><rect x="380" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="438" y="145" text-anchor="middle" class="" data-max-width="94">0</text><rect x="496" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="554" y="145" text-anchor="middle" class="" data-max-width="94" data-tex="1/2">1/2</text><rect x="612" y="116" width="116" height="48" fill="#fff" class="grid"/><text x="670" y="145" text-anchor="middle" class="" data-max-width="94" data-tex="b_3=1">b₃=1</text><rect x="32" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="90" y="193" text-anchor="middle" class="" data-max-width="94">2</text><rect x="148" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="206" y="193" text-anchor="middle" class="" data-max-width="94" data-tex="U^2">U²</text><rect x="264" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="322" y="193" text-anchor="middle" class="" data-max-width="94" data-tex="3/4">3/4</text><rect x="380" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="438" y="193" text-anchor="middle" class="" data-max-width="94" data-tex="1/4">1/4</text><rect x="496" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="554" y="193" text-anchor="middle" class="" data-max-width="94" data-tex="1/2">1/2</text><rect x="612" y="164" width="116" height="48" fill="#f5f8fa" class="grid"/><text x="670" y="193" text-anchor="middle" class="" data-max-width="94" data-tex="b_2=1">b₂=1</text><rect x="32" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="90" y="241" text-anchor="middle" class="" data-max-width="94">1</text><rect x="148" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="206" y="241" text-anchor="middle" class="" data-max-width="94" data-tex="U">U</text><rect x="264" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="322" y="241" text-anchor="middle" class="" data-max-width="94" data-tex="3/8">3/8</text><rect x="380" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="438" y="241" text-anchor="middle" class="" data-max-width="94" data-tex="3/8">3/8</text><rect x="496" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="554" y="241" text-anchor="middle" class="" data-max-width="94">0</text><rect x="612" y="212" width="116" height="48" fill="#fff" class="grid"/><text x="670" y="241" text-anchor="middle" class="" data-max-width="94" data-tex="b_1=0">b₁=0</text></svg>
