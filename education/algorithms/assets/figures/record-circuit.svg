<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 264" role="img" aria-labelledby="title desc"><title id="title">A target record prevents cancellation</title><desc id="desc">With target |0⟩ and f(x)=x, the query makes the target a copy of the input. After the Hadamard, the minus sign sits on |11⟩ and cannot cancel the plus sign on |10⟩; the input outcome is a fair coin. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">A target record prevents cancellation</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><text x="664" y="106" text-anchor="start" class="" data-max-width="112">fair coin</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket0">|0⟩</text><path class="wire" d="M135 164L650 164"/><text x="664" y="170" text-anchor="start" class="" data-max-width="112">record</text><rect class="gate" x="182" y="79" width="46" height="42" rx="3"/><text x="205" y="106" text-anchor="middle" class="" data-max-width="40">H</text><path class="wire" d="M335 100L335 164"/><circle cx="335" cy="100" r="6" fill="#476b70" stroke="#476b70" stroke-width="2"/><circle class="gate" cx="335.0" cy="164" r="14"/><path class="wire" d="M321 164L349 164"/><path class="wire" d="M335 150L335 178"/><rect class="gate" x="442" y="79" width="46" height="42" rx="3"/><text x="465" y="106" text-anchor="middle" class="" data-max-width="40">H</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/><text x="390" y="216" text-anchor="middle" class="small" data-max-width="740" data-tex="\tfrac{1}{\sqrt2}(\ket{00}+\ket{11})\ \xrightarrow{H\otimes I}\ \tfrac12(\ket{00}+\ket{10}+\ket{01}-\ket{11})">1/√2(|00⟩+|11⟩) xrightarrowH⊗ I 1/2(|00⟩+|10⟩+|01⟩−|11⟩)</text></svg>
