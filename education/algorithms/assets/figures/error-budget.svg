<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 486" role="img" aria-labelledby="title desc"><title id="title">An error budget for a simulation</title><desc id="desc">Each source must be estimated separately; tightening one beyond the others wastes resources. Columns: Source, Controlled by, Typical cost of reduction. Model, basis set, discretization, active space, classical modelling, more qubits; Algorithmic, Trotter steps or polynomial degree, gates linear or polylogarithmic in 1/ε; Rotation synthesis, T gates per rotation, about 3log₂(1/ε_(rm rot)) each; Hardware, error correction or mitigation, qubit and time overhead; Statistical, repetitions, or phase/amplitude estimation, 1/delta² or 1/delta</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">An error budget for a simulation</text><rect x="32" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="148" y="90" text-anchor="middle" class="small" data-max-width="210">Source</text><rect x="264" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="380" y="90" text-anchor="middle" class="small" data-max-width="210">Controlled by</text><rect x="496" y="54" width="232" height="62" fill="#eaf1f7" class="grid"/><text x="612" y="79" text-anchor="middle" class="small" data-max-width="210">Typical cost of</text><text x="612" y="101" text-anchor="middle" class="small" data-max-width="210">reduction</text><rect x="32" y="116" width="232" height="84" fill="#fff" class="grid"/><text x="148" y="163" text-anchor="middle" class="" data-max-width="210">Model</text><rect x="264" y="116" width="232" height="84" fill="#fff" class="grid"/><text x="380" y="141" text-anchor="middle" class="" data-max-width="210">basis set,</text><text x="380" y="163" text-anchor="middle" class="" data-max-width="210">discretization, active</text><text x="380" y="185" text-anchor="middle" class="" data-max-width="210">space</text><rect x="496" y="116" width="232" height="84" fill="#fff" class="grid"/><text x="612" y="152" text-anchor="middle" class="" data-max-width="210">classical modelling,</text><text x="612" y="174" text-anchor="middle" class="" data-max-width="210">more qubits</text><rect x="32" y="200" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="236" text-anchor="middle" class="" data-max-width="210">Algorithmic</text><rect x="264" y="200" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="225" text-anchor="middle" class="" data-max-width="210">Trotter steps or</text><text x="380" y="247" text-anchor="middle" class="" data-max-width="210">polynomial degree</text><rect x="496" y="200" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="225" text-anchor="middle" class="" data-max-width="210">gates linear or</text><text x="612" y="247" text-anchor="middle" class="" data-max-width="210" data-math="polylogarithmic in \(1/\epsilon\)">polylogarithmic in 1/ε</text><rect x="32" y="262" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="298" text-anchor="middle" class="" data-max-width="210">Rotation synthesis</text><rect x="264" y="262" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="298" text-anchor="middle" class="" data-max-width="210" data-math="\(T\) gates per rotation">T gates per rotation</text><rect x="496" y="262" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="287" text-anchor="middle" class="" data-max-width="210">about</text><text x="612" y="309" text-anchor="middle" class="" data-max-width="210" data-math="\(3\log_2(1/\epsilon_{\rm rot})\) each">3log₂(1/ε_(rm rot)) each</text><rect x="32" y="324" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="360" text-anchor="middle" class="" data-max-width="210">Hardware</text><rect x="264" y="324" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="349" text-anchor="middle" class="" data-max-width="210">error correction or</text><text x="380" y="371" text-anchor="middle" class="" data-max-width="210">mitigation</text><rect x="496" y="324" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="360" text-anchor="middle" class="" data-max-width="210">qubit and time overhead</text><rect x="32" y="386" width="232" height="84" fill="#fff" class="grid"/><text x="148" y="433" text-anchor="middle" class="" data-max-width="210">Statistical</text><rect x="264" y="386" width="232" height="84" fill="#fff" class="grid"/><text x="380" y="411" text-anchor="middle" class="" data-max-width="210">repetitions, or</text><text x="380" y="433" text-anchor="middle" class="" data-max-width="210">phase/amplitude</text><text x="380" y="455" text-anchor="middle" class="" data-max-width="210">estimation</text><rect x="496" y="386" width="232" height="84" fill="#fff" class="grid"/><text x="612" y="433" text-anchor="middle" class="" data-max-width="210" data-math="\(1/\delta^2\) or \(1/\delta\)">1/delta² or 1/delta</text></svg>
