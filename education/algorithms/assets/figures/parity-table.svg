<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 366" role="img" aria-labelledby="title desc"><title id="title">Constraints on achievable responses</title><desc id="desc">With d signal calls the response is a polynomial of degree at most d with the parity of d, bounded by 1 on [−1,1]. Functions without these properties are split, scaled, or restricted. Columns: Target, Problem, Remedy. e^(−ixt), no definite parity, implement cos(xt) and sin(xt), combine by LCU; 1/x, unbounded near 0, approximate 1/(kappa x) on |x|≥1/kappa; step at μ, discontinuous, smooth across a gap of width Delta; 2x, exceeds 1, scale to x, or restrict the interval</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Constraints on achievable responses</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Target</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Problem</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Remedy</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="138" text-anchor="middle" class="" data-max-width="210" data-tex="e^{-ixt}">e^(−ixt)</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210">no definite parity</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210" data-math="implement \(\cos(xt)\) and">implement cos(xt) and</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210" data-math="\(\sin(xt)\), combine by LCU">sin(xt), combine by LCU</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210" data-tex="1/x">1/x</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210">unbounded near 0</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210" data-math="approximate \(1/(\kappa x)\)">approximate 1/(kappa x)</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210" data-math="on \(|x|\ge1/\kappa\)">on |x|≥1/kappa</text><rect x="32" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="262" text-anchor="middle" class="" data-max-width="210" data-math="step at \(\mu\)">step at μ</text><rect x="264" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="262" text-anchor="middle" class="" data-max-width="210">discontinuous</text><rect x="496" y="226" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="251" text-anchor="middle" class="" data-max-width="210">smooth across a gap of</text><text x="612" y="273" text-anchor="middle" class="" data-max-width="210" data-math="width \(\Delta\)">width Delta</text><rect x="32" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="324" text-anchor="middle" class="" data-max-width="210" data-tex="2x">2x</text><rect x="264" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="324" text-anchor="middle" class="" data-max-width="210">exceeds 1</text><rect x="496" y="288" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="313" text-anchor="middle" class="" data-max-width="210" data-math="scale to \(x\), or restrict">scale to x, or restrict</text><text x="612" y="335" text-anchor="middle" class="" data-max-width="210">the interval</text></svg>
