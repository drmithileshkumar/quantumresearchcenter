<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">Hidden subgroup problems</title><desc id="desc">The same pattern, superposition, evaluation, coset collapse, Fourier transform, sampling, solves the problem efficiently for abelian groups. For the nonabelian cases shown, no efficient quantum algorithm is known. Columns: Problem, Group, Hidden subgroup, Status. Simon, {0,1}ⁿ under XOR, {0,s}, efficient; Order finding, integers under +, multiples of r, efficient; Discrete logarithm, mathbb Z_N×mathbb Z_N, a line, efficient; Dihedral HSP, dihedral group, reflection subgroup, subexponential; Graph isomorphism, symmetric group, automorphisms, open</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Hidden subgroup problems</text><rect x="32" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="119" y="83" text-anchor="middle" class="small" data-max-width="152">Problem</text><rect x="206" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="293" y="83" text-anchor="middle" class="small" data-max-width="152">Group</text><rect x="380" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="467" y="83" text-anchor="middle" class="small" data-max-width="152">Hidden subgroup</text><rect x="554" y="54" width="174" height="48" fill="#eaf1f7" class="grid"/><text x="641" y="83" text-anchor="middle" class="small" data-max-width="152">Status</text><rect x="32" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="131" text-anchor="middle" class="" data-max-width="152">Simon</text><rect x="206" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="131" text-anchor="middle" class="" data-max-width="152" data-math="\(\{0,1\}^n\) under XOR">{0,1}ⁿ under XOR</text><rect x="380" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="131" text-anchor="middle" class="" data-max-width="152" data-tex="\{0,s\}">{0,s}</text><rect x="554" y="102" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="131" text-anchor="middle" class="" data-max-width="152">efficient</text><rect x="32" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="119" y="179" text-anchor="middle" class="" data-max-width="152">Order finding</text><rect x="206" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="293" y="179" text-anchor="middle" class="" data-max-width="152" data-math="integers under \(+\)">integers under +</text><rect x="380" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="467" y="179" text-anchor="middle" class="" data-max-width="152" data-math="multiples of \(r\)">multiples of r</text><rect x="554" y="150" width="174" height="48" fill="#f5f8fa" class="grid"/><text x="641" y="179" text-anchor="middle" class="" data-max-width="152">efficient</text><rect x="32" y="198" width="174" height="62" fill="#fff" class="grid"/><text x="119" y="223" text-anchor="middle" class="" data-max-width="152">Discrete</text><text x="119" y="245" text-anchor="middle" class="" data-max-width="152">logarithm</text><rect x="206" y="198" width="174" height="62" fill="#fff" class="grid"/><text x="293" y="234" text-anchor="middle" class="" data-max-width="152" data-tex="\mathbb Z_N\times\mathbb Z_N">mathbb Z_N×mathbb Z_N</text><rect x="380" y="198" width="174" height="62" fill="#fff" class="grid"/><text x="467" y="234" text-anchor="middle" class="" data-max-width="152">a line</text><rect x="554" y="198" width="174" height="62" fill="#fff" class="grid"/><text x="641" y="234" text-anchor="middle" class="" data-max-width="152">efficient</text><rect x="32" y="260" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="119" y="296" text-anchor="middle" class="" data-max-width="152">Dihedral HSP</text><rect x="206" y="260" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="293" y="296" text-anchor="middle" class="" data-max-width="152">dihedral group</text><rect x="380" y="260" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="467" y="285" text-anchor="middle" class="" data-max-width="152">reflection</text><text x="467" y="307" text-anchor="middle" class="" data-max-width="152">subgroup</text><rect x="554" y="260" width="174" height="62" fill="#f5f8fa" class="grid"/><text x="641" y="296" text-anchor="middle" class="" data-max-width="152">subexponential</text><rect x="32" y="322" width="174" height="48" fill="#fff" class="grid"/><text x="119" y="351" text-anchor="middle" class="" data-max-width="152">Graph isomorphism</text><rect x="206" y="322" width="174" height="48" fill="#fff" class="grid"/><text x="293" y="351" text-anchor="middle" class="" data-max-width="152">symmetric group</text><rect x="380" y="322" width="174" height="48" fill="#fff" class="grid"/><text x="467" y="351" text-anchor="middle" class="" data-max-width="152">automorphisms</text><rect x="554" y="322" width="174" height="48" fill="#fff" class="grid"/><text x="641" y="351" text-anchor="middle" class="" data-max-width="152">open</text></svg>
