<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 512" role="img" aria-labelledby="title desc"><title id="title">Compute, copy, uncompute</title><desc id="desc">Register order a,b,c,g,t,y. The first three gates compute g=ab and t=f; one CNOT copies t into the external target y; the last three gates are the first three in reverse order, returning g and t to |0⟩. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Compute, copy, uncompute</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="270" y="84" text-anchor="middle" class="head" data-max-width="95.7143">Compute</text><text x="400" y="84" text-anchor="middle" class="head" data-max-width="95.7143">Copy</text><text x="530" y="84" text-anchor="middle" class="head" data-max-width="95.7143">Uncompute</text><text x="122" y="136" text-anchor="end" class="" data-max-width="115" data-tex="\ket a">|a⟩</text><path class="wire" d="M135 130L650 130"/><text x="664" y="136" text-anchor="start" class="" data-max-width="112" data-tex="\ket a">|a⟩</text><text x="122" y="200" text-anchor="end" class="" data-max-width="115" data-tex="\ket b">|b⟩</text><path class="wire" d="M135 194L650 194"/><text x="664" y="200" text-anchor="start" class="" data-max-width="112" data-tex="\ket b">|b⟩</text><text x="122" y="264" text-anchor="end" class="" data-max-width="115" data-tex="\ket c">|c⟩</text><path class="wire" d="M135 258L650 258"/><text x="664" y="264" text-anchor="start" class="" data-max-width="112" data-tex="\ket c">|c⟩</text><text 