<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 394" role="img" aria-labelledby="title desc"><title id="title">Optimal iteration counts</title><desc id="desc">k=round(π/(4θ)−1/2) and the resulting success probability, compared with the expected number of independent classical tries, 1/p, before the first success. For p=1/2 no iteration helps. Columns: p, θ, iterations k, success, expected classical tries 1/p. 0.5, 45.00°, 0, 0.5000, 2; 0.25, 30.00°, 1, 1.0000, 4; 0.1, 18.43°, 2, 0.9986, 10; 0.01, 5.74°, 7, 0.9953, 100; 0.001, 1.81°, 24, 0.9996, 1000</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Optimal iteration counts</text><rect x="32" y="54" width="139.2" height="84" fill="#eaf1f7" class="grid"/><text x="101.6" y="101" text-anchor="middle" class="small" data-max-width="117.2" data-tex="p">p</text><rect x="171.2" y="54" width="139.2" height="84" fill="#eaf1f7" class="grid"/><text x="240.8" y="101" text-anchor="middle" class="small" data-max-width="117.2" data-tex="\theta">θ</text><rect x="310.4" y="54" width="139.2" height="84" fill="#eaf1f7" class="grid"/><text x="380" y="101" text-anchor="middle" class="small" data-max-width="117.2" data-math="iterations \(k\)">iterations k</text><rect x="449.6" y="54" width="139.2" height="84" fill="#eaf1f7" class="grid"/><text x="519.2" y="101" text-anchor="middle" class="small" data-max-width="117.2">success</text><rect x="588.8" y="54" width="139.2" height="84" fill="#eaf1f7" class="grid"/><text x="658.4" y="79" text-anchor="middle" class="small" data-max-width="117.2">expected</text><text x="658.4" y="101" text-anchor="middle" class="small" data-max-width="117.2">classical</text><text x="658.4" y="123" text-anchor="middle" class="small" data-max-width="117.2" data-math="tries \(1/p\)">tries 1/p</text><rect x="32" y="138" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="167" text-anchor="middle" class="" data-max-width="117.2">0.5</text><rect x="171.2" y="138" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="167" text-anchor="middle" class="" data-max-width="117.2">45.00°</text><rect x="310.4" y="138" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="167" text-anchor="middle" class="" data-max-width="117.2">0</text><rect x="449.6" y="138" width="139.2" height="48" fill="#fff" class="grid"/><text x="519.2" y="167" text-anchor="middle" class="" data-max-width="117.2">0.5000</text><rect x="588.8" y="138" width="139.2" height="48" fill="#fff" class="grid"/><text x="658.4" y="167" text-anchor="middle" class="" data-max-width="117.2">2</text><rect x="32" y="186" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="101.6" y="215" text-anchor="middle" class="" data-max-width="117.2">0.25</text><rect x="171.2" y="186" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="240.8" y="215" text-anchor="middle" class="" data-max-width="117.2">30.00°</text><rect x="310.4" y="186" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="215" text-anchor="middle" class="" data-max-width="117.2">1</text><rect x="449.6" y="186" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="519.2" y="215" text-anchor="middle" class="" data-max-width="117.2">1.0000</text><rect x="588.8" y="186" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="658.4" y="215" text-anchor="middle" class="" data-max-width="117.2">4</text><rect x="32" y="234" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="263" text-anchor="middle" class="" data-max-width="117.2">0.1</text><rect x="171.2" y="234" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="263" text-anchor="middle" class="" data-max-width="117.2">18.43°</text><rect x="310.4" y="234" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="263" text-anchor="middle" class="" data-max-width="117.2">2</text><rect x="449.6" y="234" width="139.2" height="48" fill="#fff" class="grid"/><text x="519.2" y="263" text-anchor="middle" class="" data-max-width="117.2">0.9986</text><rect x="588.8" y="234" width="139.2" height="48" fill="#fff" class="grid"/><text x="658.4" y="263" text-anchor="middle" class="" data-max-width="117.2">10</text><rect x="32" y="282" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="101.6" y="311" text-anchor="middle" class="" data-max-width="117.2">0.01</text><rect x="171.2" y="282" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="240.8" y="311" text-anchor="middle" class="" data-max-width="117.2">5.74°</text><rect x="310.4" y="282" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="311" text-anchor="middle" class="" data-max-width="117.2">7</text><rect x="449.6" y="282" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="519.2" y="311" text-anchor="middle" class="" data-max-width="117.2">0.9953</text><rect x="588.8" y="282" width="139.2" height="48" fill="#f5f8fa" class="grid"/><text x="658.4" y="311" text-anchor="middle" class="" data-max-width="117.2">100</text><rect x="32" y="330" width="139.2" height="48" fill="#fff" class="grid"/><text x="101.6" y="359" text-anchor="middle" class="" data-max-width="117.2">0.001</text><rect x="171.2" y="330" width="139.2" height="48" fill="#fff" class="grid"/><text x="240.8" y="359" text-anchor="middle" class="" data-max-width="117.2">1.81°</text><rect x="310.4" y="330" width="139.2" height="48" fill="#fff" class="grid"/><text x="380" y="359" text-anchor