<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-labelledby="title desc"><title id="title">Responses of repeated signal calls</title><desc id="desc">The top-left entry of W(x)^d is the Chebyshev polynomial T_d(x)=cos(darccos x). Each is bounded by 1 on [−1,1] and oscillates more as d grows. Note T₂(x)=2x²−1, not x². Horizontal axis: signal x; vertical axis: top-left entry. </desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Responses of repeated signal calls</text><path d="M95 314.048H500" class="grid"/><text x="83" y="319.048" text-anchor="end" class="small" data-max-width="700">-1</text><path d="M95 195H500" class="grid"/><text x="83" y="200" text-anchor="end" class="small" data-max-width="700">0</text><path d="M95 75.9524H500" class="grid"/><text x="83" y="80.9524" text-anchor="end" class="small" data-max-width="700">1</text><path d="M95 320V326" stroke="#6b7885"/><text x="95" y="344" text-anchor="middle" class="small" data-max-width="700">-1</text><path d="M196.25 320V326" stroke="#6b7885"/><text x="196.25" y="344" text-anchor="middle" class="small" data-max-width="700">-0.5</text><path d="M297.5 320V326" stroke="#6b7885"/><text x="297.5" y="344" text-anchor="middle" class="small" data-max-width="700">0</text><path d="M398.75 320V326" stroke="#6b7885"/><text x="398.75" y="344" text-anchor="middle" class="small" data-max-width="700">0.5</text><path d="M500 320V326" stroke="#6b7885"/><text x="500" y="344" text-anchor="middle" class="small" data-max-w