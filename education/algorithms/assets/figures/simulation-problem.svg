<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 386" role="img" aria-labelledby="title desc"><title id="title">The Hamiltonian simulation problem</title><desc id="desc">Inputs, output, and the resources a simulation method is charged for. The time dependence is at least linear in general (no fast-forwarding). Columns: Item, Specification. Input, H=Σ_(j=1)^LHⱼ, time t, error ε; Output, circuit V with |V−e^(−iHt)|≤ε; Access, term exponentials, or a block encoding of H/λ; Costs, gates, ancillas, rotation precision, depth; Lower bound, order |H|t in general</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">The Hamiltonian simulation problem</text><rect x="32" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="206" y="83" text-anchor="middle" class="small" data-max-width="326">Item</text><rect x="380" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="554" y="83" text-anchor="middle" class="small" data-max-width="326">Specification</text><rect x="32" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="131" text-anchor="middle" class="" data-max-width="326">Input</text><rect x="380" y="102" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="131" text-anchor="middle" class="" data-max-width="326" data-math="\(H=\sum_{j=1}^LH_j\), time \(t\), error \(\epsilon\)">H=Σ_(j=1)^LHⱼ, time t, error ε</text><rect x="32" y="150" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="206" y="179" text-anchor="middle" class="" data-max-width="326">Output</text><rect x="380" y="150" width="348" height="48" fill="#f5f8fa" class="grid"/><text x="554" y="179" text-anchor="middle" class="" data-max-width="326" data-math="circuit \(V\) with \(\|V-e^{-iHt}\|\le\epsilon\)">circuit V with |V−e^(−iHt)|≤ε</text><rect x="32" y="198" width="348" height="62" fill="#fff" class="grid"/><text x="206" y="234" text-anchor="middle" class="" data-max-width="326">Access</text><rect x="380" y="198" width="348" height="62" fill="#fff" class="grid"/><text x="554" y="223" text-anchor="middle" class="" data-max-width="326">term exponentials, or a block encoding</text><text x="554" y="245" text-anchor="middle" class="" data-max-width="326" data-math="of \(H/\lambda\)">of H/λ</text><rect x="32" y="260" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="206" y="296" text-anchor="middle" class="" data-max-width="326">Costs</text><rect x="380" y="260" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="554" y="285" text-anchor="middle" class="" data-max-width="326">gates, ancillas, rotation precision,</text><text x="554" y="307" text-anchor="middle" class="" data-max-width="326">depth</text><rect x="32" y="322" width="348" height="48" fill="#fff" class="grid"/><text x="206" y="351" text-anchor="middle" class="" data-max-width="326">Lower bound</text><rect x="380" y="322" width="348" height="48" fill="#fff" class="grid"/><text x="554" y="351" text-anchor="middle" class="" data-max-width="326" data-math="order \(\|H\|t\) in general">order |H|t in general</text></svg>
