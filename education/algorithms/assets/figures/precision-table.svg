<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 338" role="img" aria-labelledby="title desc"><title id="title">Phase precision as a resource</title><desc id="desc">Errors are measured in operator norm, the largest change to any normalized state. Because unitaries preserve length, errors of composed operations add. Columns: Quantity, Bound, Consequence. One phase, error delta in angle, |e^(iφ)−e^(itildeφ)|≤delta, State error at most delta; Rounding to m bits, delta≤π/2^m, Error halves per extra bit; q approximate operations, total error ≤ qdelta, Need delta≤ε/q; Bits per operation, m≈log₂(π q/ε), Logarithmic in q/ε</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">Phase precision as a resource</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Quantity</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Bound</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Consequence</text><rect x="32" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="148" y="127" text-anchor="middle" class="" data-max-width="210" data-math="One phase, error \(\delta\)">One phase, error delta</text><text x="148" y="149" text-anchor="middle" class="" data-max-width="210">in angle</text><rect x="264" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="380" y="138" text-anchor="middle" class="" data-max-width="210" data-tex="|e^{i\phi}-e^{i\tilde\phi}|\le\delta">|e^(iφ)−e^(itildeφ)|≤delta</text><rect x="496" y="102" width="232" height="62" fill="#fff" class="grid"/><text x="612" y="127" text-anchor="middle" class="" data-max-width="210">State error at most</text><text x="612" y="149" text-anchor="middle" class="" data-max-width="210" data-tex="\delta">delta</text><rect x="32" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="200" text-anchor="middle" class="" data-max-width="210" data-math="Rounding to \(m\) bits">Rounding to m bits</text><rect x="264" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="200" text-anchor="middle" class="" data-max-width="210" data-tex="\delta\le\pi/2^m">delta≤π/2^m</text><rect x="496" y="164" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="189" text-anchor="middle" class="" data-max-width="210">Error halves per extra</text><text x="612" y="211" text-anchor="middle" class="" data-max-width="210">bit</text><rect x="32" y="226" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="255" text-anchor="middle" class="" data-max-width="210" data-math="\(q\) approximate operations">q approximate operations</text><rect x="264" y="226" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="255" text-anchor="middle" class="" data-max-width="210" data-math="total error \(\le q\delta\)">total error ≤ qdelta</text><rect x="496" y="226" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="255" text-anchor="middle" class="" data-max-width="210" data-math="Need \(\delta\le\epsilon/q\)">Need delta≤ε/q</text><rect x="32" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="303" text-anchor="middle" class="" data-max-width="210">Bits per operation</text><rect x="264" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="303" text-anchor="middle" class="" data-max-width="210" data-tex="m\approx\log_2(\pi q/\epsilon)">m≈log₂(π q/ε)</text><rect x="496" y="274" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="303" text-anchor="middle" class="" data-max-width="210" data-math="Logarithmic in \(q/\epsilon\)">Logarithmic in q/ε</text></svg>
