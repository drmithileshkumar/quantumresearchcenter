<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" role="img" aria-labelledby="title desc"><title id="title">The clean oracle contract</title><desc id="desc">Slashes mark registers of n, m, and w qubits. The box may contain many gates and use the workspace freely, but it must return the workspace to |0^w⟩ on every basis input, with no input-dependent phase. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">The clean oracle contract</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket x">|x⟩</text><path class="wire" d="M135 100L650 100"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40" data-tex="n">n</text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="\ket x">|x⟩</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket y">|y⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40" data-tex="m">m</text><text x="664" y="170" text-anchor="start" class="" data-max-width="112" data-tex="\ket{y\oplus f(x)}">|y⊕ f(x)⟩</text><text x="122" y="234" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^w}">|0^w⟩</text><path class="wire" d="M135 228L650 228"/><path class="wire" d="M151 236L163 220"/><text x="165" y="218" text-anchor="start" class="small" data-max-width="40" data-tex="w">w</text><text x="664" y="234" text-anchor="start" class="" data-max-width="112" data-tex="\ket{0^w}">|0^w⟩</text><rect class="big" x="360" y="79" width="120" height="170" rx="3"/><text x="420" y="170" text-anchor="middle" class="" data-max-width="114" data-tex="U_f">U_f</text></svg>
