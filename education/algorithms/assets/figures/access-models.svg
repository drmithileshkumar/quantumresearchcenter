<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 324" role="img" aria-labelledby="title desc"><title id="title">How a matrix can be given</title><desc id="desc">The subnormalization and cost of a block encoding depend on the access model. Query counts of later algorithms are multiplied by the cost of one block encoding. Columns: Access, Block encoding of, Typical cost of one use. Sum of L Pauli strings, H/λ, λ=Σ|hⱼ|, O(L) controlled Paulis; s-sparse, entry oracles, H/(s|H|_(max)), O(1) oracle calls plus arithmetic; Dense classical table, A/|A|_F, QRAM over N² entries; Product of encodings, AB/(αβ), sum of the two costs</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">How a matrix can be given</text><rect x="32" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="148" y="83" text-anchor="middle" class="small" data-max-width="210">Access</text><rect x="264" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="380" y="83" text-anchor="middle" class="small" data-max-width="210">Block encoding of</text><rect x="496" y="54" width="232" height="48" fill="#eaf1f7" class="grid"/><text x="612" y="83" text-anchor="middle" class="small" data-max-width="210">Typical cost of one use</text><rect x="32" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="131" text-anchor="middle" class="" data-max-width="210" data-math="Sum of \(L\) Pauli strings">Sum of L Pauli strings</text><rect x="264" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(H/\lambda\), \(\lambda=\sum|h_j|\)">H/λ, λ=Σ|hⱼ|</text><rect x="496" y="102" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="131" text-anchor="middle" class="" data-max-width="210" data-math="\(O(L)\) controlled Paulis">O(L) controlled Paulis</text><rect x="32" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="148" y="186" text-anchor="middle" class="" data-max-width="210" data-math="\(s\)-sparse, entry oracles">s-sparse, entry oracles</text><rect x="264" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="380" y="186" text-anchor="middle" class="" data-max-width="210" data-tex="H/(s\|H\|_{\max})">H/(s|H|_(max))</text><rect x="496" y="150" width="232" height="62" fill="#f5f8fa" class="grid"/><text x="612" y="175" text-anchor="middle" class="" data-max-width="210" data-math="\(O(1)\) oracle calls plus">O(1) oracle calls plus</text><text x="612" y="197" text-anchor="middle" class="" data-max-width="210">arithmetic</text><rect x="32" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="148" y="241" text-anchor="middle" class="" data-max-width="210">Dense classical table</text><rect x="264" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="380" y="241" text-anchor="middle" class="" data-max-width="210" data-tex="A/\|A\|_F">A/|A|_F</text><rect x="496" y="212" width="232" height="48" fill="#fff" class="grid"/><text x="612" y="241" text-anchor="middle" class="" data-max-width="210" data-math="QRAM over \(N^2\) entries">QRAM over N² entries</text><rect x="32" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="148" y="289" text-anchor="middle" class="" data-max-width="210">Product of encodings</text><rect x="264" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="380" y="289" text-anchor="middle" class="" data-max-width="210" data-tex="AB/(\alpha\beta)">AB/(αβ)</text><rect x="496" y="260" width="232" height="48" fill="#f5f8fa" class="grid"/><text x="612" y="289" text-anchor="middle" class="" data-max-width="210">sum of the two costs</text></svg>
