"3"/><text x="245" y="170" text-anchor="middle" class="" data-max-width="40">H</text><rect class="big" x="330.167" y="79" width="63" height="106" rx="3"/><text x="361.667" y="138" text-anchor="middle" class="" data-max-width="57" data-tex="U_f">U_f</text><rect class="gate" x="446.833" y="79" width="63" height="42" rx="3"/><text x="478.333" y="106" text-anchor="middle" class="" data-max-width="57" data-tex="H^{\otimes n}">H^(⊗ n)</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/></svg>
