<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 226" role="img" aria-labelledby="title desc"><title id="title">Order finding by phase estimation</title><desc id="desc">The control register has m≈2n qubits; the target has n qubits and starts in |1⟩, an equal superposition of the eigenstates |u_s⟩. The modular exponentiation box, |k⟩|y⟩↦|k⟩|aᵏy mod  L⟩, is the controlled powers and contains most of the gates. Read each circuit left to right; double lines carry classical measurement records.</desc><style>text{font:17px Georgia,serif;fill:#26434b}.small{font:15px Arial,sans-serif}.head{font:600 14px Arial,sans-serif;fill:#246593}.wire{stroke:#476b70;stroke-width:2;fill:none}.gate{fill:#f8fbf9;stroke:#476b70;stroke-width:2}.big{fill:#e9f0ed;stroke:#476b70;stroke-width:2}.slice{stroke:#a64d26;stroke-width:1.4;stroke-dasharray:5 4}</style><text x="390" y="26" text-anchor="middle" class="small" data-max-width="700">Order finding by phase estimation</text><text x="390" y="54" text-anchor="middle" class="small" data-max-width="700"></text><text x="122" y="106" text-anchor="end" class="" data-max-width="115" data-tex="\ket{0^m}">|0^m⟩</text><path class="wire" d="M135 100L595 100"/><path class="wire" d="M618 97L650 97"/><path class="wire" d="M618 103L650 103"/><path class="wire" d="M151 108L163 92"/><text x="165" y="90" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="106" text-anchor="start" class="" data-max-width="112" data-tex="j\approx2^m s/r">j≈2^m s/r</text><text x="122" y="170" text-anchor="end" class="" data-max-width="115" data-tex="\ket1">|1⟩</text><path class="wire" d="M135 164L650 164"/><path class="wire" d="M151 172L163 156"/><text x="165" y="154" text-anchor="start" class="small" data-max-width="40"></text><text x="664" y="170" text-anchor="start" class="" data-max-width="112"></text><rect class="gate" x="213.5" y="79" width="63" height="42" rx="3"/><text x="245" y="106" text-anchor="middle" class="" data-max-width="57" data-tex="H^{\otimes m}">H^(⊗ m)</text><rect class="big" x="301.667" y="79" width="120" height="106" rx="3"/><text x="361.667" y="138" text-anchor="middle" class="" data-max-width="114" data-tex="a^k y \bmod L">aᵏ y  mod  L</text><rect class="gate" x="455.333" y="79" width="46" height="42" rx="3"/><text x="478.333" y="106" text-anchor="middle" class="" data-max-width="40" data-tex="F^\dagger">F†</text><rect class="gate" x="572" y="79" width="46" height="42" rx="3"/><path d="M581 106A14 14 0 0 1 609 106" fill="none" stroke="#476b70" stroke-width="1.8"/><path d="M595 106L605 90" stroke="#476b70" stroke-width="1.8"/></svg>
