<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 428" role="img" aria-labelledby="title desc"><title id="title">What kind of evidence supports a claim</title><desc id="desc">Variational algorithms are heuristics. Different claims need different kinds of evidence; small successful instances support only the weakest. Columns: Claim, Evidence needed. The ansatz contains a good state, exact classical optimization over the ansatz on small instances; The optimizer finds it, success rates across random initializations and instances; Performance scales well, results across a range of sizes, with fitted scaling; Quantum advantage, beats the best classical methods at matched quality, total cost counted; Guaranteed performance, a proof, such as an approximation ratio</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>text{font:16px Georgia,serif;fill:#30343b}.heading{font:600 15px system-ui,sans-serif;fill:#246593}.small{font:14px system-ui,sans-serif;fill:#4b5864}.grid{stroke:#d3dee7;stroke-width:1}.edge{fill:none;stroke:#246593;stroke-width:1.7;marker-end:url(#arrow)}</style><text x="380" y="30" text-anchor="middle" class="heading" data-max-width="700">What kind of evidence supports a claim</text><rect x="32" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="206" y="83" text-anchor="middle" class="small" data-max-width="326">Claim</text><rect x="380" y="54" width="348" height="48" fill="#eaf1f7" class="grid"/><text x="554" y="83" text-anchor="middle" class="small" data-max-width="326">Evidence needed</text><rect x="32" y="102" width="348" height="62" fill="#fff" class="grid"/><text x="206" y="138" text-anchor="middle" class="" data-max-width="326">The ansatz contains a good state</text><rect x="380" y="102" width="348" height="62" fill="#fff" class="grid"/><text x="554" y="127" text-anchor="middle" class="" data-max-width="326">exact classical optimization over the</text><text x="554" y="149" text-anchor="middle" class="" data-max-width="326">ansatz on small instances</text><rect x="32" y="164" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="206" y="200" text-anchor="middle" class="" data-max-width="326">The optimizer finds it</text><rect x="380" y="164" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="554" y="189" text-anchor="middle" class="" data-max-width="326">success rates across random</text><text x="554" y="211" text-anchor="middle" class="" data-max-width="326">initializations and instances</text><rect x="32" y="226" width="348" height="62" fill="#fff" class="grid"/><text x="206" y="262" text-anchor="middle" class="" data-max-width="326">Performance scales well</text><rect x="380" y="226" width="348" height="62" fill="#fff" class="grid"/><text x="554" y="251" text-anchor="middle" class="" data-max-width="326">results across a range of sizes, with</text><text x="554" y="273" text-anchor="middle" class="" data-max-width="326">fitted scaling</text><rect x="32" y="288" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="206" y="324" text-anchor="middle" class="" data-max-width="326">Quantum advantage</text><rect x="380" y="288" width="348" height="62" fill="#f5f8fa" class="grid"/><text x="554" y="313" text-anchor="middle" class="" data-max-width="326">beats the best classical methods at</text><text x="554" y="335" text-anchor="middle" class="" data-max-width="326">matched quality, total cost counted</text><rect x="32" y="350" width="348" height="62" fill="#fff" class="grid"/><text x="206" y="386" text-anchor="middle" class="" data-max-width="326">Guaranteed performance</text><rect x="380" y="350" width="348" height="62" fill="#fff" class="grid"/><text x="554" y="375" text-anchor="middle" class="" data-max-width="326">a proof, such as an approximation</text><text x="554" y="397" text-anchor="middle" class="" data-max-width="326">ratio</text></svg>
