<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250" role="img" aria-labelledby="title desc"><title id="title">phase-feedback</title><desc id="desc">One adaptive phase-readout round. The correction angle β is computed from earlier classical outcomes; reset the auxiliary before the next round. Controlled powers have a cost beyond the drawn box.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H786" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">auxiliary |0⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">bit</text><path d="M140 140H860" /><text x="66" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">eigenstate |u⟩</text><text x="930" y="146" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|u⟩</text><rect x="181.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="205" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><path d="M400 65V140" /><circle cx="400" cy="65" r="6" fill="#234c46" /><rect x="352.5" y="116" width="95" height="48" rx="3" fill="#e7efeb" /><text x="400" y="147" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">U^(2^k)</text><rect x="573.5" y="41" width="73" height="48" rx="3" fill="#e7efeb" /><text x="610" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">P(−β)</text><rect x="691.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="715" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">H</text><rect x="786.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="810" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M834 62H860 M834 68H860" /></g></svg>