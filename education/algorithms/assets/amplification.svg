<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 175" width="1000" height="175" role="img" aria-labelledby="title desc"><title id="title">amplification</title><desc id="desc">One amplification iteration: negate the good subspace, then reflect about the prepared state. A is the full preparation circuit; these register gates can contain many elementary gates.</desc><rect width="100%" height="100%" fill="#faf9f6" /><g stroke="#234c46" stroke-width="2" fill="none"><path d="M140 65H781" /><text x="66" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">|ψ⟩</text><text x="930" y="71" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#203b37" stroke="none">sample</text><rect x="184.5" y="41" width="51" height="48" rx="3" fill="#e7efeb" /><text x="210" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">S_G</text><rect x="326.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="350" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">A†</text><rect x="466.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="490" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">S₀</text><rect x="606.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="630" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">A</text><rect x="781.0" y="41" width="48" height="48" rx="3" fill="#e7efeb" /><text x="805" y="72" text-anchor="middle" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#203b37" stroke="none">M</text><path d="M829 62H860 M829 68H860" /></g></svg>