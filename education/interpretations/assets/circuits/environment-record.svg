<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">A record escapes into the environment</title><desc id="desc">A CNOT correlates system and pointer; a second from pointer to environment produces a three-qubit GHZ state.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">A record escapes into the environment</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">system: |+⟩</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">pointer: |0⟩</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">environment: |0⟩</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M250 76 L250 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="250" cy="76" r="5" fill="#253d50"/><circle cx="250" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M237 134 L263 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M250 121 L250 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 134 L450 192" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="450" cy="134" r="5" fill="#253d50"/><circle cx="450" cy="192" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M437 192 L463 192" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 179 L450 205" fill="none" stroke="#2876ae" stroke-width="1.7"/><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">The joint state is (|000⟩ + |111⟩)/√2. Ignoring the environment removes local coherence.</text></g></svg>
