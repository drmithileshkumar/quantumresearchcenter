<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img" aria-labelledby="title desc"><title id="title">A record can be reversed coherently</title><desc id="desc">Two successive CNOTs copy and then erase the memory coherently. An X measurement on the system gives plus with certainty, unless coherence was lost.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">A record can be reversed coherently</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">system: |+⟩</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">memory: |0⟩</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M260 76 L260 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="260" cy="76" r="5" fill="#253d50"/><circle cx="260" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M247 134 L273 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M260 121 L260 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M460 76 L460 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="460" cy="76" r="5" fill="#253d50"/><circle cx="460" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M447 134 L473 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M460 121 L460 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="586" y="56" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="610" y="81" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MX</text><rect x="635" y="71" width="56" height="10" fill="white"/><path d="M634 73 L690 73" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M634 79 L690 79" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="81" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">+ with certainty</text><text x="260" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#253d50">record</text><text x="460" y="178" font-size="13" text-anchor="middle" font-weight="400" fill="#253d50">undo record</text><text x="20" y="198" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">The second CNOT erases the memory. Dephasing between gates reduces p(+) to 1/2.</text></g></svg>
