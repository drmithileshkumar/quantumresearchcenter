<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img" aria-labelledby="title desc"><title id="title">An ideal premeasurement</title><desc id="desc">The system controls a CNOT into a pointer initially in zero, producing a correlated two-qubit state.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">An ideal premeasurement</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">system: |ψ⟩</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">pointer: |0⟩</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M350 76 L350 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="350" cy="76" r="5" fill="#253d50"/><circle cx="350" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M337 134 L363 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M350 121 L350 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><text x="20" y="198" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">CNOT correlates the pointer: α|00⟩ + β|11⟩. No outcome is selected by this unitary.</text></g></svg>
