<svg xmlns="http://www.w3.org/2000/svg" width="900" height="216" viewBox="0 0 900 216" role="img" aria-labelledby="title desc"><title id="title">Inject T using a resource state</title><desc id="desc">Data controls a CNOT into a magic-state ancilla. Measure the ancilla in Z, and use the classical result to apply S to data only when the result is one. Both branches yield T on the data up to global phase.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Inject T using a resource state</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data: |ψ⟩</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="81" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">T|ψ⟩ (up to phase)</text><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">ancilla: |A⟩</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M280 76 L280 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="280" cy="76" r="5" fill="#253d50"/><circle cx="280" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M267 134 L293 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M280 121 L280 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="396" y="114" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="420" y="139" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MZ</text><rect x="445" y="129" width="246" height="10" fill="white"/><path d="M444 131 L690 131" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M444 137 L690 137" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="139" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">m</text><path d="M480 131 H567 V99" stroke="#7956bd" fill="none" stroke-width="1.5"/><path d="M480 137 H573 V99" stroke="#7956bd" fill="none" stroke-width="1.5"/><rect x="514.0" y="57" width="112" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="570" y="81" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">S if m=1</text><text x="20" y="198" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">|A⟩ = (|0⟩ + exp(iπ/4)|1⟩)/√2. Outcome 0 needs no correction; outcome 1 needs S.</text></g></svg>
