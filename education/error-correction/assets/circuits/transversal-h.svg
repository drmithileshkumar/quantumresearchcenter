<svg xmlns="http://www.w3.org/2000/svg" width="900" height="422" viewBox="0 0 900 422" role="img" aria-labelledby="title desc"><title id="title">Logical Hadamard on the Steane code</title><desc id="desc">Apply Hadamard independently to all seven Steane-code qubits to implement logical Hadamard.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Logical Hadamard on the Steane code</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q1</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="127" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q2</text><path d="M155 122 L690 122" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="173" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q3</text><path d="M155 168 L690 168" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="219" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q4</text><path d="M155 214 L690 214" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="265" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q5</text><path d="M155 260 L690 260" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="311" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q6</text><path d="M155 306 L690 306" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="357" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q7</text><path d="M155 352 L690 352" fill="none" stroke="#506880" stroke-width="1.7"/><rect x="379.0" y="57" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="81" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="103" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="127" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="149" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="173" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="195" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="219" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="241" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="265" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="287" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="311" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="379.0" y="333" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="357" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><text x="20" y="404" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">H on every physical qubit exchanges the paired X and Z stabilizers and logical X and Z.</text></g></svg>
