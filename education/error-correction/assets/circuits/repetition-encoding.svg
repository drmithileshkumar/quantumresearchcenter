<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">Encode one unknown qubit</title><desc id="desc">Two CNOTs from q1 to q2 and q3 encode alpha|0&gt;+beta|1&gt; into alpha|000&gt;+beta|111&gt;.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Encode one unknown qubit</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₁: |ψ⟩</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₂: |0⟩</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₃: |0⟩</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M280 76 L280 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="280" cy="76" r="5" fill="#253d50"/><circle cx="280" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M267 134 L293 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M280 121 L280 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 76 L450 192" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="450" cy="76" r="5" fill="#253d50"/><circle cx="450" cy="192" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M437 192 L463 192" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 179 L450 205" fill="none" stroke="#2876ae" stroke-width="1.7"/><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">Joint output: α|000⟩ + β|111⟩. The two ancillas do not become independent copies.</text></g></svg>
