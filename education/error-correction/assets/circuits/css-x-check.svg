<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">Measure a Steane X-type check</title><desc id="desc">Ideal X parity check on the four named data qubits. Ancilla is prepared in plus and controls each CNOT; a final Hadamard implements X readout.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Measure a Steane X-type check</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₁</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₃</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₅</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="255" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₇</text><path d="M155 250 L690 250" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="313" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">a: |0⟩</text><path d="M155 308 L690 308" fill="none" stroke="#506880" stroke-width="1.7"/><rect x="169.0" y="289" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="190" y="313" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><path d="M260 308 L260 76" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="260" cy="308" r="5" fill="#253d50"/><circle cx="260" cy="76" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M247 76 L273 76" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M260 63 L260 89" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M350 308 L350 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="350" cy="308" r="5" fill="#253d50"/><circle cx="350" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M337 134 L363 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M350 121 L350 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M440 308 L440 192" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="440" cy="308" r="5" fill="#253d50"/><circle cx="440" cy="192" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M427 192 L453 192" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M440 179 L440 205" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M530 308 L530 250" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="530" cy="308" r="5" fill="#253d50"/><circle cx="530" cy="250" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M517 250 L543 250" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M530 237 L530 263" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="589.0" y="289" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="610" y="313" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="636" y="288" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="660" y="313" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MZ</text><rect x="685" y="303" width="6" height="10" fill="white"/><path d="M684 305 L690 305" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M684 311 L690 311" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="313" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">s: 0 → +1</text><text x="20" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">Measure only the ancilla. Gate order shown is illustrative; fault tolerance requires a schedule audit.</text></g></svg>
