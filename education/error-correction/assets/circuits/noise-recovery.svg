<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">Noise and recovery must preserve the reference</title><desc id="desc">An untouched reference wire, an encoded data wire interacting with an environment via the noise isometry V, followed by recovery R on data only. The environment is discarded.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Noise and recovery must preserve the reference</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">reference R</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="81" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">R</text><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">encoded data</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="139" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">recovered data</text><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">environment |0⟩</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="197" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">discard E</text><rect x="261.0" y="112" width="78" height="102" rx="5" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="300" y="168.0" font-size="17" text-anchor="middle" font-weight="400" fill="#253d50">V</text><rect x="520.0" y="115" width="60" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="550" y="139" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">ℛ</text><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">V is the noise isometry. The environment is inaccessible; recovery acts only on the data.</text></g></svg>
