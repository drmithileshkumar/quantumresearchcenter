<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">Measure Z₁Z₂ without reading individual values</title><desc id="desc">Two CNOTs implement a Z parity measurement. The data control a zero ancilla measured in Z.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Measure Z₁Z₂ without reading individual values</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₁</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₂</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">a: |0⟩</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M330 76 L330 192" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="330" cy="76" r="5" fill="#253d50"/><circle cx="330" cy="192" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M317 192 L343 192" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M330 179 L330 205" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 134 L450 192" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="450" cy="134" r="5" fill="#253d50"/><circle cx="450" cy="192" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M437 192 L463 192" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 179 L450 205" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="616" y="172" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="640" y="197" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MZ</text><rect x="665" y="187" width="26" height="10" fill="white"/><path d="M664 189 L690 189" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M664 195 L690 195" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="197" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">s: 0 even; 1 odd</text><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">Single lines carry qubits. Double lines carry the classical measurement result s.</text></g></svg>
