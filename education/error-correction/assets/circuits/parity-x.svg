<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">Measure X₁X₂ without reading individual values</title><desc id="desc">Two CNOTs implement a X parity measurement. A plus ancilla controls each data target and is measured in X using a final Hadamard.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Measure X₁X₂ without reading individual values</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₁</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₂</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">a: |0⟩</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><rect x="199.0" y="173" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="220" y="197" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><path d="M330 192 L330 76" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="330" cy="192" r="5" fill="#253d50"/><circle cx="330" cy="76" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M317 76 L343 76" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M330 63 L330 89" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 192 L450 134" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="450" cy="192" r="5" fill="#253d50"/><circle cx="450" cy="134" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M437 134 L463 134" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M450 121 L450 147" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="529.0" y="173" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="550" y="197" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">H</text><rect x="616" y="172" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="640" y="197" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MZ</text><rect x="665" y="187" width="26" height="10" fill="white"/><path d="M664 189 L690 189" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M664 195 L690 195" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="197" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">s: 0 even; 1 odd</text><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">Single lines carry qubits. Double lines carry the classical measurement result s.</text></g></svg>
