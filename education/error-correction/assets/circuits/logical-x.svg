<svg xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-labelledby="title desc"><title id="title">Logical X for the repetition code</title><desc id="desc">Apply X independently to all three physical qubits to implement logical X on the repetition code.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">Logical X for the repetition code</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₁</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₂</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">q₃</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><rect x="379.0" y="57" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="81" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">X</text><rect x="379.0" y="115" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="139" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">X</text><rect x="379.0" y="173" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#2876ae" stroke-width="1.8"/><text x="400" y="197" font-size="16" text-anchor="middle" font-weight="400" fill="#2876ae">X</text><text x="20" y="256" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">X₁X₂X₃ exchanges |0L⟩ = |000⟩ and |1L⟩ = |111⟩ without changing either parity.</text></g></svg>
