<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc"><title id="title">A single ancilla Z fault can spread</title><desc id="desc">Four data controls interact in sequence with a target ancilla. A Z fault is inserted on the ancilla between the second and third CNOTs, causing Z components on data qubits three and four.</desc><rect width="100%" height="100%" fill="white"/><g font-family="DejaVu Sans, sans-serif"><text x="20" y="30" font-size="19" text-anchor="start" font-weight="600" fill="#253d50">A single ancilla Z fault can spread</text><text x="690" y="30" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">time →</text><text x="18" y="81" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₁</text><path d="M155 76 L690 76" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="139" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₂</text><path d="M155 134 L690 134" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="197" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₃</text><path d="M155 192 L690 192" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="255" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">data q₄</text><path d="M155 250 L690 250" fill="none" stroke="#506880" stroke-width="1.7"/><text x="18" y="313" font-size="15" text-anchor="start" font-weight="400" fill="#253d50">a: |0⟩</text><path d="M155 308 L690 308" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M230 76 L230 308" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="230" cy="76" r="5" fill="#253d50"/><circle cx="230" cy="308" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M217 308 L243 308" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M230 295 L230 321" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M310 134 L310 308" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="310" cy="134" r="5" fill="#253d50"/><circle cx="310" cy="308" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M297 308 L323 308" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M310 295 L310 321" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M480 192 L480 308" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="480" cy="192" r="5" fill="#253d50"/><circle cx="480" cy="308" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M467 308 L493 308" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M480 295 L480 321" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M560 250 L560 308" fill="none" stroke="#506880" stroke-width="1.7"/><circle cx="560" cy="250" r="5" fill="#253d50"/><circle cx="560" cy="308" r="13" fill="white" stroke="#2876ae" stroke-width="1.8"/><path d="M547 308 L573 308" fill="none" stroke="#2876ae" stroke-width="1.7"/><path d="M560 295 L560 321" fill="none" stroke="#2876ae" stroke-width="1.7"/><rect x="374.0" y="289" width="42" height="38" rx="4" fill="#f2f6fc" stroke="#a7373d" stroke-width="1.8"/><text x="395" y="313" font-size="16" text-anchor="middle" font-weight="400" fill="#a7373d">Z</text><rect x="626" y="288" width="48" height="40" rx="4" fill="white" stroke="#506880" stroke-width="1.7"/><text x="650" y="313" font-size="15" text-anchor="middle" font-weight="400" fill="#253d50">MZ</text><rect x="675" y="303" width="16" height="10" fill="white"/><path d="M674 305 L690 305" fill="none" stroke="#506880" stroke-width="1.7"/><path d="M674 311 L690 311" fill="none" stroke="#506880" stroke-width="1.7"/><text x="711" y="313" font-size="14" text-anchor="start" font-weight="400" fill="#253d50">s</text><text x="20" y="372" font-size="13" text-anchor="start" font-weight="400" fill="#253d50">Red Z is an injected fault after the first two gates. It propagates to q₃ and q₄ through later CNOTs.</text></g></svg>
