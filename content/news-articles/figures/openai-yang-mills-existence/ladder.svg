<svg viewBox="0 0 400 404" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="12" width="248" height="58" rx="6" class="fig-box"><title>established before 2026</title></rect><text x="32.0" y="36.0" class="fig-label" text-anchor="start">1  Lattice in a finite box</text><text x="32.0" y="56.0" class="fig-muted" text-anchor="start">Wilson 1974: well defined, computable</text><path d="M144,72 V82" class="fig-axis"/><rect x="20" y="84" width="248" height="58" rx="6" class="fig-box-claimed"><title>claimed by OpenAI, per the review committee</title></rect><text x="32.0" y="108.0" class="fig-label" text-anchor="start">2  Continuum limit, spacing → 0</text><text x="32.0" y="128.0" class="fig-muted" text-anchor="start">short distances; asymptotic freedom</text><path d="M144,144 V154" class="fig-axis"/><rect x="20" y="156" width="248" height="58" rx="6" class="fig-box-claimed"><title>claimed by OpenAI, per the review committee</title></rect><text x="32.0" y="180.0" class="fig-label" text-anchor="start">3  Infinite volume, box → all space</text><text x="32.0" y="200.0" class="fig-muted" text-anchor="start">long distances; no method was known</text><path d="M144,216 V226" class="fig-axis"/><rect x="20" y="228" width="248" height="58" rx="6" class="fig-box"><title>not stated in public documents</title></rect><text x="32.0" y="252.0" class="fig-label" text-anchor="start">4  Axioms of a quantum field theory</text><text x="32.0" y="272.0" class="fig-muted" text-anchor="start">reflection positivity → Minkowski QFT</text><path d="M144,288 V298" class="fig-axis"/><rect x="20" y="300" width="248" height="58" rx="6" class="fig-box-open"><title>not claimed: still open</title></rect><text x="32.0" y="324.0" class="fig-label" text-anchor="start">5  Mass gap Δ &gt; 0</text><text x="32.0" y="344.0" class="fig-muted" text-anchor="start">every excitation costs energy</text><path d="M280,88 H290 V210 H280" class="fig-line-1"/><text x="298.0" y="146.0" class="fig-label" text-anchor="start">claimed</text><text x="298.0" y="163.0" class="fig-muted" text-anchor="start">not yet public</text><path d="M280,232 H290 V282 H280" class="fig-axis"/><text x="298.0" y="254.0" class="fig-label" text-anchor="start">not stated</text><text x="298.0" y="271.0" class="fig-muted" text-anchor="start">publicly</text><path d="M280,304 H290 V354 H280" class="fig-line-2"/><text x="298.0" y="326.0" class="fig-label" text-anchor="start">open</text><text x="298.0" y="343.0" class="fig-muted" text-anchor="start">not claimed</text><text x="20.0" y="396.0" class="fig-muted" text-anchor="start">The Clay problem asks for steps 2–5 on ℝ⁴, for every gauge group</text></svg>
