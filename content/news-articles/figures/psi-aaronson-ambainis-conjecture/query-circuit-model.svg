<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="360" rx="8" class="fig-bg"/>

  <!-- Panel 1: Classical Query Model -->
  <text x="20" y="26" class="fig-label" text-anchor="start">1  Classical query model: ask for one bit at a time in a decision tree</text>

  <!-- Hidden Oracle Box (Classical) -->
  <rect x="20" y="42" width="176" height="106" rx="6" class="fig-box"/>
  <text x="108" y="64" class="fig-label" text-anchor="middle">Black-box input x</text>
  <text x="108" y="82" class="fig-muted" text-anchor="middle">n hidden bits in {−1, +1}ⁿ</text>
  <rect x="34" y="96" width="26" height="24" rx="3" class="fig-node"/>
  <text x="47" y="112" class="fig-text" text-anchor="middle">x₁</text>
  <rect x="66" y="96" width="26" height="24" rx="3" class="fig-node"/>
  <text x="79" y="112" class="fig-text" text-anchor="middle">x₂</text>
  <rect x="98" y="96" width="28" height="24" rx="3" class="fig-box-claimed"/>
  <text x="112" y="112" class="fig-label" text-anchor="middle">xᵢ</text>
  <text x="140" y="112" class="fig-muted" text-anchor="middle">⋯</text>
  <rect x="154" y="96" width="28" height="24" rx="3" class="fig-node"/>
  <text x="168" y="112" class="fig-text" text-anchor="middle">xₙ</text>
  <text x="108" y="138" class="fig-muted" text-anchor="middle">1 query = reveal 1 box</text>

  <!-- Request / Response Arrows -->
  <line x1="196" y1="80" x2="278" y2="80" class="fig-line-1"/>
  <polygon points="204,76 196,80 204,84" class="fig-fill-1"/>
  <text x="237" y="72" class="fig-muted" text-anchor="middle">ask index i</text>

  <line x1="196" y1="110" x2="278" y2="110" class="fig-line-2"/>
  <polygon points="270,106 278,110 270,114" class="fig-fill-2"/>
  <text x="237" y="126" class="fig-muted" text-anchor="middle">return bit xᵢ</text>

  <!-- Classical Decision Tree -->
  <rect x="282" y="42" width="338" height="106" rx="6" class="fig-box"/>
  <text x="451" y="62" class="fig-label" text-anchor="middle">Adaptive decision tree (depth T queries)</text>
  <line x1="335" y1="95" x2="405" y2="74" class="fig-link"/>
  <line x1="335" y1="95" x2="405" y2="118" class="fig-link"/>
  <line x1="405" y1="74" x2="475" y2="64" class="fig-link"/>
  <line x1="405" y1="74" x2="475" y2="88" class="fig-link"/>
  <line x1="405" y1="118" x2="475" y2="106" class="fig-link"/>
  <line x1="405" y1="118" x2="475" y2="130" class="fig-link"/>

  <circle cx="335" cy="95" r="14" class="fig-node"/>
  <text x="335" y="99" class="fig-label" text-anchor="middle">xᵢ₁</text>
  <text x="366" y="76" class="fig-muted" text-anchor="middle">+1</text>
  <text x="366" y="124" class="fig-muted" text-anchor="middle">−1</text>

  <circle cx="405" cy="74" r="13" class="fig-node"/>
  <text x="405" y="78" class="fig-text" text-anchor="middle">xᵢ₂</text>
  <circle cx="405" cy="118" r="13" class="fig-node"/>
  <text x="405" y="122" class="fig-text" text-anchor="middle">xᵢ₃</text>

  <rect x="475" y="55" width="32" height="18" rx="3" class="fig-box-claimed"/>
  <text x="491" y="68" class="fig-muted" text-anchor="middle">out</text>
  <rect x="475" y="79" width="32" height="18" rx="3" class="fig-node"/>
  <text x="491" y="92" class="fig-muted" text-anchor="middle">out</text>
  <rect x="475" y="97" width="32" height="18" rx="3" class="fig-node"/>
  <text x="491" y="110" class="fig-muted" text-anchor="middle">out</text>
  <rect x="475" y="121" width="32" height="18" rx="3" class="fig-box-claimed"/>
  <text x="491" y="134" class="fig-muted" text-anchor="middle">out</text>

  <text x="562" y="90" class="fig-muted" text-anchor="middle">Follows 1 path:</text>
  <text x="562" y="106" class="fig-muted" text-anchor="middle">learns at most</text>
  <text x="562" y="122" class="fig-label" text-anchor="middle">T bits of x</text>

  <!-- Divider -->
  <line x1="20" y1="166" x2="620" y2="166" class="fig-grid"/>

  <!-- Panel 2: Quantum Query Circuit -->
  <text x="20" y="192" class="fig-label" text-anchor="start">2  Quantum query circuit: T oracle calls interleaved with unitary gates</text>

  <!-- Input state labels -->
  <text x="36" y="232" class="fig-label" text-anchor="end">|i⟩</text>
  <text x="36" y="264" class="fig-label" text-anchor="end">|b⟩</text>
  <text x="36" y="296" class="fig-label" text-anchor="end">|w⟩</text>

  <!-- Three horizontal circuit wires -->
  <line x1="44" y1="228" x2="430" y2="228" class="fig-link"/>
  <line x1="44" y1="260" x2="430" y2="260" class="fig-link"/>
  <line x1="44" y1="292" x2="430" y2="292" class="fig-link"/>

  <!-- U_0 Gate -->
  <rect x="58" y="212" width="42" height="96" rx="5" class="fig-box"/>
  <text x="79" y="264" class="fig-label" text-anchor="middle">U₀</text>

  <!-- O_x Gate 1 -->
  <rect x="116" y="212" width="48" height="64" rx="5" class="fig-box-claimed"/>
  <text x="140" y="242" class="fig-label" text-anchor="middle">Oₓ</text>
  <text x="140" y="258" class="fig-muted" text-anchor="middle">·xᵢ</text>

  <!-- U_1 Gate -->
  <rect x="180" y="212" width="42" height="96" rx="5" class="fig-box"/>
  <text x="201" y="264" class="fig-label" text-anchor="middle">U₁</text>

  <!-- O_x Gate 2 -->
  <rect x="238" y="212" width="48" height="64" rx="5" class="fig-box-claimed"/>
  <text x="262" y="242" class="fig-label" text-anchor="middle">Oₓ</text>
  <text x="262" y="258" class="fig-muted" text-anchor="middle">·xᵢ</text>

  <!-- Dots -->
  <rect x="296" y="210" width="28" height="100" class="fig-bg"/>
  <text x="310" y="264" class="fig-label" text-anchor="middle">⋯</text>

  <!-- O_x Gate T -->
  <rect x="332" y="212" width="48" height="64" rx="5" class="fig-box-claimed"/>
  <text x="356" y="242" class="fig-label" text-anchor="middle">Oₓ</text>
  <text x="356" y="258" class="fig-muted" text-anchor="middle">·xᵢ</text>

  <!-- U_T Gate -->
  <rect x="394" y="212" width="42" height="96" rx="5" class="fig-box"/>
  <text x="415" y="264" class="fig-label" text-anchor="middle">U_T</text>

  <!-- Measurement box -->
  <line x1="436" y1="228" x2="454" y2="228" class="fig-link"/>
  <rect x="454" y="210" width="40" height="36" rx="5" class="fig-box-open"/>
  <path d="M462,236 A12,12 0 0,1 486,236" class="fig-line-2"/>
  <line x1="474" y1="236" x2="482" y2="220" class="fig-line-2"/>

  <!-- Arrow to Polynomial Summary Box -->
  <line x1="494" y1="228" x2="514" y2="228" class="fig-line-2"/>
  <polygon points="508,224 516,228 508,232" class="fig-fill-2"/>

  <rect x="518" y="206" width="102" height="104" rx="6" class="fig-box-claimed"/>
  <text x="569" y="228" class="fig-label" text-anchor="middle">Output P(x)</text>
  <text x="569" y="248" class="fig-text" text-anchor="middle">Polynomial</text>
  <text x="569" y="266" class="fig-label" text-anchor="middle">deg(P) ≤ 2T</text>
  <text x="569" y="286" class="fig-muted" text-anchor="middle">0 ≤ P(x) ≤ 1</text>
  <text x="569" y="301" class="fig-muted" text-anchor="middle">for all x ∈ {±1}ⁿ</text>

  <!-- Bottom annotation strip -->
  <text x="79" y="328" class="fig-muted" text-anchor="middle">superpose</text>
  <text x="140" y="328" class="fig-muted" text-anchor="middle">query 1</text>
  <text x="201" y="328" class="fig-muted" text-anchor="middle">interfere</text>
  <text x="262" y="328" class="fig-muted" text-anchor="middle">query 2</text>
  <text x="356" y="328" class="fig-muted" text-anchor="middle">query T</text>
  <text x="474" y="328" class="fig-muted" text-anchor="middle">|ψ_T|²</text>
  <text x="320" y="348" class="fig-muted" text-anchor="middle">Beals et al. (1998): T oracle calls add degree ≤ T to amplitudes; squaring amplitudes at measurement yields degree d ≤ 2T</text>
</svg>

